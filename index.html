":"L","q":"The new sports centre is expected to ______ next spring.","o":["verb","singular noun","number","adjective"],"a":0,"ans":"open","full":"The council says the new sports centre is expected to open next spring.","why":"'Expected to' is always followed by a base verb."},{"t":"mcq","sk":"W","q":"Experts predict that by 2040 the city ___ its target of zero waste.","o":["had reached","reached","will have reached","has reached"],"a":2,"why":"'By' plus a future year needs the future perfect: will have reached."},{"t":"gap","sk":"W","q":"By 2010, the figure had ___ (grow) to 40 percent.","a":["grown"],"why":"After 'had', use the past participle. Grow is irregular: grew, grown."},{"t":"dict","sk":"L","s":"By the end of the decade the number of students had nearly doubled.","why":"Listen for 'had' before doubled. It can be short and quiet.","bn":"had শব্দটা খুব দ্রুত বলা হয়।"},{"t":"tap","sk":"W","s":"The number of tourists is projected to reaching five million by 2030.","w":"reaching","o":["reach","reached","reaches"],"a":0,"why":"'Projected to' needs the base verb: reach."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: According to the latest forecast, the demand for electricity in South Asia","o":["has projected to rise by 30% over the next decade.","is projected to rise by 30% over the next decade.","projected rising by 30% over the next decade."],"a":1,"why":"Forecasts use 'is projected to' plus the base verb."},{"t":"order","sk":"W","s":"The number of cars had risen to three million.","why":"Had plus the past participle shows a change complete before a past point."},{"t":"tap","sk":"W","s":"In the next stage, the bottles was washed and then filled.","w":"was","o":["is","are","be"],"a":1,"why":"Processes use the present simple, and 'bottles' is plural, so 'are'."},{"t":"predict","sk":"L","q":"The bridge was ______ in 1887.","o":["plural noun","verb","adjective","number"],"a":1,"ans":"completed","full":"The bridge was completed in 1887, after nearly ten years of work.","why":"'Was' before the gap and a year after it point to a past participle, like completed."},{"t":"gap","sk":"W","q":"Over the past decade, the gap between rich and poor has ___ (widen) considerably.","a":["widened"],"why":"'Over the past decade' reaches up to now, so has plus past participle.","bn":"has এর পরে V3।"},{"t":"mcq","sk":"W","q":"Between 1990 and 2000, coal use ___, while gas use rose.","o":["falls","fell","has fallen","is falling"],"a":1,"why":"The period is finished, and 'rose' is past simple, so match it with 'fell'."},{"t":"speak","sk":"S","q":"How has your hometown changed in the last few years?","need":"\\b(has|have|hasn't|haven't|\\w+'ve|\\w+'s)\\s+(\\w+\\s+)?\\w+(ed|en|wn|t|un|one|ome)\\b","hint":"Use the present perfect, like 'has changed' or 'have built'.","model":"My hometown has changed a lot, because they have built a new bridge and several shopping malls have opened near the bus stand.","why":"Changes from the past up to now need the present perfect."},{"t":"tap","sk":"W","s":"By 2005, the number of mobile users has overtaken the number of landline users.","w":"has","o":["have","had","was"],"a":1,"why":"'By 2005' is a past point, so use the past perfect: had overtaken."},{"t":"dict","sk":"L","s":"Experts expect the price of solar panels to fall even further next year.","why":"Listen for 'to fall'. After 'expect ... to', the verb stays in its base form."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: Over the past twenty years, the amount of land used for farming","o":["had decreased by almost a third next year.","decreased by almost a third in 1990.","has decreased by almost a third."],"a":2,"why":"'Over the past twenty years' runs up to now, so the present perfect fits."},{"t":"gap","sk":"W","q":"By 2060, the average temperature in the region will have ___ (rise) by two degrees.","a":["risen"],"why":"'Will have' needs the past participle. Rise is irregular: risen.","bn":"will have + V3 (risen)।"},{"t":"tap","sk":"W","s":"When the government changed the law in 2015, smoking rates have already fallen by half.","w":"have","o":["had","has","were"],"a":0,"why":"The fall happened before 2015, a past point, so use the past perfect."},{"t":"speak","sk":"S","q":"What changes do you think will happen in education in the next twenty years?","need":"\\b(will|won't|is expected to|are expected to|is likely to|are likely to|is going to|are going to)\\b","hint":"Use future forms like 'will', 'is likely to' or 'will have'.","model":"I think most classes will have moved online by then, and teachers are likely to work more as guides than lecturers.","why":"Forecasts about the future use will, be likely to or will have."}]},{"id":"compare","title":"Comparing numbers","bn":"সংখ্যার তুলনা","why":"Task 1 is mostly about comparing figures, and in Listening and Reading words like fewer, less, twice and the highest decide whether your answer is right.","rules":[{"h":"Comparatives and superlatives","en":"Short adjectives add -er or -est (higher, the highest). Longer ones use more or most (more expensive, the most popular). Use 'than' after a comparative and 'the' before a superlative.","bn":"ছোট adjective এ -er/-est, বড়গুলোর আগে more/most। কখনো দুটো একসাথে নয়: more higher ভুল।","ex":["Rent is higher in Gulshan than in Mirpur.","Football is the most popular sport in the survey."]},{"h":"Show how big the difference is","en":"Put slightly, a little, considerably, significantly, much or far before a comparative: slightly higher, far more popular. Do not use 'very' with a comparative.","bn":"পার্থক্য কতটা তা বোঝাতে comparative এর আগে slightly, much, far বসান। very higher ভুল।","ex":["Women spent slightly more time online than men.","The new bridge is far wider than the old one."]},{"h":"Twice as ... as and three times","en":"Use twice as many, twice as much or three times as high as to show multiples. 'As ... as' shows equal amounts, and 'not as ... as' shows a smaller amount.","bn":"দ্বিগুণ বোঝাতে twice as ... as, তিনগুণ বোঝাতে three times as ... as। not as ... as মানে কম।","ex":["Germany produced twice as much electricity as Spain.","Bus fares are not as high as train fares."]},{"h":"Fewer with plurals, less with uncountables","en":"Use fewer with plural countable nouns (fewer cars) and less with uncountable nouns (less traffic). In the same way, use many with plurals and much with uncountables.","bn":"গোনা যায় এমন বহুবচনের সাথে fewer (fewer cars), আর গোনা যায় না এমন শব্দের সাথে less (less water)।","ex":["Fewer people smoke today than in 1990.","Families now use less water than before."]},{"h":"Linking two figures","en":"Use while, whereas or compared with to put two figures side by side. After 'compared with', use a noun phrase, not a full clause.","bn":"দুটো সংখ্যা পাশাপাশি রাখতে while, whereas, compared with ব্যবহার করুন।","ex":["Men spent three hours online a day, whereas women spent four.","Compared with 2010, unemployment was much lower in 2020."]}],"traps":[{"wrong":"The number of cars is more higher than before.","right":"The number of cars is much higher than before.","why":"Do not put more before an -er adjective."},{"wrong":"There were less students in 2020.","right":"There were fewer students in 2020.","why":"Students is a plural countable noun, so use fewer."},{"wrong":"Rice is the most cheapest food here.","right":"Rice is the cheapest food here.","why":"Use -est or most, never both."},{"wrong":"The price of oil was twice higher than in 2000.","right":"The price of oil was twice as high as in 2000.","why":"Say 'twice as high as'."},{"wrong":"Her salary is higher than her husband.","right":"Her salary is higher than her husband's.","why":"Compare salary with salary, not salary with a person."}],"starters":["Compared with my parents' generation, young people today…","The biggest difference between city life and village life is…","I find reading far more relaxing than…","It's not as easy as people think to…","Whereas my brother prefers…, I would rather…"],"q":[{"t":"mcq","sk":"W","q":"Dhaka is ___ than Sylhet.","o":["biggest","bigger","more big"],"a":1,"why":"Big is a short adjective, so add -er and double the g: bigger.","bn":"ছোট adjective এ -er।"},{"t":"gap","sk":"W","q":"Mount Everest is the ___ (high) mountain in the world.","a":["highest"],"why":"'The' and 'in the world' show a superlative: highest."},{"t":"tap","sk":"W","s":"This year the exam was more easier than last year.","w":"more","o":["most","(remove)","very"],"a":1,"why":"Easier already means 'more easy', so remove 'more'.","bn":"more আর -er একসাথে নয়।"},{"t":"dict","sk":"L","s":"Train tickets are much cheaper than flights, but the journey takes longer.","why":"Listen for the -er endings in cheaper and longer, and the word 'than'."},{"t":"predict","sk":"L","q":"The new bus service is ______ than the old one.","o":["singular noun","verb","adjective","number"],"a":2,"ans":"faster","full":"Passengers will notice that the new bus service is faster than the old one.","why":"'Than' after the gap tells you to expect a comparative adjective, like faster."},{"t":"mcq","sk":"W","q":"There is ___ traffic in the city centre on Fridays.","o":["lesser","fewer","less"],"a":2,"why":"Traffic is uncountable, so use less.","bn":"uncountable শব্দের সাথে less।"},{"t":"tap","sk":"W","s":"There were less accidents on the motorway after the speed limit was reduced.","w":"less","o":["little","lesser","fewer"],"a":2,"why":"Accidents can be counted, so use fewer."},{"t":"gap","sk":"W","q":"In 2020, there were ___ (few) visitors than in 2019 because of the pandemic.","a":["fewer"],"why":"Visitors is a plural countable noun, and 'than' needs a comparative: fewer."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: Compared with rural households, urban families","o":["spend almost twice as much on transport.","spends almost twice as much on transport.","spend almost twice more as on transport."],"a":0,"why":"Families is plural, so 'spend', and the correct pattern is 'twice as much'."},{"t":"dict","sk":"L","s":"Women spent slightly more time on housework than men in every country.","why":"Listen for 'slightly more ... than'. The -t in spent is short."},{"t":"order","sk":"S","s":"The museum was not as crowded as we expected.","why":"'Not as ... as' shows that something was less than expected."},{"t":"tap","sk":"W","s":"Rice is the most cheapest food in many Asian countries.","w":"most","o":["more","very","(remove)"],"a":2,"why":"Cheapest already means 'most cheap', so remove 'most'."},{"t":"predict","sk":"L","q":"The ______ part of the course is the final project.","o":["adjective","verb","plural noun","number"],"a":0,"ans":"hardest","full":"Most students say the hardest part of the course is the final project.","why":"'The' plus a gap plus a noun often means a superlative adjective, like hardest."},{"t":"mcq","sk":"W","q":"Spending on health was ___ that on education.","o":["three times as high as","three times high as","three times as higher than"],"a":0,"why":"The pattern is 'three times as + adjective + as'.","bn":"times as ... as কাঠামো।"},{"t":"gap","sk":"W","q":"In 2020, online sales were ___ as high as in 2015, which means they had doubled.","a":["twice"],"why":"Doubled means two times bigger, so 'twice as high as'."},{"t":"dict","sk":"L","s":"The cost of living in the capital is far higher than in smaller towns.","why":"Listen for 'far higher than'. Far makes the difference bigger."},{"t":"tap","sk":"W","s":"My salary is lower than my sister even though we do the same job.","w":"sister","o":["sisters'","sisters","sister's"],"a":2,"why":"Compare salary with salary: my sister's salary, shortened to my sister's."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: Although electric cars are more expensive to buy,","o":["they are far more cheaper to run than petrol cars.","they are far cheaper to run than petrol cars.","but they are far cheaper to run than petrol cars."],"a":1,"why":"Do not use 'but' after 'although', and never put more before an -er word.","bn":"although এর পরে but বসে না।"},{"t":"order","sk":"W","s":"Coal received the least government funding.","why":"'The least' is the opposite of 'the most' and also needs 'the'."},{"t":"tap","sk":"W","s":"The number of female students was as high than the number of male students.","w":"than","o":["that","then","as"],"a":2,"why":"The pattern is 'as high as', not 'as high than'."},{"t":"predict","sk":"L","q":"The library has fewer ______ on Sundays.","o":["plural noun","uncountable noun","singular noun","verb"],"a":0,"ans":"computers","full":"On Sundays the library has fewer computers, so please book one in advance.","why":"'Fewer' is only used with plural countable nouns."},{"t":"gap","sk":"W","q":"The ___ (low) rate of unemployment was recorded in Germany.","a":["lowest"],"why":"'The' plus a single top result needs the superlative: lowest."},{"t":"mcq","sk":"W","q":"Japan had the ___ proportion of elderly people of all the countries shown.","o":["highest","higher","most high","more higher"],"a":0,"why":"'Of all the countries' compares more than two, so use the superlative."},{"t":"speak","sk":"S","q":"Is life in a city better than life in the countryside?","need":"\\b(\\w+er|more\\s+\\w+|less\\s+\\w+|fewer\\s+\\w+)\\s+than\\b","hint":"Compare with '-er than' or 'more ... than'.","model":"I think city life is more convenient, but the countryside is far quieter than any city I know.","why":"Comparatives need 'than' after them."},{"t":"tap","sk":"W","s":"The new model is considerable faster than the previous one.","w":"considerable","o":["consider","considerably","considerate"],"a":1,"why":"Before a comparative, use the adverb: considerably faster.","bn":"adjective এর আগে adverb: considerably।"},{"t":"dict","sk":"L","s":"Fewer young people are buying newspapers than they did ten years ago.","why":"Listen for 'fewer', used with the plural people."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: In 2020, the amount of plastic recycled in Germany","o":["was almost three times higher than in Spain.","were almost three times higher than in Spain.","was almost three times higher than Spain recycling."],"a":0,"why":"'The amount' is singular, so 'was', and 'than in Spain' compares place with place."},{"t":"gap","sk":"W","q":"The gap between the two countries was not as ___ (wide) as experts had predicted.","a":["wide"],"why":"'As ... as' takes the plain adjective, not the -er form.","bn":"as ... as এর মাঝে মূল adjective।"},{"t":"tap","sk":"W","s":"Sales of electric cars rose by far more as expected in 2023.","w":"as","o":["that","like","than"],"a":2,"why":"'More' is followed by 'than': far more than expected."},{"t":"speak","sk":"S","q":"How is the way young people communicate different from the way older people do?","need":"\\b(whereas|while|compared with|compared to|than|as \\w+ as)\\b","hint":"Use 'whereas', 'while' or 'compared with' to contrast.","model":"Young people mostly send short messages, whereas older people still prefer phone calls, which they find far more personal.","why":"Whereas and while put two groups side by side."}]},{"id":"passive","title":"Passive voice","bn":"কর্মবাচ্য (Passive voice)","why":"Task 1 process diagrams need the passive, Task 2 and Reading texts use it for a formal tone, and correct passives in Speaking show grammatical range.","rules":[{"h":"Form: be plus past participle","en":"Make the passive with a form of be plus the past participle: is made, was built, has been reduced, will be opened. The form of be shows the tense.","bn":"passive = be এর রূপ + V3: is made, was built, has been reduced। কাল বোঝা যায় be দেখে।","ex":["Tea is grown in Sylhet.","The bridge was opened in 2022."]},{"h":"Use it when the action matters more","en":"In processes and science writing we care about what happens, not who does it, so the passive sounds natural. Add 'by' plus the doer only when the doer is important.","bn":"কে করছে তার চেয়ে কী ঘটছে সেটা জরুরি হলে passive। কর্তা গুরুত্বপূর্ণ হলে তবেই by + কর্তা।","ex":["The bottles are collected and taken to a factory.","Gitanjali was written by Rabindranath Tagore."]},{"h":"Modal passives","en":"After can, should, must, will and might, use be plus the past participle: can be recycled, should be banned, must be signed.","bn":"can, should, must এর পরে be + V3: can be recycled। be বাদ দিলে বাক্য ভুল।","ex":["Glass can be recycled many times.","The form must be signed by a parent."]},{"h":"Some verbs are never passive","en":"Verbs with no object, such as happen, occur, arrive, die and consist of, cannot be passive. Say 'it happened', not 'it was happened', and 'it consists of', not 'it is consist of'.","bn":"happen, occur, arrive, consist of এর কোনো object নেই, তাই এদের passive হয় না। was happened বা is consist of ভুল।","ex":["The accident happened at night.","The course consists of four modules."]},{"h":"It is believed that","en":"Use it is believed that, it is said that or it is thought that to report a common opinion in formal writing when the source is not important.","bn":"সাধারণ মতামত জানাতে it is believed that, it is said that ব্যবহার করুন। এতে লেখা আনুষ্ঠানিক শোনায়।","ex":["It is believed that the temple was built in the twelfth century.","It is often said that travel broadens the mind."]}],"traps":[{"wrong":"The accident was happened late at night.","right":"The accident happened late at night.","why":"Happen has no object, so it cannot be passive."},{"wrong":"The process is consist of five stages.","right":"The process consists of five stages.","why":"Consist of is never passive."},{"wrong":"Plastic can recycled easily.","right":"Plastic can be recycled easily.","why":"After can, the passive needs 'be'."},{"wrong":"The new road was build in 2019.","right":"The new road was built in 2019.","why":"Use the past participle, not the base verb."},{"wrong":"English is speak in many countries.","right":"English is spoken in many countries.","why":"The passive needs the past participle: spoken."}],"starters":["I was brought up in…","My hometown is known for…","It is often said that…","I was taught by…","A lot of new buildings have been built…","I think more should be done to…"],"q":[{"t":"mcq","sk":"W","q":"English ___ in many countries around the world.","o":["is spoken","is speak","speaks"],"a":0,"why":"The passive is be plus the past participle: is spoken.","bn":"passive = be + V3।"},{"t":"gap","sk":"W","q":"The bridge was ___ (build) in 2022.","a":["built"],"why":"After 'was', use the past participle. Build is irregular: built."},{"t":"tap","sk":"W","s":"The new hospital was open by the Prime Minister last year.","w":"open","o":["opening","opens","opened"],"a":2,"why":"The passive needs the past participle: was opened.","bn":"was এর পরে V3।"},{"t":"dict","sk":"L","s":"The letters are sorted by machine and then delivered by hand.","why":"Listen for the -ed endings on sorted and delivered."},{"t":"mcq","sk":"W","q":"Paper ___ recycled several times before it becomes too weak.","o":["is can","can","can be"],"a":2,"why":"After a modal like can, the passive is 'be' plus the past participle."},{"t":"gap","sk":"W","q":"Many old houses in the area have been ___ (pull) down to make space for flats.","a":["pulled"],"why":"'Have been' plus the past participle is the present perfect passive."},{"t":"tap","sk":"W","s":"The accident was happened because the driver fell asleep.","w":"was","o":["has","(remove)","is"],"a":1,"why":"Happen has no object, so it cannot be passive. Just say 'happened'.","bn":"happen এর passive হয় না।"},{"t":"mcq","sk":"W","q":"First, the raw materials ___ to the factory by lorry.","o":["transported","transport","are transport","are transported"],"a":3,"why":"Processes use the present simple passive: are plus past participle."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: In the final stage of the process, the purified water","o":["pumps into storage tanks by itself.","is pumped into storage tanks.","is pump into storage tanks."],"a":1,"why":"Water does not pump itself, so use the passive with the past participle: is pumped."},{"t":"dict","sk":"L","s":"Most of the plastic that is thrown away is never recycled.","why":"Listen for 'is thrown' and 'is recycled'. The -ed in recycled is a soft d."},{"t":"tap","sk":"W","s":"The process is consisted of five stages.","w":"consisted","o":["consisting","consist","made up"],"a":2,"why":"Consist of is never passive. Use 'is made up of' or 'consists of'.","bn":"is consist of নয়, consists of।"},{"t":"gap","sk":"W","q":"In the past, children were ___ (teach) to write on slates.","a":["taught"],"why":"Teach is irregular: teach, taught, taught."},{"t":"mcq","sk":"W","q":"It ___ that the old palace was built in the seventeenth century.","o":["believes","is believing","is believed","believed"],"a":2,"why":"The fixed phrase is 'it is believed that'."},{"t":"order","sk":"W","s":"The museum was designed by a famous Italian architect.","why":"Use 'by' when the person who did the action matters."},{"t":"tap","sk":"W","s":"A new law will introduced to reduce plastic waste.","w":"introduced","o":["be introduced","been introduced","introduce"],"a":0,"why":"The future passive is will be plus the past participle."},{"t":"dict","sk":"L","s":"It is believed that the temple was built more than a thousand years ago.","why":"Listen for 'it is believed that' and 'was built'."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: Although the method was first described in the nineteen fifties,","o":["it did not widely use until much later.","but it was not widely used until much later.","it was not widely used until much later."],"a":2,"why":"Do not add 'but' after 'although', and the method was used by people, so use the passive.","bn":"although এর পরে but বসে না।"},{"t":"gap","sk":"W","q":"The results will be ___ (publish) next month in a medical journal.","a":["published"],"why":"'Will be' plus the past participle is the future passive."},{"t":"tap","sk":"W","s":"The data were collected from three hospitals and analyse using special software.","w":"analyse","o":["analyses","analysed","analysing"],"a":1,"why":"Both verbs share 'were', so the second needs the past participle too: analysed."},{"t":"mcq","sk":"W","q":"Over the last decade, the speed limit ___ twice.","o":["has been lower","has been lowered","has lowered","was lowering"],"a":1,"why":"A limit cannot lower itself, so use the present perfect passive: has been lowered."},{"t":"dict","sk":"L","s":"The rubbish is collected every Monday and taken to a recycling centre.","why":"Listen for 'is collected' and 'taken'. Both are passive."},{"t":"mcq","sk":"W","q":"The patient ___ to hospital as soon as the ambulance arrived.","o":["took","was took","was taken","has taken"],"a":2,"why":"The patient did not do the taking, so use the passive with the past participle: was taken.","bn":"take এর V3 হলো taken।"},{"t":"speak","sk":"S","q":"Describe a building in your town that you like.","need":"\\b(is|are|was|were|been|be|being)\\s+(\\w+\\s+)?\\w+(ed|en|t|wn)\\b","hint":"Say when or how it was built, using the passive.","model":"It was built about fifty years ago, and it has recently been painted bright yellow.","why":"Buildings are usually described with the passive: was built, was designed."},{"t":"tap","sk":"W","s":"These houses are build from bamboo and mud in many coastal villages.","w":"build","o":["built","builds","building"],"a":0,"why":"After 'are' in a passive, use the past participle: built."},{"t":"gap","sk":"W","q":"Smoking should ___ banned in all public places, in my opinion.","a":["be"],"why":"After a modal, the passive needs 'be': should be banned.","bn":"should এর পরে be + V3।"},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: Many of the paintings that were damaged in the fire","o":["have since been carefully restored.","has since been carefully restored.","have since been carefully restore.","have since carefully restored."],"a":0,"why":"The paintings were restored by someone, so use the passive. 'Many of the paintings' is plural, so 'have'."},{"t":"order","sk":"S","s":"More money should be spent on public transport.","why":"A modal passive: should be plus the past participle."},{"t":"tap","sk":"W","s":"It is widely believe that the new policy will reduce traffic in the capital.","w":"believe","o":["believes","believed","believing"],"a":1,"why":"The fixed phrase uses the past participle: it is widely believed that."},{"t":"mcq","sk":"W","q":"By the time the firefighters arrived, most of the building ___.","o":["had already destroyed","was already destroying","had already been destroyed","has already been destroyed"],"a":2,"why":"The damage was done before a past point, and the building was the thing affected, so use the past perfect passive."},{"t":"speak","sk":"S","q":"What could be done to reduce traffic in big cities?","need":"\\b(be|been)\\s+(\\w+\\s+)?\\w+(ed|en|t|wn)\\b","hint":"Use modal passives like 'should be introduced'.","model":"I think more bus lanes should be built, and cars could be banned from city centres on certain days.","why":"Modal passives sound natural when you suggest solutions."}]},{"id":"relative","title":"Relative clauses","bn":"রিলেটিভ ক্লজ (who, which, that)","why":"Writing and Speaking examiners look for complex sentences, and a correct relative clause is the easiest way to show one without errors.","rules":[{"h":"who, which and that","en":"Use who for people and which for things. In clauses without commas, that works for both, and the relative word replaces he, she or it, so do not add them again.","bn":"মানুষের কথা বললে who, জিনিসের কথা বললে which; কমা ছাড়া clause-এ দুটোর জায়গাতেই that বসানো যায়। who বা which-এর পরে আবার it, he, they লিখবে না।","ex":["Students who study abroad often become more independent.","The bridge that collapsed last year has finally been rebuilt."]},{"h":"where, when and whose","en":"Use where for places, when for times and whose to show that something belongs to someone.","bn":"জায়গার জন্য where, সময়ের জন্য when, আর কারও কিছু আছে বোঝাতে whose (যার)।","ex":["This is the village where my father grew up.","Families whose homes were flooded received emergency support."]},{"h":"Commas change the meaning","en":"A non-defining clause adds extra information and sits between commas. After a comma, never use that; use who or which.","bn":"যে তথ্য বাদ দিলেও মূল অর্থ ঠিক থাকে, সেটা দুই কমার মাঝে বসে। কমার পরে that হবে না, who বা which হবে।","ex":["Dhaka, which is the capital of Bangladesh, has more than twenty million people.","My brother, who works in Dubai, sends money home every month."]},{"h":"which for a whole idea","en":"After a comma, which can refer to the whole previous clause, not just one noun. Do not use what or it here.","bn":"আগের পুরো ঘটনাটা বোঝাতে কমা দিয়ে which বসাও। এখানে what বা it বসালে ভুল হবে।","ex":["Rents rose sharply, which forced many students to share rooms.","The train was cancelled, which meant I missed the interview."]},{"h":"Reduced relative clauses","en":"You can shorten who/which + verb to an -ing form for active meaning or a past participle for passive meaning.","bn":"who/which + verb ছোট করে লেখা যায়: active হলে -ing (people living), passive হলে V3 (goods produced)।","ex":["People living in cities usually have better access to hospitals.","Most of the rice grown in the region is sold abroad."]}],"traps":[{"wrong":"The man which lives next door is a doctor.","right":"The man who lives next door is a doctor.","why":"Use who for people, not which."},{"wrong":"This is the book which I read it last month.","right":"This is the book which I read last month.","why":"which already replaces it, so delete it."},{"wrong":"Paris, that is famous for its museums, attracts millions of tourists.","right":"Paris, which is famous for its museums, attracts millions of tourists.","why":"Never use that after a comma."},{"wrong":"The city where I visited last year was very crowded.","right":"The city that I visited last year was very crowded.","why":"visit takes a direct object, so use that or which."},{"wrong":"Students who they failed the test must retake it.","right":"Students who failed the test must retake it.","why":"who is already the subject; do not add they."}],"starters":["One thing that I really enjoy about my hometown is...","I grew up in an area where...","There was a teacher at my school who...","Something which worries me a bit is...","People living in big cities tend to...","The main problem, which a lot of people ignore, is that..."],"q":[{"t":"mcq","sk":"W","q":"The teacher ___ helped me most was very patient.","o":["who","which","where"],"a":0,"why":"A teacher is a person, so we use who.","bn":"মানুষের জন্য who।"},{"t":"mcq","sk":"W","q":"This is the area ___ the new hospital will be built.","o":["which","where","who"],"a":1,"why":"area is a place and the clause is complete, so where fits."},{"t":"gap","sk":"W","q":"A dentist is a person ___ looks after people's teeth.","a":["who","that"],"why":"person needs who, or that in a defining clause."},{"t":"mcq","sk":"W","q":"Children ___ parents read to them tend to have larger vocabularies.","o":["who","whose","which"],"a":1,"why":"The parents belong to the children, so whose is correct.","bn":"'যাদের বাবা-মা' বোঝাতে whose।"},{"t":"tap","sk":"W","s":"The man which repaired my laptop charged a fair price.","w":"which","o":["who","what","whose"],"a":0,"why":"The man is a person, so use who."},{"t":"dict","sk":"L","s":"The library where I study every evening closes at nine.","why":"Listen for where after a place noun."},{"t":"mcq","sk":"S","q":"I still remember the day ___ I got my exam results.","o":["when","which","what"],"a":0,"why":"day is a time, and the clause is complete, so we use when."},{"t":"gap","sk":"W","q":"That is the café ___ we first met.","a":["where","in which"],"why":"café is a place and the clause has no object missing, so where."},{"t":"tap","sk":"W","s":"This is the phone that I bought it last week.","w":"it","o":["(remove)","them","one"],"a":0,"why":"that already stands for the phone, so it repeats the object.","bn":"that-এর পরে আবার it লাগে না।"},{"t":"mcq","sk":"W","q":"Bangladesh, ___ is one of the most densely populated countries, faces serious flooding.","o":["that","who","which"],"a":2,"why":"This is a non-defining clause between commas about a thing, so which, never that."},{"t":"dict","sk":"L","s":"My sister, who lives in Chittagong, is training to be a nurse.","why":"Notice the pause around the extra information starting with who."},{"t":"tap","sk":"W","s":"My uncle, that works in a hospital, told me about the new rules.","w":"that","o":["who","which","whom"],"a":0,"why":"After a comma we cannot use that; for a person use who."},{"t":"gap","sk":"W","q":"I have a friend ___ brother plays cricket for Bangladesh.","a":["whose"],"why":"The brother belongs to the friend, so whose.","bn":"'যার ভাই' মানে whose।"},{"t":"mcq","sk":"W","q":"The government raised fuel taxes, ___ led to protests in several cities.","o":["that","which","what","it"],"a":1,"why":"which after a comma refers to the whole previous idea, the tax rise.","bn":"পুরো ঘটনাকে বোঝাতে কমা + which।"},{"t":"order","sk":"W","s":"I met a woman whose son studies in London.","why":"whose comes straight after the noun it describes, a woman."},{"t":"tap","sk":"W","s":"The office where I work in has no windows.","w":"in","o":["(remove)","at","on"],"a":0,"why":"where already means in which, so in is repeated."},{"t":"dict","sk":"L","s":"Students whose parents speak English at home often find listening easier.","why":"whose sounds like who's; spell it w-h-o-s-e.","bn":"whose আর who's শুনতে একই, বানান আলাদা।"},{"t":"mcq","sk":"W","q":"Most of the electricity ___ in the region comes from coal.","o":["producing","produced","which produced"],"a":1,"why":"Electricity is produced by someone, so the reduced clause needs the past participle."},{"t":"gap","sk":"W","q":"The amount of plastic ___ (dump) in rivers each year is shocking.","a":["dumped","being dumped"],"why":"Plastic is dumped by people, so the reduced clause takes the past participle."},{"t":"tap","sk":"W","s":"The number of people who owns a car has doubled since 2010.","w":"owns","o":["own","owning","is owning"],"a":0,"why":"who refers to people, which is plural, so the verb is own.","bn":"who-র আগের শব্দ people, তাই verb plural।"},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: The researchers interviewed farmers …","o":["whose crops had been damaged by salt water.","which crops had been damaged by salt water.","who their crops had been damaged by salt water."],"a":0,"why":"whose links the farmers to their crops. which cannot show possession, and who their repeats the pronoun."},{"t":"order","sk":"S","s":"The town where I grew up has changed a lot.","why":"The where clause sits inside the subject, before the main verb has."},{"t":"tap","sk":"W","s":"The report, which published last year, showed a fall in crime.","w":"published","o":["was published","publishing","publishes"],"a":0,"why":"A report does not publish anything; it is published, so we need the passive."},{"t":"gap","sk":"W","q":"The bus was late again, ___ meant I missed the start of the exam.","a":["which"],"why":"which after a comma refers to the whole situation of the bus being late."},{"t":"dict","sk":"L","s":"Rents went up again this year, which forced many families to move.","why":"Listen for which after the pause, referring to the whole idea."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: Coral reefs, which cover less than one per cent of the ocean floor, …","o":["that support about a quarter of all marine species.","which support about a quarter of all marine species.","support about a quarter of all marine species."],"a":2,"why":"The relative clause is already finished, so the sentence now needs its main verb, support.","bn":"মূল বাক্যের verb এখনো আসেনি।"},{"t":"tap","sk":"W","s":"Many workers lost their jobs, what caused a sharp rise in poverty.","w":"what","o":["which","that","it"],"a":0,"why":"To refer back to a whole clause after a comma, use which, not what."},{"t":"speak","sk":"S","q":"Describe a place in your hometown that you like visiting.","need":"\\b(where|which|that|who|whose)\\b","hint":"Describe it with where, which or who","model":"There's a small lake near my house where I go in the evenings, which helps me forget about exams for a while.","why":"Relative clauses let you add detail without starting new sentences."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: The number of students enrolling in online courses rose sharply in 2020, …","o":["that surprised many universities.","which forced many universities to invest in digital platforms.","when forced universities to invest in digital platforms."],"a":1,"why":"After a comma, which refers to the whole rise. that cannot follow a comma, and when needs a subject."},{"t":"speak","sk":"S","q":"What kind of people do well in big cities?","need":"\\bpeople\\s+(who|that|whose|living|working|with)\\b|\\b(those|anyone|someone)\\s+(who|that|living|working)\\b","hint":"Use people who... or people living...","model":"People who can adapt quickly usually do well, while those living far from work often feel exhausted.","why":"A people who or people living phrase answers Part 3 directly."}]},{"id":"cond","title":"Conditionals","bn":"কন্ডিশনাল (if দিয়ে বাক্য)","why":"Speaking Part 3 is full of hypothetical questions, and a clean second or third conditional is a clear sign of band 7 grammar in Speaking and Writing.","rules":[{"h":"Zero and first conditional","en":"For general facts use the present in both parts. For a real future possibility use if + present and will in the other part; never put will after if.","bn":"সবসময় সত্য এমন কিছু হলে দুই অংশেই present। ভবিষ্যতে সত্যিই ঘটতে পারে এমন কিছু হলে if-এর পরে present, অন্য অংশে will; if-এর পরে will নয়।","ex":["If you heat ice, it melts.","If it rains tomorrow, the match will be cancelled."]},{"h":"Second conditional","en":"For imaginary or unlikely situations use if + past simple and would + base verb. In formal English use were with I, he and she.","bn":"কাল্পনিক বা অসম্ভব অবস্থা বোঝাতে if + past, অন্য অংশে would + verb। ফরমাল ইংরেজিতে I, he, she সবার সাথে were।","ex":["If I were the education minister, I would make sport compulsory.","If governments invested more in public transport, fewer people would drive."]},{"h":"Third conditional","en":"For past events that did not happen use if + had + past participle and would have + past participle. Do not put would have in the if part.","bn":"অতীতে যা ঘটেনি তা নিয়ে কল্পনা: if + had + V3, অন্য অংশে would have + V3। if-এর অংশে would have বসবে না।","ex":["If I had started earlier, I would have got a better score.","If the warning had come sooner, fewer people would have died."]},{"h":"Mixed conditionals","en":"Mix the forms when a past condition has a present result, or a present fact affected the past.","bn":"অতীতের কোনো ঘটনার ফল এখন দেখাতে if + had + V3, তারপর would + verb। উল্টোটাও হতে পারে।","ex":["If I had learnt to swim as a child, I would not be afraid of water now.","If she were more organised, she would have finished on time."]},{"h":"unless, provided that, as long as","en":"unless means if not, so do not add another not. provided that and as long as mean only if, and they take a present verb for the future.","bn":"unless মানে if not, তাই এর পরে আবার not লাগবে না। provided that আর as long as মানে 'শুধু যদি'।","ex":["Unless we reduce plastic use, our rivers will become even dirtier.","You can borrow the car as long as you return it by six."]}],"traps":[{"wrong":"If I will get band 7, I will apply to Canada.","right":"If I get band 7, I will apply to Canada.","why":"No will after if in the first conditional."},{"wrong":"If I would have known, I would have helped.","right":"If I had known, I would have helped.","why":"The if part takes had + past participle."},{"wrong":"If I am the mayor, I would build more parks.","right":"If I were the mayor, I would build more parks.","why":"would in the result needs a past form after if."},{"wrong":"Unless you don't practise, you won't improve.","right":"Unless you practise, you won't improve.","why":"unless already means if not."},{"wrong":"If people would recycle more, there would be less waste.","right":"If people recycled more, there would be less waste.","why":"Use the past simple after if, not would."}],"starters":["If I were in charge of..., I would probably...","If governments invested more in..., people would...","Looking back, if I had..., I would have...","As long as people..., I don't see a problem with...","Unless something changes, I think... will...","I'd definitely... if I had more time."],"q":[{"t":"mcq","sk":"W","q":"If water reaches 100 degrees Celsius, it ___.","o":["boils","boiled","would boil"],"a":0,"why":"This is a scientific fact, so the zero conditional uses the present in both parts."},{"t":"mcq","sk":"S","q":"If it ___ this weekend, we will have the picnic indoors.","o":["will rain","rains","rained"],"a":1,"why":"First conditional: present after if, will in the other part.","bn":"if-এর পরে will বসে না।"},{"t":"gap","sk":"W","q":"If you press this button, the machine ___ (stop).","a":["stops","will stop"],"why":"A general fact or a real result: stops or will stop."},{"t":"mcq","sk":"W","q":"If I ___ more free time, I would learn to play the guitar.","o":["have","had","will have"],"a":1,"why":"would in the result shows an imaginary situation, so if takes the past."},{"t":"tap","sk":"W","s":"If you will need help, call me on this number.","w":"will","o":["(remove)","would","shall"],"a":0,"why":"No will after if for a real future condition.","bn":"if-এর পরে will নয়।"},{"t":"dict","sk":"L","s":"If it rains tomorrow, we will move the class indoors.","why":"Notice rains, not will rain, after if."},{"t":"mcq","sk":"W","q":"Many lives ___ if the bridge had been inspected properly.","o":["would be saved","would have been saved","will be saved"],"a":1,"why":"had been inspected is third conditional, so the result is would have been saved."},{"t":"gap","sk":"W","q":"If I ___ (be) the mayor, I would plant trees on every street.","a":["were","was"],"why":"Second conditional takes the past; were is the better choice in formal writing.","bn":"ফরমাল লেখায় I were।"},{"t":"tap","sk":"W","s":"If I were you, I will take the earlier train.","w":"will","o":["would","shall","can"],"a":0,"why":"'If I were you' is the second conditional, so the result needs would."},{"t":"mcq","sk":"S","q":"You can join the advanced course ___ you have a basic level of English.","o":["unless","provided that","even if"],"a":1,"why":"provided that means only if, which matches the condition for joining."},{"t":"dict","sk":"L","s":"If I had more free time, I would learn to cook.","why":"Listen for the contracted I'd sound; would is often reduced in fast speech.","bn":"দ্রুত কথায় would ছোট হয়ে 'd শোনায়।"},{"t":"tap","sk":"W","s":"If they had left earlier, they would have catch the train.","w":"catch","o":["caught","catching","catches"],"a":0,"why":"would have needs the past participle, caught."},{"t":"gap","sk":"W","q":"If she ___ (study) harder last term, she would have passed.","a":["had studied"],"why":"would have passed is third conditional, so if + had + past participle."},{"t":"mcq","sk":"W","q":"___ the city builds more flood defences, low-lying areas will be at risk every monsoon.","o":["Unless","Provided that","As long as"],"a":0,"why":"The meaning is if the city does not build, so unless.","bn":"unless মানে if not।"},{"t":"order","sk":"W","s":"Ice melts if you leave it in the sun.","why":"The pronoun it must come after ice, so the main clause goes first."},{"t":"tap","sk":"W","s":"Unless you don't book early, the tickets will sell out.","w":"don't","o":["(remove)","won't","didn't"],"a":0,"why":"unless already contains the negative meaning."},{"t":"dict","sk":"L","s":"You can use the library as long as you bring your card.","why":"as long as is said quickly as one unit."},{"t":"mcq","sk":"W","q":"If she had taken the job in Singapore, she ___ much more money now.","o":["would have earned","would earn","will earn"],"a":1,"why":"Past condition, present result (now): a mixed conditional with would + base verb.","bn":"now থাকলে would + verb।"},{"t":"gap","sk":"W","q":"We will miss the flight ___ we leave now.","a":["unless"],"why":"The meaning is if we do not leave now."},{"t":"tap","sk":"W","s":"If I live closer to the university, I would cycle there every day, but my flat is too far away.","w":"live","o":["lived","will live","have lived"],"a":0,"why":"The speaker does not live close, so the situation is imaginary: if + past simple, then would + base verb."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: If governments taxed sugary drinks more heavily, …","o":["obesity rates would probably fall.","obesity rates will have fallen.","obesity rates would have fallen last year."],"a":0,"why":"taxed after if is the second conditional, so the result needs would + base verb."},{"t":"order","sk":"S","s":"Had I known about the traffic, I would have left earlier.","why":"Had I known is a formal way of saying If I had known, and it comes at the start of the sentence."},{"t":"tap","sk":"W","s":"If I were you, I would to apply for the scholarship.","w":"to","o":["(remove)","have","be"],"a":0,"why":"would is a modal and takes the bare verb without to.","bn":"would-এর পরে to বসে না।"},{"t":"gap","sk":"W","q":"If I had saved more money last year, I ___ (be) able to travel now.","a":["would be"],"why":"Past cause, present result: a mixed conditional with would be."},{"t":"dict","sk":"L","s":"If they had checked the data, they would have noticed the mistake.","why":"would have sounds like would've; write have, never of."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: Had the dam been designed to cope with heavier rainfall, …","o":["the village will not flood.","the village does not flood.","the village would not have flooded."],"a":2,"why":"Had the dam been is an inverted third conditional, so the result is would have + past participle.","bn":"Had দিয়ে শুরু মানে if ... had।"},{"t":"tap","sk":"W","s":"If I had learnt English as a child, I will feel more confident now.","w":"will","o":["would","shall","had"],"a":0,"why":"Past condition with a present result: would + base verb."},{"t":"speak","sk":"S","q":"What would you change about your city if you could?","need":"\\bif\\b.*\\b(would|could|might|'d)\\b|\\b(would|could|might|'d)\\b.*\\bif\\b","hint":"Use If I were..., I would...","model":"If I were in charge, I would build proper footpaths, because walking in Dhaka is really unsafe at the moment.","why":"Part 3 hypotheticals want the second conditional."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: Crop yields are expected to remain stable …","o":["unless rainfall will stay close to the average.","provided that rainfall stays close to the average.","if rainfall would stay close to the average."],"a":1,"why":"provided that takes a present verb for the future; will and would do not follow if or unless here."},{"t":"speak","sk":"S","q":"What could the government have done to reduce traffic in your city?","need":"\\b(would|could|might|should)(\\s+not|n't)?\\s+have\\s+\\w+","hint":"Use if they had..., ... would have...","model":"If they had built the metro twenty years earlier, far fewer people would have bought cars.","why":"Talking about the past that did not happen needs the third conditional.","bn":"অতীতের কল্পনা: had + V3, would have + V3।"}]},{"id":"contrast","title":"Contrast and cause linkers","bn":"বৈপরীত্য ও কারণ বোঝানোর শব্দ","why":"Linkers are marked twice in Writing and Speaking, under Coherence and Cohesion and under Grammar, so errors like although with but cost double.","rules":[{"h":"although, though, even though","en":"These are followed by a full clause with a subject and a verb. Do not add but in the other half of the sentence.","bn":"although, though, even though-এর পরে পুরো clause বসে। বাংলায় 'যদিও... কিন্তু' বলি, কিন্তু ইংরেজিতে although থাকলে but বসবে না।","ex":["Although the course was expensive, it was worth every taka.","Even though I left early, I missed the bus."]},{"h":"despite and in spite of","en":"These are followed by a noun or an -ing form, not a clause. To add a clause, write despite the fact that.","bn":"despite আর in spite of-এর পরে noun বা -ing বসে, পুরো বাক্য নয়। পুরো বাক্য বসাতে চাইলে despite the fact that লেখো।","ex":["Despite the heavy rain, the match went ahead.","In spite of having little money, she finished her degree."]},{"h":"however, nevertheless, therefore","en":"These usually start a new sentence and are followed by a comma. Do not join two full sentences with only a comma and however.","bn":"however, nevertheless, therefore সাধারণত নতুন বাক্যের শুরুতে বসে, পরে কমা। দুটো পূর্ণ বাক্য শুধু কমা দিয়ে জোড়া লাগাবে না।","ex":["Public transport is cheap. However, it is often overcrowded.","The plan was costly. Nevertheless, the council approved it."]},{"h":"whereas and while","en":"Use whereas or while to compare two facts in one sentence. This is very useful for Task 1 comparisons.","bn":"দুটো তথ্যের তুলনা এক বাক্যে করতে whereas বা while। Task 1-এ এটা খুব কাজে লাগে।","ex":["In 2000 most homes had a landline, whereas by 2020 almost everyone used a mobile.","Men spent more on transport, while women spent more on food."]},{"h":"because vs because of / due to","en":"because takes a clause; because of and due to take a noun. For results, use so, therefore or as a result.","bn":"because-এর পরে clause, কিন্তু because of আর due to-এর পরে শুধু noun। ফল বোঝাতে so, therefore বা as a result।","ex":["The flight was delayed because the weather was bad.","The delay was due to bad weather, so many passengers missed connections."]}],"traps":[{"wrong":"Although the rent is high, but the location is excellent.","right":"Although the rent is high, the location is excellent.","why":"Use although or but, never both."},{"wrong":"Despite it was raining, we went out.","right":"Despite the rain, we went out.","why":"despite takes a noun or -ing, not a clause."},{"wrong":"The course was difficult, however, most students passed.","right":"The course was difficult. However, most students passed.","why":"however starts a new sentence; a comma is not enough."},{"wrong":"Many people moved to cities due to they wanted better jobs.","right":"Many people moved to cities because they wanted better jobs.","why":"due to takes a noun; use because before a clause."},{"wrong":"Because of the government invested in solar power, costs fell.","right":"Because the government invested in solar power, costs fell.","why":"because of needs a noun, not a clause."}],"starters":["Although I enjoy..., I sometimes find it...","Despite the fact that..., most people still...","In my city..., whereas in villages...","That's mainly because...","Mostly due to..., ...","I see the point. However, I think..."],"q":[{"t":"mcq","sk":"W","q":"___ it was late, the shop was still busy.","o":["Although","Despite","However"],"a":0,"why":"it was late is a clause, so we need although.","bn":"clause-এর আগে although।"},{"t":"mcq","sk":"W","q":"The match continued ___ the heavy rain.","o":["although","despite","even though"],"a":1,"why":"the heavy rain is a noun phrase, so despite."},{"t":"gap","sk":"W","q":"___ the traffic, I arrived on time.","a":["despite","in spite of"],"why":"the traffic is a noun phrase, so despite or in spite of."},{"t":"mcq","sk":"S","q":"I stayed at home ___ I had a bad cold.","o":["because","because of","due to"],"a":0,"why":"I had a bad cold is a clause, so because."},{"t":"tap","sk":"W","s":"Although the hotel was cheap, but the rooms were clean.","w":"but","o":["(remove)","so","and"],"a":0,"why":"although and but cannot be used together.","bn":"although থাকলে but বাদ দাও।"},{"t":"dict","sk":"L","s":"Although the test was difficult, most of the class passed.","why":"There is no but after although, so do not write one."},{"t":"mcq","sk":"W","q":"Flights were cancelled ___ the storm.","o":["because","because of","although"],"a":1,"why":"the storm is a noun, so because of.","bn":"noun-এর আগে because of।"},{"t":"gap","sk":"W","q":"She got the job ___ she had no experience.","a":["although","though","even though","despite the fact that"],"why":"she had no experience is a clause showing contrast."},{"t":"tap","sk":"W","s":"Despite he was tired, he kept studying.","w":"Despite","o":["Although","In spite","However"],"a":0,"why":"he was tired is a clause, so we need although."},{"t":"mcq","sk":"W","q":"Men spent more time on sport, ___ women spent more time on shopping.","o":["whereas","despite","because of"],"a":0,"why":"whereas compares two facts, and both halves are clauses."},{"t":"dict","sk":"L","s":"Despite the cold weather, thousands of people attended the concert.","why":"despite is followed directly by the noun phrase."},{"t":"tap","sk":"W","s":"The project was cancelled because of it was too expensive.","w":"of","o":["(remove)","to","for"],"a":0,"why":"it was too expensive is a clause, so use because alone."},{"t":"gap","sk":"W","q":"The flood was ___ to heavy rainfall upstream.","a":["due","owing","attributed","linked","related"],"why":"be due to + noun explains a cause.","bn":"কারণ বোঝাতে due to + noun।"},{"t":"mcq","sk":"W","q":"Public transport is cheap. ___, many people still prefer to drive.","o":["Although","However","Despite"],"a":1,"why":"A new sentence followed by a comma needs a sentence linker like However."},{"t":"order","sk":"W","s":"Did she really pass the exam despite having so little time?","why":"despite comes before the -ing form having."},{"t":"tap","sk":"W","s":"The decline was mainly because the falling birth rate.","w":"because","o":["due to","although","despite"],"a":0,"why":"the falling birth rate is a noun phrase, so due to."},{"t":"dict","sk":"L","s":"The trains were delayed because of a problem with the signals.","why":"Listen for the small word of after because.","bn":"because of-এর of খুব আস্তে শোনা যায়।"},{"t":"mcq","sk":"W","q":"Fuel prices doubled; ___, fewer people drove to work.","o":["as a result","because of","due to"],"a":0,"why":"The second part is a result of the first, and it is a full clause."},{"t":"gap","sk":"W","q":"Exports rose by 10%, ___ imports fell slightly.","a":["whereas","while","but"],"why":"Two contrasting facts in one sentence need whereas or while."},{"t":"tap","sk":"W","s":"In spite of feel ill, she sat the exam.","w":"feel","o":["feeling","felt","to feel"],"a":0,"why":"in spite of is followed by a noun or an -ing form."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: Despite receiving generous funding, …","o":["but the project failed to meet its targets.","however the project failed to meet its targets.","the project failed to meet its targets."],"a":2,"why":"despite already gives the contrast, so the main clause needs no but or however.","bn":"despite থাকলে but লাগে না।"},{"t":"order","sk":"S","s":"Do you enjoy your job even though the hours are long?","why":"even though joins the second clause to the main clause."},{"t":"tap","sk":"W","s":"Rural incomes rose slowly, despite urban incomes rose quickly.","w":"despite","o":["whereas","because of","in spite"],"a":0,"why":"Two clauses being compared need whereas, not despite.","bn":"দুটো তথ্যের তুলনায় whereas।"},{"t":"gap","sk":"W","q":"The fees went up. ___, fewer international students applied.","a":["as a result","therefore","consequently","so","thus","as a consequence"],"why":"The second sentence is a result of the first."},{"t":"dict","sk":"L","s":"Prices fell in the city, whereas they rose in rural areas.","why":"whereas is stressed on the second syllable."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: The decline in bee populations is partly due to …","o":["farmers use more pesticides.","the increased use of pesticides.","because pesticides are used more."],"a":1,"why":"due to must be followed by a noun phrase, not a clause."},{"t":"tap","sk":"W","s":"Even the weather was terrible, the festival went ahead.","w":"Even","o":["Even though","Despite","However"],"a":0,"why":"even alone is not a linker; even though introduces the clause."},{"t":"speak","sk":"S","q":"Do you like living in your hometown?","need":"\\b(although|though|even though|but|despite|in spite of|however|whereas|while)\\b","hint":"Give a contrast with although or despite","model":"Yes, mostly, although the traffic can be a nightmare during rush hour.","why":"A quick contrast makes a Part 1 answer sound balanced."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: Although urban air quality has improved in Europe, …","o":["many cities still exceed safe limits.","but many cities still exceed safe limits.","despite many cities still exceeding safe limits."],"a":0,"why":"The sentence needs a main clause with no extra but; the despite option leaves no main verb."},{"t":"speak","sk":"S","q":"Why do some people refuse to use public transport?","need":"\\b(because|due to|since|as a result|therefore|so)\\b","hint":"Give reasons with because, due to or as a result","model":"Mainly because buses are overcrowded, and due to the heat, even a short trip can feel exhausting.","why":"Part 3 why questions need clear cause linkers.","bn":"কারণ বলতে because, due to।"}]},{"id":"modals","title":"Modals and hedging","bn":"মোডাল ও সতর্কভাবে মত প্রকাশ","why":"Task 2 essays lose marks for absolute claims and broken modal forms, while careful hedging like tends to sounds mature in Writing and Speaking.","rules":[{"h":"Modal + base verb","en":"After must, can, should, might and could, use the base verb. Never add to, -ing or -s.","bn":"must, can, should, might-এর পরে verb-এর মূল রূপ বসে। to, -ing বা -s কিছুই লাগবে না।","ex":["Students should practise speaking every day.","She can speak three languages."]},{"h":"How sure are you?","en":"must means you are almost sure, may, might and could mean it is possible, and can't means you are sure it is not true.","bn":"কতটা নিশ্চিত: must মানে প্রায় নিশ্চিত, may/might/could মানে হতে পারে, can't মানে নিশ্চিতভাবে না।","ex":["The lights are off, so they must be asleep.","That can't be true; the shop closed years ago."]},{"h":"Obligation and advice","en":"must and have to show something is necessary, and should gives advice. don't have to means it is not necessary, but mustn't means it is not allowed.","bn":"must ও have to মানে করতেই হবে; should মানে পরামর্শ। don't have to মানে দরকার নেই, mustn't মানে নিষেধ।","ex":["You mustn't use your phone during the exam.","You don't have to bring a pen; we will provide one."]},{"h":"Hedging in Task 2","en":"Soften big claims with tends to, is likely to, seems to or it could be argued that. Examiners prefer careful claims to words like always and everyone.","bn":"Task 2-এ 'সবাই', 'সবসময়' এমন বড় দাবি না করে tend to, is likely to, it could be argued that দিয়ে নরম করে বলো।","ex":["Young people tend to spend more time online than their parents.","It could be argued that tourism does more harm than good."]},{"h":"should have / could have + past participle","en":"Use these to talk about the past: should have for regret or criticism, could have for a possibility that did not happen.","bn":"অতীতে যা করা উচিত ছিল বা সম্ভব ছিল কিন্তু হয়নি: should have / could have + V3।","ex":["The council should have built better drains.","We could have taken the train, but we chose to drive."]}],"traps":[{"wrong":"Students must to wear a uniform.","right":"Students must wear a uniform.","why":"must takes the base verb without to."},{"wrong":"I can able to speak English fluently.","right":"I am able to speak English fluently.","why":"Use can or be able to, not both."},{"wrong":"People should reducing their meat intake.","right":"People should reduce their meat intake.","why":"should takes the base verb, not -ing."},{"wrong":"He should have went to the doctor.","right":"He should have gone to the doctor.","why":"should have needs the past participle, gone."},{"wrong":"You don't must pay for the museum.","right":"You don't have to pay for the museum.","why":"must has no do form; use don't have to."}],"starters":["It could be argued that...","I might be wrong, but I think...","People my age tend to...","Looking back, I should have...","It's quite likely that in the future...","That seems to be mainly because..."],"q":[{"t":"mcq","sk":"W","q":"Drivers ___ stop at a red light.","o":["must","might","could"],"a":0,"why":"This is a rule, so must shows obligation."},{"t":"mcq","sk":"S","q":"You ___ bring your own laptop, but you can if you prefer.","o":["mustn't","don't have to","shouldn't"],"a":1,"why":"It is not necessary but allowed, so don't have to.","bn":"don't have to = দরকার নেই।"},{"t":"gap","sk":"W","q":"You ___ smoke in the hospital. It's against the rules.","a":["mustn't","must not","can't","cannot"],"why":"It is not allowed, so mustn't or can't."},{"t":"mcq","sk":"W","q":"Children ___ spend less time in front of screens.","o":["should","ought","must to"],"a":0,"why":"should is followed by the base verb; ought needs to, and must to is wrong."},{"t":"tap","sk":"W","s":"We must to finish the report by Friday.","w":"to","o":["(remove)","have","be"],"a":0,"why":"must takes the base verb without to.","bn":"must-এর পরে to নয়।"},{"t":"dict","sk":"L","s":"You don't have to come early, but you must bring your passport.","why":"Contrast don't have to with must."},{"t":"mcq","sk":"S","q":"She's not answering her phone. She ___ be in a meeting.","o":["must to","should have","might"],"a":2,"why":"might shows a possibility in the present."},{"t":"gap","sk":"W","q":"Students ___ (not/have to) wear a uniform at university.","a":["don't have to","do not have to","didn't have to","did not have to"],"why":"It is not necessary, so don't have to."},{"t":"tap","sk":"W","s":"I can able to cook simple meals.","w":"can","o":["am","could","may"],"a":0,"why":"Use am able to; can and able to mean the same thing."},{"t":"mcq","sk":"W","q":"Older people ___ to find new technology harder to learn.","o":["might","tend","should"],"a":1,"why":"tend to softens a general claim; might and should cannot take to here."},{"t":"dict","sk":"L","s":"Students who sleep well tend to perform better in exams.","why":"tend to is often said quickly, like tenda.","bn":"tend to দ্রুত শোনায় tenda।"},{"t":"tap","sk":"W","s":"Teenagers should spending less time online.","w":"spending","o":["spend","to spend","spent"],"a":0,"why":"should needs the base verb."},{"t":"gap","sk":"W","q":"Young people ___ to adopt new technology faster than older adults.","a":["tend","seem","appear"],"why":"tend to or seem to hedges a general claim.","bn":"tend to দিয়ে সাধারণ প্রবণতা।"},{"t":"mcq","sk":"W","q":"Sea levels are ___ to rise further this century.","o":["likely","probably","maybe"],"a":0,"why":"be likely to + verb is the correct pattern.","bn":"be likely to + verb।"},{"t":"order","sk":"W","s":"Most people tend to trust their family doctor.","why":"tend to comes right after the subject, then the base verb."},{"t":"tap","sk":"W","s":"She cans speak three languages.","w":"cans","o":["can","is can","could to"],"a":0,"why":"Modals never take -s, even with he or she."},{"t":"dict","sk":"L","s":"It could be argued that tourism does more harm than good.","why":"could be argued is one smooth chunk."},{"t":"mcq","sk":"W","q":"That ___ be John at the door; he's on holiday in Spain.","o":["mustn't","shouldn't","can't"],"a":2,"why":"can't shows you are sure something is impossible; mustn't means not allowed."},{"t":"gap","sk":"W","q":"I should ___ (study) harder for my last exam.","a":["have studied"],"why":"Regret about the past: should have + past participle."},{"t":"tap","sk":"W","s":"You should have came to the party.","w":"came","o":["come","coming","went"],"a":0,"why":"should have needs the past participle, come."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: It could be argued that …","o":["online learning to be as effective as classroom teaching.","online learning is as effective as classroom teaching.","online learning being as effective as classroom teaching."],"a":1,"why":"that must be followed by a full clause with a finite verb, is."},{"t":"order","sk":"S","s":"I might have left my keys at the office.","why":"might have + past participle shows a past possibility."},{"t":"tap","sk":"W","s":"Prices are likely rise next year.","w":"rise","o":["to rise","rising","rose"],"a":0,"why":"The pattern is be likely to + base verb."},{"t":"gap","sk":"W","q":"It ___ be argued that cars should be banned from city centres.","a":["could","might","may","can"],"why":"It could be argued that is a standard academic hedge."},{"t":"dict","sk":"L","s":"I should have booked the tickets earlier because now they are sold out.","why":"should have sounds like should've; write have."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: The findings suggest that the disease may …","o":["spreading faster in warmer climates.","to spread faster in warmer climates.","spread faster in warmer climates."],"a":2,"why":"may is a modal and takes the base verb, spread.","bn":"may-এর পরে verb-এর মূল রূপ।"},{"t":"tap","sk":"W","s":"The streets are wet, so it can have rained last night.","w":"can","o":["must","should","would"],"a":0,"why":"For a logical conclusion about the past, use must have.","bn":"অতীত নিয়ে নিশ্চিত অনুমান: must have।"},{"t":"speak","sk":"S","q":"Will people still read printed books in the future?","need":"\\b(might|may|could|probably|likely|tend to|seems? to)\\b","hint":"Predict with might, could or likely to","model":"Printed books will probably become less common, but I think they might survive as gifts and for children.","why":"Hedged predictions sound more natural than flat yes or no answers."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: With hindsight, the city planners should …","o":["have protected the wetlands from development.","protected the wetlands from development.","had protected the wetlands from development."],"a":0,"why":"For criticism of the past, use should have + past participle."},{"t":"speak","sk":"S","q":"Is there anything you wish you had done differently at school?","need":"\\b(should|could|might)(\\s+not|n't)?\\s+have\\s+\\w+","hint":"Use should have or could have + past participle","model":"I should have joined the debate club, because I could have built my speaking confidence much earlier.","why":"Regret about the past is a natural place for should have.","bn":"আফসোস বোঝাতে should have + V3।"}]},{"id":"gerund","title":"Gerund or infinitive","bn":"-ing নাকি to + verb","why":"Wrong verb patterns like enjoy to watch are small but frequent slips that pull down your grammar score in both Speaking and Writing.","rules":[{"h":"Verbs followed by -ing","en":"After enjoy, avoid, consider, suggest, admit, finish, mind and keep, use the -ing form.","bn":"enjoy, avoid, consider, suggest, admit, finish, mind-এর পরে verb-এ -ing লাগে।","ex":["I enjoy cooking for my friends.","The minister admitted making a mistake."]},{"h":"Verbs followed by to","en":"After decide, plan, hope, refuse, afford, manage and agree, use to + base verb.","bn":"decide, plan, hope, refuse, afford, manage, agree-এর পরে to + verb বসে।","ex":["We decided to take the train.","Many families cannot afford to buy a flat."]},{"h":"stop, remember, try","en":"These verbs take both forms but the meaning changes. stop to do means pause in order to do it; stop doing means quit. remember to do is about a duty; remember doing is a memory.","bn":"stop to do মানে কিছু করার জন্য থামা, stop doing মানে ছেড়ে দেওয়া। remember to do মানে করতে মনে রাখা, remember doing মানে করার স্মৃতি।","ex":["I stopped to buy some water.","I remember visiting Sylhet as a child."]},{"h":"Preposition + -ing","en":"After a preposition always use -ing. The to in look forward to and be used to is a preposition, so it also takes -ing.","bn":"preposition-এর পরে সবসময় -ing। look forward to আর be used to-এর to-ও preposition, তাই পরে -ing।","ex":["She is interested in learning Korean.","I look forward to hearing from you."]},{"h":"-ing as subject, adjective + to","en":"Use the -ing form when an action is the subject of a sentence. After adjectives like difficult, easy and hard, use to + verb.","bn":"বাক্যের subject হিসেবে কাজ বোঝাতে -ing (Reading helps)। difficult, easy, hard-এর পরে to + verb।","ex":["Reading in English improves your vocabulary.","It is difficult to find cheap housing in Dhaka."]}],"traps":[{"wrong":"I enjoy to watch football.","right":"I enjoy watching football.","why":"enjoy is always followed by -ing."},{"wrong":"I look forward to meet you.","right":"I look forward to meeting you.","why":"to here is a preposition, so -ing follows."},{"wrong":"She suggested to take a taxi.","right":"She suggested taking a taxi.","why":"suggest takes -ing, not to + verb."},{"wrong":"Many families cannot afford buying a flat.","right":"Many families cannot afford to buy a flat.","why":"afford takes to + verb."},{"wrong":"Learn a new language takes time.","right":"Learning a new language takes time.","why":"An action as subject needs the -ing form."}],"starters":["I really enjoy... because...","Lately I've been thinking of...","I've decided to... next year.","I'm really looking forward to...","To be honest, it's quite hard to...","I stopped... a while ago because..."],"q":[{"t":"mcq","sk":"W","q":"I enjoy ___ to music while I study.","o":["listening","to listen","listen"],"a":0,"why":"enjoy is followed by the -ing form.","bn":"enjoy-এর পরে -ing।"},{"t":"mcq","sk":"S","q":"We decided ___ the train instead of the bus.","o":["taking","to take","take"],"a":1,"why":"decide is followed by to + verb."},{"t":"gap","sk":"W","q":"Would you mind ___ (open) the window?","a":["opening"],"why":"mind is followed by -ing."},{"t":"mcq","sk":"W","q":"She is good at ___ people feel relaxed.","o":["make","to make","making"],"a":2,"why":"at is a preposition, so it takes -ing."},{"t":"tap","sk":"W","s":"I really enjoy cook for my friends at weekends.","w":"cook","o":["cooking","to cook","cooked"],"a":0,"why":"enjoy is followed by -ing."},{"t":"dict","sk":"L","s":"I enjoy reading in English before I go to bed.","why":"Listen for the -ing ending on reading."},{"t":"mcq","sk":"S","q":"I'm looking forward to ___ my family next month.","o":["see","seeing","saw"],"a":1,"why":"The to in look forward to is a preposition, so -ing follows.","bn":"look forward to + -ing।"},{"t":"gap","sk":"W","q":"They managed ___ (finish) the project on time.","a":["to finish"],"why":"manage is followed by to + verb."},{"t":"tap","sk":"W","s":"We are planning visiting Cox's Bazar in December.","w":"visiting","o":["to visit","visit","visited"],"a":0,"why":"plan is followed by to + verb.","bn":"plan-এর পরে to + verb।"},{"t":"mcq","sk":"W","q":"Many young people cannot afford ___ a home in the capital.","o":["to buy","buying","buy"],"a":0,"why":"afford takes to + verb."},{"t":"dict","sk":"L","s":"We are hoping to visit our grandparents during the holidays.","why":"hope takes to + verb; to is very weak in speech.","bn":"to খুব আস্তে উচ্চারিত হয়।"},{"t":"tap","sk":"W","s":"She suggested go to the museum on Sunday.","w":"go","o":["going","to go","went"],"a":0,"why":"suggest is followed by -ing."},{"t":"gap","sk":"W","q":"I'm thinking of ___ (apply) for a master's degree.","a":["applying"],"why":"of is a preposition, so -ing.","bn":"preposition-এর পরে -ing।"},{"t":"mcq","sk":"W","q":"On the way home, I stopped ___ some bread.","o":["buying","to buy","buy"],"a":1,"why":"You stopped in order to buy bread, so stop to do."},{"t":"order","sk":"W","s":"She avoided eating sugar for the whole month.","why":"avoid comes before the -ing form eating."},{"t":"tap","sk":"W","s":"I look forward to hear from you soon.","w":"hear","o":["hearing","heard","be hearing"],"a":0,"why":"look forward to takes -ing because to is a preposition."},{"t":"dict","sk":"L","s":"Learning a second language takes a lot of patience.","why":"The sentence starts with an -ing subject."},{"t":"mcq","sk":"W","q":"___ part in sport helps children make friends.","o":["Taking","Take","To taking"],"a":0,"why":"An action as the subject takes the -ing form."},{"t":"gap","sk":"W","q":"It is not easy ___ (find) a part-time job in a small town.","a":["to find"],"why":"After an adjective like easy, use to + verb."},{"t":"tap","sk":"W","s":"Live in a big city can be very stressful.","w":"Live","o":["Living","To living","Lived"],"a":0,"why":"The subject of the sentence is an action, so use -ing."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: Many governments have considered …","o":["introduce a tax on plastic bags.","introducing a tax on plastic bags.","to introduce a tax on plastic bags."],"a":1,"why":"consider is followed by the -ing form.","bn":"consider-এর পরে -ing।"},{"t":"order","sk":"S","s":"It is difficult to find a quiet place to study.","why":"It is + adjective + to + verb."},{"t":"tap","sk":"W","s":"My parents refused letting me study abroad.","w":"letting","o":["to let","let","having let"],"a":0,"why":"refuse is followed by to + verb."},{"t":"gap","sk":"W","q":"Please remember ___ (send) me the file before Friday.","a":["to send"],"why":"remember to do is about something you must not forget to do."},{"t":"dict","sk":"L","s":"I look forward to meeting you at the conference next week.","why":"Notice meeting, not meet, after look forward to."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: Researchers found it surprisingly difficult …","o":["recruit older volunteers.","to recruit older volunteers.","for recruiting older volunteers."],"a":1,"why":"find it difficult + to + verb is the standard pattern."},{"t":"tap","sk":"W","s":"She is used to wake up at five every morning.","w":"wake","o":["waking","woke","be waking"],"a":0,"why":"In be used to, to is a preposition, so -ing follows.","bn":"be used to + -ing মানে অভ্যস্ত।"},{"t":"speak","sk":"S","q":"What do you enjoy doing in your free time?","need":"\\b(enjoy|enjoys|love|loves|like|likes|prefer|fancy)\\s+\\w+ing\\b","hint":"Use enjoy, love or like + -ing","model":"I really enjoy playing badminton with my friends, and lately I've started cooking simple meals too.","why":"Answer with the same pattern the examiner used: enjoy + -ing."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: The company is committed to …","o":["reduce its carbon emissions by 2030.","reduced its carbon emissions by 2030.","reducing its carbon emissions by 2030."],"a":2,"why":"In be committed to, to is a preposition, so the verb takes -ing."},{"t":"speak","sk":"S","q":"What should people do to stay healthy in big cities?","need":"^\\s*\\w+ing\\b|\\b(try|avoid|stop|keep|consider|start)\\s+\\w+ing\\b|\\b(important|hard|difficult|easy|essential|better|good)\\s+to\\s+\\w+","hint":"Use avoid + -ing or it's important to...","model":"Walking instead of taking a rickshaw helps a lot, and it's important to avoid eating too much fried street food.","why":"Mixing -ing and to patterns shows grammatical range.","bn":"-ing আর to দুই ধরনই ব্যবহার করো।"}]},{"id":"prep","title":"Dependent prepositions","bn":"নির্দিষ্ট শব্দের সাথে নির্দিষ্ট preposition","why":"Task 1 reports depend on a rise in versus rose by, and wrong prepositions after common verbs are some of the most repeated errors in Writing.","rules":[{"h":"in, by, of, from, to with changes","en":"Use in after the noun for the thing that changes: a rise in prices. Use by for the amount after a verb, of for the amount after a noun, and from and to for levels.","bn":"কোন জিনিস বাড়ল তা বোঝাতে noun-এর পরে in (a rise in prices)। কতটুকু বাড়ল: verb-এর পরে by, noun-এর পরে of; কোন স্তর থেকে কোন স্তরে: from ... to।","ex":["There was a sharp increase in rice prices.","Sales rose by 15%, an increase of 300 units, to reach 2,300."]},{"h":"in, on, at for time","en":"Use in for years, months and seasons, on for days and dates, and at for clock times and night.","bn":"বছর, মাস, ঋতুর আগে in; দিন বা তারিখের আগে on; ঘড়ির সময় আর night-এর আগে at।","ex":["The figures peaked in 2010.","The shop is closed on Fridays, and most accidents happen at night."]},{"h":"Adjective + preposition","en":"Some adjectives always take the same preposition: responsible for, aware of, dependent on, similar to, different from.","bn":"কিছু adjective-এর সাথে নির্দিষ্ট preposition বসে: responsible for, aware of, dependent on, similar to, different from। জোড়া ধরে মুখস্থ করো।","ex":["Parents are responsible for their children's safety.","Many people are not aware of the risks."]},{"h":"Verb + preposition","en":"Learn depend on, focus on and contribute to as fixed pairs. result in is followed by the effect, and result from is followed by the cause.","bn":"depend on, focus on, contribute to। result in-এর পরে ফল, result from-এর পরে কারণ বসে।","ex":["Deforestation results in soil erosion.","Many health problems result from poor diet."]},{"h":"No preposition after these verbs","en":"discuss, emphasise, enter, reach, mention and lack (as a verb) take a direct object with no preposition.","bn":"discuss, emphasise, enter, reach, mention আর verb হিসেবে lack-এর পরে preposition লাগে না। বাংলায় 'নিয়ে আলোচনা' বলি বলে about বসিয়ে ফেলি।","ex":["This essay will discuss both views.","Many rural schools lack qualified teachers."]}],"traps":[{"wrong":"We discussed about the problem.","right":"We discussed the problem.","why":"discuss takes a direct object; no about."},{"wrong":"The village lacks of clean water.","right":"The village lacks clean water.","why":"lack as a verb takes no preposition."},{"wrong":"There was a rise of house prices.","right":"There was a rise in house prices.","why":"Use in for the thing that rises."},{"wrong":"The price increased with 20%.","right":"The price increased by 20%.","why":"Use by for the amount of change."},{"wrong":"Smoking can result to lung cancer.","right":"Smoking can result in lung cancer.","why":"result in is followed by the effect."}],"starters":["It really depends on...","To be honest, I wasn't aware of... until...","My hometown is quite different from...","At the moment I'm mainly focusing on...","I think that has resulted in...","I'd say parents are mostly responsible for..."],"q":[{"t":"mcq","sk":"W","q":"The museum is closed ___ Mondays.","o":["in","on","at"],"a":1,"why":"Use on with days of the week.","bn":"দিনের আগে on।"},{"t":"mcq","sk":"S","q":"I usually study best ___ night.","o":["at","in","on"],"a":0,"why":"We say at night."},{"t":"gap","sk":"W","q":"The company was founded ___ 1998.","a":["in"],"why":"Use in with years."},{"t":"mcq","sk":"W","q":"There was a sharp increase ___ the number of tourists.","o":["of","in","on"],"a":1,"why":"increase in + the thing that increases."},{"t":"tap","sk":"W","s":"The exam begins in nine o'clock tomorrow.","w":"in","o":["at","on","by"],"a":0,"why":"Use at with clock times."},{"t":"dict","sk":"L","s":"The library is closed on Sundays and opens at nine on Mondays.","why":"Listen for on before days and at before the time."},{"t":"mcq","sk":"W","q":"The price of petrol rose ___ 20% between 2015 and 2020.","o":["with","by","of"],"a":1,"why":"After the verb rise, by gives the amount.","bn":"কতটুকু বাড়ল: verb + by।"},{"t":"gap","sk":"W","q":"Our city's transport system is quite similar ___ the one in Delhi.","a":["to"],"why":"The fixed pair is similar to.","bn":"similar-এর পরে to।"},{"t":"tap","sk":"W","s":"We discussed about climate change in class.","w":"about","o":["(remove)","on","of"],"a":0,"why":"discuss takes a direct object.","bn":"discuss-এর পরে about নয়।"},{"t":"mcq","sk":"S","q":"My sister's personality is very different ___ mine.","o":["from","than","with"],"a":0,"why":"In British English the standard form is different from."},{"t":"dict","sk":"L","s":"There was a steady increase in the number of foreign students.","why":"increase in is linked: increa-sin.","bn":"increase in জুড়ে শোনায়।"},{"t":"tap","sk":"W","s":"Good results depend of regular practice.","w":"of","o":["on","in","from"],"a":0,"why":"The fixed pair is depend on."},{"t":"gap","sk":"W","q":"In this essay, I will focus ___ the economic effects of tourism.","a":["on","upon"],"why":"The fixed pair is focus on."},{"t":"mcq","sk":"W","q":"Parents are responsible ___ teaching children good manners.","o":["of","for","about"],"a":1,"why":"responsible for, followed by -ing here because for is a preposition."},{"t":"order","sk":"W","s":"Parents are responsible for their children's safety.","why":"responsible is followed by for."},{"t":"tap","sk":"W","s":"Many students are not aware about the risks of online loans.","w":"about","o":["of","for","with"],"a":0,"why":"The fixed pair is aware of."},{"t":"dict","sk":"L","s":"Many farmers in the region are dependent on the monsoon rains.","why":"dependent on is linked smoothly in speech."},{"t":"mcq","sk":"W","q":"Unemployment fell from 8% in 2010 ___ 5% in 2020.","o":["by","to","at"],"a":1,"why":"from one level to another level."},{"t":"gap","sk":"W","q":"The number of cars rose from 2 million ___ 3.5 million.","a":["to"],"why":"from one level to another level."},{"t":"tap","sk":"W","s":"Whe
