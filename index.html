n the train reached to Dhaka, it was already dark.","w":"to","o":["(remove)","at","in"],"a":0,"why":"reach takes a direct object; arrive in would need in.","bn":"reach-এর পরে to নয়।"},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: Deforestation in the region has resulted …","o":["in severe soil erosion.","from severe soil erosion.","to severe soil erosion."],"a":0,"why":"Soil erosion is the effect of deforestation, so result in. result from would reverse cause and effect.","bn":"result in + ফল, result from + কারণ।"},{"t":"order","sk":"S","s":"It really depends on the weather.","why":"depends on is a fixed pair; really comes before the verb."},{"t":"tap","sk":"W","s":"There was a significant rise of unemployment after the factory closed.","w":"of","o":["in","on","at"],"a":0,"why":"rise in + the thing that rises; rise of is for the amount."},{"t":"gap","sk":"W","q":"Car sales increased ___ 10% in 2019, reaching a peak of 50,000.","a":["by"],"why":"The verb increase + by gives the amount of change."},{"t":"dict","sk":"L","s":"The report focuses on the causes and does not mention the solutions.","why":"Notice there is no word after mention before the solutions."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: Many island nations remain heavily dependent …","o":["of tourism for income.","on tourism for income.","with tourism for income."],"a":1,"why":"The fixed pair is dependent on."},{"t":"tap","sk":"W","s":"Air pollution contributes for many respiratory diseases in South Asia.","w":"for","o":["to","in","on"],"a":0,"why":"The fixed pair is contribute to."},{"t":"speak","sk":"S","q":"What do you usually do at weekends?","need":"\\b(on|at)\\s+(the\\s+)?(weekends?|saturdays?|fridays?|sundays?|night)\\b|\\bin the (morning|evening|afternoon)\\b","hint":"Use on Fridays, at night or in the morning","model":"On Fridays I usually visit my family, and at night I watch a film with my roommates.","why":"Time prepositions are easy points in Part 1."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: The report emphasises …","o":["on the need for cleaner energy.","about the need for cleaner energy.","the need for cleaner energy."],"a":2,"why":"The verb emphasise takes a direct object; only the noun emphasis takes on."},{"t":"speak","sk":"S","q":"What has caused the rise in traffic in many cities?","need":"\\b(rise|increase|growth|fall|drop) in\\b|\\bresult(s|ed)? (in|from)\\b|\\bcontribut\\w* to\\b|\\bdue to\\b|\\bdepends? on\\b","hint":"Use a rise in, contribute to or result from","model":"The rise in traffic mainly results from cheap car loans, and poor public transport also contributes to the problem.","why":"Fixed preposition pairs make a Part 3 answer sound precise.","bn":"result from + কারণ।"}]},{"id":"wordform","title":"Word forms","bn":"শব্দের রূপভেদ","why":"Wrong word forms lower your Writing and Speaking grammar score, and in Listening and Reading a gap answer in the wrong form is marked wrong.","rules":[{"h":"One word family, four jobs","en":"Many words have a noun, verb, adjective and adverb form. Economy is a noun, economic means about the economy, economical means saving money, and economically is the adverb.","bn":"একটি শব্দ পরিবারের সাধারণত noun, verb, adjective ও adverb রূপ থাকে। economic মানে অর্থনীতি সংক্রান্ত, আর economical মানে খরচ বাঁচায় এমন।","ex":["The country has strong economic growth.","A small car is more economical than a large one."]},{"h":"Adjective + noun, adverb + verb","en":"Put an adjective before a noun and an adverb after a verb. Task 1 needs both: a sharp rise, or prices rose sharply.","bn":"noun-এর আগে adjective বসে, আর verb-এর পরে adverb বসে। যেমন a sharp rise কিন্তু rose sharply।","ex":["There was a significant increase in sales.","Sales increased significantly in 2019."]},{"h":"Rise, fall, increase: noun or verb","en":"Words like rise, fall, increase and decline can be nouns or verbs. After a, the or an adjective they are nouns; after a subject they are verbs.","bn":"rise, fall, increase এগুলো noun বা verb দুটোই হতে পারে। a বা the-এর পরে noun, আর subject-এর পরে verb হিসেবে বসে।","ex":["There was a steady fall in unemployment.","Unemployment fell steadily."]},{"h":"Use the words around the gap","en":"In Reading and Listening gaps, look at the word before the gap. After the, a or an adjective you need a noun; after very or a linking verb like is you need an adjective; after a verb you often need an adverb.","bn":"gap-এর আগের শব্দ দেখুন। the বা a-এর পরে noun, very বা is-এর পরে adjective, আর verb-এর পরে সাধারণত adverb লাগে।","ex":["The museum is famous for the beauty of its gardens.","The new road made travel very convenient."]},{"h":"Endings give you clues","en":"Endings like -tion, -ment, -ness and -ity usually mark nouns; -al, -ive, -ous and -ful mark adjectives; -ly marks most adverbs.","bn":"শব্দের শেষাংশ দেখে রূপ চেনা যায়। -tion, -ment noun; -al, -ful, -ous adjective; আর -ly সাধারণত adverb।","ex":["The development of the area was slow.","The project was highly successful."]}],"traps":[{"wrong":"There was a significantly increase in sales.","right":"There was a significant increase in sales.","why":"Before a noun, use an adjective, not an adverb."},{"wrong":"The number of tourists rose sharp in 2010.","right":"The number of tourists rose sharply in 2010.","why":"A verb like rose needs an adverb."},{"wrong":"Plastic is a serious environment problem.","right":"Plastic is a serious environmental problem.","why":"Use the adjective form before the noun problem."},{"wrong":"Education is very importance for children.","right":"Education is very important for children.","why":"After very, you need an adjective."},{"wrong":"The government should invest in economical growth.","right":"The government should invest in economic growth.","why":"Economic is about the economy; economical means cheap to run."}],"starters":["There has been a noticeable change in ...","It has become increasingly difficult to ...","Financially, it makes more sense to ...","I'd say it has improved dramatically over the last few years.","The biggest difference is the ...","Honestly, it's far more convenient to ..."],"q":[{"t":"mcq","sk":"W","q":"The graph shows a ___ rise in the price of rice between 2000 and 2010.","o":["sharp","sharply","sharpen"],"a":0,"why":"Rise is a noun here (after a), so it needs an adjective: a sharp rise.","bn":"noun-এর আগে adjective বসে।"},{"t":"mcq","sk":"W","q":"Car sales fell ___ after the new tax was introduced.","o":["dramatic","drama","dramatically"],"a":2,"why":"Fell is a verb, so describe it with an adverb: fell dramatically.","bn":"verb-এর পরে adverb বসে।"},{"t":"mcq","sk":"L","q":"Please bring some proof of your ___ when you collect your library card.","o":["identify","identical","identity"],"a":2,"why":"After your you need a noun. Identity is the noun; identify is a verb."},{"t":"mcq","sk":"W","q":"Public transport is more ___ than driving, as it costs far less.","o":["economic","economical","economy"],"a":1,"why":"Economical means saving money. Economic is about the economy as a whole."},{"t":"mcq","sk":"S","q":"I think the internet has ___ changed the way students learn.","o":["completely","complete","completion"],"a":0,"why":"Changed is a verb, so it needs an adverb: completely changed."},{"t":"mcq","sk":"W","q":"The ___ of the new bridge took almost three years.","o":["construct","construction","constructive"],"a":1,"why":"After the, you need a noun. Words ending in -tion are usually nouns.","bn":"the-এর পরে noun লাগে।"},{"t":"mcq","sk":"W","q":"There is little ___ that fast food alone causes obesity.","o":["evident","evidently","evidence"],"a":2,"why":"Little here needs a noun after it: little evidence. Evident is an adjective."},{"t":"mcq","sk":"R","q":"Complete the summary with the correct word form: The study found that regular exercise had a ___ effect on students' memory.","o":["benefit","beneficial","beneficially"],"a":1,"why":"Between a and the noun effect, you need an adjective: a beneficial effect."},{"t":"mcq","sk":"R","q":"Complete the sentence with the correct word form: Early farming communities depended ___ on the river for water.","o":["heavily","heavy","heaviness"],"a":0,"why":"Depended is a verb, so an adverb fits: depended heavily on."},{"t":"mcq","sk":"R","q":"Complete the sentence with the correct word form: The decline in bee numbers is a serious threat to the ___ of many food crops.","o":["productive","productively","production"],"a":2,"why":"After the and before of you need a noun: the production of crops.","bn":"the ___ of হলে মাঝখানে noun বসে।"},{"t":"tap","sk":"W","s":"The number of students increased significant between 2005 and 2015.","w":"significant","o":["significantly","significance","signify"],"a":0,"why":"Increased is a verb, so it needs the adverb significantly.","bn":"verb-এর পরে -ly যুক্ত adverb বসান।"},{"t":"tap","sk":"W","s":"There was a dramatically fall in unemployment last year.","w":"dramatically","o":["drama","dramatic","dramatise"],"a":1,"why":"Fall is a noun here, so use the adjective dramatic before it."},{"t":"tap","sk":"W","s":"Many young people are not confidence when they speak English.","w":"confidence","o":["confidently","confide","confident"],"a":2,"why":"After are not, you need an adjective: confident. Confidence is a noun.","bn":"be verb-এর পরে adjective লাগে।"},{"t":"tap","sk":"W","s":"Living in a big city can be very stress for older people.","w":"stress","o":["stressful","stressed","stressfully"],"a":0,"why":"After very, use an adjective. Stressful describes the city life; stressed describes a person's feeling."},{"t":"tap","sk":"W","s":"Plastic waste causes serious environment damage in rivers.","w":"environment","o":["environments","environmental","environmentally"],"a":1,"why":"Damage is a noun, so the word before it should be the adjective environmental."},{"t":"tap","sk":"W","s":"Online learning allows students to study more flexible at home.","w":"flexible","o":["flexibility","flex","flexibly"],"a":2,"why":"Study is a verb, so use the adverb flexibly to describe how they study."},{"t":"tap","sk":"W","s":"The successful of the project depended on local support.","w":"successful","o":["success","succeed","successfully"],"a":0,"why":"After the and before of you need a noun: the success of the project.","bn":"the ___ of এর মাঝে noun বসে।"},{"t":"gap","sk":"W","q":"Rice production rose ___ (steady) over the decade.","a":["steadily"],"why":"Rose is a verb, so use the adverb steadily."},{"t":"gap","sk":"W","q":"The ___ (develop) of new technology has changed the job market.","a":["development"],"why":"After the you need a noun. Develop becomes development.","bn":"the-এর পরে noun রূপ লিখুন।"},{"t":"gap","sk":"W","q":"Many people are ___ (worry) about the rising cost of housing.","a":["worried"],"why":"People feel something, so use the -ed adjective worried after are."},{"t":"gap","sk":"W","q":"Smoking is ___ (harm) to both smokers and the people around them.","a":["harmful"],"why":"After is you need an adjective. Harm plus -ful gives harmful."},{"t":"gap","sk":"W","q":"It is ___ (economy) better to repair an old phone than to buy a new one.","a":["economically"],"why":"The adverb economically describes the adjective better.","bn":"adjective-কে বর্ণনা করতে adverb লাগে।"},{"t":"dict","sk":"L","s":"There was a sharp rise in the number of students studying abroad.","why":"Listen for the adjective sharp before the noun rise."},{"t":"dict","sk":"L","s":"Prices increased gradually and then fell dramatically at the end of the year.","why":"Listen for the -ly endings on gradually and dramatically."},{"t":"dict","sk":"L","s":"Public transport is a more economical choice for most young workers.","why":"Notice economical, which means it saves money."},{"t":"dict","sk":"L","s":"The development of the city has had a significant effect on traffic.","why":"Catch the noun development and the adjective significant."},{"t":"order","sk":"W","s":"The number of foreign visitors rose sharply.","why":"Subject, then verb, then the adverb that describes the verb."},{"t":"order","sk":"S","s":"I find living in a big city very stressful.","why":"Find + something + adjective: find it stressful."},{"t":"speak","sk":"S","q":"Has your hometown changed much in recent years?","need":"\\b(changed|grown|improved|increased|developed|expanded|become|got|fallen|risen)\\b.*\\b\\w{3,}ly\\b|\\b\\w{3,}ly\\b.*\\b(changed|grown|improved|increased|developed|expanded)\\b","hint":"Use a verb + adverb, e.g. changed dramatically.","model":"Yes, it has changed dramatically. The roads have improved a lot and the population has grown rapidly.","why":"Verb + adverb shows range and accurate word forms."},{"t":"speak","sk":"S","q":"How has technology affected the way people work?","need":"\\b(significant|huge|major|dramatic|positive|negative|considerable|massive|big|real)\\s+(effect|impact|change|improvement|increase|difference|influence)\\b","hint":"Use adjective + noun, e.g. a huge impact.","model":"It has had a huge impact. Most people now work online, and there has been a significant increase in remote jobs.","why":"Adjective + noun phrases sound precise and natural."}]},{"id":"sentence","title":"Sentence boundaries","bn":"বাক্যের সীমানা","why":"Comma splices, fragments and missing verbs are counted as errors in Writing Task 1 and 2, and they also confuse your ideas in Speaking.","rules":[{"h":"Every sentence needs a subject and a verb","en":"A full sentence has a subject and a main verb. English does not drop the subject or the verb be, so write It is important, not Is important.","bn":"প্রতিটি বাক্যে subject ও verb থাকতে হবে। বাংলায় 'হয়' বাদ দেওয়া যায়, কিন্তু ইংরেজিতে is/are বাদ দেওয়া যায় না।","ex":["It is important to save water.","The city is very crowded."]},{"h":"A comma cannot join two sentences","en":"Two complete sentences joined only by a comma is a comma splice. Use a full stop, a semicolon, or a joining word such as and, but, so or because.","bn":"শুধু comma দিয়ে দুটি পূর্ণ বাক্য জোড়া যায় না। full stop, semicolon, অথবা and, but, so, because ব্যবহার করুন।","ex":["Many people move to cities. They want better jobs.","Many people move to cities because they want better jobs."]},{"h":"However is not a joining word","en":"However, therefore and for example cannot join two sentences with a comma. Put a full stop or a semicolon before them and a comma after.","bn":"however, therefore দিয়ে comma-র মাধ্যমে দুটি বাক্য জোড়া যায় না। এদের আগে full stop বা semicolon এবং পরে comma দিন।","ex":["Cars are convenient. However, they pollute the air.","Cars are convenient; however, they pollute the air."]},{"h":"Because and although clauses need a main clause","en":"A clause starting with because, although, when or if cannot stand alone in writing. Join it to a main clause, and do not add but after although.","bn":"because, although, when দিয়ে শুরু হওয়া অংশ একা বাক্য হতে পারে না। এর সাথে মূল বাক্য যোগ করুন, আর although-এর সাথে but বসাবেন না।","ex":["Many students choose this course because it is cheap.","Although the city is noisy, I enjoy living there."]},{"h":"Break up run-on sentences","en":"A run-on sentence strings several ideas together with no punctuation. Give each main idea its own sentence or link two ideas clearly.","bn":"অনেকগুলো ধারণা একটানা একটি বাক্যে লিখবেন না। প্রতিটি মূল ধারণার জন্য আলাদা বাক্য লিখুন বা সঠিক linker দিন।","ex":["Rents are rising. As a result, many students share flats.","The bus was late, so I missed the first class."]}],"traps":[{"wrong":"Many people move to cities, they want better jobs.","right":"Many people move to cities because they want better jobs.","why":"A comma alone cannot join two full sentences."},{"wrong":"Because it is cheap.","right":"Many students choose this course because it is cheap.","why":"A because clause needs a main clause."},{"wrong":"Is important to save water.","right":"It is important to save water.","why":"English sentences need a subject, here it."},{"wrong":"Cars are convenient, however they pollute the air.","right":"Cars are convenient. However, they pollute the air.","why":"However cannot join two sentences with a comma."},{"wrong":"The library very quiet in the morning.","right":"The library is very quiet in the morning.","why":"Every sentence needs a verb; do not drop is."}],"starters":["The main reason is that ...","That's mainly because ...","I really like it. However, ...","There are two reasons. First, ... Second, ...","Although it's ..., I still ...","It's quite expensive, so ..."],"q":[{"t":"mcq","sk":"W","q":"Choose the correct sentence.","o":["Many students work part-time, they need money.","Many students work part-time because they need money.","Many students work part-time. Because they need money."],"a":1,"why":"Because joins the reason to the main clause. A comma alone cannot join two sentences.","bn":"comma দিয়ে দুটি বাক্য জোড়া যায় না।"},{"t":"mcq","sk":"W","q":"___ important to protect forests for future generations.","o":["It is","Is","It"],"a":0,"why":"English needs a subject and a verb: It is important. Is alone has no subject.","bn":"ইংরেজিতে subject বাদ দেওয়া যায় না।"},{"t":"mcq","sk":"W","q":"Choose the correct sentence.","o":["Fast food is cheap, however, it is often unhealthy.","Fast food is cheap however it is often unhealthy.","Fast food is cheap; however, it is often unhealthy."],"a":2,"why":"Use a semicolon or full stop before however and a comma after it."},{"t":"mcq","sk":"W","q":"The bar chart ___ the number of cars sold in four countries.","o":["showing","shows","which shows"],"a":1,"why":"The sentence needs a main verb. Showing and which shows leave it without one."},{"t":"mcq","sk":"W","q":"Choose the correct sentence.","o":["Although the city is crowded, but it has many parks.","Although the city is crowded. It has many parks.","Although the city is crowded, it has many parks."],"a":2,"why":"Although already shows contrast, so do not add but. Keep both parts in one sentence.","bn":"although-এর সাথে but বসে না।"},{"t":"mcq","sk":"W","q":"Choose the correct sentence.","o":["Online classes save time. For example, students do not need to travel.","Online classes save time, for example students do not need to travel.","Online classes save time for example, students do not need to travel."],"a":0,"why":"For example cannot join two sentences. Start a new sentence with it."},{"t":"mcq","sk":"W","q":"Choose the best way to join the ideas: Rents are high. Many students share flats.","o":["Rents are high, many students share flats.","Rents are high so, many students share flats.","Rents are high, so many students share flats."],"a":2,"why":"So can join two clauses, with a comma before it, not after it."},{"t":"mcq","sk":"W","q":"Choose the correct sentence.","o":["This is why the government built a new metro line.","Which is why the government built a new metro line.","Which the government built a new metro line."],"a":0,"why":"A sentence cannot start with which here. This is why makes a full sentence."},{"t":"mcq","sk":"W","q":"Choose the correct sentence.","o":["The number of cars has doubled, as a result traffic is worse.","The number of cars has doubled as a result, traffic is worse.","The number of cars has doubled; as a result, traffic is worse."],"a":2,"why":"As a result is a linking adverb. Use a semicolon or full stop before it."},{"t":"mcq","sk":"W","q":"Choose the correct sentence.","o":["The rent is high, the area is safe and quiet so many families live there.","The rent is high. However, the area is safe and quiet, so many families live there.","The rent is high however the area is safe and quiet so many families live there."],"a":1,"why":"The other two are run-on sentences. Split the ideas and use linkers correctly."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: Although the dam provided cheap electricity, ...","o":["but it damaged fish habitats.","it damaged fish habitats downstream.","and damaging fish habitats."],"a":1,"why":"After an although clause, add a full main clause. Do not add but or and."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: The scientists repeated the experiment because ...","o":["unclear results from the first trial.","the results of the first trial unclear.","the results of the first trial were unclear."],"a":2,"why":"Because needs a clause with a subject and verb: the results were unclear.","bn":"because-এর পরে subject ও verb লাগে।"},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: Coral reefs cover less than one percent of the ocean floor; ...","o":["however they support, a quarter of all marine species.","however, they support a quarter of all marine species.","but however they support a quarter of all marine species."],"a":1,"why":"After a semicolon, however is followed by a comma. Never use but and however together."},{"t":"tap","sk":"W","s":"Smartphones are useful, however they can be very addictive.","w":"however","o":["but","therefore","also"],"a":0,"why":"However cannot join two clauses with a comma. But can.","bn":"comma-র পরে দুটি বাক্য জুড়তে but ব্যবহার করুন।"},{"t":"tap","sk":"W","s":"Is important for children to learn a second language.","w":"Is","o":["There is","This","It is"],"a":2,"why":"The sentence needs the subject it: It is important."},{"t":"tap","sk":"W","s":"Many workers prefer remote jobs. Because they save time on travel.","w":"Because","o":["That's because","Although","Because of"],"a":0,"why":"Because they save time is a fragment. That's because makes it a full sentence.","bn":"because দিয়ে শুরু অংশ একা বাক্য নয়।"},{"t":"tap","sk":"W","s":"The chart showing the percentage of households with internet access.","w":"showing","o":["shown","shows","to show"],"a":1,"why":"The sentence has no main verb. Shows gives it one."},{"t":"gap","sk":"W","q":"___ difficult to find cheap housing in Dhaka. (two words)","a":["it is","it's"],"why":"English needs a subject: It is difficult. Is alone is not enough.","bn":"বাক্যের শুরুতে It is লিখুন।"},{"t":"gap","sk":"W","q":"The city has grown quickly. ___, traffic has become a serious problem.","a":["therefore","consequently","as a result","thus","hence","as a consequence"],"why":"A result linker starts the new sentence and is followed by a comma."},{"t":"gap","sk":"W","q":"Online shopping is convenient; ___, it can lead to overspending.","a":["however","nevertheless","nonetheless","on the other hand"],"why":"After a semicolon, a contrast linker with a comma shows the opposite idea."},{"t":"gap","sk":"W","q":"I walk to university every day ___ it is only ten minutes away.","a":["because","as","since"],"why":"Because joins the reason to the main clause in one sentence."},{"t":"gap","sk":"W","q":"The bridge was old and unsafe, ___ the council decided to replace it.","a":["so","and so"],"why":"So joins a cause and its result. Put a comma before it.","bn":"কারণ থেকে ফলাফল বোঝাতে so ব্যবহার করুন।"},{"t":"dict","sk":"L","s":"Many students work part-time because they need money for rent.","why":"Hear how because links the reason to the main idea."},{"t":"dict","sk":"L","s":"The city is very crowded. However, it has excellent public transport.","why":"Notice the pause before However, which starts a new sentence."},{"t":"dict","sk":"L","s":"It is essential to get enough sleep before an exam.","why":"Catch the small words It is at the start."},{"t":"dict","sk":"L","s":"Although the course was expensive, it helped me find a good job.","why":"Listen for although and notice there is no but."},{"t":"order","sk":"W","s":"It is difficult to find a quiet place to study.","why":"It is + adjective + to + verb is a full sentence pattern."},{"t":"order","sk":"S","s":"The course was cheap, so I chose it.","why":"The reason comes first, then so and the result, all in one sentence."},{"t":"speak","sk":"S","q":"Do you like living in a city?","need":"\\b(because|since|so|that'?s why|the reason|as a result)\\b","hint":"Answer in full sentences with because or so.","model":"Yes, I do, because everything is close by. I rarely waste time travelling, so I have more time to study.","why":"Linking a reason in a full sentence shows control of sentence structure."},{"t":"speak","sk":"S","q":"Do you think public transport in cities will improve in the future?","need":"\\b(however|but|although|even though|though|on the other hand)\\b","hint":"Contrast two ideas with but, although or however.","model":"I think it will improve, because many cities are building metro lines. However, it may take years before most people use them.","why":"A clear contrast linker shows you can join and separate ideas correctly."}]},{"id":"complex","title":"Complex sentences for band 7","bn":"ব্যান্ড ৭-এর জন্য জটিল বাক্য","why":"Band 7 in Writing and Speaking needs a mix of simple and complex sentences used accurately, and Reading often tests long sentences with these structures.","rules":[{"h":"Join ideas with when, if, because and which","en":"A subordinate clause adds time, condition, reason or extra information to a main clause. Mix these with short simple sentences so your writing is clear.","bn":"when, if, because, which দিয়ে মূল বাক্যের সাথে সময়, শর্ত, কারণ বা অতিরিক্ত তথ্য যোগ করা যায়। ছোট সরল বাক্যের সাথে মিশিয়ে ব্যবহার করুন।","ex":["When the factory closed, many workers moved away.","The library, which opened last year, is always busy."]},{"h":"Participle clauses","en":"An -ing, having + past participle, or past participle clause can open a sentence. Its subject must be the same as the subject of the main clause.","bn":"Having finished বা Built in 1990 দিয়ে বাক্য শুরু করা যায়, তবে কাজটি যে করেছে সে-ই মূল বাক্যের subject হতে হবে।","ex":["Having finished the report, she sent it to her manager.","Built in 1990, the bridge is now too narrow."]},{"h":"Turn clauses into noun phrases","en":"Academic writing often uses a noun phrase instead of a whole clause. Cities grow rapidly becomes the rapid growth of cities.","bn":"একাডেমিক লেখায় পুরো clause-এর বদলে noun phrase ব্যবহার করা হয়। যেমন cities grow rapidly থেকে the rapid growth of cities।","ex":["The rapid growth of cities has caused housing shortages.","The introduction of online banking reduced queues."]},{"h":"Not only ... but also with inversion","en":"When not only starts a sentence, put the auxiliary before the subject, like a question. The second part usually takes but + subject + also.","bn":"Not only দিয়ে বাক্য শুরু হলে প্রশ্নের মতো auxiliary আগে বসে। যেমন Not only does it save money।","ex":["Not only does cycling save money, but it also keeps you fit.","Not only is the metro faster, but it is also cleaner."]},{"h":"Emphasis with It is ... that","en":"To focus on one part of a sentence, use It is or It was + the focus + that (or who for people).","bn":"কোনো অংশে জোর দিতে It is/It was ... that ব্যবহার করুন। মানুষের ক্ষেত্রে who-ও বসতে পারে।","ex":["It was in 2015 that the city banned plastic bags.","It is my mother who taught me to cook."]}],"traps":[{"wrong":"Not only it saves money but also time.","right":"Not only does it save money, but it also saves time.","why":"After a fronted not only, put does before the subject."},{"wrong":"Having finished the exam, the results were posted online.","right":"Having finished the exam, the students waited for the results.","why":"The participle and main clause need the same subject."},{"wrong":"The town which I was born is very crowded.","right":"The town where I was born is very crowded.","why":"Use where for places when the clause has its own subject."},{"wrong":"Although it was raining, but we went out.","right":"Although it was raining, we went out.","why":"Although and but cannot be used together."},{"wrong":"It was in 2010 when the bridge opened.","right":"It was in 2010 that the bridge opened.","why":"The emphasis pattern is It was ... that."}],"starters":["Having grown up in ..., I ...","Although it's ..., I still ...","Not only is it ..., but it's also ...","It was my ... who first ...","If I had more free time, I would ...","The place where I feel most relaxed is ..."],"q":[{"t":"mcq","sk":"W","q":"___ the population grows, cities will need more housing.","o":["Because of","As","Despite"],"a":1,"why":"As can start a clause with a subject and verb. Because of and despite need a noun.","bn":"clause-এর আগে as/because; noun-এর আগে because of।"},{"t":"mcq","sk":"W","q":"The factory, ___ was built in 1975, closed last year.","o":["which","that","where"],"a":0,"why":"Use which in a non-defining clause with commas. That is not used after a comma."},{"t":"mcq","sk":"W","q":"___ in 1990, the bridge is now too narrow for modern traffic.","o":["Building","Having built","Built"],"a":2,"why":"The bridge was built, so use the passive past participle Built.","bn":"bridge নিজে তৈরি করেনি, তাই passive: Built।"},{"t":"mcq","sk":"W","q":"Not only ___ cheaper, but it is also faster.","o":["the metro is","is the metro","does the metro"],"a":1,"why":"After a fronted not only, the verb be comes before the subject: is the metro."},{"t":"mcq","sk":"S","q":"It was my grandmother ___ taught me to cook.","o":["what","that","which"],"a":1,"why":"The It was ... that pattern focuses on one part. Who would also work, but which and what do not."},{"t":"mcq","sk":"W","q":"Choose the best noun phrase to complete the sentence: ___ has caused serious traffic problems.","o":["The rapid growth of cities","Cities growing rapid","The cities rapid grow"],"a":0,"why":"Adjective + noun + of + noun makes a correct academic noun phrase.","bn":"the + adjective + noun + of + noun"},{"t":"mcq","sk":"W","q":"___ the report, the manager sent it to the whole team.","o":["Read","Having been read","Having read"],"a":2,"why":"The manager read the report first, so use the active Having read."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: Having analysed data from over 200 schools, ...","o":["the results showed a clear link between sleep and grades.","the researchers found a clear link between sleep and grades.","a clear link between sleep and grades was found."],"a":1,"why":"The people who analysed the data must be the subject: the researchers."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: Not only did the new law reduce air pollution, ...","o":["but also improving public health.","but also it improved public health.","but it also improved public health."],"a":2,"why":"The second part takes but + subject + also + verb."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: The Industrial Revolution, which began in Britain, ...","o":["and spread quickly to other parts of Europe.","spread quickly to other parts of Europe.","spreading quickly to other parts of Europe."],"a":1,"why":"The which clause is extra information. The main subject still needs a main verb: spread.","bn":"which অংশ বাদ দিলেও মূল verb থাকতে হবে।"},{"t":"tap","sk":"W","s":"Although the city is noisy, but I enjoy living there.","w":"but","o":["(remove)","so","and"],"a":0,"why":"Although already shows contrast, so remove but.","bn":"although থাকলে but লাগবে না।"},{"t":"tap","sk":"W","s":"Not only does cycling keep you fit, but also saves you money.","w":"also","o":["too","it also","also it"],"a":1,"why":"The second part needs a subject: but it also saves."},{"t":"tap","sk":"W","s":"The students, who they live on campus, pay lower rent.","w":"they","o":["them","(remove)","which"],"a":1,"why":"Who is already the subject of the clause, so they must go.","bn":"who নিজেই subject, they বাদ দিন।"},{"t":"tap","sk":"W","s":"Locating near the river, the hotel is popular with tourists.","w":"Locating","o":["Located","Locate","Having located"],"a":0,"why":"The hotel is located somewhere, so use the passive participle Located."},{"t":"tap","sk":"W","s":"It is the teachers which make a school successful.","w":"which","o":["whose","what","who"],"a":2,"why":"Teachers are people, so use who (or that) in this pattern."},{"t":"tap","sk":"W","s":"The town where I grew up it has changed a lot.","w":"it","o":["(remove)","this","which"],"a":0,"why":"The town is already the subject, so it repeats the subject.","bn":"subject দুবার লিখবেন না।"},{"t":"tap","sk":"W","s":"The rapid grow of cities has caused housing shortages.","w":"grow","o":["growing","grown","growth"],"a":2,"why":"After the rapid you need a noun: growth."},{"t":"gap","sk":"W","q":"The ___ (increase) use of private cars has made the air dirtier.","a":["increasing","increased"],"why":"An -ing or -ed adjective before the noun use makes a strong noun phrase."},{"t":"gap","sk":"W","q":"___ (have) lived abroad for two years, she speaks English fluently.","a":["having"],"why":"Having + past participle shows an action completed before the main clause.","bn":"আগে শেষ হওয়া কাজ বোঝাতে Having + V3।"},{"t":"gap","sk":"W","q":"Not only ___ the plan expensive, but it is also unpopular.","a":["is"],"why":"After a fronted not only, put the verb be before the subject."},{"t":"gap","sk":"W","q":"It was in 2015 ___ the government banned plastic bags.","a":["that"],"why":"The emphasis pattern is It was + focus + that."},{"t":"gap","sk":"W","q":"The library, ___ opened last year, stays open until midnight.","a":["which"],"why":"After a comma, use which for things in a non-defining clause."},{"t":"dict","sk":"L","s":"Having finished her degree, she decided to work abroad for a year.","why":"Listen for Having finished at the start."},{"t":"dict","sk":"L","s":"Not only is the metro faster, but it is also much cleaner.","why":"Notice is comes before the metro after Not only."},{"t":"dict","sk":"L","s":"The bridge, which was built in the last century, needs urgent repairs.","why":"Hear the extra information in the which clause."},{"t":"dict","sk":"L","s":"It was my older brother who encouraged me to learn English.","why":"Catch the It was ... who pattern."},{"t":"order","sk":"W","s":"The rapid growth of cities has increased air pollution.","why":"A noun phrase can be the subject of the sentence."},{"t":"order","sk":"S","s":"It was my teacher who inspired me to study.","why":"It was + person + who + verb."},{"t":"speak","sk":"S","q":"Describe a person who has influenced you. You should say who they are and how they influenced you.","need":"\\b(who|which|whose|having|although|it was|it is)\\b","hint":"Add a relative clause with who or which.","model":"My uncle, who works as an engineer, taught me to love maths. It was his advice that made me choose software engineering.","why":"Relative clauses and It was ... that add range."},{"t":"speak","sk":"S","q":"What are the advantages of living in a big city?","need":"\\bnot only\\b|\\b(although|while|whereas|which|having|if|when)\\b","hint":"Try Not only ... but also, or a which clause.","model":"Not only are there more jobs, but there are also better hospitals, which matters a lot as people get older.","why":"Inversion and relative clauses are band 7 structures."}]},{"id":"nounclause","title":"Noun clauses and cleft sentences","bn":"নাউন ক্লজ ও ক্লেফট বাক্য","why":"Frames like What I like most is ... help you start Speaking answers without going blank, and correct embedded questions improve your grammar score.","rules":[{"h":"What I like most is ...","en":"A what clause can be the subject of a sentence. It takes a singular verb and gives you time to think at the start of an answer.","bn":"What I like most is ... দিয়ে উত্তর শুরু করলে ভাবার সময় পাওয়া যায়। what clause subject হলে সাধারণত is বসে।","ex":["What I like most about my city is the food.","What worries me is the cost of living."]},{"h":"Embedded questions use statement order","en":"Inside a sentence, a question word is followed by subject + verb, with no do, does or did. Write I don't know where she lives, not where does she live.","bn":"বাক্যের ভেতরে প্রশ্ন থাকলে সাধারণ বাক্যের ক্রম হয়: subject তারপর verb। do, does, did বসে না।","ex":["I don't know where she lives.","Could you tell me what time the library opens?"]},{"h":"Whether or if for yes/no questions","en":"When the hidden question is a yes/no question, use whether or if. Whether sounds more formal and works well with or not.","bn":"হ্যাঁ/না প্রশ্ন বাক্যের ভেতরে আনতে whether বা if ব্যবহার করুন।","ex":["I'm not sure whether I'll have time.","She asked if the course was full."]},{"h":"The reason why ... is that ...","en":"After The reason why ... is, use that, not because. Because repeats the idea of reason.","bn":"The reason why ... is-এর পরে that বসে, because নয়। কারণ reason শব্দেই 'কারণ' বোঝানো হয়ে গেছে।","ex":["The reason why I chose this course is that it is practical.","The reason I moved was that rent was cheaper."]},{"h":"It is said that and The thing is","en":"It is said, believed or thought that ... reports general opinion in formal writing. The thing is ... is a natural way to explain a problem in Speaking.","bn":"It is said/believed that দিয়ে সাধারণ মতামত বলা যায়। কথায় সমস্যা বোঝাতে The thing is ... খুব স্বাভাবিক।","ex":["It is believed that the temple is over a thousand years old.","The thing is, I don't have much free time."]}],"traps":[{"wrong":"I don't know where does she live.","right":"I don't know where she lives.","why":"Embedded questions use statement order without does."},{"wrong":"The reason why I chose this course is because it is practical.","right":"The reason why I chose this course is that it is practical.","why":"After the reason is, use that, not because."},{"wrong":"Can you tell me what time does the bus leave?","right":"Can you tell me what time the bus leaves?","why":"No does inside an embedded question."},{"wrong":"It is say that the river was once very clean.","right":"It is said that the river was once very clean.","why":"It is said needs the past participle said."},{"wrong":"What he told me it was not true.","right":"What he told me was not true.","why":"The what clause is the subject; do not add it."}],"starters":["What I like most about ... is ...","The main reason why I ... is that ...","I'm not entirely sure whether ..., but ...","The thing is, ...","I've never really thought about why ..., but ...","It's often said that ..."],"q":[{"t":"mcq","sk":"S","q":"I don't know where ___.","o":["does she live","she lives","lives she"],"a":1,"why":"Inside a sentence, use statement order: where she lives.","bn":"বাক্যের ভেতরে প্রশ্নে subject আগে, verb পরে।"},{"t":"mcq","sk":"S","q":"___ I enjoy most about weekends is sleeping late.","o":["That","Which","What"],"a":2,"why":"What + clause can be the subject: What I enjoy most is ..."},{"t":"mcq","sk":"L","q":"Could you tell me what time ___?","o":["does the museum open","opens the museum","the museum opens"],"a":2,"why":"Polite questions with Could you tell me use statement order and no does."},{"t":"mcq","sk":"S","q":"The reason why I chose engineering is ___ I enjoy solving problems.","o":["because","that","why"],"a":1,"why":"Use that after The reason why ... is.","bn":"reason ... is-এর পরে that বসে।"},{"t":"mcq","sk":"S","q":"I'm not sure ___ I'll have time to travel this year.","o":["whether","that","what"],"a":0,"why":"This is a hidden yes/no question, so use whether (or if)."},{"t":"mcq","sk":"W","q":"It ___ that regular exercise reduces stress.","o":["thinks","is thought","thought"],"a":1,"why":"The passive reporting pattern is It is thought that ... An 'it' cannot think, so the active forms are wrong."},{"t":"mcq","sk":"S","q":"___ is, I've never been very good at cooking.","o":["What thing","The thing","That thing"],"a":1,"why":"The thing is ... is a fixed phrase to explain a problem."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: Scientists still do not fully understand why ...","o":["do some birds migrate at night.","some birds migrate at night.","migrate some birds at night."],"a":1,"why":"After why inside a sentence, use subject + verb: some birds migrate.","bn":"why-এর পরে subject তারপর verb।"},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: It is widely believed that ...","o":["the first cities appeared in Mesopotamia.","the first cities appearing in Mesopotamia.","the appearance of the first cities in Mesopotamia."],"a":0,"why":"That must be followed by a full clause with a main verb: appeared."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: What surprised the researchers most ...","o":["it was the speed of the change.","were the speed of the change.","was how quickly the ice melted."],"a":2,"why":"The what clause is the subject, so it takes was, and no extra it."},{"t":"tap","sk":"W","s":"I don't know where do they live now.","w":"do","o":["(remove)","did","does"],"a":0,"why":"Embedded questions do not use do: where they live.","bn":"ভেতরের প্রশ্নে do/does/did বাদ দিন।"},{"t":"tap","sk":"W","s":"The reason why I left my job was because the hours were too long.","w":"because","o":["since","that","why"],"a":1,"why":"After The reason why ... was, use that."},{"t":"tap","sk":"W","s":"What I need most are a quiet place to study.","w":"are","o":["be","were","is"],"a":2,"why":"A what clause subject with a singular noun takes is."},{"t":"tap","sk":"W","s":"I asked him that he could help me with the form.","w":"that","o":["whether","what","which"],"a":0,"why":"Asked introduces a yes/no question, so use whether or if.","bn":"হ্যাঁ/না প্রশ্নে whether বা if বসে।"},{"t":"tap","sk":"W","s":"It is believe that the bridge was built by the Romans.","w":"believe","o":["believing","believed","belief"],"a":1,"why":"The passive pattern needs the past participle: It is believed."},{"t":"tap","sk":"W","s":"What he said it was not true at all.","w":"it","o":["this","that","(remove)"],"a":2,"why":"What he said is already the subject, so remove it."},{"t":"tap","sk":"W","s":"Could you tell me how much do the tickets cost?","w":"do","o":["(remove)","does","did"],"a":0,"why":"Embedded questions keep statement order: how much the tickets cost."},{"t":"gap","sk":"W","q":"I have no idea where my keys ___ (be).","a":["are"],"why":"Statement order: where my keys are."},{"t":"gap","sk":"W","q":"___ I find hardest about English is the pronunciation.","a":["what"],"why":"What + clause as the subject of the sentence.","bn":"What I find hardest is ... দিয়ে শুরু করুন।"},{"t":"gap","sk":"W","q":"Do you know ___ the library is open on Fridays?","a":["whether","if"],"why":"This hides a yes/no question, so use whether or if."},{"t":"gap","sk":"W","q":"The reason I moved to Dhaka is ___ there are more jobs there.","a":["that"],"why":"After The reason ... is, use that."},{"t":"gap","sk":"W","q":"It is ___ (say) that the city was founded over a thousand years ago.","a":["said"],"why":"Passive reporting: It is said that ...","bn":"It is + V3 + that।"},{"t":"dict","sk":"L","s":"What I like most about my hometown is the friendly people.","why":"Listen for What I like most is."},{"t":"dict","sk":"L","s":"I am not sure whether the course will start next month.","why":"Catch whether after not sure."},{"t":"dict","sk":"L","s":"I would like to know where the nearest bus stop is.","why":"Notice the statement order at the end: the bus stop is."},{"t":"dict","sk":"L","s":"The reason why I chose this university is that it has a good library.","why":"Hear is that, not is because."},{"t":"order","sk":"S","s":"I don't know where the station is.","why":"Embedded question: where + subject + verb."},{"t":"order","sk":"W","s":"It is said that the bridge is unsafe.","why":"It is said that + full clause."},{"t":"speak","sk":"S","q":"What do you like most about your hometown?","need":"\\bwhat\\b.*\\b(is|was|are)\\b|\\bthe thing\\b|\\bthe reason\\b","hint":"Start with What I like most is ...","model":"What I like most is how friendly people are. The thing is, everyone knows each other there.","why":"A cleft opening gives you a fluent start."},{"t":"speak","sk":"S","q":"Why do some young people prefer to live alone?","need":"\\b(the reason|reason why|the thing is|what\\b.*\\bis|not sure (whether|if|why)|don'?t know (why|whether|if))\\b","hint":"Use The reason why ... is that ...","model":"The reason why many young people live alone is that they want more freedom. I'm not sure whether it's cheaper, though.","why":"Noun clauses help you explain reasons clearly."}]},{"id":"quant","title":"Quantifiers","bn":"পরিমাণবাচক শব্দ","why":"Task 1 reports are full of amounts and numbers, so errors with fewer, less, many and much cost marks in Writing and also in Speaking.","rules":[{"h":"Countable or uncountable","en":"Use many, few, fewer and a large number of with plural countable nouns. Use much, little, less and a large amount of with uncountable nouns. A lot of works with both.","bn":"গণনাযোগ্য noun-এর সাথে many, few, fewer, a large number of; অগণনীয় noun-এর সাথে much, little, less, a large amount of বসে।","ex":["A large number of tourists visited the beach.","A large amount of money was spent on roads."]},{"h":"Few and a few, little and a little","en":"A few and a little mean some, which is positive. Few and little mean not many or not much, which sounds negative.","bn":"a few/a little মানে কিছু আছে (ইতিবাচক)। few/little মানে প্রায় নেই (নেতিবাচক)।","ex":["I have a few close friends at university.","There is little green space in the city centre."]},{"h":"Fewer or less","en":"Fewer goes with plural nouns you can count, such as cars or people. Less goes with uncountable nouns, such as traffic or water.","bn":"গোনা যায় এমন জিনিসে fewer (fewer cars), আর গোনা যায় না এমন জিনিসে less (less traffic)।","ex":["Fewer people use landline phones today.","We use less paper than before."]},{"h":"Most, most of the, the majority of","en":"Most + noun talks about people or things in general. Most of the + noun talks about a specific group. The majority of + plural noun takes a plural verb.","bn":"সাধারণভাবে বললে most people; নির্দিষ্ট দল হলে most of the students। most of people ভুল।","ex":["Most people own a smartphone.","Most of the students in my class live nearby."]},{"h":"Each, every, both, either, neither","en":"Each and every take a singular noun and verb. Both takes a plural noun. Either and neither take a singular noun and mean one or none of two.","bn":"each/every-এর পরে একবচন noun ও verb বসে। both-এর পরে বহুবচন। either/neither দুটির মধ্যে একটি বা কোনোটিই না বোঝায়।","ex":["Every student has a laptop.","Neither option was cheap, so we stayed at home."]}],"traps":[{"wrong":"There are less cars on the roads at night.","right":"There are fewer cars on the roads at night.","why":"Cars are countable, so use fewer."},{"wrong":"Most of people use smartphones every day.","right":"Most people use smartphones every day.","why":"Most of needs the or my before the noun."},{"wrong":"Every students has a laptop.","right":"Every student has a laptop.","why":"Every is followed by a singular noun."},{"wrong":"A large amount of tourists visit Sylhet each year.","right":"A large number of tourists visit Sylhet each year.","why":"Tourists are countable, so use a large number of."},{"wrong":"We need more informations about the course.","right":"We need more information about the course.","why":"Information is uncountable and has no plural form."}],"starters":["Most people I know ...","Quite a few of my friends ...","There are far fewer ... than there used to be.","The majority of young people ...","Neither of my parents ...","I have very little time for ..."],"q":[{"t":"mcq","sk":"W","q":"There isn't ___ public transport in my village.","o":["many","much","few"],"a":1,"why":"Transport is uncountable, so use much in negatives.","bn":"অগণনীয় noun-এর সাথে much।"},{"t":"mcq","sk":"S","q":"I have ___ close friends, maybe three or four.","o":["a few","few","a little"],"a":0,"why":"A few means some, which fits three or four friends."},{"t":"mcq","sk":"W","q":"The chart shows that ___ people used public libraries in 2020 than in 2000.","o":["less","little","fewer"],"a":2,"why":"People is a plural countable noun, so use fewer.","bn":"গোনা যায় এমন noun হলে fewer।"},{"t":"mcq","sk":"W","q":"___ students in my class live in the university hall.","o":["Most of","Most of the","The most"],"a":1,"why":"A specific group needs Most of the + noun."},{"t":"mcq","sk":"L","q":"Each room in the hostel ___ its own bathroom.","o":["has","have","having"],"a":0,"why":"Each takes a singular verb: has."},{"t":"mcq","sk":"W","q":"A large ___ of money was spent on the new stadium.","o":["number","many","amount"],"a":2,"why":"Money is uncountable, so use a large amount of."},{"t":"mcq","sk":"W","q":"We looked at two hotels, but ___ hotel had free parking.","o":["either","neither","both"],"a":1,"why":"Neither means not one of the two and takes a singular noun.","bn":"দুটির কোনোটিই না হলে neither।"},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: Very little research ...","o":["have been done on this species.","has been done on this species.","were done on these species."],"a":1,"why":"Research is uncountable, so it takes a singular verb: has been done."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: Although the drug was tested on a large number of patients, ...","o":["few side effects were reported.","little side effects were reported.","a less side effects were reported."],"a":0,"why":"Side effects are countable. Few means not many, which fits the contrast with although."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: Compared with the previous decade, the 1990s saw ...","o":["less floods but more droughts.","little floods but much droughts.","fewer floods but more droughts."],"a":2,"why":"Floods are countable, so use fewer.","bn":"flood গোনা যায়, তাই fewer।"},{"t":"tap","sk":"W","s":"There are less students in the library during the holidays.","w":"less","o":["fewer","little","much"],"a":0,"why":"Students are countable, so use fewer."},{"t":"tap","sk":"W","s":"Most of people in my country eat rice every day.","w":"of","o":["(remove)","the","from"],"a":0,"why":"In general statements, use Most people with no of.","bn":"সাধারণভাবে বললে Most people, of ছাড়া।"},{"t":"tap","sk":"W","s":"Every students must bring a photo ID to the exam.","w":"students","o":["student's","student","studentes"],"a":1,"why":"Every is followed by a singular noun."},{"t":"tap","sk":"W","s":"The government spent a large number of money on new roads.","w":"number","o":["deal","many","amount"],"a":2,"why":"Money is uncountable, so use a large amount of."},{"t":"tap","sk":"W","s":"We don't have many time before the exam starts.","w":"many","o":["much","few","lot"],"a":0,"why":"Time is uncountable here, so use much.","bn":"time অগণনীয়, তাই much।"},{"t":"tap","sk":"W","s":"I need some advices about choosing a university abroad.","w":"advices","o":["advise","advice","advising"],"a":1,"why":"Advice is uncountable and has no plural form."},{"t":"tap","sk":"W","s":"Luckily, I had little money left, so I could buy a coffee.","w":"little","o":["few","a few","a little"],"a":2,"why":"A little means some, which fits the positive result.","bn":"ইতিবাচক অর্থে a little।"},{"t":"gap","sk":"W","q":"How ___ (much/many) hours do you study each day?","a":["many"],"why":"Hours are countable, so use many."},{"t":"gap","sk":"W","q":"There has been ___ (less/fewer) traffic since the new road opened.","a":["less"],"why":"Traffic is uncountable, so use less.","bn":"traffic গোনা যায় না, তাই less।"},{"t":"gap","sk":"W","q":"Only a ___ students failed the test, so the teacher was pleased.","a":["few"],"why":"A few + plural countable noun means a small number."},{"t":"gap","sk":"W","q":"___ of the two answers is correct; both are wrong.","a":["neither"],"why":"Neither means not one of the two."},{"t":"gap","sk":"W","q":"The ___ of people in the survey preferred online shopping.","a":["majority"],"why":"The majority of + plural noun means most of a group."},{"t":"dict","sk":"L","s":"Fewer people visited the museum this year than last year.","why":"Listen for fewer with the countable noun people."},{"t":"dict","sk":"L","s":"Most of the students in my class live in the hall.","why":"Notice most of the before a specific group."},{"t":"dict","sk":"L","s":"There is very little green space in the city centre.","why":"Hear little, not a little, which sounds negative."},{"t":"dict","sk":"L","s":"A large number of tourists visit the beach every winter.","why":"Catch a large number of with tourists."},{"t":"order","sk":"W","s":"The majority of workers prefer flexible hours.","why":"The majority of + plural noun + plural verb."},{"t":"order","sk":"S","s":"Most of my friends live near the campus.","why":"Most of + my + plural noun."},{"t":"speak","sk":"S","q":"Do you have many friends?","need":"\\b(a few|few|many|most|a lot of|lots of|quite a few|a couple of|several|plenty of|not many|hardly any|the majority)\\b","hint":"Use a quantifier like a few, quite a few or most.","model":"Not many, to be honest. I have a few close friends from school, and most of them live in Dhaka now.","why":"Accurate quantifiers make your answer precise."},{"t":"speak","sk":"S","q":"Do people read fewer books today than in the past?","need":"\\b(fewer|less|the majority of|a large number of|a lot of|most|few|little|much|many)\\b","hint":"Compare with fewer, less or the majority of.","model":"I think people read fewer printed books, but they read a lot of articles online. The majority of my friends read on their phones.","why":"Comparing amounts correctly shows grammatical range."}]},{"id":"parallel","title":"Parallel structure and lists","bn":"সমান্তরাল গঠন ও তালিকা","why":"Lists and comparisons appear in every Writing task and many Speaking answers, and mixed forms make sentences sound clumsy and lose grammar marks.","rules":[{"h":"Same form in a list","en":"Every item in a list should have the same grammatical form: all nouns, all -ing forms, or all to + verb.","bn":"তালিকার প্রতিটি অংশ একই রূপে লিখুন: সব noun, সব -ing, অথবা সব to + verb।","ex":["I enjoy reading, writing and speaking.","The scheme aims to cut costs, save time and improve quality."]},{"h":"Paired linkers need matching parts","en":"After both ... and, either ... or, neither ... nor and not only ... but also, use the same kind of word or phrase in each part.","bn":"both ... and, either ... or, neither ... nor-এর দুই পাশে একই ধরনের শব্দ বা phrase বসান।","ex":["The course is both useful and cheap.","You can either live in the hall or rent a flat."]},{"h":"Compare like with like","en":"Use prefer + -ing + to + -ing, and would rather + base verb + than + base verb. When comparing features, use that of or those of so you compare the same thing.","bn":"prefer cycling to driving এবং would rather walk than drive লিখুন। দুটি জিনিসের বৈশিষ্ট্য তুলনায় that of ব্যবহার করুন।","ex":["I prefer cycling to driving.","The population of Dhaka is larger than that of Khulna."]},{"h":"Lists with to","en":"In a to + verb list, either repeat to before every item or use it only before the first. Do not mix to with -ing.","bn":"to + verb তালিকায় হয় প্রতিটির আগে to দিন, নয়তো শুধু প্রথমটির আগে। to আর -ing মেশাবেন না।","ex":["People exercise to stay fit, to relax and to meet friends.","People exercise to stay fit, relax and meet friends."]},{"h":"Commas in lists","en":"Put commas between items and and or or before the last one. A comma before and is optional in British English, but be consistent.","bn":"তালিকার জিনিসগুলোর মাঝে comma দিন, শেষটির আগে and বা or দিন। and-এর আগে comma ঐচ্ছিক।","ex":["We need cleaner air, safer streets and better schools.","You can pay by cash, card or mobile banking."]}],"traps":[{"wrong":"I like reading, to swim and football.","right":"I like reading, swimming and playing football.","why":"Keep all list items in the same form."},{"wrong":"I prefer cycling than driving.","right":"I prefer cycling to driving.","why":"Prefer uses to, not than."},{"wrong":"The course is both useful and it is cheap.","right":"The course is both useful and cheap.","why":"Both ... and should join two matching adjectives."},{"wrong":"Students should read widely, practise often, and they should rest.","right":"Students should read widely, practise often and rest well.","why":"Keep each list item as a base verb."},{"wrong":"The rent in Dhaka is higher than Savar.","right":"The rent in Dhaka is higher than in Savar.","why":"Compare rent with rent, not rent with a town."}],"starters":["I'd much rather ... than ...","I prefer ... to ...","It's both ... and ...","In my free time I enjoy ..., ... and ...","Either ... or ... would be fine for me.","It helps you to ..., to ... and to ..."],"q":[{"t":"mcq","sk":"S","q":"In my free time I enjoy reading, cooking and ___.","o":["to play cricket","playing cricket","I play cricket"],"a":1,"why":"Reading and cooking are -ing forms, so the last item must be playing.","bn":"তালিকায় সব -ing রাখুন।"},{"t":"mcq","sk":"S","q":"I prefer walking ___ taking the bus.","o":["to","than","from"],"a":0,"why":"Prefer + -ing + to + -ing."},{"t":"mcq","sk":"W","q":"Public transport is cheap, reliable and ___.","o":["it is safe","safety","safe"],"a":2,"why":"Cheap and reliable are adjectives, so the last item should be the adjective safe."},{"t":"mcq","sk":"W","q":"The new policy aims to reduce traffic, cut pollution and ___ road safety.","o":["improving","improvement","improve"],"a":2,"why":"The list follows to: reduce, cut, improve, all base verbs.","bn":"to-এর পরের সব verb base form।"},{"t":"mcq","sk":"S","q":"I would rather stay at home ___ go to a crowded party.","o":["than","to","that"],"a":0,"why":"Would rather + base verb + than + base verb."},{"t":"mcq","sk":"W","q":"Students can either live in the hall ___ rent a flat nearby.","o":["nor","and","or"],"a":2,"why":"Either goes with or. Neither goes with nor."},{"t":"mcq","sk":"W","q":"The population of Dhaka is much larger than ___ of Chattogram.","o":["that","it","this"],"a":0,"why":"That of means the population of, so you compare population with population.","bn":"একই জিনিসের তুলনায় that of।"},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: The programme was designed both to improve literacy and ...","o":["increasing school attendance.","to increase school attendance.","school attendance increased."],"a":1,"why":"Both to improve ... and to increase: the two parts match."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: The new material is not only lighter than steel but also ...","o":["it resists heat better.","resisting heat better.","more resistant to heat."],"a":2,"why":"Lighter is an adjective, so the second part should be an adjective phrase too."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: Early settlers relied on the river for drinking water, transport and ...","o":["fishing.","to catch fish.","they caught fish."],"a":0,"why":"Water and transport are nouns, so the last item should be a noun: fishing.","bn":"for-এর পরের তালিকায় সব noun।"},{"t":"tap","sk":"W","s":"Reading, painting and swim are my favourite hobbies.","w":"swim","o":["swimming","to swim","swims"],"a":0,"why":"Reading and painting are -ing forms, so use swimming."},{"t":"tap","sk":"W","s":"I prefer cycling than driving in the city.","w":"than","o":["then","to","from"],"a":1,"why":"Prefer A to B, not than.","bn":"prefer-এর সাথে to বসে, than নয়।"},{"t":"tap","sk":"W","s":"The job was both well paid and interest for young people.","w":"interest","o":["interested","interests","interesting"],"a":2,"why":"Both ... and needs two adjectives: well paid and interesting."},{"t":"tap","sk":"W","s":"Neither the teachers or the students liked the new timetable.","w":"or","o":["and","nor","but"],"a":1,"why":"Neither goes with nor.","bn":"neither-এর সাথে nor।"},{"t":"tap","sk":"W","s":"The aim is to reduce costs, to save time and improving quality.","w":"improving","o":["to improve","improvement","improves"],"a":0,"why":"The list uses to + verb, so keep the same form: to improve."},{"t":"tap","sk":"W","s":"Living in the countryside is quieter than live in a city.","w":"live","o":["lived","to living","living"],"a":2,"why":"Compare -ing with -ing: Living ... than living."},{"t":"tap","sk":"W","s":"The laptop is not only light but also power for its size.","w":"power","o":["powerful","powerfully","powers"],"a":0,"why":"Light is an adjective, so the second part needs the adjective powerful.","bn":"দুই পাশে adjective রাখুন।"},{"t":"gap","sk":"W","q":"I enjoy hiking, swimming and ___ (cycle).","a":["cycling"],"why":"All items are -ing forms."},{"t":"gap","sk":"W","q":"I prefer tea ___ coffee.","a":["to","over"],"why":"Prefer A to B.","bn":"prefer A to B মনে রাখুন।"},{"t":"gap","sk":"W","q":"The city needs not only more buses ___ also safer cycle lanes.","a":["but"],"why":"Not only ... but also is a fixed pair."},{"t":"gap","sk":"W","q":"Students should learn to plan, to research and ___ (write) clearly. (two words)","a":["to write"],"why":"The list repeats to before each verb, so keep the pattern: to write."},{"t":"gap","sk":"W","q":"The weather in Sylhet is wetter than ___ in Rajshahi.","a":["that"],"why":"That means the weather, so you compare the same thing."},{"t":"dict","sk":"L","s":"I prefer studying in the morning to studying late at night.","why":"Listen for prefer ... to with two -ing forms."},{"t":"dict","sk":"L","s":"The new job was both challenging and very rewarding for me.","why":"Catch both ... and joining two adjectives."},{"t":"dict","sk":"L","s":"Students can either live in the hall or share a flat nearby.","why":"Hear either ... or with two base verbs."},{"t":"dict","sk":"L","s":"Regular exercise improves your sleep, your mood and your memory.","why":"Notice the list of three matching noun phrases."},{"t":"order","sk":"W","s":"The new library is bigger than the old one.","why":"Compare the new library with the old one."},{"t":"order","sk":"S","s":"I would rather walk than wait for a crowded bus.","why":"Would rather + verb + than + verb."},{"t":"speak","sk":"S","q":"Do you prefer studying alone or with other people?","need":"\\bprefer\\b.*\\bto\\b|\\brather\\b.*\\bthan\\b|\\bboth\\b.*\\band\\b|\\bnot only\\b","hint":"Use prefer ... to ... with matching -ing forms.","model":"I prefer studying alone to studying in a group, because I can focus better and work at my own pace.","why":"Matching forms in a comparison sound accurate."},{"t":"speak","sk":"S","q":"What are the benefits of learning a foreign language?","need":"\\b(to \\w+|\\w+ing)\\b.*\\b(and|or)\\b.*\\b(to \\w+|\\w+ing)\\b|\\bnot only\\b|\\bboth\\b","hint":"List benefits in one form: to travel, to work ...","model":"It helps you to travel more easily, to find better jobs and to understand other cultures.","why":"A parallel list sounds organised and fluent."}]}];

function dayInfo(d){
  const p = PLAN[d]; if (!p) return null; const m = S.g.plan[d] || {};
  const done = p.type === 'final' ? !!m.lesson : !!(m.lesson && m.review && m.speak);
  const any = !!(m.lesson || m.review || m.speak);
  const name = p.type === 'mock' ? 'Mock ' + p.n : p.type === 'final' ? 'Final check' : GSHORT[p.u];

/* sound and confetti */
let ACTX = null;
function tone(seq){
  if (!S.g.sound) return;
  try { ACTX = ACTX || new (window.AudioContext || window.webkitAudioContext)(); let t = ACTX.currentTime;
    seq.forEach(([f, d, type]) => { const o = ACTX.createOscillator(), g = ACTX.createGain(); o.type = type || 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.18, t + .015); g.gain.exponentialRampToValueAtTime(.0001, t + d);
      o.connect(g); g.connect(ACTX.destination); o.start(t); o.stop(t + d + .02); t += d * .8; });
  } catch (e) {}
}
const sndOK = () => tone([[660, .12], [990, .18]]);
const sndNo = () => tone([[220, .22, 'triangle']]);
const sndWin = () => tone([[523, .14], [659, .14], [784, .14], [1047, .3]]);
function confetti(n = 90){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cols = ['#5B5BD6','#FF6A3D','#13B394','#F5B400','#D6457A','#1E88E5'];
  for (let i = 0; i < n; i++){ const c = document.createElement('i'); c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw'; c.style.background = cols[i % cols.length];
    c.style.animationDuration = 1.6 + Math.random() * 1.6 + 's'; c.style.animationDelay = Math.random() * .4 + 's';
    document.body.appendChild(c); setTimeout(() => c.remove(), 3800); }
}
