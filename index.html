cted","keys":["useful","better than expected"]},{"x":"should have been offered earlier in the course","keys":["too late","earlier"]},{"x":"had too many students attending it","keys":["too many","crowded"]},{"x":"the feedback given was too general to help","keys":["feedback","vague"]},{"x":"covered material they already knew well","keys":["already knew","repeat"]},{"x":"was held at the same time as other classes","keys":["clash","timetable"]},{"x":"should have included more practical activities","keys":["more practice","activities"]}],"qs":[{"q":"note-taking","a":4,"ev":"It was basically a repeat of what I'd learnt in college.","why":"'A repeat of what I'd learnt' matches 'material they already knew'. The room was packed, but Maya says 'which was fine', so C is a trap."},{"q":"time management","a":1,"ev":"It would have made much more sense right at the start of the degree.","why":"They wanted it in the first term, so it came too late. 'When they ran it' sounds like a timetable problem (F), but they mean the stage of the course, not a clash."},{"q":"academic writing","a":3,"ev":"Comments that could have been written on anyone's work.","why":"Comments that fit anyone's work are too general. Practical activities (G) are mentioned, but both students say there were plenty, so G is wrong here."},{"q":"library databases","a":0,"ev":"I thought it'd be really dull, just someone clicking through menus for an hour, but I found three articles for my dissertation while I was sitting there.","why":"She expected it to be dull but it was very helpful, and Tom says 'I was surprised too'. The clash with the statistics lecture (F) turned out not to be real."},{"q":"presentation skills","a":2,"ev":"There were about sixty of us in a room meant for twenty","why":"Sixty people in a room for twenty means too many students. Tom first wants more practice (G), but Maya points out the talks and role plays gave plenty of practice, and Tom agrees, so the final opinion is about numbers."}]}},{"n":3,"title":"Distractors and the final answer","goal":"Today you will learn how speakers mention several options for one item and how to wait for the final answer before you write.","pages":[{"h":"One item, three options mentioned","blocks":[{"t":"p","x":"In the real test, the speaker often touches two or three options while talking about one item. This is done on purpose: words from wrong options appear, and then the speaker rejects them. Common patterns are 'I thought about X, but in the end...', 'People say X, but actually...' and 'It used to be X, now it's Y'."},{"t":"steps","x":["Listen to the whole section for one item, from its name until the next item name.","When an option seems to fit, put a light dot next to its letter, not a full answer.","Keep listening for words that turn the meaning: but, actually, in the end, the thing is, what really.","Write the letter when the next item name arrives, choosing the option the speaker finished on."]},{"t":"trap","x":"The first option you hear about an item is very often wrong. If you write it at once and stop listening, you miss the 'but' that follows. Treat the first match as a guess until the speaker moves on."},{"t":"bn","x":"একটা আইটেমের কথা বলার সময় স্পিকার ইচ্ছা করেই দুই-তিনটা অপশনের কথা তোলে, তারপর কিছু বাদ দেয়। তাই প্রথম মিলটা শুনেই উত্তর লিখে ফেলো না। পরের আইটেমের নাম আসা পর্যন্ত শোনো, শেষ মতটাই উত্তর।"}]},{"h":"Language that cancels an option","blocks":[{"t":"p","x":"Some phrases tell you that an option is being mentioned only to be rejected. Listen for past plans that did not happen ('was going to', 'we'd planned to'), beliefs that are wrong ('people assume', 'you'd think'), and things that have changed ('used to', 'no longer', 'originally'). After these phrases, the real answer usually comes next."},{"t":"example","q":"Item: 'the swimming pool'. Options include A 'is being repaired and will reopen soon' and E 'now costs less to use than it did before'. You hear: 'You might have heard the pool was going to close for repairs, but that's been put off till next year. What has changed is the price: it's three pounds now instead of five.'","a":"E","x":"'Close for repairs' matches A word for word, but 'was going to' and 'put off till next year' cancel it. 'What has changed is the price' brings the real answer: three pounds instead of five is cheaper. A strong student dots A, crosses the dot when hearing 'put off', and writes E."},{"t":"example","q":"Item: 'the history module'. Options include C 'was harder than the student expected' and F 'was not well organised'. You hear: 'Everyone warned me it'd be really tough, and it wasn't easy, I'll admit. But what got to me was that the reading lists kept changing and nobody knew which room we were in.'","a":"F","x":"C is tempting because difficulty is discussed, but the student says other people expected it to be tough, and he only half agrees. The real complaint comes after 'But what got to me': changing reading lists and room confusion mean poor organisation."},{"t":"tip","x":"Phrases like 'what got to me', 'the main thing', 'what I'd really say' and 'the real problem' are flags. The answer is usually in the next five or six words."},{"t":"bn","x":"'was going to', 'people think', 'used to' এই ধরনের কথা শুনলে বুঝবে আগের অপশনটা বাতিল হতে যাচ্ছে। 'the real problem' বা 'what got to me' এর পরেই সাধারণত আসল উত্তর থাকে।"}]},{"h":"Long options with two parts","blocks":[{"t":"p","x":"Long options often have two parts: a topic and a condition. For example, 'is popular with families but not with older visitors'. Both halves must match. Speakers like to confirm the first half and then contradict the second, so your key words need to carry both parts."},{"t":"example","q":"Option: 'The manager hopes to extend its opening hours in the coming year.'","a":"longer hours (plan)","x":"The topic is opening hours and the direction is longer, but it is only a hope for the future. If the speaker says 'it's now open till ten', that is a change that has already happened, so this option is wrong. Writing '(plan)' keeps the time idea in your note."},{"t":"example","q":"Option: 'Local residents objected to it when it was first proposed.'","a":"locals objected (past)","x":"Who: locals. What: objected. When: at the start. If the speaker says 'people round here are still complaining about it', the complaint is current, not at the start. The word '(past)' helps you notice this difference in one glance."},{"t":"trap","x":"Do not shrink so hard that you lose the condition. 'Popular' is not enough for 'is popular with families but not with older visitors'. Write 'families yes, old no'."},{"t":"bn","x":"লম্বা অপশনে অনেক সময় দুইটা অংশ থাকে: বিষয় আর শর্ত। স্পিকার প্রথম অংশটা মেনে নিয়ে দ্বিতীয়টা উল্টে দিতে পারে। তাই মূল শব্দ লেখার সময় দুইটা অংশই রাখো, যেমন 'longer hours (plan)'।"}]},{"h":"Crossing out and missing one","blocks":[{"t":"p","x":"Unless the instruction says you may use a letter more than once, each option fits only one item. Once you are sure of an answer, draw a single line through that option's key words. Your box gets smaller with every answer, which makes the last items faster."},{"t":"steps","x":["If you realise the speaker has moved on and you have no answer, leave the gap at once.","Put your pencil on the next item and listen for its name or paraphrase.","Answer the remaining items normally and cross out what you use.","At the end, look at the options that are left and pick the one closest to anything you remember about the missed item.","Never leave a gap: a guess from three letters still has a one in three chance."]},{"t":"tip","x":"Cross with one thin line, not a heavy scribble. If you later find a mistake, you still need to read the option underneath."},{"t":"bn","x":"একটা উত্তর মিস করলে ওটা নিয়ে আটকে থেকো না, সাথে সাথে পরের আইটেমের নাম ধরো। একটা মিস যেন দুইটা মিসে না পরিণত হয়। শেষে না-ব্যবহৃত অপশনগুলো থেকে একটা বেছে নাও, ফাঁকা রেখো না।"}]}],"drill":{"kind":"L","type":"match","part":3,"context":"You will hear two students, Priya and Sam, discussing research methods for a project on food waste with their tutor.","speakers":{"Tutor":"m","Priya":"f","Sam":"m"},"script":[{"s":"Tutor","x":"Right, Priya, Sam, you're looking at food waste in the student canteen. Let's go through the methods you listed, and I'll tell you what I think of each one."},{"s":"Priya","x":"Thanks. So the first one is an online questionnaire. We thought it'd be easy, and it wouldn't cost us anything."},{"s":"Sam","x":"The only worry is that hardly anyone fills them in. My flatmate sent one out last year and got about twelve replies."},{"s":"Tutor","x":"Actually, the canteen questionnaires usually do quite well, because there's a prize draw attached, so I wouldn't worry about numbers. My concern is different. If you ask students how much food they throw away, nearly all of them will say 'hardly any'. What people tell you on a form and what they actually leave on their plates are two very different things."},{"s":"Priya","x":"OK. Then we wanted to interview the kitchen staff. Do we need to get that approved by the university ethics committee? That could take months."},{"s":"Tutor","x":"No, for staff interviews about their work, the canteen manager's agreement is enough, and she's very helpful. The issue I'd raise is that the staff work for that manager. If you ask whether the portions are too big, they may not want to criticise decisions their boss has made, especially if she's sitting in the next room. They may not feel free to say what they really think."},{"s":"Sam","x":"Right. The third method was weighing what's left on the plates when people bring their trays back. I was worried that would take ages, standing there for hours every lunchtime."},{"s":"Tutor","x":"It's less work than you'd think. The kitchen already has digital scales by the dishwasher, so you'd just record the weight for each tray. And honestly, if you want hard numbers on how much is wasted, nothing beats it. It's the one method that measures what really happens."},{"s":"Priya","x":"Then photo diaries, where volunteers take a picture of their plate before and after each meal. Some people might be embarrassed, though, photographing their leftovers."},{"s":"Tutor","x":"I doubt it, students photograph their food all the time. The pictures alone won't tell you very much, to be honest. But if you put them alongside the weighing data, you'd see what kind of food is being left, not just how much. As a second method, it'd be really strong."},{"s":"Sam","x":"And last, a focus group. We thought maybe eight students talking for an hour. Although, would people feel awkward admitting they waste food in front of others?"},{"s":"Tutor","x":"In my experience, groups like that are quite relaxed once they get going. And you'd get rich discussion. But think about the practical side. Getting eight busy students in the same room at the same time means weeks of emails, and you've only got six weeks in total. It'd be valuable, but I don't think you have time to set it up."},{"s":"Priya","x":"That's fair. So maybe the weighing plus the photos, and the questionnaire just for background."},{"s":"Tutor","x":"That sounds like a sensible plan. Send me a draft by next Thursday."}],"head":"What is the tutor's opinion of each research method?","opts":[{"x":"It would give useful results but would take far too long to organise.","keys":["useful","too long to set up"]},{"x":"It is likely to produce answers that do not reflect what people actually do.","keys":["say not do","unreliable answers"]},{"x":"It needs official permission from the university, which may be difficult to obtain.","keys":["permission","hard to get"]},{"x":"It would work well if combined with one of the other methods.","keys":["combine","with another"]},{"x":"It is the most reliable way to collect accurate figures on this topic.","keys":["most accurate","figures"]},{"x":"It has been used so often by other students that it would add little.","keys":["overused","adds little"]},{"x":"It might make some participants feel uncomfortable about giving honest opinions.","keys":["uncomfortable","not honest"]},{"x":"It costs nothing, but the number of people who respond is usually very low.","keys":["free","few replies"]}],"qs":[{"q":"online questionnaire","a":1,"ev":"What people tell you on a form and what they actually leave on their plates are two very different things.","why":"The tutor says people's answers will not match what they really do. Sam raises the low response rate (H) and Priya says it is free, but the tutor rejects the response problem with 'I wouldn't worry about numbers'."},{"q":"interviews with kitchen staff","a":6,"ev":"They may not feel free to say what they really think.","why":"Staff may not want to criticise their boss, so they will not feel comfortable giving honest views. Priya mentions the ethics committee (C), but the tutor says the manager's agreement is enough."},{"q":"weighing plate waste","a":4,"ev":"if you want hard numbers on how much is wasted, nothing beats it","why":"'Hard numbers' and 'nothing beats it' match 'the most reliable way to collect accurate figures'. Sam's worry that it would take ages sounds like A, but the tutor says it is 'less work than you'd think'."},{"q":"photo diaries","a":3,"ev":"But if you put them alongside the weighing data, you'd see what kind of food is being left, not just how much.","why":"Putting the photos alongside the weighing means combining two methods. Priya suggests people might be embarrassed (G), but the tutor says 'I doubt it'."},{"q":"focus group","a":0,"ev":"It'd be valuable, but I don't think you have time to set it up.","why":"'Valuable' is useful results and 'weeks of emails' with no time to set it up means too long to organise. Sam's worry about people feeling awkward (G) is rejected: the tutor says such groups are 'quite relaxed'."}]}},{"n":4,"title":"Speed and time management","goal":"Today you will learn to shrink a full box of long options in thirty seconds and keep up when answers come close together.","pages":[{"h":"A thirty-second shrinking routine","blocks":[{"t":"p","x":"Speed in matching comes from the preview, not from listening faster. If your notes are ready, you can match a meaning in one glance. If they are not, you are reading full sentences while the next item is already playing. The routine below fits into thirty seconds once you have practised it ten or fifteen times."},{"t":"steps","x":["Seconds 0 to 3: read the instruction and circle whose opinion counts.","Seconds 3 to 6: read the item list and say each name once in your head.","Seconds 6 to 24: shrink each option to two or three key words, about two seconds each.","Seconds 24 to 30: pick the two most abstract options and think of a synonym for each.","If the recording starts early, stop at once and listen: unfinished notes are better than missing item one."]},{"t":"tip","x":"Build your own short code and use it every time: > for more or better, < for less or worse, x for not or no, + for also or combined, and a question mark for plans or uncertainty. A fixed code is faster than inventing new notes in the exam."},{"t":"bn","x":"ম্যাচিং-এ গতি আসে প্রিভিউ থেকে, দ্রুত শোনা থেকে না। ত্রিশ সেকেন্ডের একটা নির্দিষ্ট রুটিন বানাও আর প্রতিবার সেটাই মেনে চলো। নিজের জন্য ছোট কোড ঠিক করে নাও, যেমন বেশির জন্য >, না-এর জন্য x।"}]},{"h":"Shrinking practice set","blocks":[{"t":"example","q":"Option: 'The owner started the business after losing a job in a completely different industry.'","a":"owner lost job, new career","x":"The story is a career change caused by job loss. Expect paraphrases like 'she was made redundant', 'after the factory closed' or 'he used to be an engineer'. The word 'business' is useless here, because every stall is a business."},{"t":"example","q":"Option: 'It regularly sells out of its products before the market has been open for two hours.'","a":"sells out early","x":"The key idea is that nothing is left early in the day. Listen for 'by ten there's nothing left', 'you have to get there first thing' or 'it's all gone by mid-morning'. The exact number of hours will not be said."},{"t":"example","q":"Option: 'Customers who bring their own containers receive money off what they buy.'","a":"own container = discount","x":"Two ideas must both be present: bringing something and paying less. If the speaker says 'bring your own bottle and it's fifty pence cheaper', both halves match. If they say only 'it's cheap', it does not."},{"t":"example","q":"Option: 'Prices are higher than in supermarkets, but the quality makes the extra cost worthwhile.'","a":"pricey but worth it","x":"This is a two-part option: expensive plus a positive judgement. If the speaker says 'it's about the same as the supermarket', the first half fails, so the option is wrong even if the quality is praised."},{"t":"bn","x":"প্রতিটা লম্বা অপশনে খেয়াল করো কোন শব্দটা সব অপশনে কমন (যেমন business, stall), ওটা বাদ দাও। যা আলাদা করে, সেটাই রাখো। দুই অংশওয়ালা অপশনে দুইটা অংশই মিলতে হবে।"}]},{"h":"When answers come fast","blocks":[{"t":"p","x":"In Part 2, a speaker may spend only fifteen or twenty seconds on each item. The answer is often near the end of that chunk, just before the next item name. If you are still writing the last letter neatly, you will miss the start of the next item. Mark a quick letter in the margin and tidy it up when the section ends."},{"t":"steps","x":["Keep your eyes on the key word notes, not on the full options.","As soon as an option is ruled out for this item, ignore it and keep listening.","Write one fast capital letter when the next item name comes.","If you have missed one, leave it and catch the next item name.","In the checking time, fill any gap from the unused options."]},{"t":"trap","x":"The worst habit is replaying the missed answer in your head. While you try to remember what the speaker said about item 17, item 18 goes past, and one lost mark becomes two."},{"t":"bn","x":"পার্ট দুই-তে প্রতিটা আইটেমের জন্য পনেরো-বিশ সেকেন্ডের বেশি সময় থাকে না। উত্তর সুন্দর করে লিখতে গিয়ে পরের আইটেমের শুরু মিস কোরো না, দ্রুত একটা অক্ষর লিখে রাখো। মিস করা উত্তর নিয়ে মাথায় ভাবতে থাকলে পরেরটাও যাবে।"}]},{"h":"Using the checking time","blocks":[{"t":"p","x":"At the end of each part there is a short pause, and the paper test gives you ten minutes at the end to transfer your answers. Use that time for matching in a fixed order: fill gaps, then check letters. Make sure each letter appears in the box and that you have not written the option words instead of the letter."},{"t":"tip","x":"Write capital letters and form them clearly. A lowercase b and d, or a quick E that looks like an F, can cost you a mark that you actually earned. If two of your answers use the same letter and the task does not allow repeats, one of them is wrong: check which item had the stronger evidence."},{"t":"bn","x":"শেষে যে সময় পাও, ওটা ঠিকমতো কাজে লাগাও: আগে ফাঁকা ঘর পূরণ করো, তারপর অক্ষরগুলো চেক করো। বড় হাতের পরিষ্কার অক্ষর লেখো, যেন B আর D, E আর F গুলিয়ে না যায়। একই অক্ষর দুইবার এসে গেলে একটা নিশ্চয়ই ভুল।"}]}],"drill":{"kind":"L","type":"match","part":2,"context":"You will hear a local radio presenter talking about some of the stalls at a new weekend market.","speakers":{"Presenter":"f"},"script":[{"s":"Presenter","x":"Now, if you haven't been down to the new Riverside Weekend Market yet, you're missing out. I spent last Saturday morning there, and I want to tell you about five stalls you really shouldn't miss. I'll go quickly, because there's a lot to get through, and I've only got a few minutes before the news."},{"s":"Presenter","x":"First, the bakery stall, Crumb and Crust. They were shortlisted for a national baking award this year, though they didn't win in the end. Don't let that put you off. The sourdough is so good that by about ten o'clock the shelves are completely empty, so if you want a loaf, get there when the gates open at eight. Their cinnamon buns are worth the early start too, and they're not expensive at all."},{"s":"Presenter","x":"Next, the cheese stall, run by a couple who drive over three hours every weekend from their farm in Wales. They used to let everyone try a little piece before buying, but the market's hygiene rules put a stop to that, sadly. Still, you can buy with confidence: their blue cheese was named the best in the country at the British Cheese Awards last month, beating some very famous names."},{"s":"Presenter","x":"Then there's the fish stall. You'd expect fish this fresh to cost a lot more than in the shops, but I compared a few prices and they're about the same as the big supermarkets, sometimes even a bit lower. And here's the thing: every fish on that stall was caught off the coast less than fifteen miles from the market, by the owner's brother, on his own boat. You can't get much more local than that."},{"s":"Presenter","x":"Moving on to the juice bar. A lot of people assume it's only there for the summer, but the owner told me she's staying all year round and doing hot drinks in the winter. What I loved is this: if you turn up with your own bottle or cup, she takes fifty pence off the price of any drink. Half the queue had flasks under their arms when I was there. The carrot and ginger juice is my favourite, by the way, though it's quite strong."},{"s":"Presenter","x":"And finally, the spice stall. It's run by a man called Hamid, who worked as an engineer at a car plant for twenty years until it shut down. He'd always cooked for friends, so when he lost his job, he decided to turn the hobby into a living. He doesn't give out free samples, I'm afraid, but he'll happily open a jar so you can smell it, and he'll talk you through any recipe you like. I came home with a bag of his smoked paprika, and my whole kitchen still smells of it."},{"s":"Presenter","x":"So, that's my pick of the Riverside Weekend Market. It's open every Saturday and Sunday from eight till two, and there's free parking behind the old warehouse. Do go and say hello. After the news, we'll be talking to the organisers of this year's music festival."}],"head":"What does the presenter say about each stall?","opts":[{"x":"The owner started the business after losing a job in a different industry.","keys":["lost job","new career"]},{"x":"Everything it sells has been produced within a short distance of the market.","keys":["local","nearby"]},{"x":"It regularly sells out before the market has been open for long.","keys":["sells out","early"]},{"x":"Customers can try a free sample before deciding whether to buy anything.","keys":["free","taste first"]},{"x":"Customers who bring their own containers get money off what they buy.","keys":["own container","discount"]},{"x":"One of its products has recently won a national prize for quality.","keys":["won","national prize"]},{"x":"It will only be at the market for the next few weeks.","keys":["temporary","few weeks"]},{"x":"Its prices are higher than in supermarkets, but the quality justifies the cost.","keys":["pricey","worth it"]}],"qs":[{"q":"the bakery stall","a":2,"ev":"by about ten o'clock the shelves are completely empty","why":"Empty shelves two hours after an eight o'clock opening means it sells out early. The national award (F) is a trap: the bakery was only shortlisted and 'didn't win in the end'."},{"q":"the cheese stall","a":5,"ev":"their blue cheese was named the best in the country at the British Cheese Awards last month","why":"'Best in the country' at a national awards event matches F. Free tasting (D) was stopped by the hygiene rules, so it is no longer true. The cheese comes from a farm three hours away, so B does not fit."},{"q":"the fish stall","a":1,"ev":"every fish on that stall was caught off the coast less than fifteen miles from the market","why":"Caught less than fifteen miles away means produced within a short distance. H is a trap: the presenter says prices are about the same as supermarkets, not higher."},{"q":"the juice bar","a":4,"ev":"if you turn up with your own bottle or cup, she takes fifty pence off the price of any drink","why":"Bringing your own bottle or cup and getting fifty pence off matches E exactly. G is a trap: people think it is only there for the summer, but she is 'staying all year round'."},{"q":"the spice stall","a":0,"ev":"who worked as an engineer at a car plant for twenty years until it shut down","why":"He lost his engineering job when the plant shut, then turned cooking into a living, which is a different industry. He 'doesn't give out free samples', so D is wrong."}]}},{"n":5,"title":"The hardest matching sets","goal":"Today you will handle band 8 to 9 matching sets, where the options are long, abstract and very close in meaning.","pages":[{"h":"What makes the top level hard","blocks":[{"t":"p","x":"At band 8 and above, the difficulty is rarely the accent or the speed. The options are abstract, about evidence, methods, influence or bias, and two of them often share a topic but differ in one word, such as 'underestimated' and 'overestimated'. The speakers also disagree, change their minds and give hedged opinions."},{"t":"p","x":"This means your key words must capture the **difference between similar options**, not just the topic. If two options are about cost, writing 'cost' twice tells you nothing. You need 'cost too low' and 'benefit too high' so that one glance separates them."},{"t":"trap","x":"When the speaker uses the topic word of an option, such as 'cost', students jump to that option. At this level, the topic word is often the bait and the answer is in a different option that shares no words with the recording."},{"t":"bn","x":"ব্যান্ড আট-নয় লেভেলে অপশনগুলো বিমূর্ত হয়, আর দুইটা অপশন প্রায় একই বিষয়ে কিন্তু একটা শব্দে আলাদা। তাই মূল শব্দে শুধু বিষয় না, পার্থক্যটাও লিখতে হবে। স্পিকার কোনো অপশনের বিষয়-শব্দ বললেই সেটা উত্তর না।"}]},{"h":"Shrinking abstract options","blocks":[{"t":"example","q":"Option: 'The conclusions were drawn from too few locations to apply more widely.'","a":"too few sites","x":"The topic is the sample, and the problem is that it is small. Expect 'only looked at one city', 'a single neighbourhood' or 'you can't generalise from that'. The words 'conclusions' and 'apply' are shared ideas in many research options, so drop them."},{"t":"example","q":"Option: 'The findings were dismissed at first but have since been confirmed by others.'","a":"ignored, then confirmed","x":"This option tells a story in time: rejection first, support later. Compare it with 'The results challenged a view that most experts held at the time', which is about conflict with an existing belief. The key words 'ignored, then confirmed' and 'against old view' keep the two apart."},{"t":"example","q":"Option: 'The benefits of the solution were overestimated because of the way they were measured.'","a":"benefit too high, measuring","x":"There are three pieces: benefit, too high, cause is the measurement. A neighbouring option about cost being underestimated shares the idea of a wrong figure, so 'benefit too high' must be written in full. Listen for 'the effect looks bigger than it is'."},{"t":"pairs","x":[["you can't really generalise from one neighbourhood","drawn from too few locations"],["nobody paid any attention for ten years, then three teams got the same result","dismissed at first but since confirmed"],["the cooling looks bigger than it really is","benefits were overestimated"],["guess who paid for it","funded by an organisation that benefited"],["epidemiologists use his set-up now","methods taken up in unrelated fields"]]},{"t":"bn","x":"বিমূর্ত অপশনে দেখো গল্পটা কী: কম নমুনা, পরে স্বীকৃতি, বেশি করে দেখানো, নাকি টাকার উৎস। একই বিষয়ের দুইটা অপশন থাকলে মূল শব্দে পার্থক্যটা স্পষ্ট করে লেখো, যেমন 'benefit too high' আর 'cost too low'।"}]},{"h":"People to comments","blocks":[{"t":"p","x":"In people-to-comments tasks, the items are names, often researchers or writers. Unusual names can be hard to catch, and the speakers may say a name once and then use 'she', 'her later paper' or 'the Swedish study'. Say each name in your head during the preview so you recognise it when it comes."},{"t":"steps","x":["Read each name and guess how it sounds, so you are ready for it.","Listen for the name, then follow the pronouns that refer back to that person.","Notice who is speaking: in a discussion, the student who knows more usually gives the final view.","Wait for agreement. If one speaker says 'I'm not so sure' and the other accepts it, the answer follows the correction."]},{"t":"tip","x":"If you miss a name, listen for the next name on the list rather than trying to work out which researcher is being discussed. The order of the names on the paper is the order of the recording."},{"t":"bn","x":"মানুষের নামের সাথে মন্তব্য মেলানোর টাস্কে নামগুলো প্রিভিউয়ের সময় মনে মনে উচ্চারণ করে নাও। নাম একবার বলেই স্পিকার 'she' বা 'her paper' বলতে পারে। আলোচনায় যে বেশি জানে, সাধারণত তার শেষ মতটাই উত্তর।"}]},{"h":"Hedging and partial agreement","blocks":[{"t":"p","x":"At the top level, the final opinion is often softened. Speakers rarely say 'that's wrong'. Instead you hear 'I wouldn't go that far', 'that's not entirely fair' or 'there's something in that, but'. You must decide whether the speaker accepts the idea, rejects it, or accepts it only as a minor point before the main one."},{"t":"pairs","x":[["I wouldn't go that far","rejects the idea"],["that's fair enough, he never claimed otherwise","accepts it, but it is not a criticism"],["there's something in that, but what really bothers me is","the main point comes next"],["that's how it's described now, but","the popular version is wrong"]]},{"t":"example","q":"Item: 'Ramirez'. Options include A 'drew conclusions from too few locations' and B 'methods taken up in other fields'. You hear: 'He only covered two cities, true. But he never said it applied everywhere, so that's fair enough. The interesting part is the sensor set-up, which farm researchers now use.'","a":"B","x":"The small sample is mentioned and admitted, but then excused with 'that's fair enough', so it is not the comment the speaker is making. 'The interesting part is' introduces the main point: farm researchers, a different field, now use his method."},{"t":"bn","x":"উঁচু লেভেলে স্পিকার সরাসরি 'ভুল' বলে না, বলে 'I wouldn't go that far' বা 'that's fair enough, but'। খেয়াল করো সে কোনো কথা মেনে নিয়ে পাশ কাটিয়ে যাচ্ছে কিনা। 'but' এর পরের মূল কথাটাই সাধারণত উত্তর।"}]}],"drill":{"kind":"L","type":"match","part":3,"context":"You will hear two environmental science students, Lena and Omar, discussing research on urban heat for a seminar presentation.","speakers":{"Lena":"f","Omar":"m"},"script":[{"s":"Omar","x":"OK, so for the seminar we need a comment on each of the five studies on the reading list. Shall we start with Okafor? She's the one everyone says overturned the old thinking about street trees, isn't she?"},{"s":"Lena","x":"That's how it's described now, but when you read the background, there wasn't really an accepted view for her to overturn. Nobody had looked at street trees and temperature at all. What actually happened was her paper was more or less ignored for about a decade, and then three separate teams got almost identical results within a couple of years. So she's been proved right, but long after the fact."},{"s":"Omar","x":"Fair enough. Lindqvist next. I have to say, her cost figures for green roofs look suspiciously low to me."},{"s":"Lena","x":"I thought so too at first, but she does include maintenance and replacement over thirty years, so I think the costs are fine. The problem is the cooling figure. She measured the surface temperature of the roofs, and a surface reading always shows a much bigger drop than the air people actually breathe. So the effect looks bigger than it really is."},{"s":"Omar","x":"Right, that's a good point. Then Ramirez. My main criticism is that he only covered two cities, both in the same climate zone."},{"s":"Lena","x":"True, but he never claimed it applied everywhere. He says quite clearly it's a pilot. So I'd say that's fair enough. The interesting thing about Ramirez is the sensor set-up. He built a network of really cheap temperature sensors, and now epidemiologists use it to track heatwaves and health, and farm researchers use it in greenhouses. None of them are urban planners."},{"s":"Omar","x":"Oh, I didn't know that. OK, Chen. That study's from two thousand and nine, so I was going to say the data's out of date."},{"s":"Lena","x":"I wouldn't go that far. Summer temperatures in that city haven't changed much since then, and he uses thirty years of records anyway. What bothers me is who paid for it. The whole project was funded by a company that makes reflective roof paint, and, well, guess which solution comes out on top in the conclusion?"},{"s":"Omar","x":"Hmm, that's worth mentioning, but carefully. We're not saying he made anything up."},{"s":"Lena","x":"No, just that readers should know. And last, Moreau."},{"s":"Omar","x":"Well, at least her data's very recent, from last summer. And I like that she includes the costs of planting."},{"s":"Lena","x":"Yes, the data's current, no question. But look at where it comes from. She studied one neighbourhood in Lyon, about twelve streets, and then in the conclusion she talks about what all European cities should do. You can't really generalise from one neighbourhood to a whole continent."},{"s":"Omar","x":"That's true. OK, I'll draft the slides for Okafor and Lindqvist, and you take the other three?"},{"s":"Lena","x":"Sounds good. Let's meet on Thursday and run through it together. And remember Doctor Patel said she wants a clear criticism for each study, not just a summary, so let's keep the comments sharp."}],"head":"What comment do the students make about each researcher's work?","opts":[{"x":"The conclusions were drawn from too few locations to apply more widely.","keys":["too few sites","can't generalise"]},{"x":"The methods were later taken up by researchers in unrelated fields.","keys":["method reused","other fields"]},{"x":"The results challenged a view that most experts held at the time.","keys":["against","accepted view"]},{"x":"The findings were dismissed at first but have since been confirmed by others.","keys":["ignored","later confirmed"]},{"x":"The cost of the proposed solution was underestimated in the original study.","keys":["cost","too low"]},{"x":"The research was paid for by an organisation that benefited from the results.","keys":["funder","benefited"]},{"x":"The data used is now too old to reflect conditions in cities today.","keys":["data","outdated"]},{"x":"The benefits of the solution were overestimated because of how they were measured.","keys":["benefit too high","measuring"]}],"qs":[{"q":"Okafor","a":3,"ev":"her paper was more or less ignored for about a decade, and then three separate teams got almost identical results within a couple of years","why":"Ignored for a decade, then supported by three teams, matches D. C is the trap: Omar repeats the popular claim that she overturned an old view, but Lena says there was no accepted view to overturn."},{"q":"Lindqvist","a":7,"ev":"So the effect looks bigger than it really is.","why":"Measuring surface temperature makes the cooling benefit look bigger, so the benefit was overestimated because of the measurement. Omar suggests the costs are too low (E), but Lena says 'the costs are fine'."},{"q":"Ramirez","a":1,"ev":"now epidemiologists use it to track heatwaves and health, and farm researchers use it in greenhouses","why":"Health researchers and farm researchers are unrelated fields using his sensor method. The two-city sample (A) is mentioned, but Lena calls it 'fair enough' because he never claimed wider results."},{"q":"Chen","a":5,"ev":"The whole project was funded by a company that makes reflective roof paint","why":"A paint company paid for a study whose conclusion favours reflective roofs, so the funder benefited. Omar thinks the data is out of date (G), but Lena answers 'I wouldn't go that far'."},{"q":"Moreau","a":0,"ev":"You can't really generalise from one neighbourhood to a whole continent.","why":"One neighbourhood of twelve streets cannot support advice for all European cities, which matches A. The data is recent (so not G), and the cost of planting is praised, not criticised (so not E)."}]}},{"n":6,"title":"Mock test and final checklist","goal":"Today you will take a full matching set under exam conditions and finish with a checklist you can use on test day.","pages":[{"h":"Exam conditions","blocks":[{"t":"p","x":"Treat today's drill like the real test. Give yourself thirty seconds for the preview, play the recording once only, and do not pause. Write your key words on paper next to each letter, exactly as you would in the exam hall."},{"t":"steps","x":["Set a timer for thirty seconds and shrink all eight options.","Start the audio and keep your pencil on the current item.","Dot possible letters, and write the final one when the next item name comes.","Cross out used options with a thin line.","When the recording ends, fill any gap and check every letter."]},{"t":"example","q":"Option from today's box: 'Volunteers working there will need to complete extra training before starting.'","a":"volunteers: extra training","x":"The topic is training and the condition is that it is extra, beyond the normal course. If the speaker says 'there's no extra training for that room, just the standard course', the option is cancelled for that item. Keep 'extra' in your note."},{"t":"bn","x":"আজকের ড্রিলটা আসল পরীক্ষার মতো করো: ত্রিশ সেকেন্ড প্রিভিউ, রেকর্ডিং একবারই শুনবে, থামাবে না। মূল শব্দগুলো কাগজে লিখে নাও, ঠিক যেভাবে পরীক্ষার হলে করবে।"}]},{"h":"Final checklist","blocks":[{"t":"steps","x":["Underline whose opinion counts in the instruction.","Shrink every option to two or three key words, keeping words like not, only, extra and no longer.","Items come in order, options do not: follow the item names as signposts.","Expect two or three options to be mentioned for each item and write the one the speaker ends on.","If you miss one, leave it, catch the next item name, and guess from the unused letters at the end.","Check each letter is in the box, written clearly, and not used twice unless the instruction allows it."]},{"t":"trap","x":"On test day, nerves make people go back to reading full options during the audio. If you notice your eyes reading a long sentence, stop and look at your key words instead."},{"t":"bn","x":"পরীক্ষার দিনের চেকলিস্ট: কার মত শুনতে হবে দেখো, প্রতিটা অপশন ছোট করো, আইটেমের নাম ধরে এগোও, শেষ মতটাই লেখো, মিস হলে পরেরটা ধরো, আর শেষে অক্ষরগুলো চেক করো।"}]},{"h":"Staying calm when you miss one","blocks":[{"t":"p","x":"Every strong listener misses an answer sometimes. The difference between band 7 and band 8.5 is often what happens next. A calm student loses one mark, while a worried student loses three because the panic carries into the next items."},{"t":"tip","x":"Have a short phrase ready for that moment, such as 'next name'. Say it in your head, move your pencil down, and listen only for the next item. You can deal with the gap later, when the recording has stopped."},{"t":"bn","x":"ভালো শ্রোতাও মাঝে মাঝে উত্তর মিস করে। পার্থক্যটা হলো এরপর কী করো। মনে মনে বলো 'next name', পেন্সিল নিচে নামাও আর পরের আইটেম শোনো। ফাঁকাটা পরে দেখবে।"}]}],"drill":{"kind":"L","type":"match","part":2,"context":"You will hear the manager of a recently renovated arts centre talking to a group of new volunteers.","speakers":{"Manager":"f","Volunteer":"m"},"script":[{"s":"Manager","x":"Good evening, everyone, and thank you all for coming. I'm Rachel, the centre manager. As you know, the Westbrook Arts Centre reopened in the spring after nearly two years of building work, and we couldn't run the place without volunteers like you. Tonight I'd like to give you a quick tour, in words at least, of the main areas you might be working in, so you know what to expect. I'll keep it short, because I know some of you have come straight from work."},{"s":"Manager","x":"So, starting with the main theatre. People often assume the theatre was the part that ran late, because it was the biggest job, but in fact the builders finished it two weeks early. It seats four hundred now, and although you might think it's the busiest part of the building, it's only full a couple of nights a week. If you'd like to volunteer there, as an usher or backstage, you'll need to do an extra half-day course on fire safety and emergency exits, on top of the general induction that everyone does."},{"s":"Volunteer","x":"Sorry, is that course the same for front of house and backstage?"},{"s":"Manager","x":"Yes, it's the same course, and we run it on the first Monday of every month. Right, next, the gallery on the ground floor. You may have seen in the paper that local people chose what went into the opening exhibition. That's true, there was a public vote on the paintings, but the room itself was designed by the architects, nobody else. And it has been a huge success. Since we reopened, more people have come through the gallery doors than through the theatre and the café put together."},{"s":"Manager","x":"Then upstairs there's the recording studio. When we first applied for planning permission, some neighbours were worried about noise, which is understandable, but the walls are fully soundproofed, and we haven't had a single complaint. The studio isn't just for professional musicians, either. Any local resident can hire it by the hour, and they pay roughly half what a commercial studio in the city would charge."},{"s":"Volunteer","x":"And the roof garden I've heard about, is that open yet?"},{"s":"Manager","x":"Ah, the rooftop terrace. I wish I could say yes. It was supposed to open in March, then June, and now we're hoping for September, so it's taken a lot longer than any of us planned. There was a problem with the drainage that nobody spotted until the tiles were down, and fixing it meant lifting almost all of them again. When it does open, it'll have seating for about fifty people and a small bar in the evenings. At one point we were going to say a member of staff had to be up there whenever it was open, but the new railings are so high that the safety officer says that won't be necessary."},{"s":"Manager","x":"And finally, the children's workshop room in the basement. Some of you who knew the old building will remember that this was the boiler room. It was full of pipes and machinery, and no one went down there except the caretaker. Now it's bright and colourful, with art materials, sinks and long tables. On Saturday mornings it's full of four-year-olds covered in paint, which is wonderful to see. It isn't staffed all day. Families can just drop in as long as an adult stays with the children, and volunteers there don't need any training beyond the general induction."},{"s":"Manager","x":"OK, that's the tour. Please fill in the form on your chair to say which area you'd prefer, and we'll be in touch by the end of the week. Thanks again for giving up your time."}],"head":"What does the manager say about each area of the arts centre?","opts":[{"x":"It is now used for a different purpose than when the building first opened.","keys":["new use","was something else"]},{"x":"Volunteers working there will need to complete extra training before starting.","keys":["volunteers","extra training"]},{"x":"Members of the public can hire it at a lower price than elsewhere.","keys":["public hire","cheaper"]},{"x":"The work on it has taken much longer than the centre originally planned.","keys":["delayed","longer than planned"]},{"x":"It is only open to visitors when a member of staff is present.","keys":["staff present","only"]},{"x":"Some people living nearby have complained about the noise coming from it.","keys":["neighbours","noise complaints"]},{"x":"It has attracted more visitors than any other part of the centre since reopening.","keys":["most visitors","busiest"]},{"x":"Its design was chosen by people who live in the local area.","keys":["locals chose","design"]}],"qs":[{"q":"the main theatre","a":1,"ev":"you'll need to do an extra half-day course on fire safety and emergency exits, on top of the general induction that everyone does","why":"An extra course on top of the general induction is extra training. Two traps come first: the theatre did not run late (D), it finished early, and it is not the busiest part (G)."},{"q":"the gallery","a":6,"ev":"more people have come through the gallery doors than through the theatre and the café put together","why":"More visitors than the theatre and café together means the most visitors. H is the trap: local people voted on the paintings, but the room's design was by the architects."},{"q":"the recording studio","a":2,"ev":"Any local resident can hire it by the hour, and they pay roughly half what a commercial studio in the city would charge","why":"Residents can hire it for about half the commercial price, which matches C. Noise (F) was only a worry before it was built, and there has not been 'a single complaint'."},{"q":"the rooftop terrace","a":3,"ev":"it's taken a lot longer than any of us planned","why":"Planned for March, then June, now September, so it is delayed. E is the trap: a staff member was going to be required, but the high railings mean 'that won't be necessary'."},{"q":"the children's workshop room","a":0,"ev":"this was the boiler room","why":"It was the boiler room and is now a workshop, so its purpose has changed. It 'isn't staffed all day' (not E), and volunteers need no extra training (not B)."}]}}]}];

/* ---------- voices by gender ---------- */
const FEMV = /(\bfemale\b|zira|sonia|libby|maisie|hazel|susan|jenny|aria|emma|natasha|clara|samantha|karen|moira|tessa|serena|kate|fiona|victoria|\bava\b|allison|joanna|\bamy\b|olivia|ruth|sara|heera|neerja|catherine|linda|michelle|kendra|kimberly|salli|ivy|sonia|maisie)/i;
const MALV = /\b(male|ryan|thomas|george|alfie|elliot|guy|davis|christopher|eric|brian|andrew|daniel|arthur|oliver|alex|fred|mark|david|james|william|liam|matthew|joey|justin|kevin|rishi|prabhat|richard|roger|steffan|tony)\b/i;
function castVoices(speakers){
  const pref = S.settings.accent === 'US' ? /en[-_]US/i : /en[-_]GB/i;
  const pool = VOICES.slice().sort((a, b) => (pref.test(b.lang) - pref.test(a.lang)) || (/natural|online|neural/i.test(b.name) - /natural|online|neural/i.test(a.name)));
  const fem = pool.filter(v => FEMV.test(v.name)), mal = pool.filter(v => !FEMV.test(v.name) && MALV.test(v.name));
  const used = { f:0, m:0 }; const cast = {};
  Object.entries(speakers).forEach(([name, g]) => { const list = g === 'f' ? fem : mal; const i = used[g]++;
    const v = list[i % Math.max(1, list.length)] || pool[0] || null;
    cast[name] = { v, pitch: list.length ? (i >= list.length ? (g === 'f' ? 1.1 : .9) : 1) : (g === 'f' ? 1.25 : .8) }; });
  return cast;
}

function courseCard(id){
  const c = SC[id]; if (!c) return ''; const [t, ts] = KTINT[id];
  const nx = c.days.find(d => !S.k.res[kday(c, d.n)]);
  const best = c.days.map(d => S.k.res[kday(c, d.n)]).filter(Boolean);
  const avg = best.length ? Math.round(best.reduce((a, r) => a + kpct(r), 0) / best.length * 100) : null;
  const miss = Object.keys(S.k.miss).filter(k => k.startsWith(id + ':')).length;
  return `<div class="kcard" style="--tint:${t};--tint-soft:${ts}"><div class="row" style="justify-content:space-between"><span class="label">${c.skill === 'R' ? 'Reading' : 'Listening'} · 6 days</span>${avg != null ? `<span class="pill">${avg}% average</span>` : ''}</div>
    <h3>${esc(c.title)}</h3><span class="bn">${esc(c.bn)}</span>
    <div class="kdays">${c.days.map(d => { const r = S.k.res[kday(c, d.n)]; const p = kpct(r);
      const cls = r ? (p >= .8 ? 'ok' : p >= .5 ? 'mid' : 'low') : (nx && nx.n === d.n ? 'next' : S.k.read[kday(c, d.n)] ? 'read' : '');
      return `<i class="${cls}" title="Day ${d.n}: ${esc(d.title)}${r ? ` · best ${r.best}/${r.total}` : ''}">${r ? Math.round(p * 100) : d.n}</i>`; }).join('')}</div>
    <p class="muted" style="margin:0;font-size:14px">${esc(c.why)}</p>
    <div class="row"><a class="btn small primary" href="#skills-${id}">${nx ? `Open day ${nx.n}` : 'Open course'}</a>${miss ? `<span class="pill bad">${miss} to review</span>` : ''}</div></div>`;
}

      <small style="margin-top:4px">${r ? `Best score <b>${r.best}/${r.total}</b> · ${r.tries} ${r.tries > 1 ? 'tries' : 'try'}` : read ? 'Chapter read · test not taken yet' : 'Not started'}</small></span>

      return `<div class="mk"><span><span class="pill" style="margin-bottom:4px">Day ${n}, question ${+qi + 1}</span><br><b>${esc(qText(dr, q))}</b></span><span>You: <s>${esc(m.given || 'no answer')}</s><br>Answer: <b>${esc(ansText(dr, q))}</b></span></div>`; }).join('')}</div>
      <p class="muted" style="font-size:14px;margin:10px 0 0">Retake the day's test. A question leaves this list when you get it right.</p></div>` : ''}`;
  bindK();
}
const qText = (dr, q) => dr.type === 'heading' ? 'Paragraph ' + q.p : dr.type === 'info' ? q.s : q.q;
function ansText(dr, q){
  if (dr.type === 'heading') return ROMAN[q.a] + ' ' + dr.headings[q.a];
  if (dr.type === 'info') return q.a;
  if (dr.type === 'mcq') return LET[q.a] + ' ' + q.o[q.a];
  return LET[q.a] + ' ' + dr.opts[q.a].x;
}

/* ---------- book reader ---------- */
function openChapter(c, n, page){
  const d = c.days[n - 1]; const P = d.pages.length; page = Math.max(0, Math.min(P - 1, page));
  K = { kind:'book', c, n, page };
  if (page === P - 1){ S.k.read[kday(c, n)] = true; save(); }
  const pg = d.pages[page]; let first = page === 0;
  const blocks = pg.blocks.map(b => {
    if (b.t === 'p'){ const h = `<p class="${first ? 'drop' : ''}">${kmd(b.x)}</p>`; first = false; return h; }
    if (b.t === 'steps') return `<ol class="steps">${b.x.map(s => `<li><span>${kmd(s)}</span></li>`).join('')}</ol>`;
    if (b.t === 'tip') return `<div class="note tip"><b class="k">Examiner's tip</b>${kmd(b.x)}</div>`;
    if (b.t === 'trap') return `<div class="note trap"><b class="k">Trap</b>${kmd(b.x)}</div>`;
    if (b.t === 'bn') return `<div class="note bnn"><b class="k">বাংলায়</b>${esc(b.x)}</div>`;
    if (b.t === 'pairs') return `<table class="pairs"><tr><th>${c.skill === 'R' ? 'In the passage' : 'In the recording'}</th><th></th><th>In the question</th></tr>${b.x.map(([a, q]) => `<tr><td>${esc(a)}</td><td class="ar">↔</td><td>${esc(q)}</td></tr>`).join('')}</table>`;
    if (b.t === 'example') return `<div class="ex"><div class="label" style="color:#9A7B55;margin-bottom:4px">Worked example</div><div class="q">${kmd(b.q)}</div><div class="ans"><button class="btn small" type="button" data-show>Show the answer</button><div hidden><p style="margin:8px 0 4px"><b>Answer: ${esc(b.a)}</b></p><p style="margin:0">${kmd(b.x)}</p></div></div></div>`;
    return '';
  }).join('');
  main().innerHTML = `<div class="book"><div class="ktop"><a class="btn small ghost" href="#skills-${c.id}">← ${esc(c.title)}</a><span class="muted" style="font-size:14px">Page ${page + 1} of ${P}</span></div>
    <article class="paper"><div class="run"><span>${esc(c.title)}</span><span>Day ${n} · ${esc(d.title)}</span></div>
      ${page === 0 ? `<p style="font-family:var(--f-ui);font-size:15px;color:#9A7B55;margin:-6px 0 12px">${esc(d.goal)}</p>` : ''}
      <h2>${esc(pg.h)}</h2>${blocks}</article>
    <div class="bookfoot"><button class="btn" type="button" id="bkPrev" ${page === 0 ? 'disabled' : ''}>← Back</button><div class="pdots">${d.pages.map((x, i) => `<i class="${i === page ? 'on' : ''}"></i>`).join('')}</div>
      ${page === P - 1 ? `<button class="btn primary" type="button" id="bkTest">Take the day ${n} test</button>` : '<button class="btn primary" type="button" id="bkNext">Next page →</button>'}</div></div>`;
  $$('[data-show]').forEach(b => b.onclick = () => { b.nextElementSibling.hidden = false; b.remove(); });
  $('#bkPrev').onclick = () => { openChapter(c, n, page - 1); window.scrollTo(0, 0); };
  if ($('#bkNext')) $('#bkNext').onclick = () => { openChapter(c, n, page + 1); window.scrollTo(0, 0); };
  if ($('#bkTest')) $('#bkTest').onclick = () => openTest(c, n);
}
document.addEventListener('keydown', e => {
  if (!K || K.kind !== 'book' || !document.body.contains($('.paper')) || /input|textarea|select/i.test(e.target.tagName)) return;
  if (e.key === 'ArrowRight' && $('#bkNext')) $('#bkNext').click();
  if (e.key === 'ArrowLeft' && !$('#bkPrev').disabled) $('#bkPrev').click();
});

/* ---------- tests ---------- */
function openTest(c, n){ stopK(); const dr = c.days[n - 1].drill; K = { kind:'test', c, n, dr, ans:{}, cross:{}, done:false, t0:Date.now() }; window.scrollTo(0, 0); dr.kind === 'R' ? readingTest() : listeningTest(); }
function stopK(){ if (K && K.timer) clearInterval(K.timer); if (K && K.play) { K.play.stop = true; speechSynthesis.cancel(); } }
function timerTick(){
  const el = $('#ktm'); if (!el || !K) return stopK();
  const left = K.dr.time * 60 - Math.floor((Date.now() - K.t0) / 1000); const a = Math.abs(left);
  el.textContent = (left < 0 ? '+' : '') + Math.floor(a / 60) + ':' + String(a % 60).padStart(2, '0'); el.classList.toggle('over', left < 0);
}
function passageHTML(dr, marks){
  return `<h2>${esc(dr.title)}</h2>${dr.paras.map(p => { let h = esc(p.x);
    (marks || []).filter(m => m.l === p.l || !m.l).forEach(m => { const e = esc(m.ev); if (h.includes(e)) h = h.replace(e, `<mark class="ev">${e}<sup>${m.n}</sup></mark>`); });
    return `<div class="para"><b class="l">${p.l}</b><div>${h}</div></div>`; }).join('')}`;
}
function readingTest(){
  const { c, n, dr } = K;
  const letters = dr.paras.map(p => p.l);
  const items = dr.qs.map((q, i) => {
    if (dr.type === 'heading') return `<div class="item"><div><span class="qn">${i + 1}</span><b>Paragraph ${q.p}</b></div><select data-a="${i}"><option value="">Choose a heading</option>${dr.headings.map((h, j) => `<option value="${j}">${ROMAN[j]}</option>`).join('')}</select></div>`;
    if (dr.type === 'info') return `<div class="item"><div><span class="qn">${i + 1}</span>${esc(q.s)}</div><select data-a="${i}"><option value="">Paragraph</option>${letters.map(l => `<option>${l}</option>`).join('')}</select></div>`;
    return `<div class="item"><div><span class="qn">${i + 1}</span><b>${esc(q.q)}</b></div><div class="opts">${q.o.map((o, j) => `<div class="kopt" data-q="${i}" data-o="${j}" role="button" tabindex="0"><b>${LET[j]}</b><span class="t">${esc(o)}</span><button class="cross" type="button" title="Cross out" data-x="${i}:${j}">✕</button></div>`).join('')}</div></div>`;
  }).join('');
  main().innerHTML = `<div class="ktop"><div class="row"><a class="btn small ghost" href="#skills-${c.id}">← ${esc(c.title)}</a><span class="pill">Day ${n} test · ${KTYPE[dr.type]}</span></div>
    <div class="row"><span class="ktimer" id="ktm"></span><button class="btn primary" type="button" id="kSub">Check answers</button></div></div>
    <div class="ktest"><article class="kpass" id="kpass">${passageHTML(dr)}</article>
    <div class="kq" id="kq"><div class="ins">${esc(dr.instr)}<br><span style="font-size:13px">Tip: select words in the passage to highlight them.</span></div>
      ${dr.type === 'heading' ? `<div><div class="label" style="margin-bottom:6px">List of headings (tap one to cross it out)</div><div class="hlist">${dr.headings.map((h, j) => `<button type="button" data-h="${j}"><b>${ROMAN[j]}</b><span>${esc(h)}</span></button>`).join('')}</div></div>` : ''}
      ${items}<button class="btn primary" type="button" id="kSub2">Check answers</button></div></div>`;
  K.timer = setInterval(timerTick, 1000); timerTick();
  $$('[data-a]').forEach(s => s.onchange = () => { K.ans[s.dataset.a] = s.value; });
  $$('[data-h]').forEach(b => b.onclick = () => b.classList.toggle('x'));
  $$('.kopt').forEach(o => o.onclick = e => { if (K.done || e.target.closest('.cross')) return; const i = o.dataset.q; K.ans[i] = o.dataset.o; $$(`.kopt[data-q="${i}"]`).forEach(x => x.classList.toggle('sel', x === o)); });
  $$('[data-x]').forEach(b => b.onclick = () => b.parentElement.classList.toggle('x'));
  $('#kpass').onmouseup = () => { const sel = getSelection(); if (!sel.rangeCount || sel.isCollapsed || K.done) return; const r = sel.getRangeAt(0); if (!$('#kpass').contains(r.commonAncestorContainer)) return;
    try { const m = document.createElement('mark'); m.className = 'hl'; r.surroundContents(m); m.onclick = () => { m.replaceWith(...m.childNodes); }; } catch (e) {} sel.removeAllRanges(); };
  $('#kSub').onclick = $('#kSub2').onclick = () => finishTest();
}
function finishTest(){
  const { c, n, dr } = K; if (K.done) return;
  const unanswered = dr.qs.filter((q, i) => K.ans[i] == null || K.ans[i] === '').length;
  if (unanswered && !K.warned){ K.warned = true; toast(`${unanswered} unanswered. In the real test, always guess. Press check again to finish.`); return; }
  K.done = true; stopK();
  const res = dr.qs.map((q, i) => { const g = K.ans[i]; const ok = g != null && g !== '' && String(g) === String(q.a); return { q, i, g, ok }; });
  const right = res.filter(r => r.ok).length; const tot = dr.qs.length; const key = kday(c, n);
  const prev = S.k.res[key]; S.k.res[key] = { best: Math.max(right, prev ? prev.best : 0), total: tot, last: right, date: TODAY(), tries: (prev ? prev.tries : 0) + 1 };
  res.forEach(r => { const mk = key + ':' + r.i; if (r.ok) delete S.k.miss[mk]; else S.k.miss[mk] = { given: r.g === undefined || r.g === '' ? '' : giveText(dr, r.g, r.q), d: TODAY() }; });
  addXP(right * 2, 'skills'); save();
  const pct = right / tot;
  if (pct >= .8){ sndWin(); confetti(); } else if (pct >= .5) sndOK(); else sndNo();
  const msg = pct === 1 ? 'Full marks. This question type is yours now.' : pct >= .8 ? 'Band 8 level on this type. Read the explanations for the ones you missed.' : pct >= .5 ? 'Good base. Each green highlight shows where the answer was hiding.' : 'This is how you learn it. Read each proof below, then retake the test tomorrow.';
  const resHTML = res.map(r => `<div class="kres ${r.ok ? 'ok' : 'no'}"><div><span class="qn" style="background:${r.ok ? 'var(--good)' : 'var(--bad)'}">${r.i + 1}</span><b>${esc(qText(dr, r.q))}</b></div>
    <div>${r.ok ? 'Correct' : `You: <s>${esc(r.g == null || r.g === '' ? 'no answer' : giveText(dr, r.g, r.q))}</s>`} · Answer: <b>${esc(ansText(dr, r.q))}</b></div>
    <div class="ev">“${esc(r.q.ev)}”</div><div>${esc(r.q.why)}</div></div>`).join('');
  const head = `<div class="kres ${pct >= .5 ? 'ok' : 'no'}" style="text-align:center;padding:16px"><div style="font-family:var(--f-head);font-size:48px;font-weight:800;line-height:1">${right}<span class="muted" style="font-size:24px">/${tot}</span></div><div>${msg}</div>
    <div class="row" style="justify-content:center;margin-top:6px"><button class="btn small" type="button" id="kAgain">Retake</button>${n < 6 ? `<button class="btn small primary" type="button" id="kNext">Read day ${n + 1}</button>` : ''}<a class="btn small" href="#skills">All courses</a></div></div>`;
  if (dr.kind === 'R'){
    $('#kpass').innerHTML = passageHTML(dr, res.map(r => ({ ev: r.q.ev, n: r.i + 1, l: dr.type === 'heading' ? r.q.p : dr.type === 'info' ? r.q.a : null })));
    $('#kq').innerHTML = head + resHTML;
  } else {
    $('#kq').innerHTML = head + resHTML;
    $('#ltrans').hidden = false; $('#ltrans').innerHTML = transHTML(dr, res);
    $('#lplay') && ($('#lplay').hidden = true);
    $$('#lph span').forEach((x, i) => x.classList.toggle('on', i === 2)); $('#lprev') && ($('#lprev').hidden = true);
  }
  $('#kSub') && ($('#kSub').hidden = true);
  $('#kAgain').onclick = () => openTest(c, n);
  if ($('#kNext')) $('#kNext').onclick = () => { openChapter(c, n + 1, 0); window.scrollTo(0, 0); };
  window.scrollTo({ top:0, behavior:'smooth' });
}
function giveText(dr, g, q){ if (dr.type === 'heading') return ROMAN[g] + ' ' + dr.headings[g]; if (dr.type === 'mcq') return LET[g] + ' ' + q.o[g]; if (dr.type === 'match') return LET[g] + ' ' + dr.opts[g].x; return g; }

/* ---------- listening ---------- */
const kwWrap = s => s.split(/(\s+)/).map(w => /\s/.test(w) || !w ? w : `<button type="button" class="kw">${esc(w)}</button>`).join('');
function listeningTest(){
  const { c, n, dr } = K; K.phase = 'preview';
  const items = dr.type === 'mcq'
    ? dr.qs.map((q, i) => `<div class="item"><div><span class="qn">${i + 1}</span><b>${kwWrap(q.q)}</b></div><div class="opts">${q.o.map((o, j) => `<div class="kopt" data-q="${i}" data-o="${j}" role="button" tabindex="0"><b>${LET[j]}</b><span class="t">${kwWrap(o)}</span><button class="cross" type="button" title="Cross out" data-x="${i}:${j}">✕</button></div>`).join('')}</div></div>`).join('')
    : `<div><div class="label" style="margin-bottom:6px">${esc(dr.head)}</div><div class="optlist">${dr.opts.map((o, j) => `<div class="optrow" data-or="${j}"><b class="l">${LET[j]}</b><span class="tx">${kwWrap(o.x)}</span><span class="keys" hidden>Key words: ${esc(o.keys.join(' · '))}</span></div>`).join('')}</div></div>
       ${dr.qs.map((q, i) => `<div class="item"><div class="row" style="justify-content:space-between"><span><span class="qn">${i + 1}</span><b>${esc(q.q)}</b></span><select data-a="${i}"><option value="">Letter</option>${dr.opts.map((o, j) => `<option value="${j}">${LET[j]}</option>`).join('')}</select></div></div>`).join('')}`;
  main().innerHTML = `<div class="ktop"><div class="row"><a class="btn small ghost" href="#skills-${c.id}">← ${esc(c.title)}</a><span class="pill">Day ${n} test · Part ${dr.part} · ${KTYPE[dr.type]}</span></div>
    <div class="lphase" id="lph"><span class="on">1 Preview</span><span>2 Listen</span><span>3 Check</span></div></div>
    <div class="ktest"><div class="stack">
      <div class="kq"><p style="margin:0"><b>${esc(dr.context)}</b></p>
        <div class="ins" id="lins">${dr.type === 'match' ? 'Preview: the options are long. Tap the 2 or 3 words in each option that carry its meaning, so you only have to listen for those. Then compare with the suggested key words.' : 'Preview: tap the key words in each question and option. All three options are usually mentioned, so listen for the one the speaker finally chooses.'}</div>
        <div class="row">${dr.type === 'match' ? '<button class="btn small" type="button" id="lkeys">Compare with suggested key words</button>' : ''}<span class="ktimer" id="lprev">0:45</span></div>
        <div class="row"><label class="chip" style="display:inline-flex;gap:6px;align-items:center"><input type="checkbox" id="lmode" ${S.k.mode === 'practice' ? 'checked' : ''}> Practice mode (pause and replay)</label></div>
      </div>
      <div class="lplayer" id="lplay"><div class="row" style="justify-content:space-between"><b>Recording</b><span class="mono" id="lpos">ready</span></div><div class="wave">${'<i></i>'.repeat(18)}</div><div class="bar"><i id="lbar" style="width:0"></i></div>
        <div class="row"><button class="btn primary" type="button" id="lgo">Start listening</button><button class="btn" type="button" id="lpause" hidden>Pause</button><button class="btn" type="button" id="lback" hidden>Replay last part</button></div>
        <span style="font-size:13px;opacity:.8">Exam mode plays once with no pause, like the real test. Answer while you listen.</span></div>
      <div class="trans" id="ltrans" hidden></div></div>
    <div class="kq" id="kq">${items}<button class="btn primary" type="button" id="kSub2">Check answers</button></div></div>`;
  $$('.kw').forEach(b => b.onclick = e => { e.stopPropagation(); b.classList.toggle('on'); });
  $$('[data-a]').forEach(s => s.onchange = () => { K.ans[s.dataset.a] = s.value; $$('.optrow').forEach(r => r.classList.toggle('used', Object.values(K.ans).includes(r.dataset.or))); });
  $$('.kopt').forEach(o => o.onclick = e => { if (K.done || e.target.closest('.cross') || e.target.closest('.kw') && K.phase === 'preview') return; const i = o.dataset.q; K.ans[i] = o.dataset.o; $$(`.kopt[data-q="${i}"]`).forEach(x => x.classList.toggle('sel', x === o)); });
  $$('[data-x]').forEach(b => b.onclick = () => b.parentElement.classList.toggle('x'));
  if ($('#lkeys')) $('#lkeys').onclick = () => { $$('.optrow .keys').forEach(k => k.hidden = !k.hidden); };
  $('#lmode').onchange = e => { S.k.mode = e.target.checked ? 'practice' : 'exam'; save(); };
  let pv = 45; K.timer = setInterval(() => { pv--; const el = $('#lprev'); if (!el) return stopK(); el.textContent = pv >= 0 ? '0:' + String(pv).padStart(2, '0') : 'time to listen'; if (pv < 0) el.classList.add('over'); }, 1000);
  $('#lgo').onclick = () => startListening();
  $('#kSub2').onclick = () => { if (K.phase === 'preview' && !K.warnedP){ K.warnedP = true; toast('Listen to the recording first. Press check again to finish anyway.'); return; } finishTest(); };
}
function sentences(t){ return t.match(/[^.!?]+[.!?]*\s*/g) || [t]; }
function startListening(){
  const dr = K.dr; clearInterval(K.timer); K.phase = 'listen';
  $$('#lph span').forEach((s, i) => s.classList.toggle('on', i === 1));
  $('#lins').textContent = 'Listen and answer as you go. Write your answer when the speaker moves to the next point.';
  const cast = castVoices(dr.speakers);
  const units = []; dr.script.forEach((l, li) => sentences(l.x).forEach(s => units.push({ s: l.s, t: s.trim(), li })));
  const practice = S.k.mode === 'practice';
  K.play = { i:0, stop:false, paused:false };
  const P = K.play;
  $('#lgo').hidden = true; if (practice){ $('#lpause').hidden = false; $('#lback').hidden = false; }
  $('#lplay').classList.add('on');
  const step = () => {
    if (P.stop || P.paused) return;
    if (P.i >= units.length){ $('#lplay').classList.remove('on'); $('#lpos').textContent = 'finished'; K.phase = 'check'; $$('#lph span').forEach((s, i) => s.classList.toggle('on', i === 2)); toast('Recording finished. Check your answers, then press Check answers.'); return; }
    const u = units[P.i]; const cv = cast[u.s] || {};
    const ut = new SpeechSynthesisUtterance(u.t); if (cv.v){ ut.voice = cv.v; ut.lang = cv.v.lang; } else ut.lang = 'en-GB';
    ut.pitch = cv.pitch || 1; ut.rate = S.settings.rate;
    ut.onend = () => { P.i++; setTimeout(step, units[P.i] && units[P.i].li !== u.li ? 420 : 120); };
    ut.onerror = () => { P.i++; setTimeout(step, 50); };
    $('#lbar').style.width = (P.i / units.length * 100) + '%'; $('#lpos').textContent = Math.round(P.i / units.length * 100) + '%';
    speechSynthesis.speak(ut);
  };
  $('#lpause').onclick = () => { if (!P.paused){ P.paused = true; speechSynthesis.cancel(); $('#lpause').textContent = 'Resume'; $('#lplay').classList.remove('on'); } else { P.paused = false; $('#lpause').textContent = 'Pause'; $('#lplay').classList.add('on'); step(); } };
  $('#lback').onclick = () => { const was = P.paused; P.paused = true; speechSynthesis.cancel(); P.i = Math.max(0, P.i - 3); setTimeout(() => { P.paused = false; if (was) { $('#lpause').textContent = 'Pause'; } $('#lplay').classList.add('on'); step(); }, 150); };
  speechSynthesis.cancel(); setTimeout(step, 300);
}
function transHTML(dr, res){
  const marks = {}; res.forEach(r => { const li = dr.script.findIndex(l => l.x.includes(r.q.ev)); if (li >= 0) (marks[li] = marks[li] || []).push(r); });
  return `<h2 style="font-size:19px">Transcript</h2>${dr.script.map((l, li) => { let h = esc(l.x); (marks[li] || []).forEach(r => { const e = esc(r.q.ev); h = h.replace(e, `<mark class="ev">${e}<sup>${r.i + 1}</sup></mark>`); });
    return `<p><b class="sp">${esc(l.s)}:</b> ${h}</p>`; }).join('')}
    ${dr.type === 'match' ? `<h2 style="font-size:17px;margin-top:12px">Options and their key words</h2>${dr.opts.map((o, j) => `<p><b>${LET[j]}</b> ${esc(o.x)}<br><span style="color:var(--good);font-weight:700;font-size:14px">${esc(o.keys.join(' · '))}</span></p>`).join('')}` : ''}`;
}


/* ---------- global events ---------- */
function bindSpeak(){ $$('[data-say]').forEach(b => b.onclick = e => { e.stopPropagation(); say(b.dataset.say); }); }
document.addEventListener('click', e => {
  const s = e.target.closest('[data-say]'); if (s) { say(s.dataset.say); return; }
  const st = e.target.closest('[data-star]'); if (st){ const k = st.dataset.star; const i = S.stars.indexOf(k); i >= 0 ? S.stars.splice(i, 1) : S.stars.push(k); st.setAttribute('aria-pressed', i < 0); save(); }
});
$('#openSettings').onclick = openSettings;
route();
</script>
