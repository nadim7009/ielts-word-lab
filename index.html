th, and seedlings drown before their roots can establish themselves. Planting projects often chose these sites because they were empty and easy to reach, and because using them did not involve any argument with farmers over land. In effect, the trees were put where they could not survive."},{"l":"D","x":"A different method, developed by ecologists working in South-East Asia, starts not with trees but with water. Instead of planting, teams study why mangroves disappeared from an area, and they repair the flow of tides, often by breaking holes in the walls of abandoned fish ponds. Once the water moves naturally again, seeds carried by the tide arrive and grow on their own. Where this has been tried, the forests that return tend to be more varied and much more likely to last."},{"l":"E","x":"Cost is part of the argument for this approach. Repairing the flow of water needs engineers and careful surveys at the start, so it can look expensive on paper. But because natural regrowth produces forests that survive, the cost per hectare of forest actually established is often lower than that of planting schemes, in which a large share of the money is spent on trees that die within a year or two."},{"l":"F","x":"Local people decide, in the end, whether any of this lasts. Restored forests have been cut again where villagers saw no benefit from them, and they have survived where communities were paid to protect them or allowed to fish and collect honey there. Some of the most successful projects now begin with meetings in the village rather than with work on the shore, because a forest that nobody values is unlikely to be left alone."}],"headings":["Letting the tide do the planting","The rapid growth of shrimp farming","Success depends on support from residents","Impressive figures that concealed poor results","Disputes between farmers and conservationists","A protective habitat that is disappearing","Long-term savings despite higher starting costs","Seedlings placed where they could not live","New income from forest products"],"qs":[{"p":"A","a":5,"ev":"For coastal villages, this makes the forests a kind of living sea wall.","why":"The paragraph has two parts: what mangroves protect, then how much has been cleared. Heading 'A protective habitat that is disappearing' joins both, 'protective habitat' and 'disappearing'. Heading 'The rapid growth of shrimp farming' is the repeated word trap: shrimp farms are only one reason for clearing, and their growth is not discussed."},{"p":"B","a":3,"ev":"However, when researchers returned to many of these sites a few years later, they found that most of the seedlings had died.","why":"The paragraph praises the large numbers and then turns with 'However' to show most trees died. 'Numbers reported with pride' becomes 'impressive figures', and the deaths are the 'poor results'. The nursery method is detail."},{"p":"C","a":7,"ev":"In effect, the trees were put where they could not survive.","why":"The first sentence says the cause was location, and the last sentence sums it up. Heading 'Disputes between farmers and conservationists' is the trap: farmers are mentioned, but the text says choosing these sites avoided any argument, so there was no dispute."},{"p":"D","a":0,"ev":"Once the water moves naturally again, seeds carried by the tide arrive and grow on their own.","why":"The new method repairs tidal flow and lets seeds arrive naturally instead of planting by hand, so 'letting the tide do the planting' fits. The fish ponds are one example of how the flow is repaired."},{"p":"E","a":6,"ev":"But because natural regrowth produces forests that survive, the cost per hectare of forest actually established is often lower than that of planting schemes, in which a large share of the money is spent on trees that die within a year or two.","why":"The paragraph compares costs: the method looks expensive at the start but costs less per surviving hectare. That is 'long-term savings despite higher starting costs'. Watch the angle: the paragraph does not say the method is simply expensive or simply cheap."},{"p":"F","a":2,"ev":"Local people decide, in the end, whether any of this lasts.","why":"Every sentence is about local communities deciding whether forests survive. Heading 'New income from forest products' is the detail trap: fishing and honey are examples of benefits that persuade villagers, not the main point."}]}},{"n":4,"title":"Speed, order and the example","goal":"Today you will learn when to do headings, how to use the example, and how to keep to about one minute per paragraph.","pages":[{"h":"Headings first or last?","blocks":[{"t":"p","x":"Teachers disagree about this, and both choices can work. Doing headings first gives you a map of the passage: once you know what each paragraph is about, later questions are much faster to locate. Doing them last means you have already read much of the text for other questions, so the main ideas are fresher."},{"t":"p","x":"For most students aiming at band 7.5, a mixed plan works best. Do headings first, but only with a fast reading of each paragraph, and skip any paragraph that is not clear within about ninety seconds. Come back to the skipped ones after the other questions in that passage, when you know the text better and fewer headings remain."},{"t":"tip","x":"Never leave a heading box empty at the end. If you have two paragraphs left and three headings, one guess will usually be right just by elimination."},{"t":"bn","x":"হেডিং আগে করলে পুরো প্যাসেজের একটা ম্যাপ মাথায় থাকে। ভালো উপায় হলো হেডিং আগে করা, কিন্তু কোনো প্যারাগ্রাফে দেড় মিনিটের বেশি লাগলে সেটা ছেড়ে দাও, পরে ফিরে এসো।"}]},{"h":"Make the example work for you","blocks":[{"t":"p","x":"Many headings tasks give one paragraph as an example, with its heading already chosen. The first job is simple: cross that heading out of the list, because it cannot be used again. Students lose marks every year by choosing the example heading for a second paragraph."},{"t":"p","x":"The example also shows you how general the headings in this set are. Read the example paragraph and its heading side by side and notice how much the wording changes. That tells you how far to move from the text when you summarise the other paragraphs."},{"t":"example","q":"Example paragraph: 'Almost all of the data that passes between continents travels not through satellites but through cables lying on the sea floor.' Example heading: 'The hidden backbone of global communication'. What does this tell you about the other headings?","a":"They will be general and use metaphor or abstract words, not the paragraph's own vocabulary.","x":"'Cables on the sea floor' has become 'hidden backbone', and 'data between continents' has become 'global communication'. None of the key words are repeated. So in this set, expect correct headings to look quite different from the text, and treat close word matches with suspicion."},{"t":"trap","x":"Do not skip the example paragraph completely. If it is the first paragraph, it often introduces the topic, and later paragraphs build on it."},{"t":"bn","x":"উদাহরণ হিসেবে যে হেডিং দেওয়া আছে সেটা সাথে সাথে কেটে দাও, ওটা আর ব্যবহার করা যাবে না। উদাহরণ দেখে বোঝো এই সেটের হেডিংগুলো কতটা সাধারণ ভাষায় লেখা।"}]},{"h":"A timing plan","blocks":[{"t":"p","x":"Each reading passage gets about twenty minutes. A headings task of six or seven paragraphs should take about eight to ten minutes, which leaves time for the other questions on the same passage. That means roughly one minute per paragraph on the first pass, with a short second pass for the hard ones."},{"t":"steps","x":["Spend thirty seconds on the headings list: cross out the example and underline the key noun in each heading.","Do each paragraph in order, reading the first sentence, the last sentence and only as much of the middle as you need.","Answer the clear paragraphs at once and mark the unclear ones with a question mark.","After the first pass, look at the headings that are left. Fewer options make the hard paragraphs easier.","Check that you have not used any heading twice."]},{"t":"tip","x":"Write a two or three word label in the margin beside each paragraph, such as 'cause: speed' or 'critics'. You will use these labels again for the other questions on the passage."},{"t":"bn","x":"প্রতি প্যারাগ্রাফে প্রথমবার মোটামুটি এক মিনিট দাও। সহজগুলো আগে শেষ করো, কঠিনগুলো চিহ্ন দিয়ে রাখো। শেষে বাকি হেডিং কম থাকবে, তাই কঠিনগুলো তখন সহজ হয়ে যাবে।"}]}],"drill":{"kind":"R","type":"heading","time":9,"title":"The cables beneath the ocean","instr":"Reading Passage 1 has six paragraphs, A-F. Choose the correct heading for paragraphs B-F from the list of headings below. Example: Paragraph A, The hidden backbone of global communication.","paras":[{"l":"A","x":"Almost all of the data that passes between continents travels not through satellites but through cables lying on the sea floor. There are several hundred of these cables in service, and together they carry the great majority of international internet traffic. Satellites are useful for remote areas and ships, but they cannot match the capacity of a cable, and signals sent through space take longer to arrive."},{"l":"B","x":"The idea is older than most people imagine. The first cable across the Atlantic was completed in 1858 and carried a message from Queen Victoria to the American president. It failed within weeks, partly because engineers had sent too high a voltage through it in an attempt to speed up the signal. A lasting link was not established until 1866, when a stronger cable was laid by the largest ship of the time."},{"l":"C","x":"Modern cables are surprisingly thin. In deep water, where they lie undisturbed, many are no wider than a garden hose. Inside, a few strands of glass fibre carry pulses of light, surrounded by layers of copper, plastic and, near the coast, steel wire. Every fifty to one hundred kilometres a device called a repeater boosts the signal, which would otherwise fade over the long distances involved."},{"l":"D","x":"Laying a cable is slow and expensive work. Specialised ships carry thousands of kilometres of cable in huge tanks and release it at a steady speed while moving across the ocean. Before this begins, survey teams map the sea floor in detail to avoid steep slopes, underwater volcanoes and areas where fishing boats drag their nets. A single route may take several years to plan, although the laying itself can be completed in a few months."},{"l":"E","x":"Once in place, cables are damaged more often than might be expected, with well over a hundred faults reported worldwide in a typical year. Sharks were once blamed for biting them, but the real causes are far more ordinary. Most breaks are caused by fishing equipment and ships' anchors in shallow coastal waters. Natural events such as earthquakes are less frequent, yet they can cut several cables at once and disconnect entire regions."},{"l":"F","x":"Repairing a break is a delicate task. A repair ship must first locate the fault, sometimes by sending light down the fibre and measuring how long it takes to reflect back. The damaged section is then lifted to the surface with a hook, cut out and replaced, and the cable is returned to the sea floor. Because there are only a small number of repair ships in the world, a region may have to wait days or even weeks for help."}],"headings":["Locating and mending damage at sea","The hidden backbone of global communication","What lies inside a modern cable","Animals that attack cables","Ordinary causes of frequent breaks","An early failure followed by a lasting link","Planning a route and placing the cable","Why some regions wait weeks for a connection"],"qs":[{"p":"B","a":5,"ev":"It failed within weeks, partly because engineers had sent too high a voltage through it in an attempt to speed up the signal.","why":"The paragraph tells a short history: a first cable that failed and a stronger one that lasted. The heading needs both parts. The message from Queen Victoria is a detail and is not in any heading."},{"p":"C","a":2,"ev":"Inside, a few strands of glass fibre carry pulses of light, surrounded by layers of copper, plastic and, near the coast, steel wire.","why":"The paragraph describes the size and the layers of a modern cable, and the repeater is one more part of it. 'What lies inside a modern cable' covers this. Nothing here is about damage or laying."},{"p":"D","a":6,"ev":"Before this begins, survey teams map the sea floor in detail to avoid steep slopes, underwater volcanoes and areas where fishing boats drag their nets.","why":"The paragraph covers planning (surveys, years of route planning) and laying (ships releasing cable). Heading 'Planning a route and placing the cable' matches both. Fishing boats appear here only as something to avoid; damage from fishing belongs to paragraph E."},{"p":"E","a":4,"ev":"Sharks were once blamed for biting them, but the real causes are far more ordinary.","why":"Breaks are frequent ('over a hundred') and mostly ordinary (fishing gear, anchors). Heading 'Animals that attack cables' is the trap: sharks are mentioned only to say the belief was wrong."},{"p":"F","a":0,"ev":"A repair ship must first locate the fault, sometimes by sending light down the fibre and measuring how long it takes to reflect back.","why":"Most of the paragraph describes the repair process: find the fault, lift, cut, replace. Heading 'Why some regions wait weeks for a connection' matches only the last sentence about waiting, so it is a detail heading."}]}},{"n":5,"title":"Contrast words and abstract headings","goal":"Today you will learn to handle band 8 and 9 paragraphs, where the main idea turns, hides at the end or is named by an abstract word.","pages":[{"h":"When the paragraph turns","blocks":[{"t":"p","x":"Many hard paragraphs open with one view and then reject it. The writer starts with what people used to think, or what seems true, and then a contrast word arrives: however, but, yet, in fact, in practice, this view has been challenged. The writer's real point is almost always **after the turn**."},{"t":"p","x":"A wrong heading will often be built from the first sentence, the part before the turn. If you read only the opening line, you will choose it. So when you see a contrast word in the middle of a paragraph, read the sentence that follows it carefully and treat it as a possible topic sentence."},{"t":"example","q":"Paragraph: 'Electric scooters were welcomed as a clean way to make short trips. Early studies, however, found that most riders would otherwise have walked or taken the bus, not driven. The scooters therefore did little to reduce car use.' Choose: (i) A green form of transport (ii) Benefits smaller than expected (iii) The popularity of buses","a":"ii","x":"The first sentence gives the hopeful view, and 'however' brings the real point: riders were not former drivers, so the benefit was small. Heading i only repeats the opening claim that the writer goes on to question. Heading iii takes one word from the middle."},{"t":"bn","x":"প্যারাগ্রাফের মাঝখানে however, but, yet, in fact এই শব্দগুলো এলে লেখকের মত সাধারণত ঘুরে যায়। আসল মূল কথা থাকে এই শব্দের পরে, তাই প্রথম লাইন দেখেই হেডিং বেছে নিও না।"}]},{"h":"When the point comes last","blocks":[{"t":"p","x":"Some paragraphs begin with an example, a story or a question and only state the point at the end. Others give two sides, a claim and a reply, and the heading has to cover both. In these paragraphs the first sentence is the worst guide you can use."},{"t":"steps","x":["If the first sentence is a question, an anecdote or a single study, do not treat it as the topic sentence.","Read the last sentence, since it often explains what the example shows.","Look for words like 'therefore', 'this suggests' or 'the lesson is' that signal a conclusion.","If the paragraph presents a view and a reply, pick a heading that mentions both, such as 'a debate' or 'objections and responses'."]},{"t":"tip","x":"Two-part headings, like 'Causes and effects' or 'Early success and later decline', are correct only if both halves are in the paragraph. Check each half separately."},{"t":"bn","x":"কিছু প্যারাগ্রাফ শুরু হয় উদাহরণ বা প্রশ্ন দিয়ে, মূল কথা আসে শেষে। আর যে হেডিংয়ে দুটো অংশ আছে, প্যারাগ্রাফে দুটো অংশই থাকতে হবে, একটা থাকলে হবে না।"}]},{"h":"Abstract headings at band 8 and 9","blocks":[{"t":"p","x":"At the highest level, headings stop describing content and start naming what the paragraph does. You will see words such as a misconception, a reassessment, an unexpected consequence, a paradox or practical applications. To match these, you need to recognise the shape of the paragraph, not its topic."},{"t":"pairs","x":[["Many people believe ... In fact ...","A common misconception"],["Earlier researchers concluded ... but new evidence suggests ...","A reassessment of earlier findings"],["The policy was meant to cut traffic, but it raised house prices.","An unintended side effect"],["The more choice people have, the less satisfied they feel.","A paradox"],["Hospitals and schools now use the method to ...","Practical applications"]]},{"t":"trap","x":"An abstract heading can look vague, so students skip it for a concrete one that repeats a word. At band 8 and 9 level, the vague-looking heading is often the right one."},{"t":"bn","x":"উঁচু লেভেলের হেডিংয়ে থাকে misconception, reassessment, paradox এর মতো বিমূর্ত শব্দ। এগুলো বিষয় না, প্যারাগ্রাফ কী কাজ করছে সেটা বলে। প্যারাগ্রাফের গঠন চিনতে পারলে এগুলো মেলানো সহজ।"}]}],"drill":{"kind":"R","type":"heading","time":14,"title":"Learning that lasts","instr":"Reading Passage 3 has seven paragraphs, A-G. Choose the correct heading for each paragraph from the list of headings below.","paras":[{"l":"A","x":"Most students prepare for examinations by reading their notes again and again, often highlighting key passages as they go. The method feels productive, and surveys of university students consistently find it to be the most popular way of studying. Yet a large body of research suggests that rereading is among the least effective techniques available. Its popularity, psychologists argue, rests on a misunderstanding of how memory actually works."},{"l":"B","x":"The misunderstanding has to do with familiarity. When a page is read for the second or third time, the words are processed more easily, and this ease is mistaken for knowledge. Learners conclude that they have mastered the material because it looks familiar. However, recognising information when it is in front of you is quite different from recalling it in an empty examination hall, and it is recall that tests demand."},{"l":"C","x":"The German psychologist Hermann Ebbinghaus was the first to measure forgetting systematically. In the 1880s he memorised lists of nonsense syllables and tested himself at different intervals, recording how much he had lost. His results showed that most forgetting happens within the first day, after which the rate slows. Less famous, but arguably more useful, was a second finding: material reviewed several times over a number of days was retained far better than material studied for the same total time in a single session."},{"l":"D","x":"Spacing, as this effect is now called, has been confirmed in hundreds of later studies, with learners ranging from young children to medical students. It seems to work because each gap allows a little forgetting, and the effort of bringing the memory back strengthens it. It might be expected that teachers would build their courses around such a reliable finding. In practice, though, few do, partly because spaced learning feels slower and produces worse results in the short term."},{"l":"E","x":"A second technique, retrieval practice, involves testing oneself rather than reviewing. In one well-known type of experiment, two groups study a short text. One group reads it four times; the other reads it once and then tries three times to write down everything it can remember. Five minutes later, the rereading group performs better. When both groups are tested a week later, however, the result is reversed, and those who practised recall remember considerably more."},{"l":"F","x":"Not all researchers are convinced that these findings transfer easily to the classroom. Most experiments use short texts or word lists, whereas real courses involve complex ideas that build on one another. Critics also point out that frequent testing can make anxious students more stressed. Supporters reply that low-stakes quizzes, which do not count towards a final grade, avoid this problem, and that studies in schools have generally produced results similar to those in the laboratory."},{"l":"G","x":"Perhaps the most important lesson concerns students' own judgement. When learners are asked which method helped them most, they usually choose rereading, even after their test scores have shown the opposite. Techniques that feel difficult are taken as signs of failure, when in fact the difficulty is often what makes them work. Teaching students to trust effort rather than ease may therefore matter as much as teaching the techniques themselves."}],"headings":["A method whose benefits appear only later","Why recognising something feels like knowing it","The failure of difficult techniques","A popular habit based on a mistaken belief","Early evidence on how fast we forget and how to slow it","Concerns about classroom use, and a reply","The rapid loss of newly learned information","A reliable technique that is seldom put to use","Learners must learn to value effort over ease","The advantages of reading a text several times"],"qs":[{"p":"A","a":3,"ev":"Its popularity, psychologists argue, rests on a misunderstanding of how memory actually works.","why":"The paragraph turns at 'Yet': rereading is popular but ineffective, and the last sentence says this rests on a misunderstanding. 'Most popular' becomes 'popular habit', and 'misunderstanding' becomes 'mistaken belief'. The surveys are supporting detail."},{"p":"B","a":1,"ev":"Learners conclude that they have mastered the material because it looks familiar.","why":"The paragraph explains the illusion: familiar text feels like knowledge, but recognition is not recall. Heading 'Why recognising something feels like knowing it' describes exactly this. The examination hall is only an image used to make the point, so a heading about exam pressure would be a detail trap."},{"p":"C","a":4,"ev":"Less famous, but arguably more useful, was a second finding: material reviewed several times over a number of days was retained far better than material studied for the same total time in a single session.","why":"Ebbinghaus found two things: how fast forgetting happens and that spread-out review reduces it. Heading 'Early evidence on how fast we forget and how to slow it' is a two-part heading and both halves are present. Heading 'The rapid loss of newly learned information' is the trap: it covers only the first finding, and the writer says the second one is more useful."},{"p":"D","a":7,"ev":"In practice, though, few do, partly because spaced learning feels slower and produces worse results in the short term.","why":"The paragraph confirms that spacing is reliable and then turns with 'In practice, though' to say teachers rarely use it. Heading 'A reliable technique that is seldom put to use' joins both parts. The explanation of why gaps strengthen memory is one sentence of support."},{"p":"E","a":0,"ev":"When both groups are tested a week later, however, the result is reversed, and those who practised recall remember considerably more.","why":"Self-testing loses after five minutes but wins after a week, so its benefits appear later. Heading 'The advantages of reading a text several times' is the trap: rereading does better at five minutes, but 'however' reverses that result, and the paragraph is about retrieval practice."},{"p":"F","a":5,"ev":"Supporters reply that low-stakes quizzes, which do not count towards a final grade, avoid this problem, and that studies in schools have generally produced results similar to those in the laboratory.","why":"The paragraph gives doubts about using the research in schools and then the supporters' answer. Heading 'Concerns about classroom use, and a reply' has both halves, concerns and a reply. A heading about anxious students alone would cover only one criticism."},{"p":"G","a":8,"ev":"Teaching students to trust effort rather than ease may therefore matter as much as teaching the techniques themselves.","why":"The conclusion comes in the last sentence, signalled by 'therefore': learners should trust effort rather than ease. Heading 'The failure of difficult techniques' repeats 'difficult' and 'failure', but the paragraph says difficulty is not failure, which is the opposite of what the heading says."}]}},{"n":6,"title":"Mock test and final checklist","goal":"Today you will do a full headings set under exam conditions and fix a routine you can use on test day.","pages":[{"h":"Your test-day routine","blocks":[{"t":"steps","x":["Spend thirty seconds on the list: cross out the example and underline the key noun in each heading.","For each paragraph, read the first sentence, any sentence after a contrast word, and the last sentence.","Summarise the paragraph in five words before you look at the list.","Run the cover test on your choice: does it fit most of the paragraph, or one sentence?","Skip anything unclear after ninety seconds and return when fewer headings are left.","Check that no heading is used twice and that no box is empty."]},{"t":"tip","x":"Keep to about ten minutes for a seven-paragraph set. If you are still on headings after twelve minutes, guess the remaining ones by elimination and move on."},{"t":"bn","x":"পরীক্ষার দিনে এই ধাপগুলো অনুসরণ করো: উদাহরণ কাটো, প্রথম লাইন, contrast শব্দের পরের লাইন আর শেষ লাইন পড়ো, পাঁচ শব্দে সারাংশ বানাও। দশ মিনিটের বেশি সময় দিও না।"}]},{"h":"Final checklist","blocks":[{"t":"pairs","x":[["The heading shares a rare word with the paragraph","Check it twice; it may be a trap"],["The heading fits one example","Detail heading; cross it out"],["The paragraph contains 'however' or 'in fact'","Read after the turn"],["The heading has two parts","Both parts must be in the paragraph"],["The heading fits every paragraph","Too general; reject it"]]},{"t":"trap","x":"Changing a correct answer at the last minute because another heading 'also seems possible' costs many marks. Change an answer only if you find a clear reason in the text."},{"t":"bn","x":"শেষবার মিলিয়ে নাও: একই শব্দ মানেই সঠিক না, ডিটেইল হেডিং বাদ, contrast শব্দের পরে পড়ো, দুই অংশের হেডিংয়ে দুটোই থাকতে হবে। কোনো স্পষ্ট কারণ ছাড়া উত্তর বদলাবে না।"}]},{"h":"Staying calm with headings","blocks":[{"t":"p","x":"Headings feel frightening because the answer is never written in the text. But you now have a method that does not depend on luck: find the main idea, translate it into general words, and test each heading against the whole paragraph. Students who follow these steps calmly usually score well above those who rely on word matching."},{"t":"p","x":"If you freeze on a paragraph, that is normal. Skip it, finish the others, and come back with fewer headings left. Elimination is a real exam skill, not cheating."},{"t":"bn","x":"হেডিং দেখে ভয় পাওয়ার কিছু নেই। তোমার কাছে এখন একটা নিয়ম আছে: মূল কথা খোঁজো, সাধারণ ভাষায় বলো, পুরো প্যারাগ্রাফের সাথে মিলিয়ে দেখো। আটকে গেলে পরের প্যারাগ্রাফে চলে যাও।"}]}],"drill":{"kind":"R","type":"heading","time":12,"title":"Cooling the city","instr":"Reading Passage 2 has seven paragraphs, A-G. Choose the correct heading for each paragraph from the list of headings below.","paras":[{"l":"A","x":"On a still summer evening, the centre of a large city can be several degrees warmer than the farmland around it. This difference, known as the urban heat island effect, was first described in the early nineteenth century by a scientist recording temperatures in and around London. What was once a curiosity has become a serious concern, since heatwaves are becoming more frequent and the share of the world's population living in cities continues to rise."},{"l":"B","x":"The causes are well understood. Dark surfaces such as asphalt and roofing materials absorb sunlight during the day and release the heat slowly at night. Tall buildings trap this warmth and block the winds that would otherwise carry it away. Vehicles, air conditioners and factories add heat of their own. Above all, cities have replaced vegetation, which cools the air as water evaporates from leaves, with hard surfaces that stay dry."},{"l":"C","x":"The effects are not shared equally. Within a single city, temperatures can vary sharply from one district to another, and the hottest areas are often the poorest. These neighbourhoods tend to have fewer parks and trees, more densely packed housing and residents who are less likely to own air conditioning. Elderly people living alone are at particular risk, and studies of past heatwaves have found that deaths were concentrated in exactly these parts of the city."},{"l":"D","x":"One response is to change the colour of the city. Painting roofs white or covering them with reflective materials can lower the surface temperature of a roof by more than twenty degrees on a sunny day, and the buildings beneath need less cooling. Several cities now require reflective roofs on new buildings. The approach has limits, however. Light-coloured pavements can reflect heat onto pedestrians, making streets feel hotter at head height, and white surfaces lose their effect as they get dirty."},{"l":"E","x":"Trees offer a different kind of solution. A mature tree shades the ground and cools the surrounding air through evaporation, and streets lined with trees can be noticeably cooler than open streets nearby. One South American city planted trees and shrubs along busy roads and waterways and reported that temperatures in those corridors fell by around two degrees. Yet trees take decades to reach full size, need water during droughts and compete for space with pipes, cables and parking."},{"l":"F","x":"Some planners argue that the most effective changes are made before a district is built. The direction of streets, the spacing of buildings and the placement of open spaces all affect how air moves through a neighbourhood. Older cities in hot, dry regions, with their narrow shaded lanes and inner courtyards, kept residents comfortable long before mechanical cooling existed. Modern developments that copy these principles have been shown to need far less energy for air conditioning."},{"l":"G","x":"None of these measures, on its own, will keep cities comfortable as the climate warms. Researchers now stress the importance of combining approaches and of measuring their results street by street, using networks of cheap sensors rather than a single weather station at an airport. Such data allow councils to see where money will do the most good. They also shift attention from the average temperature of a city to the conditions in which its residents actually live."}],"headings":["Lighter surfaces: useful but not perfect","Health risks for older people","Why built-up areas hold on to heat","Planning cooler districts from the start","An old observation that now needs urgent attention","The disappearance of traditional courtyards","Greenery as a slow but effective remedy","Combining solutions and measuring them locally","Unequal exposure within one city","The first scientist to study London's weather"],"qs":[{"p":"A","a":4,"ev":"What was once a curiosity has become a serious concern, since heatwaves are becoming more frequent and the share of the world's population living in cities continues to rise.","why":"The paragraph moves from an early nineteenth-century description to a present-day concern, which is 'an old observation that now needs urgent attention'. Heading 'The first scientist to study London's weather' is the trap: the London scientist is one detail, and the text says he was the first to describe the heat island effect, not the first to study London's weather."},{"p":"B","a":2,"ev":"The causes are well understood.","why":"The topic sentence announces causes, and each sentence after it gives one: dark surfaces, tall buildings, machines, loss of plants. Heading 'Why built-up areas hold on to heat' names this. Plants and evaporation appear only as the last cause, so a heading about greenery belongs to E."},{"p":"C","a":8,"ev":"Within a single city, temperatures can vary sharply from one district to another, and the hottest areas are often the poorest.","why":"'Not shared equally' and 'within a single city' point to 'unequal exposure within one city'. Heading 'Health risks for older people' is the detail trap: elderly people are one group at risk, mentioned in one sentence."},{"p":"D","a":0,"ev":"The approach has limits, however.","why":"Reflective roofs work, but after 'however' the writer lists problems. Heading 'Lighter surfaces: useful but not perfect' covers both the benefit and the limits. A heading about building rules would match only the third sentence."},{"p":"E","a":6,"ev":"Yet trees take decades to reach full size, need water during droughts and compete for space with pipes, cables and parking.","why":"Trees cool streets (effective), but 'Yet' introduces the slow growth and other demands (slow). Heading 'Greenery as a slow but effective remedy' has both parts. Compare D: both paragraphs have a benefit and a limit, so check the topic words, 'lighter surfaces' against 'greenery'."},{"p":"F","a":3,"ev":"Some planners argue that the most effective changes are made before a district is built.","why":"The paragraph argues for designing districts to stay cool from the beginning, using older cities as evidence. Heading 'The disappearance of traditional courtyards' repeats 'courtyards', but the paragraph does not say courtyards are disappearing; it says modern developments copy them."},{"p":"G","a":7,"ev":"Researchers now stress the importance of combining approaches and of measuring their results street by street, using networks of cheap sensors rather than a single weather station at an airport.","why":"The first sentence says no single measure is enough, and the second gives the two-part answer: combine approaches and measure locally. Heading 'Combining solutions and measuring them locally' has both. The airport weather station is a detail used for contrast."}]}}]},{"id":"rinfo","skill":"R","title":"Matching information","bn":"তথ্য মেলানো: কোন অনুচ্ছেদে কোন তথ্য","why":"Students lose marks here because the answers jump around the passage and the statements describe a kind of information rather than a topic, so they match words instead of meaning. This course gives you a clear method, practice with paraphrase and traps, and a timing plan so you can finish the set calmly.","days":[{"n":1,"title":"How this question type works","goal":"Today you will learn what matching information questions look like in the real test and use a simple method to answer them.","pages":[{"h":"What you see on the exam paper","blocks":[{"t":"p","x":"The passage has paragraphs labelled with letters, for example A to G. Below it you get a list of statements, usually four to seven, and you write the letter of the paragraph that contains each piece of information. The instruction always begins with the question **Which paragraph contains the following information?** and it can appear with any of the three passages."},{"t":"p","x":"The big difference from most other question types is order. True, False, Not Given questions and gap fills usually follow the passage from start to finish. Here the answers are **not in passage order**: question 1 might be in paragraph E and question 2 in paragraph A. This is the main reason the task feels hard and slow."},{"t":"tip","x":"Read the NB line under the instruction. 'You may use any letter more than once' means one paragraph can hold two answers. It often also means that some paragraphs will not be used at all."},{"t":"bn","x":"এই প্রশ্নে প্রতিটা statement পড়ে তোমাকে বলতে হবে কোন অনুচ্ছেদে (A, B, C...) তথ্যটা আছে। উত্তরগুলো প্যাসেজের ক্রম মেনে আসে না, তাই উপর থেকে নিচে একবার পড়ে সব পাওয়া যায় না। একটা অক্ষর দুইবার আসতে পারে, আবার কিছু অনুচ্ছেদ একদম ব্যবহার না-ও হতে পারে।"}]},{"h":"Statements describe a type of information","blocks":[{"t":"p","x":"A statement does not summarise a paragraph. It points to one small piece of information and tells you what kind of information it is. Most statements start with a label such as 'an example of', 'a reference to', 'a reason for', 'a comparison between', 'a description of' or 'a prediction about'."},{"t":"p","x":"Think of each statement as two parts: the type word and the content. In 'a reason why a bridge was closed', the type is a reason and the content is the closing of a bridge. You need a sentence that matches both parts."},{"t":"pairs","x":[["In Lima, for instance, several schools now collect their own water.","an example of"],["The project failed because the pumps kept breaking.","a reason for"],["Steel nets caught twice as much water as plastic ones.","a comparison between"],["Demand will probably double by 2040.","a prediction about"],["The device consists of a metal frame and a fine net.","a description of"]]},{"t":"trap","x":"Do not choose a paragraph just because its general topic matches the statement. A paragraph about costs may not contain 'a comparison of costs'. Find the exact sentence that does the job the type word describes."},{"t":"bn","x":"প্রতিটা statement-এর দুইটা অংশ থাকে: তথ্যের ধরন (উদাহরণ, কারণ, তুলনা, ভবিষ্যদ্বাণী) আর বিষয়। শুধু বিষয় মিললে হবে না, ধরনটাও মিলতে হবে। যেমন 'a comparison' চাইলে লেখায় দুইটা জিনিস পাশাপাশি রাখা থাকতে হবে।"}]},{"h":"How it differs from matching headings","blocks":[{"t":"p","x":"Many students mix this task up with matching headings. A heading describes the main idea of a whole paragraph. A matching information statement can describe one line in the middle of a paragraph, even a line that has nothing to do with the paragraph's main idea."},{"t":"example","q":"Which paragraph contains a reference to the size of a standard collector? (B: '... A standard collector measuring 40 square metres can produce around 200 litres on a good day ...' E: '... threads which are too thick block the wind ...')","a":"B","x":"The statement asks about size, so the student scans for a number with a unit of area. Paragraph B is mainly about how the equipment works, but its last sentence gives '40 square metres'. E talks about thread thickness, which is also a kind of size, but it is not the size of a collector."},{"t":"tip","x":"So, read the whole paragraph, not only its first sentence. With headings, the first sentence often helps. With this task, the answer is often in the middle or at the end."}]},{"h":"A first method you can trust","blocks":[{"t":"steps","x":["If the passage has other question sets, do those first. You will already know roughly what each paragraph says.","Underline the type word and one or two content words in every statement.","Start with statements that contain a name, a number, a date or a specific noun. Scan for them.","When you find a likely sentence, read it carefully and check that it really is the type the statement asks for.","Write the letter, tick the paragraph lightly on the passage, and move to the next statement.","Leave the hardest statement until last and never leave a box blank."]},{"t":"tip","x":"Plan about one minute per statement. For a set of six, give yourself six to eight minutes. If one statement takes more than two minutes, guess, mark it and come back if you have time."},{"t":"bn","x":"সময় বাঁচাতে নাম, সংখ্যা, সাল এরকম সহজে চোখে পড়া শব্দ দিয়ে শুরু করো। কঠিন statement শেষে করো। প্রতিটা প্রশ্নে মোটামুটি এক মিনিট রাখো, আর কোনো ঘর ফাঁকা রেখো না।"}]}],"drill":{"kind":"R","type":"info","time":10,"title":"Catching water from fog","instr":"Reading Passage 1 has six paragraphs, A-F. Which paragraph contains the following information? Write the correct letter, A-F, next to each statement. NB You may use any letter more than once.","paras":[{"l":"A","x":"On the hills above some of the driest coastlines on Earth, a thin grey cloud rolls in from the sea most mornings and then disappears without leaving a drop of rain. In parts of northern Chile, southern Peru and the Atlantic coast of Morocco, annual rainfall can be lower than 50 millimetres, yet the air is often thick with fog for more than half the year. For centuries this moisture was regarded as part of the scenery rather than a resource. Since the 1980s, however, small research teams have been testing whether it can be collected on a scale large enough to supply villages."},{"l":"B","x":"The basic equipment is surprisingly simple. A fine mesh, usually made of polypropylene, is stretched between two poles and placed at right angles to the wind. As fog drifts through, tiny droplets strike the threads, join together and run down into a gutter at the base, from which a pipe carries the water to a storage tank. A standard collector measuring 40 square metres can produce around 200 litres on a good day, although the amount varies greatly with wind speed and the density of the fog."},{"l":"C","x":"The best-known early project began in 1987 near the fishing village of Chungungo in Chile. Around 100 collectors were installed on a ridge, and for several years they supplied the village with more water than the lorries that had previously delivered it. The scheme eventually collapsed, though. Villagers had not been trained to repair the nets, and once the community was connected to a pipeline in the early 2000s, nobody saw a reason to maintain the collectors. Researchers now cite Chungungo as evidence that the social side of a project matters as much as the engineering."},{"l":"D","x":"In south-west Morocco, an organisation called Dar Si Hmad took a different approach. Local people, many of them women who had previously spent hours each day carrying water from distant wells, were involved from the planning stage and taught to maintain the system themselves. Monitoring is partly done through mobile phones: if a pipe breaks, residents send a text message and a technician is notified. The cost of the water, roughly the same as what families had paid before, is shared among households according to how much each one uses."},{"l":"E","x":"Meanwhile, laboratory work has focused on improving the mesh itself. Engineers at several universities have found that threads which are too thick block the wind, so the fog simply flows around the net, while threads which are too thin let droplets pass straight through. A team at MIT reported in 2013 that a coated stainless-steel mesh could capture up to five times more water than the standard polypropylene material. The coating helps droplets slide off quickly, before the wind can blow them away again."},{"l":"F","x":"Whether fog collection has a long-term future is uncertain. Some climate models suggest that warming oceans could reduce the frequency of coastal fog in certain regions, which would make investment in collectors riskier. Others argue that fog nets will remain useful because they need no fuel and are cheap to build and repair once local people have the skills. For now, most experts see them as an addition to other water sources rather than a replacement for them."}],"qs":[{"s":"a reference to how people report damage to the system","a":"D","ev":"Monitoring is partly done through mobile phones: if a pipe breaks, residents send a text message and a technician is notified.","why":"'Report damage' is a paraphrase of 'if a pipe breaks, residents send a text message'. Paragraph C talks about nets that were not repaired, but it says nothing about how anyone reported a problem."},{"s":"a comparison between two materials used to make nets","a":"E","ev":"A team at MIT reported in 2013 that a coated stainless-steel mesh could capture up to five times more water than the standard polypropylene material.","why":"Two materials are compared ('five times more water than'). Polypropylene is also named in B, but B only describes one material, so there is no comparison there."},{"s":"a description of how water moves from the net to a container","a":"B","ev":"As fog drifts through, tiny droplets strike the threads, join together and run down into a gutter at the base, from which a pipe carries the water to a storage tank.","why":"'Container' is the storage tank, and the sentence follows the water step by step. E mentions droplets sliding off the mesh, but it does not describe where the water goes."},{"s":"a reference to the amount of rain some regions receive","a":"A","ev":"In parts of northern Chile, southern Peru and the Atlantic coast of Morocco, annual rainfall can be lower than 50 millimetres, yet the air is often thick with fog for more than half the year.","why":"The number '50 millimetres' and the word 'rainfall' make this easy to scan. B also has numbers (40 square metres, 200 litres), but they are about water collected, not rain."},{"s":"a reason why an early fog-collection scheme was abandoned","a":"C","ev":"Villagers had not been trained to repair the nets, and once the community was connected to a pipeline in the early 2000s, nobody saw a reason to maintain the collectors.","why":"'Abandoned' matches 'collapsed' and 'nobody saw a reason to maintain'. F talks about risk to future schemes, which is a prediction, not a reason for a past failure."},{"s":"a mention of how the price of water is divided between families","a":"D","ev":"The cost of the water, roughly the same as what families had paid before, is shared among households according to how much each one uses.","why":"'Price' paraphrases 'cost' and 'divided between families' paraphrases 'shared among households'. This is the second answer in D, which is why the instructions say a letter may be used more than once. F says nets are cheap to build, but that is not about how families share a price."}]}},{"n":2,"title":"Paraphrase and keyword spotting","goal":"Today you will learn to spot which words in a statement will be paraphrased and which ones you can scan for directly.","pages":[{"h":"Two kinds of keyword","blocks":[{"t":"p","x":"Every statement has words that the passage will change and words it usually keeps. Names of people and places, dates, numbers and technical terms are hard to paraphrase, so they normally appear in the passage exactly as written. Ordinary words like 'problem', 'reduce' or 'members of the public' are almost always changed."},{"t":"p","x":"Use this difference. If a statement contains a name or a number, scan for it first because it is quick. If it contains only ordinary words, think of two or three possible paraphrases before you look at the passage."},{"t":"example","q":"Statement: a reference to experts from different fields studying something together. Passage: 'A committee of a zoologist, a geologist and an archaeologist studied them together.'","a":"The paragraph containing that sentence","x":"The statement has no names or numbers, so a strong student expects paraphrase. 'Experts from different fields' is turned into a list of three job titles. The student does not search for the word 'expert' but for a group of people with different specialities."},{"t":"bn","x":"নাম, সাল, সংখ্যা সাধারণত প্যাসেজে একই রকম থাকে, তাই এগুলো খোঁজা সহজ। কিন্তু সাধারণ শব্দ প্রায় সবসময় অন্যভাবে লেখা থাকে। তাই প্যাসেজে যাওয়ার আগে ভেবে নাও শব্দটা অন্য কীভাবে লেখা হতে পারে।"}]},{"h":"How type words are paraphrased","blocks":[{"t":"p","x":"The type word itself almost never appears in the passage. The writer does not say 'here is an example'. You have to recognise the signal that does the same job."},{"t":"pairs","x":[["for instance / such as / in one case","an example of"],["because / as a result / this is why / so","a reason for / an explanation of"],["whereas / unlike / more than / in the same way","a comparison between"],["is likely to / could / by 2040 / in future","a prediction about"],["critics point out / not everyone agrees","a criticism of"],["consists of / works by / is made from","a description of"]]},{"t":"tip","x":"When you read a paragraph for the first time, notice these signal words. 'Because', 'whereas' and 'for instance' often mark the exact sentence the examiner has turned into a statement."}]},{"h":"How content words are paraphrased","blocks":[{"t":"p","x":"Content words change in three common ways: a synonym ('price' for 'cost'), a general word for a specific one ('religious buildings' for 'temples and mosques') or a whole idea in new words ('stocks declined' for 'the fish became hard to find'). The second and third kinds cause the most mistakes."},{"t":"pairs","x":[["temples, churches and mosques","religious buildings"],["the fish became hard to find","stocks declined"],["ordinary residents with a smartphone","members of the public"],["the readings were wrong by up to 30 per cent","inaccurate results"],["split between the three villages","divided among communities"]]},{"t":"trap","x":"If you find the exact word from the statement in a paragraph, be careful. Examiners often place the same word in a wrong paragraph and paraphrase it in the right one. A word match is a reason to check, not a reason to answer."},{"t":"bn","x":"প্যাসেজে statement-এর হুবহু শব্দ পেলে খুশি হয়ে উত্তর লিখে ফেলো না। অনেক সময় একই শব্দ ভুল অনুচ্ছেদে রাখা থাকে, আর সঠিক অনুচ্ছেদে কথাটা অন্যভাবে বলা থাকে। অর্থ মিলছে কিনা দেখো।"}]},{"h":"Scanning without reading everything","blocks":[{"t":"steps","x":["Decide what the target looks like: a capital letter, a digit, a word in quotation marks or a technical term.","Move your eyes quickly down the middle of each paragraph looking only for that shape.","When you find it, stop and read the full sentence and the sentence after it.","Check the type word: is this sentence really a reason, an example or a comparison?"]},{"t":"tip","x":"Digits and capital letters stand out on the page, so scanning for them is two or three times faster than scanning for an ordinary word. Use them first whenever a statement allows it."}]}],"drill":{"kind":"R","type":"info","time":10,"title":"Reading the rubbish of the past","instr":"Reading Passage 1 has six paragraphs, A-F. Which paragraph contains the following information? Write the correct letter, A-F, next to each statement. NB You may use any letter more than once.","paras":[{"l":"A","x":"Archaeologists have a long-standing joke that the most valuable thing a past society can leave behind is its rubbish. Palaces and temples tell us how rulers wished to be remembered, but heaps of discarded shells, bones, broken pots and ash record what ordinary people actually ate, used and threw away. These deposits, known as middens, are found on every inhabited continent, and some have been growing, layer by layer, for thousands of years."},{"l":"B","x":"Shell middens along the coasts of Denmark, first examined in detail in the 1840s, were among the earliest to attract scientific attention. A committee of a zoologist, a geologist and an archaeologist studied them together, which was an unusual arrangement at the time. Their joint report concluded that the mounds had been built up by people rather than by natural processes, a point that had been fiercely disputed. This collaboration is often regarded as one of the first examples of an interdisciplinary approach in archaeology."},{"l":"C","x":"Because middens accumulate gradually, they allow researchers to follow changes in diet across long periods. At one site on the coast of South Africa, the shells in the lower layers come mainly from large limpets, whereas the upper layers contain far smaller ones. The most likely explanation is that people collected so heavily that the larger animals became scarce, forcing them to accept less rewarding food. In this sense, the midden is a record of overharvesting long before the term existed."},{"l":"D","x":"Dating a midden is not always straightforward. Radiocarbon dates taken from marine shells can appear several hundred years older than they really are, because seawater contains carbon that has been out of contact with the atmosphere for a long time. To correct for this, researchers compare shells with charcoal from the same layer. Burrowing animals present a second difficulty: rabbits and crabs can move objects between layers, so a single item found in the wrong place should not be trusted on its own."},{"l":"E","x":"The same methods have been applied to modern waste. From 1973, a team at the University of Arizona sorted and recorded household rubbish from the city of Tucson. One of its findings surprised many people: residents' answers to questionnaires about their own drinking habits greatly underestimated the number of beer cans that later turned up in their bins. The researchers argued that rubbish offers a more honest account of behaviour than people's descriptions of themselves."},{"l":"F","x":"Many middens are now under threat. Rising sea levels and stronger storms are eroding coastal sites faster than archaeologists can record them, and in some places shell mounds were dug up in the twentieth century to make lime for agriculture and road building. Several countries have begun training volunteers to photograph and report eroding sites, on the reasoning that a quick record made by a local walker is better than no record at all."}],"qs":[{"s":"an explanation of why one dating method can give misleading results","a":"D","ev":"Radiocarbon dates taken from marine shells can appear several hundred years older than they really are, because seawater contains carbon that has been out of contact with the atmosphere for a long time.","why":"'Misleading results' paraphrases 'appear several hundred years older than they really are', and 'because' gives the explanation. Dates appear in B and E too (1840s, 1973), but those are simply dates, not a dating method."},{"s":"a contrast between what people say they do and what they really do","a":"E","ev":"residents' answers to questionnaires about their own drinking habits greatly underestimated the number of beer cans that later turned up in their bins.","why":"'What people say' is the questionnaire answers and 'what they really do' is the beer cans in the bins. A also contrasts two things (palaces and rubbish), but that is about rulers' image, not people describing their own behaviour."},{"s":"evidence that people may have reduced the supply of a food source","a":"C","ev":"The most likely explanation is that people collected so heavily that the larger animals became scarce, forcing them to accept less rewarding food.","why":"'Reduced the supply' paraphrases 'the larger animals became scarce'. The word 'may' in the statement matches 'the most likely explanation'. A mentions what people ate, but gives no sign of a falling supply."},{"s":"a comparison between what buildings and rubbish can tell us about the past","a":"A","ev":"Palaces and temples tell us how rulers wished to be remembered, but heaps of discarded shells, bones, broken pots and ash record what ordinary people actually ate, used and threw away.","why":"'Buildings' is a general word for 'palaces and temples', and 'but' sets up the comparison. E compares two sources of information too, but neither of them is a building."},{"s":"a reason why the position of an object in a site may be unreliable","a":"D","ev":"Burrowing animals present a second difficulty: rabbits and crabs can move objects between layers, so a single item found in the wrong place should not be trusted on its own.","why":"'Position of an object' matches 'a single item found in the wrong place', and the reason is the burrowing animals. D is used twice in this set. Students who refuse to reuse a letter often write C here because it also talks about layers."},{"s":"a mention of members of the public helping to record sites at risk","a":"F","ev":"Several countries have begun training volunteers to photograph and report eroding sites, on the reasoning that a quick record made by a local walker is better than no record at all.","why":"'Members of the public' paraphrases 'volunteers' and 'a local walker', and 'record sites at risk' paraphrases 'photograph and report eroding sites'. B mentions experts working together, but they were scientists, not the public, so B is a trap built on the idea of collaboration."}]}},{"n":3,"title":"Distractors and common traps","goal":"Today you will learn the four traps examiners use in this task and how to check your answer before you write it.","pages":[{"h":"The word that sits in the wrong place","blocks":[{"t":"p","x":"The most common trap is a repeated word. The statement mentions air conditioning, and two paragraphs mention it. Only one of them gives the information the statement describes. Students who stop at the first match lose the mark."},{"t":"example","q":"Statement: a reference to a building that became cooler without air conditioning. Paragraph C: 'The library installed air conditioning in 2010, and summer temperatures inside fell by six degrees.' Paragraph F: 'After trees were planted around the old school, classrooms were about three degrees cooler, even though no cooling system had been added.'","a":"F","x":"C shares more words with the statement: 'air conditioning' and a fall in temperature. But the statement has a second condition, 'without air conditioning'. Only F describes cooling with no machine, so F is correct even though it never uses the words 'air conditioning'."},{"t":"trap","x":"When two paragraphs look possible, do not choose by feeling. Go back to the statement and find the one detail that only the correct paragraph contains."}]},{"h":"Right topic, wrong type","blocks":[{"t":"p","x":"The second trap is a paragraph that talks about the right topic but gives the wrong type of information. If the statement asks for 'a comparison of costs', a paragraph that says something was 'cheap' is not enough, because nothing is compared. If it asks for 'a reason', a paragraph that only describes the event is not enough."},{"t":"pairs","x":[["Fog nets are cheap to build.","NOT a comparison of cost (only one thing)"],["A net costs less than one month of lorry deliveries.","a comparison of cost (two things)"],["The bridge was closed in 2019.","NOT a reason (only the result)"],["Cracks had appeared in the main supports.","a reason why the bridge was closed"]]},{"t":"bn","x":"বিষয় মিললেও তথ্যের ধরন না মিললে উত্তর ভুল। 'cheap' বললেই সেটা তুলনা হয় না, তুলনার জন্য দুইটা জিনিস লাগে। আবার কী ঘটেছে বললেই সেটা কারণ হয় না, কেন ঘটেছে সেটা থাকতে হবে।"}]},{"h":"Who, where and when","blocks":[{"t":"p","x":"The third trap changes one small detail: who did something, where it happened or when. A paragraph may describe people judging a sound differently, but the statement may ask about differences that depend on place, while the paragraph is about differences between listeners. Read the small words in the statement: 'by researchers', 'in different places', 'early', 'later'."},{"t":"tip","x":"Ask three quick questions before you write a letter: who is it about, where is it, and when is it? If any answer does not match, keep looking."},{"t":"trap","x":"'An early scheme' and 'a recent study' are details that matter. If the passage describes two projects, one from 1987 and one from today, the time word in the statement decides between them."}]},{"h":"Repeated letters and unused paragraphs","blocks":[{"t":"p","x":"The fourth trap is in your own head. Many students believe each letter can be used only once, so when they find a second answer in a paragraph they have already used, they reject it and choose a weaker paragraph. The instruction tells you the opposite."},{"t":"p","x":"Expect at least one paragraph to be unused and, in many sets, one paragraph to be used twice. Long paragraphs full of detail are the most likely to hold two answers. A short paragraph that only introduces the topic is often the one left unused."},{"t":"bn","x":"একই অক্ষর দুইবার আসতে পারে, এটা নির্দেশনাতেই বলা থাকে। তাই কোনো অনুচ্ছেদ আগে ব্যবহার করেছ বলে সঠিক উত্তর বাদ দিও না। আর সব অনুচ্ছেদ ব্যবহার করতেই হবে, এমনও না।"}]}],"drill":{"kind":"R","type":"info","time":12,"title":"Listening to the city","instr":"Reading Passage 1 has seven paragraphs, A-G. Which paragraph contains the following information? Write the correct letter, A-G, next to each statement. NB You may use any letter more than once.","paras":[{"l":"A","x":"For most of the twentieth century, city sound was studied almost entirely as a problem. Engineers measured noise in decibels, governments set maximum limits for traffic and factories, and success was judged by how far the numbers came down. This approach brought real benefits, particularly near airports and motorways. Yet it treated every sound as unwanted, and it had little to say about why some busy places feel pleasant while some quiet ones feel uncomfortable."},{"l":"B","x":"The idea of a soundscape, the whole acoustic environment as people experience it, was developed in the late 1960s by the Canadian composer R. Murray Schafer. Schafer and his students recorded the sounds of towns and villages and classified them, distinguishing, for instance, between the steady background hum of a place and the signals, such as church bells or horns, that people actively notice. He argued that each community had characteristic sounds worth protecting, in the same way that historic buildings are protected."},{"l":"C","x":"Later research tested these ideas with questionnaires and laboratory experiments. In a typical study, volunteers listen to recordings from different public spaces and rate them on scales such as 'pleasant to annoying' and 'calm to chaotic'. A consistent finding is that loudness explains only part of people's reactions. The type of sound matters at least as much: at the same decibel level, running water and birdsong are rated far more positively than traffic, and the sound of human voices is judged acceptable in a market but irritating in a library."},{"l":"D","x":"Planners have begun to use these findings. Rather than trying to remove traffic noise entirely, which is often impossible in a dense city, some designers add sounds that people prefer. A fountain placed at the edge of a small square, for example, does not make the square quieter on a sound meter, but it draws attention away from passing cars. In one Swedish study, visitors to a park near a motorway described it as calmer after a water feature was installed, even though the measured noise level had risen slightly."},{"l":"E","x":"The health argument for this work is strong. Long-term exposure to traffic noise, especially at night, has been linked to disturbed sleep and higher blood pressure, and the World Health Organization estimates that it costs Western Europe over a million healthy years of life annually. Researchers are careful to point out, however, that a pleasant soundscape does not cancel these effects. A fountain may make a square feel calmer by day, but it does nothing for a resident whose bedroom window faces a busy road at three in the morning."},{"l":"F","x":"Mapping the sound of a whole city is a further challenge. Official noise maps, required in the European Union since 2002, are produced mainly by computer models based on traffic data rather than by actual recordings. To fill the gaps, several projects now invite residents to record and rate sounds using a smartphone app. The results are less precise than professional measurements, but they show which places people value, such as a quiet courtyard behind a shopping street, which an official map would simply mark as low noise."},{"l":"G","x":"Not everyone is convinced. Critics point out that most soundscape studies have been carried out with small groups of university students in a handful of European cities, and that ideas of a pleasant sound vary between cultures and age groups. Temple bells, the calls of street sellers or the noise of children playing may be welcome to one listener and a nuisance to another. Designing for an average listener, they argue, risks removing the very sounds that give particular neighbourhoods their identity."}],"qs":[{"s":"an example of a change that made a place seem quieter although it became louder","a":"D","ev":"In one Swedish study, visitors to a park near a motorway described it as calmer after a water feature was installed, even though the measured noise level had risen slightly.","why":"'Seem quieter' is 'described it as calmer' and 'became louder' is 'the measured noise level had risen'. E also mentions a fountain making a square feel calmer, but it does not say the noise increased, and the point of E is health."},{"s":"a reference to a weakness in the choice of people used in research","a":"G","ev":"Critics point out that most soundscape studies have been carried out with small groups of university students in a handful of European cities, and that ideas of a pleasant sound vary between cultures and age groups.","why":"The weakness is that the participants were a narrow group. C also mentions volunteers in studies, which is the trap, but C reports the results and does not criticise who was chosen."},{"s":"a comparison between protecting sounds and protecting architecture","a":"B","ev":"He argued that each community had characteristic sounds worth protecting, in the same way that historic buildings are protected.","why":"'Architecture' paraphrases 'historic buildings' and 'in the same way' signals the comparison. G talks about sounds that give neighbourhoods identity, which feels close, but it makes no comparison with buildings."},{"s":"a warning that a pleasant sound environment cannot prevent physical harm","a":"E","ev":"Researchers are careful to point out, however, that a pleasant soundscape does not cancel these effects.","why":"'Cannot prevent physical harm' paraphrases 'does not cancel these effects', where the effects are disturbed sleep and higher blood pressure. D praises the fountain, which is the opposite message."},{"s":"an estimate of the scale of a health problem","a":"E","ev":"the World Health Organization estimates that it costs Western Europe over a million healthy years of life annually.","why":"This is the second answer in E. Many students skip E here because they have already used it. A has numbers and limits too, but those are noise limits, not the size of a health problem."},{"s":"a mention of information that official sources tend to miss","a":"F","ev":"The results are less precise than professional measurements, but they show which places people value, such as a quiet courtyard behind a shopping street, which an official map would simply mark as low noise.","why":"The app data show places people value, which an official map would miss. A describes the official approach of earlier engineers, but it does not compare it with any other source of information."},{"s":"an example of a sound that people judge differently depending on where they hear it","a":"C","ev":"the sound of human voices is judged acceptable in a market but irritating in a library.","why":"The difference depends on place (market or library). G is the trap: there the same sound is judged differently by different listeners, not in different locations. Always check what the difference depends on."}]}},{"n":4,"title":"Speed and time management","goal":"Today you will learn how to fit this question set into your 20 minutes per passage without rushing the other questions.","pages":[{"h":"Do this set after the others","blocks":[{"t":"p","x":"If a passage has matching information together with other question types, leave the matching set until the end. Questions like sentence completion or True, False, Not Given go in passage order, so they make you read the passage from top to bottom. By the time you finish them, you already know what most paragraphs say."},{"t":"steps","x":["Read the matching statements quickly before anything else, so they stay in the back of your mind.","Answer the other question sets on the passage in order.","While doing them, if you notice a sentence that clearly matches a statement, write the letter next to it at once.","Return to the matching set and deal only with the statements that are still open."]},{"t":"bn","x":"একই প্যাসেজে অন্য প্রশ্ন থাকলে আগে সেগুলো করো। তাতে পুরো প্যাসেজটা একবার পড়া হয়ে যায়। তবে শুরুতেই statement-গুলোয় একবার চোখ বুলিয়ে নাও, পড়তে পড়তে কোনোটা পেয়ে গেলে সাথে সাথে লিখে ফেলো।"}]},{"h":"A quick paragraph map","blocks":[{"t":"p","x":"If the matching set is the only task on a passage, spend about two minutes making a map. Read each paragraph quickly and write three or four words in the margin, together with any names, dates or numbers. Then answer from the map instead of rereading the whole passage each time."},{"t":"example","q":"Make margin notes for this paragraph: 'Meanwhile, laboratory work has focused on improving the mesh itself. Engineers ... have found that threads which are too thick block the wind ... A team at MIT reported in 2013 that a coated stainless-steel mesh could capture up to five times more water ...'","a":"E: lab work on mesh, thread thickness, MIT 2013, steel 5x more","x":"The note keeps the topic, the name, the date and the last point. A strong student adds the last point because the end of a paragraph often contains a separate piece of information that a statement can target."},{"t":"tip","x":"Your map is only for finding the right area. Always confirm the answer by reading the actual sentence before you write the letter."}]},{"h":"Which statement to answer first","blocks":[{"t":"p","x":"The statements are not in order, so you are free to choose. Sort them by how easy they are to find, not by their number. This simple change can save three or four minutes."},{"t":"steps","x":["First, statements with a name, a date or a number: scan for them.","Next, statements with a specific noun such as 'a pipeline' or 'beer cans'.","Then, statements with a clear type word such as 'a comparison' or 'a prediction'.","Last, abstract statements such as 'an acknowledgement of a limitation'. By now fewer paragraphs are left to check."]},{"t":"trap","x":"Do not spend five minutes on question 1 just because it comes first. A stuck student often has three easy questions waiting further down the list."}]},{"h":"Guessing with a plan","blocks":[{"t":"p","x":"There is no penalty for a wrong answer, so never leave a box empty. A good guess is not random. Choose a paragraph you have not used yet, preferably a long one with many details, and avoid a short introduction paragraph unless you have real evidence for it."},{"t":"tip","x":"Set a hard limit. If a statement has taken two minutes, write your best guess, put a small mark next to the number and move on. Come back only if time remains at the end."},{"t":"bn","x":"ভুল উত্তরে নম্বর কাটে না, তাই কখনো ঘর খালি রেখো না। আন্দাজ করতে হলে এমন অনুচ্ছেদ বেছে নাও যেটা এখনো ব্যবহার হয়নি এবং যেটায় অনেক খুঁটিনাটি তথ্য আছে। দুই মিনিটের বেশি এক প্রশ্নে আটকে থেকো না।"}]}],"drill":{"kind":"R","type":"info","time":8,"title":"Lichens and the air we breathe","instr":"Reading Passage 1 has six paragraphs, A-F. Which paragraph contains the following information? Write the correct letter, A-F, next to each statement. NB You may use any letter more than once.","paras":[{"l":"A","x":"Lichens are easy to overlook. They appear as grey, green or orange crusts on walls, tree bark and gravestones, and many people assume they are a kind of moss. In fact, a lichen is a partnership between a fungus and an alga or bacterium, in which the fungus provides structure and protection while its partner produces food through photosynthesis. Around 20,000 species have been described, and they grow everywhere from Antarctic rocks to tropical rainforests."},{"l":"B","x":"Lichens have no roots and no protective outer layer like the waxy surface of a leaf. They take in water and nutrients directly from rain, mist and the air, and they have no way of getting rid of what they absorb. This makes them highly sensitive to pollution. Sulphur dioxide, in particular, damages the alga inside the lichen, and species differ greatly in how much of it they can tolerate."},{"l":"C","x":"The first person to use lichens as indicators of air quality was probably the Finnish botanist William Nylander, who noted in 1866 that lichens were disappearing from the Luxembourg Gardens in Paris as the city grew. A century later, two British researchers, David Hawksworth and Francis Rose, published a scale in 1970 that allowed anyone to estimate sulphur dioxide levels in England and Wales simply by recording which lichen species grew on trees. The scale was cheap to use and required no electronic equipment, which made it popular with schools."},{"l":"D","x":"Since the 1980s, sulphur dioxide levels in much of Europe have fallen sharply, and many sensitive lichens have returned to city centres where they had not been seen for over a hundred years. However, the recovery has revealed a new pattern. Species that thrive on nitrogen, which comes largely from farming and vehicle exhaust, have spread rapidly, while species that prefer clean conditions remain rare. As a result, the old sulphur scale is no longer a reliable guide, and researchers have had to develop new ones based on nitrogen."},{"l":"E","x":"Compared with electronic monitors, lichens have obvious limitations. They cannot give an hourly reading, and identifying species accurately takes training. Their strength is that they show the average effect of pollution over months or years, and they can be surveyed at hundreds of sites for the cost of a single automatic monitoring station. Some studies also use lichens to measure heavy metals, since the amount of lead or zinc stored in their tissue reflects what has fallen on them from the air."},{"l":"F","x":"In recent years, national surveys in Britain and the United States have trained volunteers to record lichens on trees near their homes. The data have helped map nitrogen pollution at a level of detail that official networks could never achieve. Organisers admit that some records are unreliable, but they check a sample of the identifications using photographs, and they argue that the large number of observations makes up for occasional errors."}],"qs":[{"s":"the name of the person who first connected the loss of lichens with the growth of a city","a":"C","ev":"The first person to use lichens as indicators of air quality was probably the Finnish botanist William Nylander, who noted in 1866 that lichens were disappearing from the Luxembourg Gardens in Paris as the city grew.","why":"'The name of' tells you to scan for a capital letter. C has several names, and Nylander is the one linked to a growing city. Hawksworth and Rose, also in C, came a century later."},{"s":"an explanation of why an older method no longer works well","a":"D","ev":"As a result, the old sulphur scale is no longer a reliable guide, and researchers have had to develop new ones based on nitrogen.","why":"'Older method' matches 'the old sulphur scale' and 'no longer works well' matches 'no longer a reliable guide'. The scale itself is described in C, which is the trap, but C does not say it stopped working."},{"s":"a reference to the number of lichen species that are known","a":"A","ev":"Around 20,000 species have been described, and they grow everywhere from Antarctic rocks to tropical rainforests.","why":"A quick scan for a number finds 20,000 at once. 'Known' paraphrases 'have been described'. B mentions species too, but only says they differ in tolerance, with no number."},{"s":"a comparison of the cost of two ways of monitoring air","a":"E","ev":"they can be surveyed at hundreds of sites for the cost of a single automatic monitoring station.","why":"The cost of lichen surveys is set against the cost of one machine. C says the scale was cheap, but it does not compare it with anything, so there is no comparison of cost."},{"s":"a description of how errors in data are controlled","a":"F","ev":"Organisers admit that some records are unreliable, but they check a sample of the identifications using photographs, and they argue that the large number of observations makes up for occasional errors.","why":"'Errors are controlled' matches 'check a sample of the identifications using photographs'. E mentions that identifying species takes training, which is a difficulty, not a way of checking data."},{"s":"a mention of a method that suited users without technical equipment","a":"C","ev":"The scale was cheap to use and required no electronic equipment, which made it popular with schools.","why":"'Without technical equipment' paraphrases 'required no electronic equipment'. C is used twice. E talks about electronic monitors, which is the word trap here."}]}},{"n":5,"title":"The hardest statements","goal":"Today you will practise the abstract, carefully worded statements that separate band 7 from band 8 and 9.","pages":[{"h":"Abstract statements","blocks":[{"t":"p","x":"At higher levels, statements stop using concrete words. Instead of 'a reference to dry regions', you see 'the suggestion that physical surroundings could affect a language'. There is nothing to scan for. You have to understand what each paragraph is doing and match the idea."},{"t":"pairs","x":[["the team admitted the sample was small","an acknowledgement of a limitation"],["the word was borrowed from Portuguese traders","the origin of a term"],["sales tripled once the price was halved","evidence of a link between cost and demand"],["this question is still debated","an unresolved issue"],["few experts had expected the result","a surprising finding"]]},{"t":"bn","x":"কঠিন statement-এ খোঁজার মতো নির্দিষ্ট শব্দ থাকে না, পুরো ধারণাটা অন্যভাবে লেখা থাকে। তাই প্রতিটা অনুচ্ছেদ আসলে কী কাজ করছে (সমালোচনা করছে, ব্যাখ্যা দিচ্ছে, স্বীকার করছে) সেটা বুঝতে হবে।"}]},{"h":"Words that change the answer","blocks":[{"t":"p","x":"Hard statements depend on small words. 'A suggestion' is weaker than 'proof'. 'A possible reason' fits a sentence with 'may' or 'likely', while 'the reason' needs a clear statement. 'Researchers' acknowledgement' means the doubt comes from the authors themselves, not from their critics."},{"t":"example","q":"Statement: an admission by a scientist that her model may not work everywhere. Paragraph B: 'Several reviewers doubted that the model would work outside Europe.' Paragraph E: 'Okafor herself conceded that the model had been tested only on European data and might not hold elsewhere.'","a":"E","x":"Both paragraphs say the model may fail outside Europe. The statement says the admission comes from the scientist. In B the doubt comes from reviewers, while in E Okafor says it herself, so only E matches every part."},{"t":"trap","x":"Do not ignore words like 'early', 'only', 'by researchers' or 'between individuals'. In band 8 to 9 questions, these small words are usually what separates the right paragraph from the tempting one."}]},{"h":"When the clue is split across sentences","blocks":[{"t":"p","x":"Sometimes one paragraph reports that a survey covered 50,000 households and a later paragraph explains why the survey may still be biased. The statement 'a reason why a large survey may be less reliable' points to the explanation, not to the number. The paragraph that gives the size of the survey is the trap."},{"t":"tip","x":"When a statement contains two ideas, such as a survey and a reason it is weak, ask which idea the type word refers to. The answer is the paragraph that contains that part, even if the other part appears elsewhere."},{"t":"bn","x":"অনেক সময় একটা তথ্যের দুই অংশ দুই অনুচ্ছেদে থাকে। statement-এর ধরন (কারণ, তুলনা, স্বীকারোক্তি) যে অংশের কথা বলছে, উত্তর সেই অনুচ্ছেদ।"}]},{"h
