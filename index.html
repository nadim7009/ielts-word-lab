":"A three-point check","blocks":[{"t":"steps","x":["Type: does the sentence actually do what the type word says (explain, compare, predict, admit)?","Content: does it talk about the same thing as the statement, even in different words?","Details: do the small words match, such as who, when, where, 'only', 'early' or 'possible'?","If one of the three fails, look again. If two paragraphs pass all three, reread the statement slowly."]},{"t":"tip","x":"On hard sets, do not guess too early. A careful three-point check takes about twenty seconds, which is cheaper than losing a mark."}]}],"drill":{"kind":"R","type":"info","time":13,"title":"Why pitch can change meaning","instr":"Reading Passage 1 has seven paragraphs, A-G. Which paragraph contains the following information? Write the correct letter, A-G, next to each statement. NB You may use any letter more than once.","paras":[{"l":"A","x":"Speakers of English use pitch constantly, to signal a question or to express surprise, but changing the pitch of a word does not change what it refers to. In a large share of the world's languages, it does. In Mandarin Chinese, the syllable ma means 'mother' when spoken with a high, level pitch and 'horse' when the pitch falls and then rises. Languages that work like this are called tonal, and they are concentrated in sub-Saharan Africa, East and South-East Asia, and parts of the Americas."},{"l":"B","x":"Linguists have long asked how tones arise in the first place. A widely accepted answer, based on the history of Vietnamese, is that tones often develop from sounds that have disappeared. When a consonant at the end of a syllable is gradually lost, the slight change in pitch it once caused on the preceding vowel may remain, and speakers begin to treat that pitch as the feature that separates one word from another. In this account, tone is not invented but inherited from a sound that is no longer pronounced."},{"l":"C","x":"In 2015, a team led by the linguist Caleb Everett proposed a more controversial idea: that climate might influence whether languages develop complex tones. Their analysis of over 3,700 languages suggested that those with complex tone systems were rare in very dry regions. The researchers pointed to laboratory evidence that dry air affects the vocal folds and makes precise control of pitch slightly harder, and they argued that languages spoken in such regions would therefore be less likely to keep complex tones."},{"l":"D","x":"The proposal met strong objections. Critics noted that languages are not independent samples: neighbouring languages often share features through contact, and related languages inherit them from a common ancestor, so a pattern across thousands of languages may reflect only a few historical events. Others questioned whether the effect of dry air on the voice was large enough to matter. The authors accepted that their findings showed a correlation, not a cause, but maintained that the pattern deserved further testing rather than dismissal."},{"l":"E","x":"A similar debate had followed an earlier study by Dan Dediu and Robert Ladd, who in 2007 reported that populations speaking non-tonal languages were more likely to carry particular versions of two genes involved in brain development. Their proposal was that a slight bias in how individuals perceive pitch could, when added up over a population and many centuries, make tone more or less likely to survive. The study attracted wide attention in the press, where it was often reported, wrongly, as a claim that genes decide which language a child will speak."},{"l":"F","x":"Tone also appears to shape how people hear music. Several studies have found that musicians who grew up speaking a tonal language are more likely to have absolute pitch, the rare ability to name a note without hearing a reference note. In one study at music schools, the proportion was considerably higher among Mandarin-speaking students than among American students with the same amount of training, and the gap was widest for those who began lessons early. Whether language actually causes this advantage, or whether other differences in education are responsible, is still debated."},{"l":"G","x":"For adults learning a tonal language as foreigners, tone is often the most frustrating feature. Learners whose first language is not tonal tend to hear pitch differences as emotion or emphasis and ignore them, so the problem is one of attention rather than hearing ability. Teachers have reported that brief training, in which learners repeatedly sort recordings of single syllables by tone and receive immediate feedback, can produce rapid gains. Such reports suggest that the adult ear is more flexible than is often assumed."}],"qs":[{"s":"an acknowledgement by researchers of what their evidence could not show","a":"D","ev":"The authors accepted that their findings showed a correlation, not a cause, but maintained that the pattern deserved further testing rather than dismissal.","why":"'What their evidence could not show' is the cause. The answer is in the last sentence of a paragraph that opens with criticism, so a student who reads only first sentences misses it. F also says something 'is still debated', but there the doubt comes from other people, not from the researchers themselves."},{"s":"a reason why a very large sample may be less convincing than it appears","a":"D","ev":"Critics noted that languages are not independent samples: neighbouring languages often share features through contact, and related languages inherit them from a common ancestor, so a pattern across thousands of languages may reflect only a few historical events.","why":"The large sample is the 3,700 languages in C, which is the trap. C gives the sample size, but the reason it may be less convincing is in D. D is used twice."},{"s":"the suggestion that physical surroundings could affect the development of a language","a":"C","ev":"In 2015, a team led by the linguist Caleb Everett proposed a more controversial idea: that climate might influence whether languages develop complex tones.","why":"'Physical surroundings' is an abstract paraphrase of 'climate'. E is about genes, which are physical too, but genes are inside people, not surroundings."},{"s":"an account of one feature of a language replacing another that was lost","a":"B","ev":"When a consonant at the end of a syllable is gradually lost, the slight change in pitch it once caused on the preceding vowel may remain, and speakers begin to treat that pitch as the feature that separates one word from another.","why":"The lost feature is the final consonant and the new one is pitch. A also describes how pitch changes meaning, but it does not explain where tone came from."},{"s":"a reference to a skill that may be connected with a person's first language","a":"F","ev":"Several studies have found that musicians who grew up speaking a tonal language are more likely to have absolute pitch, the rare ability to name a note without hearing a reference note.","why":"'Skill' is absolute pitch and 'first language' is the language they grew up speaking. G is the trap: it is about first language and pitch, but it describes a difficulty for learners, not a skill."},{"s":"an explanation of how small differences between individuals could have a large effect over time","a":"E","ev":"Their proposal was that a slight bias in how individuals perceive pitch could, when added up over a population and many centuries, make tone more or less likely to survive.","why":"'Small differences between individuals' is 'a slight bias in how individuals perceive pitch' and 'a large effect over time' is 'many centuries'. C also links a slight difficulty to tone, but it is about the effect of dry air on everyone, not differences between individuals."},{"s":"an example of the same sound carrying two unrelated meanings","a":"A","ev":"In Mandarin Chinese, the syllable ma means 'mother' when spoken with a high, level pitch and 'horse' when the pitch falls and then rises.","why":"One syllable, two meanings. G mentions recordings of single syllables, but there the syllables are used for training, not to show a double meaning. Paragraph G is not used in this set."}]}},{"n":6,"title":"Mock test and final checklist","goal":"Today you will do a full set under exam conditions and finish with a checklist you can use on test day.","pages":[{"h":"Before you start the mock","blocks":[{"t":"p","x":"Set a timer for the time given and work without a dictionary. Imagine the other questions on this passage are already done and you have about twelve minutes left for this set. Write an answer for every statement before the timer ends."},{"t":"tip","x":"In the first minute, read all seven statements and sort them: easy scans, specific nouns, and abstract ones. Then work in that order, not in number order."},{"t":"bn","x":"টাইমার চালু করে আসল পরীক্ষার মতো করো। শুরুতে এক মিনিটে সব statement পড়ে সহজ থেকে কঠিন ক্রমে সাজাও। সময় শেষ হওয়ার আগে সব ঘরে উত্তর লেখো।"}]},{"h":"Final checklist","blocks":[{"t":"steps","x":["Do other question sets on the same passage first, and note any matches you see on the way.","Underline the type word and the content words in every statement.","Answer names, numbers and specific nouns first; leave abstract statements for last.","Read the whole paragraph, because the answer is often one detail in the middle.","Check type, content and small details before you write a letter.","Reuse a letter when the evidence says so, and guess an unused paragraph rather than leave a blank."]},{"t":"example","q":"You have one minute left and one statement open: 'a mention of a law that changed an industry'. You have used A, B, D, E, F and G once each. What do you do?","a":"Scan every paragraph, used ones too, for law words (law, ban, rule, required, government) before guessing.","x":"A strong student does not assume the answer must be the unused paragraph C. The instruction allows repeats, so a quick scan for law words comes first. Only if nothing is found does the student guess C."}]},{"h":"If you feel panic","blocks":[{"t":"p","x":"This task feels hard because the answers jump around, not because you are a weak reader. Once you stop reading from top to bottom and start hunting for one thing at a time, it becomes a set of small searches. Each search is something you have already practised this week."},{"t":"tip","x":"If your mind goes blank, put your pen down, breathe out slowly, and go to the easiest open statement. One quick correct answer brings your focus back."},{"t":"bn","x":"ভয় পাওয়ার কিছু নেই। পুরো প্যাসেজ একবারে বোঝার চেষ্টা না করে একেকটা তথ্য খুঁজলেই কাজটা ছোট হয়ে যায়। মাথা ফাঁকা লাগলে একটু শ্বাস নাও, তারপর সবচেয়ে সহজ প্রশ্নটা দিয়ে আবার শুরু করো।"}]}],"drill":{"kind":"R","type":"info","time":12,"title":"The frozen water trade","instr":"Reading Passage 1 has seven paragraphs, A-G. Which paragraph contains the following information? Write the correct letter, A-G, next to each statement. NB You may use any letter more than once.","paras":[{"l":"A","x":"Before the age of electric refrigerators, ice was a seasonal luxury in most of the world. Wealthy households in Europe had stored winter ice in underground ice houses for centuries, but the supply was small and rarely lasted through the summer. In the nineteenth century this changed dramatically. Frozen lakes in New England and, later, Norway became the source of a global trade, and by the 1880s ice was being shipped in large quantities to cities as far away as Rio de Janeiro and Bombay."},{"l":"B","x":"The trade is usually traced to Frederic Tudor, a Boston businessman who in 1806 sent a shipload of ice to the Caribbean island of Martinique. The cargo arrived largely intact, but the venture lost money: there was nowhere to store the ice once it was unloaded, and local people had no habit of using it. Tudor spent years building insulated ice houses in the ports he supplied and giving away cold drinks in an effort to create demand. He was imprisoned for debt more than once before his business finally became profitable."},{"l":"C","x":"Two technical improvements made the industry possible. The first was insulation. Through trial and error, shippers found that packing blocks tightly in sawdust, a waste product of New England's timber mills that was available almost free, greatly reduced melting during voyages. The second was a horse-drawn cutting tool introduced in the 1820s by Nathaniel Wyeth, one of Tudor's suppliers, which marked the surface of a frozen lake into a grid so that blocks of identical size could be cut quickly. Uniform blocks could be packed with almost no gaps between them, which slowed melting further."},{"l":"D","x":"The most remarkable voyages were to India. In 1833 a ship carrying about 180 tons of ice left Boston for Calcutta, a journey of four months which twice crossed the equator. More than half of the cargo survived. British residents of the city welcomed it so warmly that they raised money to build a large ice house, and the trade continued for several decades. For merchants, ice was also useful as ballast, the heavy material placed low in a ship to keep it stable, so a vessel leaving Boston with no other cargo could still carry something worth selling."},{"l":"E","x":"At home, the harvest became a major winter industry. On the larger lakes, hundreds of workers, many of them farm labourers with little else to do in the cold months, cut, floated and stored the ice in enormous wooden warehouses beside the water. The work was dangerous: men regularly fell through weakened ice, and the sharp tools caused frequent injuries. Ice companies also began to see clean ice as a selling point, and some advertised that their product came from lakes far away from towns and factories."},{"l":"F","x":"Competition arrived from Norway in the second half of the century. Norwegian lakes froze reliably, and the country was much closer to the expanding market in Britain, where ice was in demand for fishing boats, breweries and the growing number of restaurants. One Norwegian company even renamed a lake 'Wenham Lake' after a famous Massachusetts source, so that its ice could be sold in London under a name that customers already trusted. By 1900, Norway was exporting several hundred thousand tons of ice a year."},{"l":"G","x":"The natural ice trade did not disappear overnight. Machines that produced ice artificially had existed since the 1850s, but for many years they were expensive and unreliable, and natural ice remained cheaper. What finally changed opinion was a concern about health. As cities grew and rivers became more polluted, doctors warned that natural ice could carry disease, and artificial ice, made from boiled or filtered water, began to be sold as the safer choice. A run of mild winters, which left ice too thin to harvest, added to the industry's difficulties, and by the 1920s the trade had largely ended."}],"qs":[{"s":"an example of a company using a name to mislead buyers","a":"F","ev":"One Norwegian company even renamed a lake 'Wenham Lake' after a famous Massachusetts source, so that its ice could be sold in London under a name that customers already trusted.","why":"The company gave a Norwegian lake an American name so buyers would trust the ice. E is the trap: companies there advertise clean ice, which is promotion but not a misleading name."},{"s":"a description of the dangers faced by people who collected ice","a":"E","ev":"The work was dangerous: men regularly fell through weakened ice, and the sharp tools caused frequent injuries.","why":"'Dangers' matches 'dangerous', and 'people who collected ice' are the harvest workers. B mentions Tudor going to prison, which is a misfortune, but he was a businessman, not a collector, and prison is not a danger of the work."},{"s":"a reference to how widely ice was eventually sold","a":"A","ev":"Frozen lakes in New England and, later, Norway became the source of a global trade, and by the 1880s ice was being shipped in large quantities to cities as far away as Rio de Janeiro and Bombay.","why":"'How widely' is answered by 'a global trade' and the distant city names. D is the trap because it describes one long voyage to India, but that is a single example, not the full reach of the trade."},{"s":"an additional practical use for ice on board ship","a":"D","ev":"For merchants, ice was also useful as ballast, the heavy material placed low in a ship to keep it stable, so a vessel leaving Boston with no other cargo could still carry something worth selling.","why":"The word 'also' in D signals the additional use, which is keeping the ship stable. C is about packing ice on ships, but that is about reducing melting, not a second use for the ice."},{"s":"a mention of efforts to get people to start using a product that was new to them","a":"B","ev":"Tudor spent years building insulated ice houses in the ports he supplied and giving away cold drinks in an effort to create demand.","why":"'Get people to start using' paraphrases 'create demand', and the product was new to them because 'local people had no habit of using it'. E mentions advertising, but it is aimed at buyers who already use ice. F's renamed lake also tries to sell, but it relies on a name customers 'already trusted', so the product was not new to them."},{"s":"a reference to weather conditions that hurt the industry","a":"G","ev":"A run of mild winters, which left ice too thin to harvest, added to the industry's difficulties, and by the 1920s the trade had largely ended.","why":"'Weather conditions' is 'mild winters'. F mentions that Norwegian lakes froze reliably, which is weather that helped the industry, the opposite of the statement."},{"s":"a comparison between the prices of two kinds of product","a":"G","ev":"Machines that produced ice artificially had existed since the 1850s, but for many years they were expensive and unreliable, and natural ice remained cheaper.","why":"Artificial and natural ice are compared on price. G is used twice. C mentions sawdust that was 'available almost free', which is about price but compares nothing. Paragraph C is not used."}]}}]},{"id":"rmcq","skill":"R","title":"Reading multiple choice","bn":"রিডিং মাল্টিপল চয়েস","why":"Multiple choice looks easy because the answer is printed in front of you, but three of the four options are written to sound right, and students who read the options first get pulled towards familiar words. This course trains you to read the stem, find the place in the text and test every option until only one survives.","days":[{"n":1,"title":"How multiple choice works","goal":"Today you will learn the format, the instructions and a basic method for IELTS Reading multiple choice.","pages":[{"h":"What you see in the exam","blocks":[{"t":"p","x":"In IELTS Academic Reading, a multiple choice set usually has between three and six questions on one passage. Each question has a stem, which is either a full question or the start of a sentence, followed by four options marked A, B, C and D. The instructions say: 'Choose the correct letter, A, B, C or D.' You write only the letter on your answer sheet."},{"t":"p","x":"A second version gives a longer list, often five options from A to E, and tells you to **choose TWO letters**. Each correct letter earns one mark, and you can write the two letters in either order. A rarer version asks for three letters from a list of six or seven."},{"t":"tip","x":"Write capital letters and check that the box number matches the question number. On paper, a letter in the wrong box is a lost mark even if your reading was right."},{"t":"bn","x":"এই প্রশ্নে প্রথমে একটা stem থাকে, তারপর A থেকে D পর্যন্ত চারটা অপশন। তুমি উত্তরপত্রে শুধু একটা অক্ষর লিখবে। কখনও পাঁচটা অপশন থেকে দুইটা বেছে নিতে বলে, তখন প্রতিটা সঠিক অক্ষরের জন্য আলাদা এক নম্বর পাবে।"}]},{"h":"Where the answers come from","blocks":[{"t":"p","x":"Multiple choice questions follow the order of the passage. The answer to question 2 comes after the answer to question 1 and before the answer to question 3. A set may cover the whole passage or only a few paragraphs of it."},{"t":"p","x":"The last question in a set is sometimes different. It may ask about the writer's purpose, the main idea or the best title, and for that you need the passage as a whole rather than one sentence. You will practise these on day 5."},{"t":"trap","x":"Students often go to the first paragraph that contains a word from the options. Use the stem to find the place instead, and remember that the answer to this question cannot come before the answer to the one you just finished."},{"t":"example","q":"Stem: 'Why did the factory close?' You answered question 1 from paragraph A. Question 3 mentions a date that appears in paragraph D.","a":"Look in paragraphs B and C first.","x":"Passage order tells you the answer sits after paragraph A and before the date in paragraph D. That leaves two paragraphs to scan for words about closing, such as 'shut down' or 'ceased production', instead of the whole text."}]},{"h":"A basic method in five steps","blocks":[{"t":"steps","x":["Read the stem and decide what it asks for: a reason, a result, an opinion, a fact or a purpose.","Pick out one or two locator words in the stem, such as a name, a date or a technical term.","Scan the passage for those words, then read the two or three sentences around them slowly.","Now read the four options and compare each one with what the text says.","Choose the option the text supports and make sure you can say why each of the others is wrong."]},{"t":"p","x":"Notice the order. You read the options after you have read the text, not before. If you read all four options first, you carry four ideas into the passage, and three of them are wrong. The stem alone gives you one clear question to look for."},{"t":"example","q":"Text: 'The bridge was finished in 1932, two years later than planned, mainly because the steel arrived late from abroad.' Why was the bridge finished late? A The design was changed. B Materials were delayed. C Workers went on strike. D It was built abroad.","a":"B","x":"The stem asks for a reason, so look for 'because'. 'The steel arrived late' matches B: 'materials' is a general word for steel and 'delayed' means 'arrived late'. D repeats the word 'abroad' but says something the text does not."}]},{"h":"Timing on test day","blocks":[{"t":"p","x":"You have 60 minutes for three passages and 40 questions, and the paper test gives no extra time to copy answers. That is roughly 20 minutes a passage. Multiple choice takes longer than most other question types, so plan on about one and a half minutes for each question after a quick first look at the passage."},{"t":"tip","x":"If one question is taking more than three minutes, write your best letter, circle the question number and move on. Wrong answers lose nothing, so never leave a box empty."},{"t":"bn","x":"পুরো রিডিংয়ে ৬০ মিনিটে তিনটা প্যাসেজ। প্রতিটা MCQ প্রশ্নে মোটামুটি দেড় মিনিট ধরো। কোনো প্রশ্নে আটকে গেলে একটা উত্তর লিখে পরের প্রশ্নে চলে যাও, কারণ ভুল উত্তরে নম্বর কাটে না।"}]}],"drill":{"kind":"R","type":"mcq","time":10,"title":"Bees on the rooftops","instr":"Reading Passage 1 has five paragraphs, A-E. Questions 1-5: Choose the correct letter, A, B, C or D.","paras":[{"l":"A","x":"Over the past twenty years, beekeeping has moved from the countryside into the centre of many large cities. In London alone, the number of registered hives more than doubled between 2008 and 2013, and similar growth was recorded in Paris, Berlin and Toronto. Most of these new hives are kept by amateurs on the roofs of offices, hotels and apartment blocks. Many of the new keepers say they began after reading news reports about the decline of honeybees, and they see a hive as a small, practical way to help."},{"l":"B","x":"Cities can be surprisingly good places for bees. Parks, private gardens, railway banks and street trees provide a wide variety of flowers, and because different species are planted, something is usually in bloom from early spring until late autumn. In farming areas, by contrast, large fields of a single crop may offer a rich supply of food for two or three weeks and very little for the rest of the year. Urban bees are also less exposed to the chemical sprays used on farms, although garden pesticides are not unknown."},{"l":"C","x":"However, some scientists now argue that the boom has gone too far. A hive contains up to 50,000 bees, and a city park can only support a limited number of them. Researchers in London calculated that in parts of the centre there are now more hives than the local flowers can feed. When food is short, honeybees compete with the city's wild bees, of which Britain has more than 250 species. Unlike honeybees, many wild species fly only short distances and depend on a few particular plants, so they are the first to suffer."},{"l":"D","x":"Disease is a second concern. When hives are placed close together, infections spread more easily from one colony to another. Experienced keepers check their bees regularly and treat problems early, but a survey of new city keepers in 2019 found that fewer than half had received any formal training. Some admitted that they rarely opened their hives at all once the bees had settled in."},{"l":"E","x":"None of this means that city beekeeping should end. Instead, most experts recommend a change of focus. Planting more flowering trees and shrubs, and leaving areas of grass uncut, would help all kinds of bees, not only those kept in hives. Several local councils have started to do exactly this, and some companies that once installed hives on their roofs now pay for wildflower gardens instead."}],"qs":[{"q":"Why did many people start keeping bees in cities?","o":["They wanted to sell honey to local hotels.","They had read that honeybee numbers were falling.","Their employers had put hives on office roofs.","They were offered training by experienced keepers."],"a":1,"ev":"Many of the new keepers say they began after reading news reports about the decline of honeybees","why":"'Reading news reports about the decline of honeybees' is paraphrased as 'had read that honeybee numbers were falling'. Option C is tempting because offices and roofs are mentioned in the same paragraph, but the text only says where hives are kept, not that employers provided them."},{"q":"According to the writer, one advantage cities offer bees is that","o":["there are no pesticides in urban areas.","city flowers produce more food than farm crops.","flowers are available for more of the year.","bees can fly shorter distances to find food."],"a":2,"ev":"because different species are planted, something is usually in bloom from early spring until late autumn","why":"'From early spring until late autumn' means flowers last for more of the year. A is too extreme: the text says garden pesticides are 'not unknown', so they do exist. B uses the farm comparison but the text compares how long food lasts, not how much there is."},{"q":"What did researchers in London find?","o":["Some central areas have more hives than the flowers can support.","Britain has lost around 250 species of wild bee.","Honeybees fly shorter distances than most wild bees.","A city park can feed up to 50,000 hives."],"a":0,"ev":"Researchers in London calculated that in parts of the centre there are now more hives than the local flowers can feed.","why":"'More hives than the local flowers can feed' matches A. B and D take numbers from the paragraph and attach them to the wrong idea: 250 is about the number of wild bee species that exist, and 50,000 is the number of bees in one hive. C reverses the comparison, since it is wild bees that fly short distances."},{"q":"What does the 2019 survey suggest about new city keepers?","o":["Most of them had lost colonies to disease.","They kept their hives too close to one another.","Many had not been given any formal training.","They checked their bees more often than experienced keepers."],"a":2,"ev":"a survey of new city keepers in 2019 found that fewer than half had received any formal training","why":"If fewer than half had received training, many had not been trained, which is C. B is the general reason disease spreads, given at the start of the paragraph, but it is not what the survey found. D is the opposite: some new keepers rarely opened their hives."},{"q":"What do most experts recommend?","o":["Ending beekeeping in city centres.","Moving hives from roofs into parks.","Asking companies to pay for keepers' training.","Growing more plants that feed every kind of bee."],"a":3,"ev":"Planting more flowering trees and shrubs, and leaving areas of grass uncut, would help all kinds of bees, not only those kept in hives.","why":"'Planting more flowering trees and shrubs' that 'help all kinds of bees' matches D. A is the opposite of 'None of this means that city beekeeping should end'. C borrows 'companies' and 'pay for', but the companies pay for wildflower gardens, not training."}]}},{"n":2,"title":"Paraphrase and keyword spotting","goal":"Today you will learn to find the right sentence quickly and recognise the same idea in different words.","pages":[{"h":"Two kinds of keyword","blocks":[{"t":"p","x":"Not every word in a stem helps you in the same way. **Locator words** are names, dates, numbers, places and technical terms. They usually appear in the passage exactly as they appear in the question, so they are the words you scan for."},{"t":"p","x":"**Meaning words** are the verbs, adjectives and ideas that tell you what is being asked. These are almost always changed in the passage. If the stem says 'increased', the text may say 'rose', 'grew' or 'more than doubled'."},{"t":"pairs","x":[["more than doubled","rose sharply"],["fewer than half had received any formal training","many had not been trained"],["garden pesticides are not unknown","some pesticides are used in cities"],["the coast was little changed","there was almost no improvement"]]},{"t":"tip","x":"Scan for the locator word, then stop and read. Do not try to match meaning words while scanning, because they have usually been changed and your eye will pass over them."}]},{"h":"Why the stem comes first","blocks":[{"t":"p","x":"Many students read the four options before the passage, hoping one will jump out. The problem is that the options are written to look familiar. Three of them contain words or ideas from the passage, and once you have read them, your eye goes to those words and stops there."},{"t":"steps","x":["Read the stem only and say in your own words what it is asking.","Underline one locator word and decide whether the question wants a cause, an effect, a fact, an opinion or a purpose.","Find the locator in the passage and read from one sentence before it to one sentence after it.","Form a rough answer in your head before you look at the options.","Read the options, pick the one closest to your rough answer, then check the other three."]},{"t":"bn","x":"আগে অপশন পড়লে চারটা আইডিয়া মাথায় ঢুকে যায়, আর ভুল অপশনগুলো ইচ্ছা করেই প্যাসেজের শব্দ দিয়ে বানানো হয়। তাই আগে শুধু stem পড়ো, প্যাসেজে জায়গাটা খুঁজে বের করো, নিজের মনে একটা উত্তর ভাবো, তারপর অপশন দেখো।"}]},{"h":"How the correct option is paraphrased","blocks":[{"t":"p","x":"The correct option rarely copies the passage. Examiners change it in a few regular ways: a synonym, a different word form, a general word in place of a specific one, or a sentence turned from active to passive. Expect these changes and the right answer will not look strange to you."},{"t":"pairs","x":[["the steel arrived late","materials were delayed"],["a flying swarm is far harder and more expensive to control","flying swarms are more difficult and costly to deal with"],["parks, private gardens, railway banks and street trees","green spaces"],["researchers calculated","a study estimated"],["fewer than a third do so","most do not"]]},{"t":"example","q":"Text: 'Officers in affected countries survey remote areas, record where young locusts are found and send this information to a central office in Rome.' What do field officers do? A They spray young locusts in Rome. B They report where they find immature insects. C They visit only areas near towns. D They train officers in other countries.","a":"B","x":"'Young locusts' becomes 'immature insects', and 'record ... and send this information' becomes 'report'. A borrows 'young locusts' and 'Rome' but joins them into a claim the text never makes. C is the opposite of 'remote areas'."}]},{"h":"When an exact match is a warning","blocks":[{"t":"p","x":"If an option repeats a phrase from the passage word for word, slow down. Sometimes it is right, but more often it is a trap: the words are the same, but the option attaches them to a different subject, a different time or a different cause."},{"t":"trap","x":"Choosing an option because it contains the same unusual word as the passage. Before you choose, ask: does the passage say this about the thing the stem is asking about?"},{"t":"tip","x":"When you pick an answer, you should be able to point to the exact words in the text that it paraphrases. If you cannot point to them, you are guessing, so look again."},{"t":"bn","x":"অপশনে যদি প্যাসেজের শব্দ হুবহু থাকে, সাবধান হও। অনেক সময় শব্দ এক থাকলেও কথাটা অন্য কিছু নিয়ে বলা হয়। সঠিক উত্তর সাধারণত অন্য শব্দে একই অর্থ বলে।"}]}],"drill":{"kind":"R","type":"mcq","time":11,"title":"Forecasting the desert locust","instr":"Reading Passage 1 has six paragraphs, A-F. Questions 1-5: Choose the correct letter, A, B, C or D.","paras":[{"l":"A","x":"The desert locust is, for most of its life, a harmless grasshopper that lives alone in the dry regions between West Africa and India. After heavy rain, however, plants grow quickly and locust numbers rise. When the insects are crowded together, they change colour, become more active and begin to move as a group. Within a few generations a swarm can form that covers several hundred square kilometres and eats as much food in a day as millions of people."},{"l":"B","x":"Since the 1960s, an international network has tried to stop swarms before they start. Officers in affected countries survey remote areas, record where young locusts are found and send this information to a central office in Rome. There, forecasters combine the field reports with weather data and issue warnings that tell governments where to send spray teams. The aim is to treat small groups of insects while they are still on the ground, because a flying swarm is far harder and more expensive to control."},{"l":"C","x":"The system has always depended on people reaching the right place at the right time. Breeding areas are huge, and many are in deserts with few roads. In some years, conflict has made parts of Yemen and the Sahel too dangerous for survey teams to enter. Forecasters have described these gaps in the data as their single biggest problem, since an outbreak that goes unseen for a month may already be too large to stop."},{"l":"D","x":"Satellites have reduced, though not removed, this difficulty. Images can now show where the ground has become green after rain, which tells forecasters where locusts are likely to breed. Since 2015, field officers have also used a tablet application that sends their observations directly, replacing paper forms that were sometimes posted weeks after a survey. The time between an observation and its arrival in Rome has fallen from several weeks to a few minutes."},{"l":"E","x":"Even so, the outbreak of 2019 to 2021 showed the limits of forecasting. Two unusual cyclones brought rain to the deserts of southern Arabia, an area rarely visited by survey teams, and locusts bred there for several generations without being detected. By the time swarms reached East Africa, they were the largest seen in Kenya for seventy years. Warnings had been issued, but several countries had no spray aircraft ready and little money to hire them."},{"l":"F","x":"Researchers are now testing models that predict breeding from soil moisture and wind patterns months in advance. Their supporters say such forecasts would give governments time to prepare. Others point out that better predictions are of little use unless countries keep control teams trained and funded in the quiet years, when there are no locusts and the problem seems to have gone away."}],"qs":[{"q":"What causes desert locusts to change their behaviour?","o":["A sudden change in their colour.","A shortage of plants in dry weather.","Close contact with large numbers of other locusts.","A move from West Africa towards India."],"a":2,"ev":"When the insects are crowded together, they change colour, become more active and begin to move as a group.","why":"'Crowded together' is paraphrased as 'close contact with large numbers of other locusts', and it comes before the change. A is a result of crowding, not its cause. B is the opposite: numbers rise after heavy rain, when plants grow quickly."},{"q":"Why does the network try to treat locusts before they can fly?","o":["Flying swarms are more difficult and costly to deal with.","Flying swarms cannot be seen from the office in Rome.","Spray teams are trained to work only on the ground.","Young locusts eat more food than adult locusts."],"a":0,"ev":"because a flying swarm is far harder and more expensive to control","why":"'Harder' becomes 'more difficult', 'more expensive' becomes 'costly' and 'control' becomes 'deal with'. C takes 'on the ground' from the same sentence but changes who it applies to: the insects are on the ground, not the teams, and nothing says teams work only there."},{"q":"According to forecasters, their main difficulty has been","o":["the high cost of buying weather data.","a lack of information from some breeding areas.","conflict between governments in the region.","the time needed to build roads in the desert."],"a":1,"ev":"Forecasters have described these gaps in the data as their single biggest problem","why":"'Single biggest problem' matches 'main difficulty', and 'gaps in the data' matches 'a lack of information'. C is tempting because conflict is mentioned, but it is one reason the gaps exist, and the text describes danger to survey teams, not conflict between governments."},{"q":"What change has the tablet application brought about?","o":["Paper forms are now posted every week.","Field officers can survey larger areas in a day.","Satellite images are sent straight to field officers.","Field reports reach the central office far sooner than before."],"a":3,"ev":"The time between an observation and its arrival in Rome has fallen from several weeks to a few minutes.","why":"'Rome' is the central office from paragraph B, and 'from several weeks to a few minutes' means far sooner. A misuses 'posted weeks after', which described the old system. C joins satellites and officers, which the text treats as two separate improvements."},{"q":"What does the writer say about the outbreak of 2019 to 2021?","o":["The countries affected received no warnings.","Some countries were unable to act on the warnings they received.","The cyclones carried the swarms directly to Kenya.","Survey teams found the locusts but could not reach them."],"a":1,"ev":"Warnings had been issued, but several countries had no spray aircraft ready and little money to hire them.","why":"Having 'no spray aircraft ready and little money' means they could not act on the warnings. A is the opposite of 'Warnings had been issued'. D is wrong because the locusts bred 'without being detected', so survey teams did not find them."}]}},{"n":3,"title":"Four kinds of wrong option","goal":"Today you will learn the four ways wrong options are written and how to cross each one out with a reason.","pages":[{"h":"Type 1: true, but not the answer","blocks":[{"t":"p","x":"This is the distractor that catches strong readers. The option says something the passage really does say, so it feels safe. But it answers a different question. The stem may ask for a cause while the option gives a result, or the stem asks about the past while the option describes the present."},{"t":"example","q":"Text: 'For a long time, engineers assumed that the Romans had simply built more carefully. Recent analysis suggests the material itself behaves differently.' What did engineers originally believe? A Roman concrete was made differently. B Roman builders worked more carefully.","a":"B","x":"A is true according to the passage, but it is the new finding, not the original belief. The word 'originally' in the stem points to 'for a long time ... assumed', and that matches B."},{"t":"tip","x":"Ask two questions about every option: 'Is it true?' and then 'Does it answer this exact stem?' Only an option that passes both can be right."}]},{"h":"Type 2: same words, different meaning","blocks":[{"t":"p","x":"Here the option is built from words that really appear in the passage, sometimes from the right paragraph, but they are joined to say something new. A cause becomes an effect, one person's opinion is given to someone else, or two separate facts are combined."},{"t":"example","q":"Text: 'Roman concrete has low tensile strength, which means it cannot be used with steel reinforcement.' A student chooses 'Roman concrete contains too little steel.' Why is this wrong?","a":"The text says it cannot be combined with steel, not that it contains some.","x":"The option takes 'Roman concrete' and 'steel' from the sentence but changes the relationship between them. Read the verbs and small words like 'with', 'by' and 'because', since these carry the relationship that the distractor changes."},{"t":"bn","x":"এই ধরনের ভুল অপশনে প্যাসেজের শব্দই থাকে, কিন্তু অর্থ বদলে যায়। কারণ আর ফলাফল উল্টে দেওয়া হয়, বা একজনের মত অন্য কারো নামে বসানো হয়। তাই শব্দ মিলছে কিনা না দেখে পুরো বাক্যের অর্থ মিলছে কিনা দেখো।"}]},{"h":"Type 3: too extreme","blocks":[{"t":"p","x":"Academic writers are careful. They say 'may', 'some', 'often' and 'tends to'. Distractors are often written with 'all', 'always', 'only', 'never' or 'completely'. When an option is stronger than the text, it is wrong, even if the topic is right. Each pair below shows the text on the left and a wrong, overstated option on the right."},{"t":"pairs","x":[["garden pesticides are not unknown","there are no pesticides in cities"],["most went to bed at about the same time","every student kept the same bedtime"],["Satellites have reduced, though not removed, this difficulty","satellites solved the problem"],["Grades in biology, the one subject the researchers tracked, rose","grades rose in all subjects"]]},{"t":"trap","x":"Not every strong word makes an option wrong. If the passage itself says 'the only species' or 'never', a strong option can be correct. Compare the strength of the option with the strength of the text, not with a list of words to avoid."}]},{"h":"Type 4: opposite or not mentioned","blocks":[{"t":"p","x":"Some options say the reverse of the passage, usually because a 'not', 'rather than' or 'unlike' has been missed. Others bring in an idea that sounds sensible but never appears. Both are easy to reject when you check the text, and both are tempting when you answer from general knowledge."},{"t":"example","q":"Text: 'If these work, the main benefit may be lower maintenance costs rather than buildings that last for millennia.' Option: 'The main benefit will be buildings that last for thousands of years.'","a":"Wrong, because it is the opposite of the text.","x":"'Rather than' tells you that long-lasting buildings are the benefit the writer rejects. A reader who sees 'millennia' and 'thousands of years' match may choose it without noticing the small phrase that reverses the meaning."},{"t":"trap","x":"Answering from what you already know about the topic. You may know that teenagers use phones late at night, but if the passage never mentions screens, an option about screens is wrong."}]},{"h":"Cross out with a reason","blocks":[{"t":"steps","x":["Find the right part of the text, then test the options one at a time.","Put a small mark beside each: a tick if the text supports it, a cross if it fails, a question mark if you are unsure.","For each cross, name the type: not the answer, changed meaning, too extreme, or opposite and not mentioned.","If two options remain, go back to the stem and check exactly what it asks.","Choose the one option you can link to specific words in the text."]},{"t":"bn","x":"প্রতিটা অপশনের পাশে টিক, ক্রস বা প্রশ্নচিহ্ন দাও, আর ক্রস দিলে কারণটা মনে মনে বলো। কারণ বলতে না পারলে বুঝবে এখনও নিশ্চিত হওনি, তখন প্যাসেজের ওই বাক্যটা আবার পড়ো।"}]}],"drill":{"kind":"R","type":"mcq","time":13,"title":"The secret of Roman concrete","instr":"Reading Passage 2 has six paragraphs, A-F. Questions 14-19: Choose the correct letter, A, B, C or D.","paras":[{"l":"A","x":"Many Roman harbours, bridges and domes are still standing after two thousand years, while modern concrete structures often need major repairs within fifty. For a long time, engineers assumed that the Romans had simply built more carefully or used thicker walls. Over the past two decades, however, chemical analysis of ancient samples has suggested that the material itself behaves differently from the concrete in use today."},{"l":"B","x":"Modern concrete is made with Portland cement, which is produced by heating limestone and clay to about 1,450°C. When mixed with water, it sets into a hard, dense mass. Roman builders instead combined lime with volcanic ash, much of it taken from the area around the Bay of Naples. The resulting material was weaker when it first set, and the Romans seem to have understood this: ancient writers advised builders to leave new walls for several months before loading them."},{"l":"C","x":"The value of the Roman mixture appears over time. In 2017, a team led by the geologist Marie Jackson examined concrete from harbour walls that had stood in seawater since the first century BC. They found that seawater passing through the walls had reacted with the volcanic ash to grow new minerals in the cracks and spaces of the concrete. Rather than wearing the material away, as it does with modern concrete, the sea had made the Roman walls stronger."},{"l":"D","x":"A second discovery concerned small white lumps of lime that appear throughout many Roman samples. These had usually been explained as a sign of poor mixing. A study published in 2023 proposed a different explanation: the Romans may have added lime in a hot, reactive form, leaving lumps that later act as a store of calcium. When a crack forms and water enters, the lumps dissolve and the calcium fills the gap again. The researchers tested the idea by cracking new samples made the same way and found that the cracks had closed within two weeks."},{"l":"E","x":"These findings have led some commentators to claim that Roman concrete is simply better than its modern equivalent. Most engineers disagree. Roman concrete has low tensile strength, which means it cannot be used with steel reinforcement in the long, thin beams and tall towers that modern cities depend on. It also sets slowly, and few construction companies could accept waiting months before building the next floor."},{"l":"F","x":"The more realistic hope is to borrow particular ideas. Several companies are developing cements that contain volcanic ash or similar materials, partly because they need less heat to produce and therefore release less carbon dioxide. Others are experimenting with self-healing additives inspired by the lime lumps. If these work, the main benefit may be lower maintenance costs rather than buildings that last for millennia."}],"qs":[{"q":"Before recent research, engineers believed Roman structures had lasted because","o":["Roman concrete contained volcanic ash.","the Romans used more careful building methods.","modern concrete is too dense to last.","the structures had been repaired regularly."],"a":1,"ev":"For a long time, engineers assumed that the Romans had simply built more carefully or used thicker walls.","why":"'For a long time ... assumed' matches 'before recent research ... believed', and 'built more carefully' matches B. A is true according to the passage, but it is the new finding, not the earlier belief. This is the 'true but not the answer' trap."},{"q":"What does the writer say about Roman concrete when it was new?","o":["It was made at a higher temperature than Portland cement.","Builders were told not to use it near the sea.","It needed time before it could carry heavy loads.","Ancient writers thought it was weaker than stone."],"a":2,"ev":"ancient writers advised builders to leave new walls for several months before loading them","why":"Leaving walls 'for several months before loading them' means the concrete needed time before carrying loads. A takes the temperature from the sentence about Portland cement. D uses 'ancient writers' and 'weaker', but the writers gave advice; they did not compare it with stone."},{"q":"Jackson's team found that seawater","o":["had slowly worn away the surface of the harbour walls.","had been used by the Romans when mixing the concrete.","reacts in the same way with modern concrete.","had produced minerals that strengthened the walls."],"a":3,"ev":"They found that seawater passing through the walls had reacted with the volcanic ash to grow new minerals in the cracks and spaces of the concrete.","why":"New minerals grew in the cracks and 'the sea had made the Roman walls stronger', which is D. A is the opposite: wearing away is what happens to modern concrete. C is also contradicted by 'as it does with modern concrete'. B is never mentioned."},{"q":"According to the 2023 study, the lumps of lime","o":["show that Roman workers mixed the concrete badly.","can repair cracks by releasing calcium.","close all cracks within two weeks.","were added to make the concrete set more quickly."],"a":1,"ev":"When a crack forms and water enters, the lumps dissolve and the calcium fills the gap again.","why":"The lumps dissolve and the calcium fills the gap, so they repair cracks. A is the old explanation that the study rejected. C is too extreme: the two weeks refers to test samples, and nothing says all cracks in all concrete close."},{"q":"Why do most engineers reject the claim that Roman concrete is better?","o":["It cannot meet some of the needs of modern building.","It is more expensive to produce than Portland cement.","It releases more carbon dioxide during production.","It contains too little steel to be strong."],"a":0,"ev":"Roman concrete has low tensile strength, which means it cannot be used with steel reinforcement in the long, thin beams and tall towers that modern cities depend on.","why":"Beams, towers and fast construction are needs of modern building that Roman concrete cannot meet. D uses 'steel' but changes the relationship: the text says it cannot be used with steel, not that it contains some. C is the opposite: ash cements release less carbon dioxide."},{"q":"According to the writer, if the new materials work, their main benefit may be","o":["buildings that last for thousands of years.","concrete that sets more quickly.","lower spending on repairs.","wider use of ash from the Bay of Naples."],"a":2,"ev":"If these work, the main benefit may be lower maintenance costs rather than buildings that last for millennia.","why":"'Lower maintenance costs' means lower spending on repairs. A is the trap: 'rather than' tells you the writer rejects this idea, even though 'thousands of years' matches 'millennia' exactly."}]}},{"n":4,"title":"Speed and time management","goal":"Today you will learn to answer each multiple choice question in about 90 seconds without losing accuracy.","pages":[{"h":"Your time budget","blocks":[{"t":"p","x":"A 20-minute passage with six multiple choice questions and seven others leaves no room to read every sentence twice. Most high scorers spend two or three minutes skimming the passage first to see what each paragraph is about, and only then go to the questions."},{"t":"steps","x":["Skim the passage in two or three minutes, reading the first and last sentence of each paragraph.","Spend about 90 seconds on each multiple choice question.","At three minutes, write your best letter, circle the number and move on.","Keep two minutes at the end of the passage to return to circled questions."]},{"t":"tip","x":"While skimming, write two or three words beside each paragraph, such as 'cause of decline' or 'new method'. These notes tell you where to look when a stem names a topic but has no locator word."}]},{"h":"Let passage order work for you","blocks":[{"t":"p","x":"Because answers follow the order of the passage, every question you finish narrows the search for the next one. If question 3 has no clear locator word, find the answers to questions 2 and 4 first. The answer to question 3 will be somewhere between them."},{"t":"example","q":"You answered question 2 from paragraph B. Question 4 mentions 'the Seattle study', which appears at the end of paragraph C and in paragraph D. Question 3 asks: 'Why does the writer mention road accidents?'","a":"Search paragraph C first.","x":"The answer must come after paragraph B and before the Seattle study. Paragraph C begins with the effects of poor sleep, which is where accidents would fit, and scanning one paragraph takes seconds."},{"t":"trap","x":"Rereading the whole passage for every question. With a skim map and passage order, you rarely need more than one paragraph per question."}]},{"h":"When two options survive","blocks":[{"t":"p","x":"Most time is lost at the end, when two options both seem possible. Do not reread the whole paragraph. Go back to the stem and find the word that decides it: does it ask what the writer thinks or what others claim, about the past or now, for a cause or a result?"},{"t":"p","x":"Then compare the two options word by word against the one sentence that answers the stem. Usually one of them adds something small that the text does not say, such as 'all', 'first' or 'because'. That extra piece is what makes it wrong."},{"t":"bn","x":"শেষে দুইটা অপশন থাকলে পুরো প্যারাগ্রাফ আবার পড়ো না। stem-এর মূল শব্দটা আবার দেখো, তারপর দুইটা অপশনকে শুধু সেই একটা বাক্যের সাথে মেলাও। যেটা প্যাসেজের বাইরের কিছু যোগ করে, সেটাই ভুল।"}]},{"h":"Choose TWO without losing time","blocks":[{"t":"p","x":"A 'choose TWO' question with five options is really five small true-or-false checks. The two correct options may come from different parts of the section, so do not stop after you find one. Check all five, then make sure you have written exactly two letters."},{"t":"example","q":"Which TWO problems followed the later school start? A Students went to bed later. B Bus timetables had to change. C Sports practices finished later. D Biology grades fell. E Teachers left the schools.","a":"B and C","x":"Each option is checked against the paragraph on problems. Bus timetables and later sports practices are both stated there. A is the opposite of what the study found, D is the opposite of the 4.5 per cent rise, and E is never mentioned."},{"t":"tip","x":"If you are sure of one letter and unsure of the second, write the sure one and your best guess. Each letter is marked separately, so one right letter still earns a mark."}]}],"drill":{"kind":"R","type":"mcq","time":10,"title":"Teenagers and the morning bell","instr":"Reading Passage 2 has six paragraphs, A-F. Questions 14-19: Choose the correct letter, A, B, C or D.","paras":[{"l":"A","x":"In most countries, secondary schools begin their day between 7.30 and 8.30 in the morning. For many teenagers this is a difficult hour. During puberty, the body releases melatonin, the hormone that makes people feel sleepy, roughly two hours later in the evening than it does in younger children. A fifteen-year-old who goes to bed at ten o'clock may therefore lie awake for a long time, not because of poor habits but because the body is not yet ready to sleep."},{"l":"B","x":"Sleep researchers recommend that adolescents get between eight and ten hours a night. Surveys in the United States suggest that fewer than a third do so on school nights. The shortfall is usually made up at weekends, when teenagers sleep late, but this pattern brings problems of its own. Shifting the time of waking by several hours every Saturday has an effect similar to flying across time zones, and it makes falling asleep on Sunday night even harder."},{"l":"C","x":"A lack of sleep does more than make students tired in class. It reduces the ability to concentrate and to store new information, and it has been linked to lower moods and a higher rate of road accidents among young drivers. For this reason, a number of school districts have experimented with later start times. One of the best known studies followed two high schools in Seattle, which moved their start from 7.50 to 8.45 in 2016."},{"l":"D","x":"Students at the Seattle schools wore wrist monitors that recorded their sleep for two weeks before the change and again a year later. On average, they slept 34 minutes longer per night after the change. They did not simply go to bed later, as some teachers had predicted; most went to bed at about the same time and woke later. Grades in biology, the one subject the researchers tracked, rose by 4.5 per cent, and the number of students arriving late or missing first lessons fell."},{"l":"E","x":"Not all of the effects were positive. Sports practices had to finish later, which meant that some students returned home after dark, and a few parents who drove their children to school found the new times hard to fit around their own working hours. Bus companies, which often use the same vehicles for several schools in sequence, also had to change their timetables, and in some districts this raised costs."},{"l":"F","x":"Such practical problems explain why many school boards that support the idea in principle have not adopted it. Supporters argue that the costs should be compared with the price of poor sleep, which is spread across health services, insurers and families and is therefore easy to overlook. Whether that argument succeeds may depend less on new research than on how well it is explained to the people who pay for buses."}],"qs":[{"q":"According to the writer, many teenagers find it hard to fall asleep early because","o":["they spend too long using screens in the evening.","their bodies produce a sleep hormone later than children's do.","they usually go to bed at ten o'clock.","younger children in the family keep them awake."],"a":1,"ev":"During puberty, the body releases melatonin, the hormone that makes people feel sleepy, roughly two hours later in the evening than it does in younger children.","why":"Melatonin is 'the hormone that makes people feel sleepy', and it is released later than in younger children. A sounds sensible but screens are never mentioned, and the text says the cause is 'not ... poor habits'. D borrows 'younger children' for a claim the passage does not make."},{"q":"What does the writer say about sleeping late at weekends?","o":["It allows teenagers to recover all the sleep they have lost.","It is most common among teenagers who travel abroad.","It can make the start of the next school week harder.","It is recommended by sleep researchers."],"a":2,"ev":"Shifting the time of waking by several hours every Saturday has an effect similar to flying across time zones, and it makes falling asleep on Sunday night even harder.","why":"Finding it harder to sleep on Sunday night makes Monday, the start of the week, harder. A is too extreme: the shortfall is 'made up', but the writer says the pattern 'brings problems of its own'. B misreads the comparison with flying across time zones."},{"q":"Why does the writer mention road accidents?","o":["To show that poor sleep matters outside school work.","To argue that teenagers should not drive to school.","To explain why the Seattle schools were chosen.","To compare the effects of tiredness and low mood."],"a":0,"ev":"A lack of sleep does more than make students tired in class.","why":"The paragraph opens by saying sleep loss 'does more than make students tired in class', and accidents are one example. C is tempting because Seattle follows in the same paragraph, but the accidents explain why districts tried later starts in general, not why these schools were chosen."},{"q":"What did the Seattle study find?","o":["Students went to bed later after the change.","Students' grades rose in every subject.","Most students kept similar bedtimes but woke later.","Students missed more first lessons than before."],"a":2,"ev":"most went to bed at about the same time and woke later","why":"'About the same time' is paraphrased as 'similar bedtimes'. A is what 'some teachers had predicted', which the study showed was wrong. B is too extreme because biology was 'the one subject the researchers tracked'. D is the opposite: the number missing first lessons fell."},{"q":"Which problem with the later start is mentioned?","o":["Teachers had to work longer hours.","Bus timetables had to be reorganised.","Sports practices were cancelled.","Parents had to collect children after dark."],"a":1,"ev":"Bus companies, which often use the same vehicles for several schools in sequence, also had to change their timetables","why":"'Had to change their timetables' matches 'had to be reorganised'. C is wrong because practices finished later; they were not cancelled. D joins 'parents' and 'after dark', which belong to two different points in the paragraph."},{"q":"What is the writer's view in the final paragraph?","o":["Further studies are needed before schools change their hours.","Most school boards are against later start times.","Health services should help to pay for school transport.","The outcome may depend on how clearly the case is put to those who fund transport."],"a":3,"ev":"Whether that argument succeeds may depend less on new research than on how well it is explained to the people who pay for buses.","why":"'How well it is explained to the people who pay for buses' matches D. A is the opposite of 'less on new research'. B contradicts 'support the idea in principle'. C uses 'health services', which appear only as one place where the cost of poor sleep falls."}]}},{"n":5,"title":"Band 8-9 question types","goal":"Today you will handle questions on the writer's purpose, opinion and main idea, which separate band 7 from band 8.","pages":[{"h":"Why does the writer mention X?","blocks":[{"t":"p","x":"A purpose question asks what job a detail is doing, not what it says. The stem usually reads 'The writer mentions X in order to' or 'Why does the writer refer to X?'. Find X, then read the sentence before it and the sentence after it, because the purpose is usually the claim that the detail supports."},{"t":"example","q":"Text: 'The difficulty lies in what the visitor counts actually measure. A single person who now drops into the Victoria and Albert Museum four times a year in place of once is recorded as four visits.' Why does the writer mention this person?","a":"To show that visit numbers can rise without more people visiting.","x":"The sentence before states the claim: visitor counts do not measure what they seem to. The example proves it. An option such as 'to show that most regular visitors live nearby' may be true later in the paragraph, but it is not the job this example does."},{"t":"tip","x":"Common purposes are: to give an example, to support a claim, to contrast two things, to criticise a view and to explain a cause. Decide which one fits before you read the options."}]},{"h":"The writer's view or someone else's?","blocks":[{"t":"p","x":"Harder passages report many voices: researchers, critics, supporters, governments. A stem that asks what the writer thinks wants the writer's own position, which is often signalled by 'yet', 'however', 'arguably', 'in fact' or 'the more serious problem is'. An option that gives the view of 'some commentators' is wrong if the writer goes on to disagree."},{"t":"pairs","x":[["These findings have led some commentators to claim that Roman concrete is simply better","the writer believes Roman concrete is better (wrong: this is not the writer's view)"],["Most engineers disagree.","experts reject the claim"],["Such visits are hard to value in economic terms, but they are arguably closer to what a public collection is for.","the writer approves of these visits"],["The more serious objection concerns money.","the writer sees funding as the bigger problem"]]},{"t":"trap","x":"Choosing the opinion that appears first. Writers often present a popular view and then question it. Read to the end of the argument before deciding what the writer believes."}]},{"h":"Whole-passage questions","blocks":[{"t":"p","x":"The last question in a set may ask for the writer's main purpose or the best title. Leave it until you have answered the others, because by then you have read most of the passage closely. Then test each option against the passage as a whole."},{"t":"p","x":"Wrong options here are usually **too narrow**, true of one paragraph only, or **too broad**, a topic the passage touches but does not discuss. Some are wrong in tone, such as 'to argue against' when the writer is balanced. The right option fits the beginning, the middle and the end."},{"t":"example","q":"A passage on free museum entry in Britain shows that visitor numbers mislead, praises some effects, criticises the funding and ends: 'Free entry is a reasonable starting condition rather than a solution in itself.' What is the writer's main purpose? A to argue for bringing back charges B to describe how museums are funded C to assess what free entry can and cannot achieve","a":"C","x":"A has the wrong tone, since the writer never asks for charges. B is too narrow, since funding fills one paragraph. C covers both the doubts and the praise and matches the balanced final sentence."}]},{"h":"Choose TWO at a high level","blocks":[{"t":"p","x":"Harder 'choose TWO' questions ask things like 'Which TWO claims does the writer make about planting?' The options are spread across several paragraphs, and at least one wrong option is true but was said by someone other than the writer, or said about a different subject."},{"t":"trap","x":"Picking two options because both appear in the passage, without checking the subject. If the question asks about planting, an option that describes a different method is wrong even though every word is in the text."},{"t":"bn","x":"ব্যান্ড ৮-৯ লেভেলে প্রশ্ন জিজ্ঞেস করে লেখক কেন কিছু বললেন, বা লেখকের নিজের মত কী। অন্যের মত আর লেখকের মত আলাদা করো। 'however', 'yet', 'arguably' এই শব্দগুলোর পরে সাধারণত লেখকের নিজের অবস্থান থাকে।"}]}],"drill":{"kind":"R","type":"mcq","time":15,"title":"The price of free museums","instr":"Reading Passage 3 has six paragraphs, A-F. Questions 27-32: Choose the correct letter, A, B, C or D.","paras":[{"l":"A","x":"In 2001 the British government removed admission charges at the national museums it funds. The policy is still regarded by many as one of the great cultural successes of recent decades, and the figures appear to support that view: visits to the museums that had previously charged rose by around 70 per cent in the first year. Yet economists who have looked closely at the data have reached a less comfortable conclusion about who, exactly, has benefited."},{"l":"B","x":"The difficulty lies in what the visitor counts actually measure. A single person who now drops into the Victoria and Albert Museum four times a year in place of once is recorded as four visits. Several studies have found that much of the increase after 2001 came from precisely this kind of repeat visiting by people who were already regular museum-goers, most of them university-educated and living nearby. The proportion of visitors from lower-income groups, which the policy was partly intended to raise, changed far less."},{"l":"C","x":"This should not be surprising. Surveys of people who rarely go to museums seldom name price as the main reason. More often they say that museums are 'not for people like me', that they would not know what to look at, or simply that they would rather spend their free time in other ways. Removing a charge of a few pounds does little to change these feelings, and in some cases may even reinforce the impression that museums are designed for a confident, well-informed public."},{"l":"D","x":"None of this means that free admission has failed. Museums that charge often find that visitors feel obliged to 'get their money's worth', moving quickly through every room and leaving exhausted. Free entry allows a different kind of use: a lunchtime visit to a single painting, a regular walk through a familiar gallery, a place to shelter from the rain that turns, unexpectedly, into an afternoon of looking. Such visits are hard to value in economic terms, but they are arguably closer to what a public collection is for."},{"l":"E","x":"The more serious objection concerns money. When charges were removed, the government promised to compensate museums for the income they lost. That payment was fixed in 2001 and has since fallen sharply in real terms, while the cost of heating, insuring and guarding large historic buildings has risen. Several museums have responded by charging for temporary exhibitions, sometimes at prices of twenty pounds or more, which brings back the very barrier the policy was meant to remove, only in a different place."},{"l":"F","x":"What the British case suggests is that admission price is a weaker tool than either its defenders or its critics assume. The museums that have been most successful at attracting new audiences are those that combined free entry with sustained work outside their own walls: partnerships with schools, events planned with local community groups, and staff whose job is to make a first visit feel less intimidating. Free entry, on this view, is a reasonable starting condition rather than a solution in itself."}],"qs":[{"q":"What point does the writer make about the 70 per cent rise in visits?","o":["It proves that the policy reached the people it was aimed at.","It was much larger than economists had predicted.","It may give a misleading picture of who gained from the policy.","It happened only at museums that had never charged."],"a":2,"ev":"Yet economists who have looked closely at the data have reached a less comfortable conclusion about who, exactly, has benefited.","why":"'Yet' signals that the figures 'appear' to support success but may mislead about 'who, exactly, has benefited'. A is the popular view the writer is about to question. D is the opposite: the rise was at museums 'that had previously charged'."},{"q":"The writer mentions a person visiting the Victoria and Albert Museum four times a year in order to","o":["show how visit numbers can rise without more people visiting.","suggest that most regular visitors live close to the museum.","give an example of the policy's success with new audiences.","compare the Victoria and Albert Museum with other national museums."],"a":0,"ev":"A single person who now drops into the Victoria and Albert Museum four times a year in place of once is recorded as four visits.","why":"The example supports the claim before it, that the problem lies in 'what the visitor counts actually measure': one person becomes four visits. B is true later in the paragraph, but it is not the job this example does. C is the opposite, since the person was already a visitor."},{"q":"According to surveys, people who rarely visit museums","o":["think that entry charges are too high.","often see museums as places meant for other kinds of people.","would go more often if museums opened later.","would visit if they knew which works to look at first."],"a":1,"ev":"More often they say that museums are 'not for people like me'","why":"'Not for people like me' is paraphrased as 'meant for other kinds of people'. A is contradicted by 'seldom name price as the main reason'. D twists 'would not know what to look at': the surveys report this as a feeling, not a promise to visit if it changed."},{"q":"What is the writer's attitude to the kinds of visit described in paragraph D?","o":["Doubtful, because they cannot be given an economic value.","Critical, as they are mainly made by people avoiding bad weather.","Approving, as they suit the purpose of a public collection.","Neutral, since they happen in both free and charging museums."],"a":2,"ev":"Such visits are hard to value in economic terms, but they are arguably closer to what a public collection is for.","why":"The sentence turns on 'but': the writer admits the visits are hard to value, then says they are closer to 'what a public collection is for', which is approval. A copies the first half of the sentence and ignores the 'but'. D is wrong because the writer contrasts these visits with behaviour in museums that charge."},{"q":"How does the writer view the charges for temporary exhibitions?","o":["As a fair way to pay for heating and insurance.","As a return of the problem that free entry tried to solve.","As the main reason that government payments fell.","As too low to cover the cost of the exhibitions."],"a":1,"ev":"which brings back the very barrier the policy was meant to remove, only in a different place","why":"'Brings back the very barrier the policy was meant to remove' means the old problem returns. C reverses cause and effect: the payments fell first, and the charges were the response. A takes the costs from the paragraph but the writer does not call the charges fair."},{"q":"What is the writer's main purpose in the passage?","o":["To argue that national museums should bring back admission charges.","To show that free entry has done more harm than good.","To describe how British museums are funded by the government.","To assess what free admission can and cannot achieve on its own."],"a":3,"ev":"Free entry, on this view, is a reasonable starting condition rather than a solution in itself.","why":"The writer questions the visitor figures, praises some effects, criticises the funding and ends by calling free entry a starting point, not a solution, which is a balanced assessment. A and B are the wrong tone, since paragraph D says free admission has not failed. C is too narrow because funding is only paragraph E."}]}},{"n":6,"title":"Mock test and final checklist","goal":"Today you will sit a timed mock set and finish with a checklist to use on exam day.","pages":[{"h":"How to sit the mock","blocks":[{"t":"p","x":"Treat this like the real test. Set a timer for 12 minutes, put your phone away and do not look up any words. In the exam this passage would come with seven or eight other questions, so 12 minutes for six multiple choice questions is the pace you need."},{"t":"steps","x":["Skim the seven paragraphs in about three minutes and note a few words beside each.","Answer the questions in order, reading each stem before its options.","Circle any question that takes longer than three minutes and come back to it at the end.","When time is up, stop, check your answers and read the explanation for every question, including the ones you got right."]},{"t":"tip","x":"For each mistake, write down which of the four wrong-option types caught you. After a few mocks you will see your own pattern, and that is the trap to watch for on test day."}]},{"h":"Final checklist","blocks":[{"t":"steps","x":["Read the stem first and say what it asks: cause, result, opinion, purpose or fact.","Use locator words and passage order to find the right sentences.","Form a rough answer before reading the options.","Test all four options and give every cross a reason.","Leave whole-passage questions until last and reject options that are too narrow or too broad.","Never leave a box empty."]},{"t":"example","q":"Last check on a mock answer: the stem asks 'What does the writer suggest about seedling numbers?' and you chose 'They are the figure that projects report most often.'","a":"Change it: the writer suggests the numbers say little about whether a forest will grow.","x":"Your option is true, but it is a detail, not what the writer suggests. The sentence goes on to say the number 'says almost nothing about whether a forest will result'. This is the 'true but not the answer' trap, and checking the stem one last time catches it."}]},{"h":"Staying calm on the day","blocks":[{"t":"p","x":"Fear of multiple choice usually comes from the feeling that every option could be right. After this week you have a method that does not depend on that feeling: find the place, test each option, give a reason. When you feel stuck, go back to the method instead of rereading in a panic."},{"t":"bn","x":"পরীক্ষার দিন ভয় লাগলে নিজেকে মনে করাও যে তোমার একটা নির্দিষ্ট পদ্ধতি আছে। stem পড়ো, জায়গা খোঁজো, প্রতিটা অপশন যাচাই করো। কোনো প্রশ্নে আটকে গেলে সময় নষ্ট না করে এগিয়ে যাও, পরে ফিরে এসো।"},{"t":"tip","x":"Breathe out slowly before each new passage and start with the first question, not the hardest one. One easy early mark settles the nerves better than anything else."}]}],"drill":{"kind":"R","type":"mcq","time":12,"title":"Replanting the mangroves","instr":"Reading Passage 3 has seven paragraphs, A-G. Questions 27-32: Choose the correct letter, A, B, C or D.","paras":[{"l":"A","x":"Mangrove forests grow along tropical coasts where the land meets the sea, in mud that is flooded by salt water twice a day. They protect shorelines from storms, store large amounts of carbon in their soils and provide nursery grounds for many fish that are later caught offshore. Yet between 1980 and 2000 roughly a fifth of the world's mangroves were lost, mainly to shrimp ponds, rice fields and coastal building. In response, governments and charities have planted mangrove seedlings on a very large scale."},{"l":"B","x":"The results have often been disappointing. A review of replanting projects in Sri Lanka, carried out after the 2004 tsunami, found that at more than half of the sites fewer than one in five seedlings had survived. In the Philippines, where several hundred million seedlings were planted between the 1980s and 2010, researchers estimated that most of the young trees had died within a few years. The money had been spent, the planting ceremonies photographed, and the coast was little changed."},{"l":"C","x":"The main reason is simple: many seedlings were put in the wrong place. Mangroves can only grow within a narrow band of the tide, where they are covered by water for part of the day and exposed to air for the rest. Large areas of open mudflat below this band look empty and therefore available, and they are attractive to planners because nobody owns them. But they are empty for a reason. Seedlings planted there spend too long under water and drown, or are washed away by waves before their roots take hold."},{"l":"D","x":"Species choice has caused further problems. Projects have frequently relied on a single species, usually of the genus Rhizophora, because its long seeds are easy to collect and plant by hand. Rhizophora does well in some positions but poorly in others, and plantations of one species support fewer kinds of crab, snail and fish than mixed natural forest. In places where several local species once grew together, a uniform plantation may look green from a distance while doing only part of the work of the forest it replaced."},{"l":"E","x":"An alternative approach, developed by the ecologist Robin Lewis in Florida during the 1980s and 1990s, begins with a different question: why did the mangroves disappear from this site, and what is stopping them coming back? Often the answer is that the flow of tidal water has been blocked by a road, a wall or an abandoned shrimp pond. Where this is corrected, mangroves usually return by themselves, since seeds are carried in on the tide fro
