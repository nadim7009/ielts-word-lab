 verb."},{"wrong":"English is speak in many countries.","right":"English is spoken in many countries.","why":"The passive needs the past participle: spoken."}],"starters":["I was brought up in…","My hometown is known for…","It is often said that…","I was taught by…","A lot of new buildings have been built…","I think more should be done to…"],"q":[{"t":"mcq","sk":"W","q":"English ___ in many countries around the world.","o":["is spoken","is speak","speaks"],"a":0,"why":"The passive is be plus the past participle: is spoken.","bn":"passive = be + V3।"},{"t":"gap","sk":"W","q":"The bridge was ___ (build) in 2022.","a":["built"],"why":"After 'was', use the past participle. Build is irregular: built."},{"t":"tap","sk":"W","s":"The new hospital was open by the Prime Minister last year.","w":"open","o":["opening","opens","opened"],"a":2,"why":"The passive needs the past participle: was opened.","bn":"was এর পরে V3।"},{"t":"dict","sk":"L","s":"The letters are sorted by machine and then delivered by hand.","why":"Listen for the -ed endings on sorted and delivered."},{"t":"mcq","sk":"W","q":"Paper ___ recycled several times before it becomes too weak.","o":["is can","can","can be"],"a":2,"why":"After a modal like can, the passive is 'be' plus the past participle."},{"t":"gap","sk":"W","q":"Many old houses in the area have been ___ (pull) down to make space for flats.","a":["pulled"],"why":"'Have been' plus the past participle is the present perfect passive."},{"t":"tap","sk":"W","s":"The accident was happened because the driver fell asleep.","w":"was","o":["has","(remove)","is"],"a":1,"why":"Happen has no object, so it cannot be passive. Just say 'happened'.","bn":"happen এর passive হয় না।"},{"t":"mcq","sk":"W","q":"First, the raw materials ___ to the factory by lorry.","o":["transported","transport","are transport","are transported"],"a":3,"why":"Processes use the present simple passive: are plus past participle."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: In the final stage of the process, the purified water","o":["pumps into storage tanks by itself.","is pumped into storage tanks.","is pump into storage tanks."],"a":1,"why":"Water does not pump itself, so use the passive with the past participle: is pumped."},{"t":"dict","sk":"L","s":"Most of the plastic that is thrown away is never recycled.","why":"Listen for 'is thrown' and 'is recycled'. The -ed in recycled is a soft d."},{"t":"tap","sk":"W","s":"The process is consisted of five stages.","w":"consisted","o":["consisting","consist","made up"],"a":2,"why":"Consist of is never passive. Use 'is made up of' or 'consists of'.","bn":"is consist of নয়, consists of।"},{"t":"gap","sk":"W","q":"In the past, children were ___ (teach) to write on slates.","a":["taught"],"why":"Teach is irregular: teach, taught, taught."},{"t":"mcq","sk":"W","q":"It ___ that the old palace was built in the seventeenth century.","o":["believes","is believing","is believed","believed"],"a":2,"why":"The fixed phrase is 'it is believed that'."},{"t":"order","sk":"W","s":"The museum was designed by a famous Italian architect.","why":"Use 'by' when the person who did the action matters."},{"t":"tap","sk":"W","s":"A new law will introduced to reduce plastic waste.","w":"introduced","o":["be introduced","been introduced","introduce"],"a":0,"why":"The future passive is will be plus the past participle."},{"t":"dict","sk":"L","s":"It is believed that the temple was built more than a thousand years ago.","why":"Listen for 'it is believed that' and 'was built'."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: Although the method was first described in the nineteen fifties,","o":["it did not widely use until much later.","but it was not widely used until much later.","it was not widely used until much later."],"a":2,"why":"Do not add 'but' after 'although', and the method was used by people, so use the passive.","bn":"although এর পরে but বসে না।"},{"t":"gap","sk":"W","q":"The results will be ___ (publish) next month in a medical journal.","a":["published"],"why":"'Will be' plus the past participle is the future passive."},{"t":"tap","sk":"W","s":"The data were collected from three hospitals and analyse using special software.","w":"analyse","o":["analyses","analysed","analysing"],"a":1,"why":"Both verbs share 'were', so the second needs the past participle too: analysed."},{"t":"mcq","sk":"W","q":"Over the last decade, the speed limit ___ twice.","o":["has been lower","has been lowered","has lowered","was lowering"],"a":1,"why":"A limit cannot lower itself, so use the present perfect passive: has been lowered."},{"t":"dict","sk":"L","s":"The rubbish is collected every Monday and taken to a recycling centre.","why":"Listen for 'is collected' and 'taken'. Both are passive."},{"t":"mcq","sk":"W","q":"The patient ___ to hospital as soon as the ambulance arrived.","o":["took","was took","was taken","has taken"],"a":2,"why":"The patient did not do the taking, so use the passive with the past participle: was taken.","bn":"take এর V3 হলো taken।"},{"t":"speak","sk":"S","q":"Describe a building in your town that you like.","need":"\\b(is|are|was|were|been|be|being)\\s+(\\w+\\s+)?\\w+(ed|en|t|wn)\\b","hint":"Say when or how it was built, using the passive.","model":"It was built about fifty years ago, and it has recently been painted bright yellow.","why":"Buildings are usually described with the passive: was built, was designed."},{"t":"tap","sk":"W","s":"These houses are build from bamboo and mud in many coastal villages.","w":"build","o":["built","builds","building"],"a":0,"why":"After 'are' in a passive, use the past participle: built."},{"t":"gap","sk":"W","q":"Smoking should ___ banned in all public places, in my opinion.","a":["be"],"why":"After a modal, the passive needs 'be': should be banned.","bn":"should এর পরে be + V3।"},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: Many of the paintings that were damaged in the fire","o":["have since been carefully restored.","has since been carefully restored.","have since been carefully restore.","have since carefully restored."],"a":0,"why":"The paintings were restored by someone, so use the passive. 'Many of the paintings' is plural, so 'have'."},{"t":"order","sk":"S","s":"More money should be spent on public transport.","why":"A modal passive: should be plus the past participle."},{"t":"tap","sk":"W","s":"It is widely believe that the new policy will reduce traffic in the capital.","w":"believe","o":["believes","believed","believing"],"a":1,"why":"The fixed phrase uses the past participle: it is widely believed that."},{"t":"mcq","sk":"W","q":"By the time the firefighters arrived, most of the building ___.","o":["had already destroyed","was already destroying","had already been destroyed","has already been destroyed"],"a":2,"why":"The damage was done before a past point, and the building was the thing affected, so use the past perfect passive."},{"t":"speak","sk":"S","q":"What could be done to reduce traffic in big cities?","need":"\\b(be|been)\\s+(\\w+\\s+)?\\w+(ed|en|t|wn)\\b","hint":"Use modal passives like 'should be introduced'.","model":"I think more bus lanes should be built, and cars could be banned from city centres on certain days.","why":"Modal passives sound natural when you suggest solutions."}]},{"id":"relative","title":"Relative clauses","bn":"রিলেটিভ ক্লজ (who, which, that)","why":"Writing and Speaking examiners look for complex sentences, and a correct relative clause is the easiest way to show one without errors.","rules":[{"h":"who, which and that","en":"Use who for people and which for things. In clauses without commas, that works for both, and the relative word replaces he, she or it, so do not add them again.","bn":"মানুষের কথা বললে who, জিনিসের কথা বললে which; কমা ছাড়া clause-এ দুটোর জায়গাতেই that বসানো যায়। who বা which-এর পরে আবার it, he, they লিখবে না।","ex":["Students who study abroad often become more independent.","The bridge that collapsed last year has finally been rebuilt."]},{"h":"where, when and whose","en":"Use where for places, when for times and whose to show that something belongs to someone.","bn":"জায়গার জন্য where, সময়ের জন্য when, আর কারও কিছু আছে বোঝাতে whose (যার)।","ex":["This is the village where my father grew up.","Families whose homes were flooded received emergency support."]},{"h":"Commas change the meaning","en":"A non-defining clause adds extra information and sits between commas. After a comma, never use that; use who or which.","bn":"যে তথ্য বাদ দিলেও মূল অর্থ ঠিক থাকে, সেটা দুই কমার মাঝে বসে। কমার পরে that হবে না, who বা which হবে।","ex":["Dhaka, which is the capital of Bangladesh, has more than twenty million people.","My brother, who works in Dubai, sends money home every month."]},{"h":"which for a whole idea","en":"After a comma, which can refer to the whole previous clause, not just one noun. Do not use what or it here.","bn":"আগের পুরো ঘটনাটা বোঝাতে কমা দিয়ে which বসাও। এখানে what বা it বসালে ভুল হবে।","ex":["Rents rose sharply, which forced many students to share rooms.","The train was cancelled, which meant I missed the interview."]},{"h":"Reduced relative clauses","en":"You can shorten who/which + verb to an -ing form for active meaning or a past participle for passive meaning.","bn":"who/which + verb ছোট করে লেখা যায়: active হলে -ing (people living), passive হলে V3 (goods produced)।","ex":["People living in cities usually have better access to hospitals.","Most of the rice grown in the region is sold abroad."]}],"traps":[{"wrong":"The man which lives next door is a doctor.","right":"The man who lives next door is a doctor.","why":"Use who for people, not which."},{"wrong":"This is the book which I read it last month.","right":"This is the book which I read last month.","why":"which already replaces it, so delete it."},{"wrong":"Paris, that is famous for its museums, attracts millions of tourists.","right":"Paris, which is famous for its museums, attracts millions of tourists.","why":"Never use that after a comma."},{"wrong":"The city where I visited last year was very crowded.","right":"The city that I visited last year was very crowded.","why":"visit takes a direct object, so use that or which."},{"wrong":"Students who they failed the test must retake it.","right":"Students who failed the test must retake it.","why":"who is already the subject; do not add they."}],"starters":["One thing that I really enjoy about my hometown is...","I grew up in an area where...","There was a teacher at my school who...","Something which worries me a bit is...","People living in big cities tend to...","The main problem, which a lot of people ignore, is that..."],"q":[{"t":"mcq","sk":"W","q":"The teacher ___ helped me most was very patient.","o":["who","which","where"],"a":0,"why":"A teacher is a person, so we use who.","bn":"মানুষের জন্য who।"},{"t":"mcq","sk":"W","q":"This is the area ___ the new hospital will be built.","o":["which","where","who"],"a":1,"why":"area is a place and the clause is complete, so where fits."},{"t":"gap","sk":"W","q":"A dentist is a person ___ looks after people's teeth.","a":["who","that"],"why":"person needs who, or that in a defining clause."},{"t":"mcq","sk":"W","q":"Children ___ parents read to them tend to have larger vocabularies.","o":["who","whose","which"],"a":1,"why":"The parents belong to the children, so whose is correct.","bn":"'যাদের বাবা-মা' বোঝাতে whose।"},{"t":"tap","sk":"W","s":"The man which repaired my laptop charged a fair price.","w":"which","o":["who","what","whose"],"a":0,"why":"The man is a person, so use who."},{"t":"dict","sk":"L","s":"The library where I study every evening closes at nine.","why":"Listen for where after a place noun."},{"t":"mcq","sk":"S","q":"I still remember the day ___ I got my exam results.","o":["when","which","what"],"a":0,"why":"day is a time, and the clause is complete, so we use when."},{"t":"gap","sk":"W","q":"That is the café ___ we first met.","a":["where","in which"],"why":"café is a place and the clause has no object missing, so where."},{"t":"tap","sk":"W","s":"This is the phone that I bought it last week.","w":"it","o":["(remove)","them","one"],"a":0,"why":"that already stands for the phone, so it repeats the object.","bn":"that-এর পরে আবার it লাগে না।"},{"t":"mcq","sk":"W","q":"Bangladesh, ___ is one of the most densely populated countries, faces serious flooding.","o":["that","who","which"],"a":2,"why":"This is a non-defining clause between commas about a thing, so which, never that."},{"t":"dict","sk":"L","s":"My sister, who lives in Chittagong, is training to be a nurse.","why":"Notice the pause around the extra information starting with who."},{"t":"tap","sk":"W","s":"My uncle, that works in a hospital, told me about the new rules.","w":"that","o":["who","which","whom"],"a":0,"why":"After a comma we cannot use that; for a person use who."},{"t":"gap","sk":"W","q":"I have a friend ___ brother plays cricket for Bangladesh.","a":["whose"],"why":"The brother belongs to the friend, so whose.","bn":"'যার ভাই' মানে whose।"},{"t":"mcq","sk":"W","q":"The government raised fuel taxes, ___ led to protests in several cities.","o":["that","which","what","it"],"a":1,"why":"which after a comma refers to the whole previous idea, the tax rise.","bn":"পুরো ঘটনাকে বোঝাতে কমা + which।"},{"t":"order","sk":"W","s":"I met a woman whose son studies in London.","why":"whose comes straight after the noun it describes, a woman."},{"t":"tap","sk":"W","s":"The office where I work in has no windows.","w":"in","o":["(remove)","at","on"],"a":0,"why":"where already means in which, so in is repeated."},{"t":"dict","sk":"L","s":"Students whose parents speak English at home often find listening easier.","why":"whose sounds like who's; spell it w-h-o-s-e.","bn":"whose আর who's শুনতে একই, বানান আলাদা।"},{"t":"mcq","sk":"W","q":"Most of the electricity ___ in the region comes from coal.","o":["producing","produced","which produced"],"a":1,"why":"Electricity is produced by someone, so the reduced clause needs the past participle."},{"t":"gap","sk":"W","q":"The amount of plastic ___ (dump) in rivers each year is shocking.","a":["dumped","being dumped"],"why":"Plastic is dumped by people, so the reduced clause takes the past participle."},{"t":"tap","sk":"W","s":"The number of people who owns a car has doubled since 2010.","w":"owns","o":["own","owning","is owning"],"a":0,"why":"who refers to people, which is plural, so the verb is own.","bn":"who-র আগের শব্দ people, তাই verb plural।"},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: The researchers interviewed farmers …","o":["whose crops had been damaged by salt water.","which crops had been damaged by salt water.","who their crops had been damaged by salt water."],"a":0,"why":"whose links the farmers to their crops. which cannot show possession, and who their repeats the pronoun."},{"t":"order","sk":"S","s":"The town where I grew up has changed a lot.","why":"The where clause sits inside the subject, before the main verb has."},{"t":"tap","sk":"W","s":"The report, which published last year, showed a fall in crime.","w":"published","o":["was published","publishing","publishes"],"a":0,"why":"A report does not publish anything; it is published, so we need the passive."},{"t":"gap","sk":"W","q":"The bus was late again, ___ meant I missed the start of the exam.","a":["which"],"why":"which after a comma refers to the whole situation of the bus being late."},{"t":"dict","sk":"L","s":"Rents went up again this year, which forced many families to move.","why":"Listen for which after the pause, referring to the whole idea."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: Coral reefs, which cover less than one per cent of the ocean floor, …","o":["that support about a quarter of all marine species.","which support about a quarter of all marine species.","support about a quarter of all marine species."],"a":2,"why":"The relative clause is already finished, so the sentence now needs its main verb, support.","bn":"মূল বাক্যের verb এখনো আসেনি।"},{"t":"tap","sk":"W","s":"Many workers lost their jobs, what caused a sharp rise in poverty.","w":"what","o":["which","that","it"],"a":0,"why":"To refer back to a whole clause after a comma, use which, not what."},{"t":"speak","sk":"S","q":"Describe a place in your hometown that you like visiting.","need":"\\b(where|which|that|who|whose)\\b","hint":"Describe it with where, which or who","model":"There's a small lake near my house where I go in the evenings, which helps me forget about exams for a while.","why":"Relative clauses let you add detail without starting new sentences."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: The number of students enrolling in online courses rose sharply in 2020, …","o":["that surprised many universities.","which forced many universities to invest in digital platforms.","when forced universities to invest in digital platforms."],"a":1,"why":"After a comma, which refers to the whole rise. that cannot follow a comma, and when needs a subject."},{"t":"speak","sk":"S","q":"What kind of people do well in big cities?","need":"\\bpeople\\s+(who|that|whose|living|working|with)\\b|\\b(those|anyone|someone)\\s+(who|that|living|working)\\b","hint":"Use people who... or people living...","model":"People who can adapt quickly usually do well, while those living far from work often feel exhausted.","why":"A people who or people living phrase answers Part 3 directly."}]},{"id":"cond","title":"Conditionals","bn":"কন্ডিশনাল (if দিয়ে বাক্য)","why":"Speaking Part 3 is full of hypothetical questions, and a clean second or third conditional is a clear sign of band 7 grammar in Speaking and Writing.","rules":[{"h":"Zero and first conditional","en":"For general facts use the present in both parts. For a real future possibility use if + present and will in the other part; never put will after if.","bn":"সবসময় সত্য এমন কিছু হলে দুই অংশেই present। ভবিষ্যতে সত্যিই ঘটতে পারে এমন কিছু হলে if-এর পরে present, অন্য অংশে will; if-এর পরে will নয়।","ex":["If you heat ice, it melts.","If it rains tomorrow, the match will be cancelled."]},{"h":"Second conditional","en":"For imaginary or unlikely situations use if + past simple and would + base verb. In formal English use were with I, he and she.","bn":"কাল্পনিক বা অসম্ভব অবস্থা বোঝাতে if + past, অন্য অংশে would + verb। ফরমাল ইংরেজিতে I, he, she সবার সাথে were।","ex":["If I were the education minister, I would make sport compulsory.","If governments invested more in public transport, fewer people would drive."]},{"h":"Third conditional","en":"For past events that did not happen use if + had + past participle and would have + past participle. Do not put would have in the if part.","bn":"অতীতে যা ঘটেনি তা নিয়ে কল্পনা: if + had + V3, অন্য অংশে would have + V3। if-এর অংশে would have বসবে না।","ex":["If I had started earlier, I would have got a better score.","If the warning had come sooner, fewer people would have died."]},{"h":"Mixed conditionals","en":"Mix the forms when a past condition has a present result, or a present fact affected the past.","bn":"অতীতের কোনো ঘটনার ফল এখন দেখাতে if + had + V3, তারপর would + verb। উল্টোটাও হতে পারে।","ex":["If I had learnt to swim as a child, I would not be afraid of water now.","If she were more organised, she would have finished on time."]},{"h":"unless, provided that, as long as","en":"unless means if not, so do not add another not. provided that and as long as mean only if, and they take a present verb for the future.","bn":"unless মানে if not, তাই এর পরে আবার not লাগবে না। provided that আর as long as মানে 'শুধু যদি'।","ex":["Unless we reduce plastic use, our rivers will become even dirtier.","You can borrow the car as long as you return it by six."]}],"traps":[{"wrong":"If I will get band 7, I will apply to Canada.","right":"If I get band 7, I will apply to Canada.","why":"No will after if in the first conditional."},{"wrong":"If I would have known, I would have helped.","right":"If I had known, I would have helped.","why":"The if part takes had + past participle."},{"wrong":"If I am the mayor, I would build more parks.","right":"If I were the mayor, I would build more parks.","why":"would in the result needs a past form after if."},{"wrong":"Unless you don't practise, you won't improve.","right":"Unless you practise, you won't improve.","why":"unless already means if not."},{"wrong":"If people would recycle more, there would be less waste.","right":"If people recycled more, there would be less waste.","why":"Use the past simple after if, not would."}],"starters":["If I were in charge of..., I would probably...","If governments invested more in..., people would...","Looking back, if I had..., I would have...","As long as people..., I don't see a problem with...","Unless something changes, I think... will...","I'd definitely... if I had more time."],"q":[{"t":"mcq","sk":"W","q":"If water reaches 100 degrees Celsius, it ___.","o":["boils","boiled","would boil"],"a":0,"why":"This is a scientific fact, so the zero conditional uses the present in both parts."},{"t":"mcq","sk":"S","q":"If it ___ this weekend, we will have the picnic indoors.","o":["will rain","rains","rained"],"a":1,"why":"First conditional: present after if, will in the other part.","bn":"if-এর পরে will বসে না।"},{"t":"gap","sk":"W","q":"If you press this button, the machine ___ (stop).","a":["stops","will stop"],"why":"A general fact or a real result: stops or will stop."},{"t":"mcq","sk":"W","q":"If I ___ more free time, I would learn to play the guitar.","o":["have","had","will have"],"a":1,"why":"would in the result shows an imaginary situation, so if takes the past."},{"t":"tap","sk":"W","s":"If you will need help, call me on this number.","w":"will","o":["(remove)","would","shall"],"a":0,"why":"No will after if for a real future condition.","bn":"if-এর পরে will নয়।"},{"t":"dict","sk":"L","s":"If it rains tomorrow, we will move the class indoors.","why":"Notice rains, not will rain, after if."},{"t":"mcq","sk":"W","q":"Many lives ___ if the bridge had been inspected properly.","o":["would be saved","would have been saved","will be saved"],"a":1,"why":"had been inspected is third conditional, so the result is would have been saved."},{"t":"gap","sk":"W","q":"If I ___ (be) the mayor, I would plant trees on every street.","a":["were","was"],"why":"Second conditional takes the past; were is the better choice in formal writing.","bn":"ফরমাল লেখায় I were।"},{"t":"tap","sk":"W","s":"If I were you, I will take the earlier train.","w":"will","o":["would","shall","can"],"a":0,"why":"'If I were you' is the second conditional, so the result needs would."},{"t":"mcq","sk":"S","q":"You can join the advanced course ___ you have a basic level of English.","o":["unless","provided that","even if"],"a":1,"why":"provided that means only if, which matches the condition for joining."},{"t":"dict","sk":"L","s":"If I had more free time, I would learn to cook.","why":"Listen for the contracted I'd sound; would is often reduced in fast speech.","bn":"দ্রুত কথায় would ছোট হয়ে 'd শোনায়।"},{"t":"tap","sk":"W","s":"If they had left earlier, they would have catch the train.","w":"catch","o":["caught","catching","catches"],"a":0,"why":"would have needs the past participle, caught."},{"t":"gap","sk":"W","q":"If she ___ (study) harder last term, she would have passed.","a":["had studied"],"why":"would have passed is third conditional, so if + had + past participle."},{"t":"mcq","sk":"W","q":"___ the city builds more flood defences, low-lying areas will be at risk every monsoon.","o":["Unless","Provided that","As long as"],"a":0,"why":"The meaning is if the city does not build, so unless.","bn":"unless মানে if not।"},{"t":"order","sk":"W","s":"Ice melts if you leave it in the sun.","why":"The pronoun it must come after ice, so the main clause goes first."},{"t":"tap","sk":"W","s":"Unless you don't book early, the tickets will sell out.","w":"don't","o":["(remove)","won't","didn't"],"a":0,"why":"unless already contains the negative meaning."},{"t":"dict","sk":"L","s":"You can use the library as long as you bring your card.","why":"as long as is said quickly as one unit."},{"t":"mcq","sk":"W","q":"If she had taken the job in Singapore, she ___ much more money now.","o":["would have earned","would earn","will earn"],"a":1,"why":"Past condition, present result (now): a mixed conditional with would + base verb.","bn":"now থাকলে would + verb।"},{"t":"gap","sk":"W","q":"We will miss the flight ___ we leave now.","a":["unless"],"why":"The meaning is if we do not leave now."},{"t":"tap","sk":"W","s":"If I live closer to the university, I would cycle there every day, but my flat is too far away.","w":"live","o":["lived","will live","have lived"],"a":0,"why":"The speaker does not live close, so the situation is imaginary: if + past simple, then would + base verb."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: If governments taxed sugary drinks more heavily, …","o":["obesity rates would probably fall.","obesity rates will have fallen.","obesity rates would have fallen last year."],"a":0,"why":"taxed after if is the second conditional, so the result needs would + base verb."},{"t":"order","sk":"S","s":"Had I known about the traffic, I would have left earlier.","why":"Had I known is a formal way of saying If I had known, and it comes at the start of the sentence."},{"t":"tap","sk":"W","s":"If I were you, I would to apply for the scholarship.","w":"to","o":["(remove)","have","be"],"a":0,"why":"would is a modal and takes the bare verb without to.","bn":"would-এর পরে to বসে না।"},{"t":"gap","sk":"W","q":"If I had saved more money last year, I ___ (be) able to travel now.","a":["would be"],"why":"Past cause, present result: a mixed conditional with would be."},{"t":"dict","sk":"L","s":"If they had checked the data, they would have noticed the mistake.","why":"would have sounds like would've; write have, never of."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: Had the dam been designed to cope with heavier rainfall, …","o":["the village will not flood.","the village does not flood.","the village would not have flooded."],"a":2,"why":"Had the dam been is an inverted third conditional, so the result is would have + past participle.","bn":"Had দিয়ে শুরু মানে if ... had।"},{"t":"tap","sk":"W","s":"If I had learnt English as a child, I will feel more confident now.","w":"will","o":["would","shall","had"],"a":0,"why":"Past condition with a present result: would + base verb."},{"t":"speak","sk":"S","q":"What would you change about your city if you could?","need":"\\bif\\b.*\\b(would|could|might|'d)\\b|\\b(would|could|might|'d)\\b.*\\bif\\b","hint":"Use If I were..., I would...","model":"If I were in charge, I would build proper footpaths, because walking in Dhaka is really unsafe at the moment.","why":"Part 3 hypotheticals want the second conditional."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: Crop yields are expected to remain stable …","o":["unless rainfall will stay close to the average.","provided that rainfall stays close to the average.","if rainfall would stay close to the average."],"a":1,"why":"provided that takes a present verb for the future; will and would do not follow if or unless here."},{"t":"speak","sk":"S","q":"What could the government have done to reduce traffic in your city?","need":"\\b(would|could|might|should)(\\s+not|n't)?\\s+have\\s+\\w+","hint":"Use if they had..., ... would have...","model":"If they had built the metro twenty years earlier, far fewer people would have bought cars.","why":"Talking about the past that did not happen needs the third conditional.","bn":"অতীতের কল্পনা: had + V3, would have + V3।"}]},{"id":"contrast","title":"Contrast and cause linkers","bn":"বৈপরীত্য ও কারণ বোঝানোর শব্দ","why":"Linkers are marked twice in Writing and Speaking, under Coherence and Cohesion and under Grammar, so errors like although with but cost double.","rules":[{"h":"although, though, even though","en":"These are followed by a full clause with a subject and a verb. Do not add but in the other half of the sentence.","bn":"although, though, even though-এর পরে পুরো clause বসে। বাংলায় 'যদিও... কিন্তু' বলি, কিন্তু ইংরেজিতে although থাকলে but বসবে না।","ex":["Although the course was expensive, it was worth every taka.","Even though I left early, I missed the bus."]},{"h":"despite and in spite of","en":"These are followed by a noun or an -ing form, not a clause. To add a clause, write despite the fact that.","bn":"despite আর in spite of-এর পরে noun বা -ing বসে, পুরো বাক্য নয়। পুরো বাক্য বসাতে চাইলে despite the fact that লেখো।","ex":["Despite the heavy rain, the match went ahead.","In spite of having little money, she finished her degree."]},{"h":"however, nevertheless, therefore","en":"These usually start a new sentence and are followed by a comma. Do not join two full sentences with only a comma and however.","bn":"however, nevertheless, therefore সাধারণত নতুন বাক্যের শুরুতে বসে, পরে কমা। দুটো পূর্ণ বাক্য শুধু কমা দিয়ে জোড়া লাগাবে না।","ex":["Public transport is cheap. However, it is often overcrowded.","The plan was costly. Nevertheless, the council approved it."]},{"h":"whereas and while","en":"Use whereas or while to compare two facts in one sentence. This is very useful for Task 1 comparisons.","bn":"দুটো তথ্যের তুলনা এক বাক্যে করতে whereas বা while। Task 1-এ এটা খুব কাজে লাগে।","ex":["In 2000 most homes had a landline, whereas by 2020 almost everyone used a mobile.","Men spent more on transport, while women spent more on food."]},{"h":"because vs because of / due to","en":"because takes a clause; because of and due to take a noun. For results, use so, therefore or as a result.","bn":"because-এর পরে clause, কিন্তু because of আর due to-এর পরে শুধু noun। ফল বোঝাতে so, therefore বা as a result।","ex":["The flight was delayed because the weather was bad.","The delay was due to bad weather, so many passengers missed connections."]}],"traps":[{"wrong":"Although the rent is high, but the location is excellent.","right":"Although the rent is high, the location is excellent.","why":"Use although or but, never both."},{"wrong":"Despite it was raining, we went out.","right":"Despite the rain, we went out.","why":"despite takes a noun or -ing, not a clause."},{"wrong":"The course was difficult, however, most students passed.","right":"The course was difficult. However, most students passed.","why":"however starts a new sentence; a comma is not enough."},{"wrong":"Many people moved to cities due to they wanted better jobs.","right":"Many people moved to cities because they wanted better jobs.","why":"due to takes a noun; use because before a clause."},{"wrong":"Because of the government invested in solar power, costs fell.","right":"Because the government invested in solar power, costs fell.","why":"because of needs a noun, not a clause."}],"starters":["Although I enjoy..., I sometimes find it...","Despite the fact that..., most people still...","In my city..., whereas in villages...","That's mainly because...","Mostly due to..., ...","I see the point. However, I think..."],"q":[{"t":"mcq","sk":"W","q":"___ it was late, the shop was still busy.","o":["Although","Despite","However"],"a":0,"why":"it was late is a clause, so we need although.","bn":"clause-এর আগে although।"},{"t":"mcq","sk":"W","q":"The match continued ___ the heavy rain.","o":["although","despite","even though"],"a":1,"why":"the heavy rain is a noun phrase, so despite."},{"t":"gap","sk":"W","q":"___ the traffic, I arrived on time.","a":["despite","in spite of"],"why":"the traffic is a noun phrase, so despite or in spite of."},{"t":"mcq","sk":"S","q":"I stayed at home ___ I had a bad cold.","o":["because","because of","due to"],"a":0,"why":"I had a bad cold is a clause, so because."},{"t":"tap","sk":"W","s":"Although the hotel was cheap, but the rooms were clean.","w":"but","o":["(remove)","so","and"],"a":0,"why":"although and but cannot be used together.","bn":"although থাকলে but বাদ দাও।"},{"t":"dict","sk":"L","s":"Although the test was difficult, most of the class passed.","why":"There is no but after although, so do not write one."},{"t":"mcq","sk":"W","q":"Flights were cancelled ___ the storm.","o":["because","because of","although"],"a":1,"why":"the storm is a noun, so because of.","bn":"noun-এর আগে because of।"},{"t":"gap","sk":"W","q":"She got the job ___ she had no experience.","a":["although","though","even though","despite the fact that"],"why":"she had no experience is a clause showing contrast."},{"t":"tap","sk":"W","s":"Despite he was tired, he kept studying.","w":"Despite","o":["Although","In spite","However"],"a":0,"why":"he was tired is a clause, so we need although."},{"t":"mcq","sk":"W","q":"Men spent more time on sport, ___ women spent more time on shopping.","o":["whereas","despite","because of"],"a":0,"why":"whereas compares two facts, and both halves are clauses."},{"t":"dict","sk":"L","s":"Despite the cold weather, thousands of people attended the concert.","why":"despite is followed directly by the noun phrase."},{"t":"tap","sk":"W","s":"The project was cancelled because of it was too expensive.","w":"of","o":["(remove)","to","for"],"a":0,"why":"it was too expensive is a clause, so use because alone."},{"t":"gap","sk":"W","q":"The flood was ___ to heavy rainfall upstream.","a":["due","owing","attributed","linked","related"],"why":"be due to + noun explains a cause.","bn":"কারণ বোঝাতে due to + noun।"},{"t":"mcq","sk":"W","q":"Public transport is cheap. ___, many people still prefer to drive.","o":["Although","However","Despite"],"a":1,"why":"A new sentence followed by a comma needs a sentence linker like However."},{"t":"order","sk":"W","s":"Did she really pass the exam despite having so little time?","why":"despite comes before the -ing form having."},{"t":"tap","sk":"W","s":"The decline was mainly because the falling birth rate.","w":"because","o":["due to","although","despite"],"a":0,"why":"the falling birth rate is a noun phrase, so due to."},{"t":"dict","sk":"L","s":"The trains were delayed because of a problem with the signals.","why":"Listen for the small word of after because.","bn":"because of-এর of খুব আস্তে শোনা যায়।"},{"t":"mcq","sk":"W","q":"Fuel prices doubled; ___, fewer people drove to work.","o":["as a result","because of","due to"],"a":0,"why":"The second part is a result of the first, and it is a full clause."},{"t":"gap","sk":"W","q":"Exports rose by 10%, ___ imports fell slightly.","a":["whereas","while","but"],"why":"Two contrasting facts in one sentence need whereas or while."},{"t":"tap","sk":"W","s":"In spite of feel ill, she sat the exam.","w":"feel","o":["feeling","felt","to feel"],"a":0,"why":"in spite of is followed by a noun or an -ing form."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: Despite receiving generous funding, …","o":["but the project failed to meet its targets.","however the project failed to meet its targets.","the project failed to meet its targets."],"a":2,"why":"despite already gives the contrast, so the main clause needs no but or however.","bn":"despite থাকলে but লাগে না।"},{"t":"order","sk":"S","s":"Do you enjoy your job even though the hours are long?","why":"even though joins the second clause to the main clause."},{"t":"tap","sk":"W","s":"Rural incomes rose slowly, despite urban incomes rose quickly.","w":"despite","o":["whereas","because of","in spite"],"a":0,"why":"Two clauses being compared need whereas, not despite.","bn":"দুটো তথ্যের তুলনায় whereas।"},{"t":"gap","sk":"W","q":"The fees went up. ___, fewer international students applied.","a":["as a result","therefore","consequently","so","thus","as a consequence"],"why":"The second sentence is a result of the first."},{"t":"dict","sk":"L","s":"Prices fell in the city, whereas they rose in rural areas.","why":"whereas is stressed on the second syllable."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: The decline in bee populations is partly due to …","o":["farmers use more pesticides.","the increased use of pesticides.","because pesticides are used more."],"a":1,"why":"due to must be followed by a noun phrase, not a clause."},{"t":"tap","sk":"W","s":"Even the weather was terrible, the festival went ahead.","w":"Even","o":["Even though","Despite","However"],"a":0,"why":"even alone is not a linker; even though introduces the clause."},{"t":"speak","sk":"S","q":"Do you like living in your hometown?","need":"\\b(although|though|even though|but|despite|in spite of|however|whereas|while)\\b","hint":"Give a contrast with although or despite","model":"Yes, mostly, although the traffic can be a nightmare during rush hour.","why":"A quick contrast makes a Part 1 answer sound balanced."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: Although urban air quality has improved in Europe, …","o":["many cities still exceed safe limits.","but many cities still exceed safe limits.","despite many cities still exceeding safe limits."],"a":0,"why":"The sentence needs a main clause with no extra but; the despite option leaves no main verb."},{"t":"speak","sk":"S","q":"Why do some people refuse to use public transport?","need":"\\b(because|due to|since|as a result|therefore|so)\\b","hint":"Give reasons with because, due to or as a result","model":"Mainly because buses are overcrowded, and due to the heat, even a short trip can feel exhausting.","why":"Part 3 why questions need clear cause linkers.","bn":"কারণ বলতে because, due to।"}]},{"id":"modals","title":"Modals and hedging","bn":"মোডাল ও সতর্কভাবে মত প্রকাশ","why":"Task 2 essays lose marks for absolute claims and broken modal forms, while careful hedging like tends to sounds mature in Writing and Speaking.","rules":[{"h":"Modal + base verb","en":"After must, can, should, might and could, use the base verb. Never add to, -ing or -s.","bn":"must, can, should, might-এর পরে verb-এর মূল রূপ বসে। to, -ing বা -s কিছুই লাগবে না।","ex":["Students should practise speaking every day.","She can speak three languages."]},{"h":"How sure are you?","en":"must means you are almost sure, may, might and could mean it is possible, and can't means you are sure it is not true.","bn":"কতটা নিশ্চিত: must মানে প্রায় নিশ্চিত, may/might/could মানে হতে পারে, can't মানে নিশ্চিতভাবে না।","ex":["The lights are off, so they must be asleep.","That can't be true; the shop closed years ago."]},{"h":"Obligation and advice","en":"must and have to show something is necessary, and should gives advice. don't have to means it is not necessary, but mustn't means it is not allowed.","bn":"must ও have to মানে করতেই হবে; should মানে পরামর্শ। don't have to মানে দরকার নেই, mustn't মানে নিষেধ।","ex":["You mustn't use your phone during the exam.","You don't have to bring a pen; we will provide one."]},{"h":"Hedging in Task 2","en":"Soften big claims with tends to, is likely to, seems to or it could be argued that. Examiners prefer careful claims to words like always and everyone.","bn":"Task 2-এ 'সবাই', 'সবসময়' এমন বড় দাবি না করে tend to, is likely to, it could be argued that দিয়ে নরম করে বলো।","ex":["Young people tend to spend more time online than their parents.","It could be argued that tourism does more harm than good."]},{"h":"should have / could have + past participle","en":"Use these to talk about the past: should have for regret or criticism, could have for a possibility that did not happen.","bn":"অতীতে যা করা উচিত ছিল বা সম্ভব ছিল কিন্তু হয়নি: should have / could have + V3।","ex":["The council should have built better drains.","We could have taken the train, but we chose to drive."]}],"traps":[{"wrong":"Students must to wear a uniform.","right":"Students must wear a uniform.","why":"must takes the base verb without to."},{"wrong":"I can able to speak English fluently.","right":"I am able to speak English fluently.","why":"Use can or be able to, not both."},{"wrong":"People should reducing their meat intake.","right":"People should reduce their meat intake.","why":"should takes the base verb, not -ing."},{"wrong":"He should have went to the doctor.","right":"He should have gone to the doctor.","why":"should have needs the past participle, gone."},{"wrong":"You don't must pay for the museum.","right":"You don't have to pay for the museum.","why":"must has no do form; use don't have to."}],"starters":["It could be argued that...","I might be wrong, but I think...","People my age tend to...","Looking back, I should have...","It's quite likely that in the future...","That seems to be mainly because..."],"q":[{"t":"mcq","sk":"W","q":"Drivers ___ stop at a red light.","o":["must","might","could"],"a":0,"why":"This is a rule, so must shows obligation."},{"t":"mcq","sk":"S","q":"You ___ bring your own laptop, but you can if you prefer.","o":["mustn't","don't have to","shouldn't"],"a":1,"why":"It is not necessary but allowed, so don't have to.","bn":"don't have to = দরকার নেই।"},{"t":"gap","sk":"W","q":"You ___ smoke in the hospital. It's against the rules.","a":["mustn't","must not","can't","cannot"],"why":"It is not allowed, so mustn't or can't."},{"t":"mcq","sk":"W","q":"Children ___ spend less time in front of screens.","o":["should","ought","must to"],"a":0,"why":"should is followed by the base verb; ought needs to, and must to is wrong."},{"t":"tap","sk":"W","s":"We must to finish the report by Friday.","w":"to","o":["(remove)","have","be"],"a":0,"why":"must takes the base verb without to.","bn":"must-এর পরে to নয়।"},{"t":"dict","sk":"L","s":"You don't have to come early, but you must bring your passport.","why":"Contrast don't have to with must."},{"t":"mcq","sk":"S","q":"She's not answering her phone. She ___ be in a meeting.","o":["must to","should have","might"],"a":2,"why":"might shows a possibility in the present."},{"t":"gap","sk":"W","q":"Students ___ (not/have to) wear a uniform at university.","a":["don't have to","do not have to","didn't have to","did not have to"],"why":"It is not necessary, so don't have to."},{"t":"tap","sk":"W","s":"I can able to cook simple meals.","w":"can","o":["am","could","may"],"a":0,"why":"Use am able to; can and able to mean the same thing."},{"t":"mcq","sk":"W","q":"Older people ___ to find new technology harder to learn.","o":["might","tend","should"],"a":1,"why":"tend to softens a general claim; might and should cannot take to here."},{"t":"dict","sk":"L","s":"Students who sleep well tend to perform better in exams.","why":"tend to is often said quickly, like tenda.","bn":"tend to দ্রুত শোনায় tenda।"},{"t":"tap","sk":"W","s":"Teenagers should spending less time online.","w":"spending","o":["spend","to spend","spent"],"a":0,"why":"should needs the base verb."},{"t":"gap","sk":"W","q":"Young people ___ to adopt new technology faster than older adults.","a":["tend","seem","appear"],"why":"tend to or seem to hedges a general claim.","bn":"tend to দিয়ে সাধারণ প্রবণতা।"},{"t":"mcq","sk":"W","q":"Sea levels are ___ to rise further this century.","o":["likely","probably","maybe"],"a":0,"why":"be likely to + verb is the correct pattern.","bn":"be likely to + verb।"},{"t":"order","sk":"W","s":"Most people tend to trust their family doctor.","why":"tend to comes right after the subject, then the base verb."},{"t":"tap","sk":"W","s":"She cans speak three languages.","w":"cans","o":["can","is can","could to"],"a":0,"why":"Modals never take -s, even with he or she."},{"t":"dict","sk":"L","s":"It could be argued that tourism does more harm than good.","why":"could be argued is one smooth chunk."},{"t":"mcq","sk":"W","q":"That ___ be John at the door; he's on holiday in Spain.","o":["mustn't","shouldn't","can't"],"a":2,"why":"can't shows you are sure something is impossible; mustn't means not allowed."},{"t":"gap","sk":"W","q":"I should ___ (study) harder for my last exam.","a":["have studied"],"why":"Regret about the past: should have + past participle."},{"t":"tap","sk":"W","s":"You should have came to the party.","w":"came","o":["come","coming","went"],"a":0,"why":"should have needs the past participle, come."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: It could be argued that …","o":["online learning to be as effective as classroom teaching.","online learning is as effective as classroom teaching.","online learning being as effective as classroom teaching."],"a":1,"why":"that must be followed by a full clause with a finite verb, is."},{"t":"order","sk":"S","s":"I might have left my keys at the office.","why":"might have + past participle shows a past possibility."},{"t":"tap","sk":"W","s":"Prices are likely rise next year.","w":"rise","o":["to rise","rising","rose"],"a":0,"why":"The pattern is be likely to + base verb."},{"t":"gap","sk":"W","q":"It ___ be argued that cars should be banned from city centres.","a":["could","might","may","can"],"why":"It could be argued that is a standard academic hedge."},{"t":"dict","sk":"L","s":"I should have booked the tickets earlier because now they are sold out.","why":"should have sounds like should've; write have."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: The findings suggest that the disease may …","o":["spreading faster in warmer climates.","to spread faster in warmer climates.","spread faster in warmer climates."],"a":2,"why":"may is a modal and takes the base verb, spread.","bn":"may-এর পরে verb-এর মূল রূপ।"},{"t":"tap","sk":"W","s":"The streets are wet, so it can have rained last night.","w":"can","o":["must","should","would"],"a":0,"why":"For a logical conclusion about the past, use must have.","bn":"অতীত নিয়ে নিশ্চিত অনুমান: must have।"},{"t":"speak","sk":"S","q":"Will people still read printed books in the future?","need":"\\b(might|may|could|probably|likely|tend to|seems? to)\\b","hint":"Predict with might, could or likely to","model":"Printed books will probably become less common, but I think they might survive as gifts and for children.","why":"Hedged predictions sound more natural than flat yes or no answers."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: With hindsight, the city planners should …","o":["have protected the wetlands from development.","protected the wetlands from development.","had protected the wetlands from development."],"a":0,"why":"For criticism of the past, use should have + past participle."},{"t":"speak","sk":"S","q":"Is there anything you wish you had done differently at school?","need":"\\b(should|could|might)(\\s+not|n't)?\\s+have\\s+\\w+","hint":"Use should have or could have + past participle","model":"I should have joined the debate club, because I could have built my speaking confidence much earlier.","why":"Regret about the past is a natural place for should have.","bn":"আফসোস বোঝাতে should have + V3।"}]},{"id":"gerund","title":"Gerund or infinitive","bn":"-ing নাকি to + verb","why":"Wrong verb patterns like enjoy to watch are small but frequent slips that pull down your grammar score in both Speaking and Writing.","rules":[{"h":"Verbs followed by -ing","en":"After enjoy, avoid, consider, suggest, admit, finish, mind and keep, use the -ing form.","bn":"enjoy, avoid, consider, suggest, admit, finish, mind-এর পরে verb-এ -ing লাগে।","ex":["I enjoy cooking for my friends.","The minister admitted making a mistake."]},{"h":"Verbs followed by to","en":"After decide, plan, hope, refuse, afford, manage and agree, use to + base verb.","bn":"decide, plan, hope, refuse, afford, manage, agree-এর পরে to + verb বসে।","ex":["We decided to take the train.","Many families cannot afford to buy a flat."]},{"h":"stop, remember, try","en":"These verbs take both forms but the meaning changes. stop to do means pause in order to do it; stop doing means quit. remember to do is about a duty; remember doing is a memory.","bn":"stop to do মানে কিছু করার জন্য থামা, stop doing মানে ছেড়ে দেওয়া। remember to do মানে করতে মনে রাখা, remember doing মানে করার স্মৃতি।","ex":["I stopped to buy some water.","I remember visiting Sylhet as a child."]},{"h":"Preposition + -ing","en":"After a preposition always use -ing. The to in look forward to and be used to is a preposition, so it also takes -ing.","bn":"preposition-এর পরে সবসময় -ing। look forward to আর be used to-এর to-ও preposition, তাই পরে -ing।","ex":["She is interested in learning Korean.","I look forward to hearing from you."]},{"h":"-ing as subject, adjective + to","en":"Use the -ing form when an action is the subject of a sentence. After adjectives like difficult, easy and hard, use to + verb.","bn":"বাক্যের subject হিসেবে কাজ বোঝাতে -ing (Reading helps)। difficult, easy, hard-এর পরে to + verb।","ex":["Reading in English improves your vocabulary.","It is difficult to find cheap housing in Dhaka."]}],"traps":[{"wrong":"I enjoy to watch football.","right":"I enjoy watching football.","why":"enjoy is always followed by -ing."},{"wrong":"I look forward to meet you.","right":"I look forward to meeting you.","why":"to here is a preposition, so -ing follows."},{"wrong":"She suggested to take a taxi.","right":"She suggested taking a taxi.","why":"suggest takes -ing, not to + verb."},{"wrong":"Many families cannot afford buying a flat.","right":"Many families cannot afford to buy a flat.","why":"afford takes to + verb."},{"wrong":"Learn a new language takes time.","right":"Learning a new language takes time.","why":"An action as subject needs the -ing form."}],"starters":["I really enjoy... because...","Lately I've been thinking of...","I've decided to... next year.","I'm really looking forward to...","To be honest, it's quite hard to...","I stopped... a while ago because..."],"q":[{"t":"mcq","sk":"W","q":"I enjoy ___ to music while I study.","o":["listening","to listen","listen"],"a":0,"why":"enjoy is followed by the -ing form.","bn":"enjoy-এর পরে -ing।"},{"t":"mcq","sk":"S","q":"We decided ___ the train instead of the bus.","o":["taking","to take","take"],"a":1,"why":"decide is followed by to + verb."},{"t":"gap","sk":"W","q":"Would you mind ___ (open) the window?","a":["opening"],"why":"mind is followed by -ing."},{"t":"mcq","sk":"W","q":"She is good at ___ people feel relaxed.","o":["make","to make","making"],"a":2,"why":"at is a preposition, so it takes -ing."},{"t":"tap","sk":"W","s":"I really enjoy cook for my friends at weekends.","w":"cook","o":["cooking","to cook","cooked"],"a":0,"why":"enjoy is followed by -ing."},{"t":"dict","sk":"L","s":"I enjoy reading in English before I go to bed.","why":"Listen for the -ing ending on reading."},{"t":"mcq","sk":"S","q":"I'm looking forward to ___ my family next month.","o":["see","seeing","saw"],"a":1,"why":"The to in look forward to is a preposition, so -ing follows.","bn":"look forward to + -ing।"},{"t":"gap","sk":"W","q":"They managed ___ (finish) the project on time.","a":["to finish"],"why":"manage is followed by to + verb."},{"t":"tap","sk":"W","s":"We are planning visiting Cox's Bazar in December.","w":"visiting","o":["to visit","visit","visited"],"a":0,"why":"plan is followed by to + verb.","bn":"plan-এর পরে to + verb।"},{"t":"mcq","sk":"W","q":"Many young people cannot afford ___ a home in the capital.","o":["to buy","buying","buy"],"a":0,"why":"afford takes to + verb."},{"t":"dict","sk":"L","s":"We are hoping to visit our grandparents during the holidays.","why":"hope takes to + verb; to is very weak in speech.","bn":"to খুব আস্তে উচ্চারিত হয়।"},{"t":"tap","sk":"W","s":"She suggested go to the museum on Sunday.","w":"go","o":["going","to go","went"],"a":0,"why":"suggest is followed by -ing."},{"t":"gap","sk":"W","q":"I'm thinking of ___ (apply) for a master's degree.","a":["applying"],"why":"of is a preposition, so -ing.","bn":"preposition-এর পরে -ing।"},{"t":"mcq","sk":"W","q":"On the way home, I stopped ___ some bread.","o":["buying","to buy","buy"],"a":1,"why":"You stopped in order to buy bread, so stop to do."},{"t":"order","sk":"W","s":"She avoided eating sugar for the whole month.","why":"avoid comes before the -ing form eating."},{"t":"tap","sk":"W","s":"I look forward to hear from you soon.","w":"hear","o":["hearing","heard","be hearing"],"a":0,"why":"look forward to takes -ing because to is a preposition."},{"t":"dict","sk":"L","s":"Learning a second language takes a lot of patience.","why":"The sentence starts with an -ing subject."},{"t":"mcq","sk":"W","q":"___ part in sport helps children make friends.","o":["Taking","Take","To taking"],"a":0,"why":"An action as the subject takes the -ing form."},{"t":"gap","sk":"W","q":"It is not easy ___ (find) a part-time job in a small town.","a":["to find"],"why":"After an adjective like easy, use to + verb."},{"t":"tap","sk":"W","s":"Live in a big city can be very stressful.","w":"Live","o":["Living","To living","Lived"],"a":0,"why":"The subject of the sentence is an action, so use -ing."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: Many governments have considered …","o":["introduce a tax on plastic bags.","introducing a tax on plastic bags.","to introduce a tax on plastic bags."],"a":1,"why":"consider is followed by the -ing form.","bn":"consider-এর পরে -ing।"},{"t":"order","sk":"S","s":"It is difficult to find a quiet place to study.","why":"It is + adjective + to + verb."},{"t":"tap","sk":"W","s":"My parents refused letting me study abroad.","w":"letting","o":["to let","let","having let"],"a":0,"why":"refuse is followed by to + verb."},{"t":"gap","sk":"W","q":"Please remember ___ (send) me the file before Friday.","a":["to send"],"why":"remember to do is about something you must not forget to do."},{"t":"dict","sk":"L","s":"I look forward to meeting you at the conference next week.","why":"Notice meeting, not meet, after look forward to."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: Researchers found it surprisingly difficult …","o":["recruit older volunteers.","to recruit older volunteers.","for recruiting older volunteers."],"a":1,"why":"find it difficult + to + verb is the standard pattern."},{"t":"tap","sk":"W","s":"She is used to wake up at five every morning.","w":"wake","o":["waking","woke","be waking"],"a":0,"why":"In be used to, to is a preposition, so -ing follows.","bn":"be used to + -ing মানে অভ্যস্ত।"},{"t":"speak","sk":"S","q":"What do you enjoy doing in your free time?","need":"\\b(enjoy|enjoys|love|loves|like|likes|prefer|fancy)\\s+\\w+ing\\b","hint":"Use enjoy, love or like + -ing","model":"I really enjoy playing badminton with my friends, and lately I've started cooking simple meals too.","why":"Answer with the same pattern the examiner used: enjoy + -ing."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: The company is committed to …","o":["reduce its carbon emissions by 2030.","reduced its carbon emissions by 2030.","reducing its carbon emissions by 2030."],"a":2,"why":"In be committed to, to is a preposition, so the verb takes -ing."},{"t":"speak","sk":"S","q":"What should people do to stay healthy in big cities?","need":"^\\s*\\w+ing\\b|\\b(try|avoid|stop|keep|consider|start)\\s+\\w+ing\\b|\\b(important|hard|difficult|easy|essential|better|good)\\s+to\\s+\\w+","hint":"Use avoid + -ing or it's important to...","model":"Walking instead of taking a rickshaw helps a lot, and it's important to avoid eating too much fried street food.","why":"Mixing -ing and to patterns shows grammatical range.","bn":"-ing আর to দুই ধরনই ব্যবহার করো।"}]},{"id":"prep","title":"Dependent prepositions","bn":"নির্দিষ্ট শব্দের সাথে নির্দিষ্ট preposition","why":"Task 1 reports depend on a rise in versus rose by, and wrong prepositions after common verbs are some of the most repeated errors in Writing.","rules":[{"h":"in, by, of, from, to with changes","en":"Use in after the noun for the thing that changes: a rise in prices. Use by for the amount after a verb, of for the amount after a noun, and from and to for levels.","bn":"কোন জিনিস বাড়ল তা বোঝাতে noun-এর পরে in (a rise in prices)। কতটুকু বাড়ল: verb-এর পরে by, noun-এর পরে of; কোন স্তর থেকে কোন স্তরে: from ... to।","ex":["There was a sharp increase in rice prices.","Sales rose by 15%, an increase of 300 units, to reach 2,300."]},{"h":"in, on, at for time","en":"Use in for years, months and seasons, on for days and dates, and at for clock times and night.","bn":"বছর, মাস, ঋতুর আগে in; দিন বা তারিখের আগে on; ঘড়ির সময় আর night-এর আগে at।","ex":["The figures peaked in 2010.","The shop is closed on Fridays, and most accidents happen at night."]},{"h":"Adjective + preposition","en":"Some adjectives always take the same preposition: responsible for, aware of, dependent on, similar to, different from.","bn":"কিছু adjective-এর সাথে নির্দিষ্ট preposition বসে: responsible for, aware of, dependent on, similar to, different from। জোড়া ধরে মুখস্থ করো।","ex":["Parents are responsible for their children's safety.","Many people are not aware of the risks."]},{"h":"Verb + preposition","en":"Learn depend on, focus on and contribute to as fixed pairs. result in is followed by the effect, and result from is followed by the cause.","bn":"depend on, focus on, contribute to। result in-এর পরে ফল, result from-এর পরে কারণ বসে।","ex":["Deforestation results in soil erosion.","Many health problems result from poor diet."]},{"h":"No preposition after these verbs","en":"discuss, emphasise, enter, reach, mention and lack (as a verb) take a direct object with no preposition.","bn":"discuss, emphasise, enter, reach, mention আর verb হিসেবে lack-এর পরে preposition লাগে না। বাংলায় 'নিয়ে আলোচনা' বলি বলে about বসিয়ে ফেলি।","ex":["This essay will discuss both views.","Many rural schools lack qualified teachers."]}],"traps":[{"wrong":"We discussed about the problem.","right":"We discussed the problem.","why":"discuss takes a direct object; no about."},{"wrong":"The village lacks of clean water.","right":"The village lacks clean water.","why":"lack as a verb takes no preposition."},{"wrong":"There was a rise of house prices.","right":"There was a rise in house prices.","why":"Use in for the thing that rises."},{"wrong":"The price increased with 20%.","right":"The price increased by 20%.","why":"Use by for the amount of change."},{"wrong":"Smoking can result to lung cancer.","right":"Smoking can result in lung cancer.","why":"result in is followed by the effect."}],"starters":["It really depends on...","To be honest, I wasn't aware of... until...","My hometown is quite different from...","At the moment I'm mainly focusing on...","I think that has resulted in...","I'd say parents are mostly responsible for..."],"q":[{"t":"mcq","sk":"W","q":"The museum is closed ___ Mondays.","o":["in","on","at"],"a":1,"why":"Use on with days of the week.","bn":"দিনের আগে on।"},{"t":"mcq","sk":"S","q":"I usually study best ___ night.","o":["at","in","on"],"a":0,"why":"We say at night."},{"t":"gap","sk":"W","q":"The company was founded ___ 1998.","a":["in"],"why":"Use in with years."},{"t":"mcq","sk":"W","q":"There was a sharp increase ___ the number of tourists.","o":["of","in","on"],"a":1,"why":"increase in + the thing that increases."},{"t":"tap","sk":"W","s":"The exam begins in nine o'clock tomorrow.","w":"in","o":["at","on","by"],"a":0,"why":"Use at with clock times."},{"t":"dict","sk":"L","s":"The library is closed on Sundays and opens at nine on Mondays.","why":"Listen for on before days and at before the time."},{"t":"mcq","sk":"W","q":"The price of petrol rose ___ 20% between 2015 and 2020.","o":["with","by","of"],"a":1,"why":"After the verb rise, by gives the amount.","bn":"কতটুকু বাড়ল: verb + by।"},{"t":"gap","sk":"W","q":"Our city's transport system is quite similar ___ the one in Delhi.","a":["to"],"why":"The fixed pair is similar to.","bn":"similar-এর পরে to।"},{"t":"tap","sk":"W","s":"We discussed about climate change in class.","w":"about","o":["(remove)","on","of"],"a":0,"why":"discuss takes a direct object.","bn":"discuss-এর পরে about নয়।"},{"t":"mcq","sk":"S","q":"My sister's personality is very different ___ mine.","o":["from","than","with"],"a":0,"why":"In British English the standard form is different from."},{"t":"dict","sk":"L","s":"There was a steady increase in the number of foreign students.","why":"increase in is linked: increa-sin.","bn":"increase in জুড়ে শোনায়।"},{"t":"tap","sk":"W","s":"Good results depend of regular practice.","w":"of","o":["on","in","from"],"a":0,"why":"The fixed pair is depend on."},{"t":"gap","sk":"W","q":"In this essay, I will focus ___ the economic effects of tourism.","a":["on","upon"],"why":"The fixed pair is focus on."},{"t":"mcq","sk":"W","q":"Parents are responsible ___ teaching children good manners.","o":["of","for","about"],"a":1,"why":"responsible for, followed by -ing here because for is a preposition."},{"t":"order","sk":"W","s":"Parents are responsible for their children's safety.","why":"responsible is followed by for."},{"t":"tap","sk":"W","s":"Many students are not aware about the risks of online loans.","w":"about","o":["of","for","with"],"a":0,"why":"The fixed pair is aware of."},{"t":"dict","sk":"L","s":"Many farmers in the region are dependent on the monsoon rains.","why":"dependent on is linked smoothly in speech."},{"t":"mcq","sk":"W","q":"Unemployment fell from 8% in 2010 ___ 5% in 2020.","o":["by","to","at"],"a":1,"why":"from one level to another level."},{"t":"gap","sk":"W","q":"The number of cars rose from 2 million ___ 3.5 million.","a":["to"],"why":"from one level to another level."},{"t":"tap","sk":"W","s":"When the train reached to Dhaka, it was already dark.","w":"to","o":["(remove)","at","in"],"a":0,"why":"reach takes a direct object; arrive in would need in.","bn":"reach-এর পরে to নয়।"},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: Deforestation in the region has resulted …","o":["in severe soil erosion.","from severe soil erosion.","to severe soil erosion."],"a":0,"why":"Soil erosion is the effect of deforestation, so result in. result from would reverse cause and effect.","bn":"result in + ফল, result from + কারণ।"},{"t":"order","sk":"S","s":"It really depends on the weather.","why":"depends on is a fixed pair; really comes before the verb."},{"t":"tap","sk":"W","s":"There was a significant rise of unemployment after the factory closed.","w":"of","o":["in","on","at"],"a":0,"why":"rise in + the thing that rises; rise of is for the amount."},{"t":"gap","sk":"W","q":"Car sales increased ___ 10% in 2019, reaching a peak of 50,000.","a":["by"],"why":"The verb increase + by gives the amount of change."},{"t":"dict","sk":"L","s":"The report focuses on the causes and does not mention the solutions.","why":"Notice there is no word after mention before the solutions."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: Many island nations remain heavily dependent …","o":["of tourism for income.","on tourism for income.","with tourism for income."],"a":1,"why":"The fixed pair is dependent on."},{"t":"tap","sk":"W","s":"Air pollution contributes for many respiratory diseases in South Asia.","w":"for","o":["to","in","on"],"a":0,"why":"The fixed pair is contribute to."},{"t":"speak","sk":"S","q":"What do you usually do at weekends?","need":"\\b(on|at)\\s+(the\\s+)?(weekends?|saturdays?|fridays?|sundays?|night)\\b|\\bin the (morning|evening|afternoon)\\b","hint":"Use on Fridays, at night or in the morning","model":"On Fridays I usually visit my family, and at night I watch a film with my roommates.","why":"Time prepositions are easy points in Part 1."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: The report emphasises …","o":["on the need for cleaner energy.","about the need for cleaner energy.","the need for cleaner energy."],"a":2,"why":"The verb emphasise takes a direct object; only the noun emphasis takes on."},{"t":"speak","sk":"S","q":"What has caused the rise in traffic in many cities?","need":"\\b(rise|increase|growth|fall|drop) in\\b|\\bresult(s|ed)? (in|from)\\b|\\bcontribut\\w* to\\b|\\bdue to\\b|\\bdepends? on\\b","hint":"Use a rise in, contribute to or result from","model":"The rise in traffic mainly results from cheap car loans, and poor public transport also contributes to the problem.","why":"Fixed preposition pairs make a Part 3 answer sound precise.","bn":"result from + কারণ।"}]},{"id":"wordform","title":"Word forms","bn":"শব্দের রূপভেদ","why":"Wrong word forms lower your Writing and Speaking grammar score, and in Listening and Reading a gap answer in the wrong form is marked wrong.","rules":[{"h":"One word family, four jobs","en":"Many words have a noun, verb, adjective and adverb form. Economy is a noun, economic means about the economy, economical means saving money, and economically is the adverb.","bn":"একটি শব্দ পরিবারের সাধারণত noun, verb, adjective ও adverb রূপ থাকে। economic মানে অর্থনীতি সংক্রান্ত, আর economical মানে খরচ বাঁচায় এমন।","ex":["The country has strong economic growth.","A small car is more economical than a large one."]},{"h":"Adjective + noun, adverb + verb","en":"Put an adjective before a noun and an adverb after a verb. Task 1 needs both: a sharp rise, or prices rose sharply.","bn":"noun-এর আগে adjective বসে, আর verb-এর পরে adverb বসে। যেমন a sharp rise কিন্তু rose sharply।","ex":["There was a significant increase in sales.","Sales increased significantly in 2019."]},{"h":"Rise, fall, increase: noun or verb","en":"Words like rise, fall, increase and decline can be nouns or verbs. After a, the or an adjective they are nouns; after a subject they are verbs.","bn":"rise, fall, increase এগুলো noun বা verb দুটোই হতে পারে। a বা the-এর পরে noun, আর subject-এর পরে verb হিসেবে বসে।","ex":["There was a steady fall in unemployment.","Unemployment fell steadily."]},{"h":"Use the words around the gap","en":"In Reading and Listening gaps, look at the word before the gap. After the, a or an adjective you need a noun; after very or a linking verb like is you need an adjective; after a verb you often need an adverb.","bn":"gap-এর আগের শব্দ দেখুন। the বা a-এর পরে noun, very বা is-এর পরে adjective, আর verb-এর পরে সাধারণত adverb লাগে।","ex":["The museum is famous for the beauty of its gardens.","The new road made travel very convenient."]},{"h":"Endings give you clues","en":"Endings like -tion, -ment, -ness and -ity usually mark nouns; -al, -ive, -ous and -ful mark adjectives; -ly marks most adverbs.","bn":"শব্দের শেষাংশ দেখে রূপ চেনা যায়। -tion, -ment noun; -al, -ful, -ous adjective; আর -ly সাধারণত adverb।","ex":["The development of the area was slow.","The project was highly successful."]}],"traps":[{"wrong":"There was a significantly increase in sales.","right":"There was a significant increase in sales.","why":"Before a noun, use an adjective, not an adverb."},{"wrong":"The number of tourists rose sharp in 2010.","right":"The number of tourists rose sharply in 2010.","why":"A verb like rose needs an adverb."},{"wrong":"Plastic is a serious environment problem.","right":"Plastic is a serious environmental problem.","why":"Use the adjective form before the noun problem."},{"wrong":"Education is very importance for children.","right":"Education is very important for children.","why":"After very, you need an adjective."},{"wrong":"The government should invest in economical growth.","right":"The government should invest in economic growth.","why":"Economic is about the economy; economical means cheap to run."}],"starters":["There has been a noticeable change in ...","It has become increasingly difficult to ...","Financially, it makes more sense to ...","I'd say it has improved dramatically over the last few years.","The biggest difference is the ...","Honestly, it's far more convenient to ..."],"q":[{"t":"mcq","sk":"W","q":"The graph shows a ___ rise in the price of rice between 2000 and 2010.","o":["sharp","sharply","sharpen"],"a":0,"why":"Rise is a noun here (after a), so it needs an adjective: a sharp rise.","bn":"noun-এর আগে adjective বসে।"},{"t":"mcq","sk":"W","q":"Car sales fell ___ after the new tax was introduced.","o":["dramatic","drama","dramatically"],"a":2,"why":"Fell is a verb, so describe it with an adverb: fell dramatically.","bn":"verb-এর পরে adverb বসে।"},{"t":"mcq","sk":"L","q":"Please bring some proof of your ___ when you collect your library card.","o":["identify","identical","identity"],"a":2,"why":"After your you need a noun. Identity is the noun; identify is a verb."},{"t":"mcq","sk":"W","q":"Public transport is more ___ than driving, as it costs far less.","o":["economic","economical","economy"],"a":1,"why":"Economical means saving money. Economic is about the economy as a whole."},{"t":"mcq","sk":"S","q":"I think the internet has ___ changed the way students learn.","o":["completely","complete","completion"],"a":0,"why":"Changed is a verb, so it needs an adverb: completely changed."},{"t":"mcq","sk":"W","q":"The ___ of the new bridge took almost three years.","o":["construct","construction","constructive"],"a":1,"why":"After the, you need a noun. Words ending in -tion are usually nouns.","bn":"the-এর পরে noun লাগে।"},{"t":"mcq","sk":"W","q":"There is little ___ that fast food alone causes obesity.","o":["evident","evidently","evidence"],"a":2,"why":"Little here needs a noun after it: little evidence. Evident is an adjective."},{"t":"mcq","sk":"R","q":"Complete the summary with the correct word form: The study found that regular exercise had a ___ effect on students' memory.","o":["benefit","beneficial","beneficially"],"a":1,"why":"Between a and the noun effect, you need an adjective: a beneficial effect."},{"t":"mcq","sk":"R","q":"Complete the sentence with the correct word form: Early farming communities depended ___ on the river for water.","o":["heavily","heavy","heaviness"],"a":0,"why":"Depended is a verb, so an adverb fits: depended heavily on."},{"t":"mcq","sk":"R","q":"Complete the sentence with the correct word form: The decline in bee numbers is a serious threat to the ___ of many food crops.","o":["productive","productively","production"],"a":2,"why":"After the and before of you need a noun: the production of crops.","bn":"the ___ of হলে মাঝখানে noun বসে।"},{"t":"tap","sk":"W","s":"The number of students increased significant between 2005 and 2015.","w":"significant","o":["significantly","significance","signify"],"a":0,"why":"Increased is a verb, so it needs the adverb significantly.","bn":"verb-এর পরে -ly যুক্ত adverb বসান।"},{"t":"tap","sk":"W","s":"There was a dramatically fall in unemployment last year.","w":"dramatically","o":["drama","dramatic","dramatise"],"a":1,"why":"Fall is a noun here, so use the adjective dramatic before it."},{"t":"tap","sk":"W","s":"Many young people are not confidence when they speak English.","w":"confidence","o":["confidently","confide","confident"],"a":2,"why":"After are not, you need an adjective: confident. Confidence is a noun.","bn":"be verb-এর পরে adjective লাগে।"},{"t":"tap","sk":"W","s":"Living in a big city can be very stress for older people.","w":"stress","o":["stressful","stressed","stressfully"],"a":0,"why":"After very, use an adjective. Stressful describes the city life; stressed describes a person's feeling."},{"t":"tap","sk":"W","s":"Plastic waste causes serious environment damage in rivers.","w":"environment","o":["environments","environmental","environmentally"],"a":1,"why":"Damage is a noun, so the word before it should be the adjective environmental."},{"t":"tap","sk":"W","s":"Online learning allows students to study more flexible at home.","w":"flexible","o":["flexibility","flex","flexibly"],"a":2,"why":"Study is a verb, so use the adverb flexibly to describe how they study."},{"t":"tap","sk":"W","s":"The successful of the project depended on local support.","w":"successful","o":["success","succeed","successfully"],"a":0,"why":"After the and before of you need a noun: the success of the project.","bn":"the ___ of এর মাঝে noun বসে।"},{"t":"gap","sk":"W","q":"Rice production rose ___ (steady) over the decade.","a":["steadily"],"why":"Rose is a verb, so use the adverb steadily."},{"t":"gap","sk":"W","q":"The ___ (develop) of new technology has changed the job market.","a":["development"],"why":"After the you need a noun. Develop becomes development.","bn":"the-এর পরে noun রূপ লিখুন।"},{"t":"gap","sk":"W","q":"Many people are ___ (worry) about the rising cost of housing.","a":["worried"],"why":"People feel something, so use the -ed adjective worried after are."},{"t":"gap","sk":"W","q":"Smoking is ___ (harm) to both smokers and the people around them.","a":["harmful"],"why":"After is you need an adjective. Harm plus -ful gives harmful."},{"t":"gap","sk":"W","q":"It is ___ (economy) better to repair an old phone than to buy a new one.","a":["economically"],"why":"The adverb economically describes the adjective better.","bn":"adjective-কে বর্ণনা করতে adverb লাগে।"},{"t":"dict","sk":"L","s":"There was a sharp rise in the number of students studying abroad.","why":"Listen for the adjective sharp before the noun rise."},{"t":"dict","sk":"L","s":"Prices increased gradually and then fell dramatically at the end of the year.","why":"Listen for the -ly endings on gradually and dramatically."},{"t":"dict","sk":"L","s":"Public transport is a more economical choice for most young workers.","why":"Notice economical, which means it saves money."},{"t":"dict","sk":"L","s":"The development of the city has had a significant effect on traffic.","why":"Catch the noun development and the adjective significant."},{"t":"order","sk":"W","s":"The number of foreign visitors rose sharply.","why":"Subject, then verb, then the adverb that describes the verb."},{"t":"order","sk":"S","s":"I find living in a big city very stressful.","why":"Find + something + adjective: find it stressful."},{"t":"speak","sk":"S","q":"Has your hometown changed much in recent years?","need":"\\b(changed|grown|improved|increased|developed|expanded|become|got|fallen|risen)\\b.*\\b\\w{3,}ly\\b|\\b\\w{3,}ly\\b.*\\b(changed|grown|improved|increased|developed|expanded)\\b","hint":"Use a verb + adverb, e.g. changed dramatically.","model":"Yes, it has changed dramatically. The roads have improved a lot and the population has grown rapidly.","why":"Verb + adverb shows range and accurate word forms."},{"t":"speak","sk":"S","q":"How has technology affected the way people work?","need":"\\b(significant|huge|major|dramatic|positive|negative|considerable|massive|big|real)\\s+(effect|impact|change|improvement|increase|difference|influence)\\b","hint":"Use adjective + noun, e.g. a huge impact.","model":"It has had a huge impact. Most people now work online, and there has been a significant increase in remote jobs.","why":"Adjective + noun phrases sound precise and natural."}]},{"id":"sentence","title":"Sentence boundaries","bn":"বাক্যের সীমানা","why":"Comma splices, fragments and missing verbs are counted as errors in Writing Task 1 and 2, and they also confuse your ideas in Speaking.","rules":[{"h":"Every sentence needs a subject and a verb","en":"A full sentence has a subject and a main verb. English does not drop the subject or the verb be, so write It is important, not Is important.","bn":"প্রতিটি বাক্যে subject ও verb থাকতে হবে। বাংলায় 'হয়' বাদ দেওয়া যায়, কিন্তু ইংরেজিতে is/are বাদ দেওয়া যায় না।","ex":["It is important to save water.","The city is very crowded."]},{"h":"A comma cannot join two sentences","en":"Two complete sentences joined only by a comma is a comma splice. Use a full stop, a semicolon, or a joining word such as and, but, so or because.","bn":"শুধু comma দিয়ে দুটি পূর্ণ বাক্য জোড়া যায় না। full stop, semicolon, অথবা and, but, so, because ব্যবহার করুন।","ex":["Many people move to cities. They want better jobs.","Many people move to cities because they want better jobs."]},{"h":"However is not a joining word","en":"However, therefore and for example cannot join two sentences with a comma. Put a full stop or a semicolon before them and a comma after.","bn":"however, therefore দিয়ে comma-র মাধ্যমে দুটি বাক্য জোড়া যায় না। এদের আগে full stop বা semicolon এবং পরে comma দিন।","ex":["Cars are convenient. However, they pollute the air.","Cars are convenient; however, they pollute the air."]},{"h":"Because and although clauses need a main clause","en":"A clause starting with because, although, when or if cannot stand alone in writing. Join it to a main clause, and do not add but after although.","bn":"because, although, when দিয়ে শুরু হওয়া অংশ একা বাক্য হতে পারে না। এর সাথে মূল বাক্য যোগ করুন, আর although-এর সাথে but বসাবেন না।","ex":["Many students choose this course because it is cheap.","Although the city is noisy, I enjoy living there."]},{"h":"Break up run-on sentences","en":"A run-on sentence strings several ideas together with no punctuation. Give each main idea its own sentence or link two ideas clearly.","bn":"অনেকগুলো ধারণা একটানা একটি বাক্যে লিখবেন না। প্রতিটি মূল ধারণার জন্য আলাদা বাক্য লিখুন বা সঠিক linker দিন।","ex":["Rents are rising. As a result, many students share flats.","The bus was late, so I missed the first class."]}],"traps":[{"wrong":"Many people move to cities, they want better jobs.","right":"Many people move to cities because they want better jobs.","why":"A comma alone cannot join two full sentences."},{"wrong":"Because it is cheap.","right":"Many students choose this course because it is cheap.","why":"A because clause needs a main clause."},{"wrong":"Is important to save water.","right":"It is important to save water.","why":"English sentences need a subject, here it."},{"wrong":"Cars are convenient, however they pollute the air.","right":"Cars are convenient. However, they pollute the air.","why":"However cannot join two sentences with a comma."},{"wrong":"The library very quiet in the morning.","right":"The library is very quiet in the morning.","why":"Every sentence needs a verb; do not drop is."}],"starters":["The main reason is that ...","That's mainly because ...","I really like it. However, ...","There are two reasons. First, ... Second, ...","Although it's ..., I still ...","It's quite expensive, so ..."],"q":[{"t":"mcq","sk":"W","q":"Choose the correct sentence.","o":["Many students work part-time, they need money.","Many students work part-time because they need money.","Many students work part-time. Because they need money."],"a":1,"why":"Because joins the reason to the main clause. A comma alone cannot join two sentences.","bn":"comma দিয়ে দুটি বাক্য জোড়া যায় না।"},{"t":"mcq","sk":"W","q":"___ important to protect forests for future generations.","o":["It is","Is","It"],"a":0,"why":"English needs a subject and a verb: It is important. Is alone has no subject.","bn":"ইংরেজিতে subject বাদ দেওয়া যায় না।"},{"t":"mcq","sk":"W","q":"Choose the correct sentence.","o":["Fast food is cheap, however, it is often unhealthy.","Fast food is cheap however it is often unhealthy.","Fast food is cheap; however, it is often unhealthy."],"a":2,"why":"Use a semicolon or full stop before however and a comma after it."},{"t":"mcq","sk":"W","q":"The bar chart ___ the number of cars sold in four countries.","o":["showing","shows","which shows"],"a":1,"why":"The sentence needs a main verb. Showing and which shows leave it without one."},{"t":"mcq","sk":"W","q":"Choose the correct sentence.","o":["Although the city is crowded, but it has many parks.","Although the city is crowded. It has many parks.","Although the city is crowded, it has many parks."],"a":2,"why":"
