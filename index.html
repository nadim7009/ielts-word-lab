Although already shows contrast, so do not add but. Keep both parts in one sentence.","bn":"although-এর সাথে but বসে না।"},{"t":"mcq","sk":"W","q":"Choose the correct sentence.","o":["Online classes save time. For example, students do not need to travel.","Online classes save time, for example students do not need to travel.","Online classes save time for example, students do not need to travel."],"a":0,"why":"For example cannot join two sentences. Start a new sentence with it."},{"t":"mcq","sk":"W","q":"Choose the best way to join the ideas: Rents are high. Many students share flats.","o":["Rents are high, many students share flats.","Rents are high so, many students share flats.","Rents are high, so many students share flats."],"a":2,"why":"So can join two clauses, with a comma before it, not after it."},{"t":"mcq","sk":"W","q":"Choose the correct sentence.","o":["This is why the government built a new metro line.","Which is why the government built a new metro line.","Which the government built a new metro line."],"a":0,"why":"A sentence cannot start with which here. This is why makes a full sentence."},{"t":"mcq","sk":"W","q":"Choose the correct sentence.","o":["The number of cars has doubled, as a result traffic is worse.","The number of cars has doubled as a result, traffic is worse.","The number of cars has doubled; as a result, traffic is worse."],"a":2,"why":"As a result is a linking adverb. Use a semicolon or full stop before it."},{"t":"mcq","sk":"W","q":"Choose the correct sentence.","o":["The rent is high, the area is safe and quiet so many families live there.","The rent is high. However, the area is safe and quiet, so many families live there.","The rent is high however the area is safe and quiet so many families live there."],"a":1,"why":"The other two are run-on sentences. Split the ideas and use linkers correctly."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: Although the dam provided cheap electricity, ...","o":["but it damaged fish habitats.","it damaged fish habitats downstream.","and damaging fish habitats."],"a":1,"why":"After an although clause, add a full main clause. Do not add but or and."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: The scientists repeated the experiment because ...","o":["unclear results from the first trial.","the results of the first trial unclear.","the results of the first trial were unclear."],"a":2,"why":"Because needs a clause with a subject and verb: the results were unclear.","bn":"because-এর পরে subject ও verb লাগে।"},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: Coral reefs cover less than one percent of the ocean floor; ...","o":["however they support, a quarter of all marine species.","however, they support a quarter of all marine species.","but however they support a quarter of all marine species."],"a":1,"why":"After a semicolon, however is followed by a comma. Never use but and however together."},{"t":"tap","sk":"W","s":"Smartphones are useful, however they can be very addictive.","w":"however","o":["but","therefore","also"],"a":0,"why":"However cannot join two clauses with a comma. But can.","bn":"comma-র পরে দুটি বাক্য জুড়তে but ব্যবহার করুন।"},{"t":"tap","sk":"W","s":"Is important for children to learn a second language.","w":"Is","o":["There is","This","It is"],"a":2,"why":"The sentence needs the subject it: It is important."},{"t":"tap","sk":"W","s":"Many workers prefer remote jobs. Because they save time on travel.","w":"Because","o":["That's because","Although","Because of"],"a":0,"why":"Because they save time is a fragment. That's because makes it a full sentence.","bn":"because দিয়ে শুরু অংশ একা বাক্য নয়।"},{"t":"tap","sk":"W","s":"The chart showing the percentage of households with internet access.","w":"showing","o":["shown","shows","to show"],"a":1,"why":"The sentence has no main verb. Shows gives it one."},{"t":"gap","sk":"W","q":"___ difficult to find cheap housing in Dhaka. (two words)","a":["it is","it's"],"why":"English needs a subject: It is difficult. Is alone is not enough.","bn":"বাক্যের শুরুতে It is লিখুন।"},{"t":"gap","sk":"W","q":"The city has grown quickly. ___, traffic has become a serious problem.","a":["therefore","consequently","as a result","thus","hence","as a consequence"],"why":"A result linker starts the new sentence and is followed by a comma."},{"t":"gap","sk":"W","q":"Online shopping is convenient; ___, it can lead to overspending.","a":["however","nevertheless","nonetheless","on the other hand"],"why":"After a semicolon, a contrast linker with a comma shows the opposite idea."},{"t":"gap","sk":"W","q":"I walk to university every day ___ it is only ten minutes away.","a":["because","as","since"],"why":"Because joins the reason to the main clause in one sentence."},{"t":"gap","sk":"W","q":"The bridge was old and unsafe, ___ the council decided to replace it.","a":["so","and so"],"why":"So joins a cause and its result. Put a comma before it.","bn":"কারণ থেকে ফলাফল বোঝাতে so ব্যবহার করুন।"},{"t":"dict","sk":"L","s":"Many students work part-time because they need money for rent.","why":"Hear how because links the reason to the main idea."},{"t":"dict","sk":"L","s":"The city is very crowded. However, it has excellent public transport.","why":"Notice the pause before However, which starts a new sentence."},{"t":"dict","sk":"L","s":"It is essential to get enough sleep before an exam.","why":"Catch the small words It is at the start."},{"t":"dict","sk":"L","s":"Although the course was expensive, it helped me find a good job.","why":"Listen for although and notice there is no but."},{"t":"order","sk":"W","s":"It is difficult to find a quiet place to study.","why":"It is + adjective + to + verb is a full sentence pattern."},{"t":"order","sk":"S","s":"The course was cheap, so I chose it.","why":"The reason comes first, then so and the result, all in one sentence."},{"t":"speak","sk":"S","q":"Do you like living in a city?","need":"\\b(because|since|so|that'?s why|the reason|as a result)\\b","hint":"Answer in full sentences with because or so.","model":"Yes, I do, because everything is close by. I rarely waste time travelling, so I have more time to study.","why":"Linking a reason in a full sentence shows control of sentence structure."},{"t":"speak","sk":"S","q":"Do you think public transport in cities will improve in the future?","need":"\\b(however|but|although|even though|though|on the other hand)\\b","hint":"Contrast two ideas with but, although or however.","model":"I think it will improve, because many cities are building metro lines. However, it may take years before most people use them.","why":"A clear contrast linker shows you can join and separate ideas correctly."}]},{"id":"complex","title":"Complex sentences for band 7","bn":"ব্যান্ড ৭-এর জন্য জটিল বাক্য","why":"Band 7 in Writing and Speaking needs a mix of simple and complex sentences used accurately, and Reading often tests long sentences with these structures.","rules":[{"h":"Join ideas with when, if, because and which","en":"A subordinate clause adds time, condition, reason or extra information to a main clause. Mix these with short simple sentences so your writing is clear.","bn":"when, if, because, which দিয়ে মূল বাক্যের সাথে সময়, শর্ত, কারণ বা অতিরিক্ত তথ্য যোগ করা যায়। ছোট সরল বাক্যের সাথে মিশিয়ে ব্যবহার করুন।","ex":["When the factory closed, many workers moved away.","The library, which opened last year, is always busy."]},{"h":"Participle clauses","en":"An -ing, having + past participle, or past participle clause can open a sentence. Its subject must be the same as the subject of the main clause.","bn":"Having finished বা Built in 1990 দিয়ে বাক্য শুরু করা যায়, তবে কাজটি যে করেছে সে-ই মূল বাক্যের subject হতে হবে।","ex":["Having finished the report, she sent it to her manager.","Built in 1990, the bridge is now too narrow."]},{"h":"Turn clauses into noun phrases","en":"Academic writing often uses a noun phrase instead of a whole clause. Cities grow rapidly becomes the rapid growth of cities.","bn":"একাডেমিক লেখায় পুরো clause-এর বদলে noun phrase ব্যবহার করা হয়। যেমন cities grow rapidly থেকে the rapid growth of cities।","ex":["The rapid growth of cities has caused housing shortages.","The introduction of online banking reduced queues."]},{"h":"Not only ... but also with inversion","en":"When not only starts a sentence, put the auxiliary before the subject, like a question. The second part usually takes but + subject + also.","bn":"Not only দিয়ে বাক্য শুরু হলে প্রশ্নের মতো auxiliary আগে বসে। যেমন Not only does it save money।","ex":["Not only does cycling save money, but it also keeps you fit.","Not only is the metro faster, but it is also cleaner."]},{"h":"Emphasis with It is ... that","en":"To focus on one part of a sentence, use It is or It was + the focus + that (or who for people).","bn":"কোনো অংশে জোর দিতে It is/It was ... that ব্যবহার করুন। মানুষের ক্ষেত্রে who-ও বসতে পারে।","ex":["It was in 2015 that the city banned plastic bags.","It is my mother who taught me to cook."]}],"traps":[{"wrong":"Not only it saves money but also time.","right":"Not only does it save money, but it also saves time.","why":"After a fronted not only, put does before the subject."},{"wrong":"Having finished the exam, the results were posted online.","right":"Having finished the exam, the students waited for the results.","why":"The participle and main clause need the same subject."},{"wrong":"The town which I was born is very crowded.","right":"The town where I was born is very crowded.","why":"Use where for places when the clause has its own subject."},{"wrong":"Although it was raining, but we went out.","right":"Although it was raining, we went out.","why":"Although and but cannot be used together."},{"wrong":"It was in 2010 when the bridge opened.","right":"It was in 2010 that the bridge opened.","why":"The emphasis pattern is It was ... that."}],"starters":["Having grown up in ..., I ...","Although it's ..., I still ...","Not only is it ..., but it's also ...","It was my ... who first ...","If I had more free time, I would ...","The place where I feel most relaxed is ..."],"q":[{"t":"mcq","sk":"W","q":"___ the population grows, cities will need more housing.","o":["Because of","As","Despite"],"a":1,"why":"As can start a clause with a subject and verb. Because of and despite need a noun.","bn":"clause-এর আগে as/because; noun-এর আগে because of।"},{"t":"mcq","sk":"W","q":"The factory, ___ was built in 1975, closed last year.","o":["which","that","where"],"a":0,"why":"Use which in a non-defining clause with commas. That is not used after a comma."},{"t":"mcq","sk":"W","q":"___ in 1990, the bridge is now too narrow for modern traffic.","o":["Building","Having built","Built"],"a":2,"why":"The bridge was built, so use the passive past participle Built.","bn":"bridge নিজে তৈরি করেনি, তাই passive: Built।"},{"t":"mcq","sk":"W","q":"Not only ___ cheaper, but it is also faster.","o":["the metro is","is the metro","does the metro"],"a":1,"why":"After a fronted not only, the verb be comes before the subject: is the metro."},{"t":"mcq","sk":"S","q":"It was my grandmother ___ taught me to cook.","o":["what","that","which"],"a":1,"why":"The It was ... that pattern focuses on one part. Who would also work, but which and what do not."},{"t":"mcq","sk":"W","q":"Choose the best noun phrase to complete the sentence: ___ has caused serious traffic problems.","o":["The rapid growth of cities","Cities growing rapid","The cities rapid grow"],"a":0,"why":"Adjective + noun + of + noun makes a correct academic noun phrase.","bn":"the + adjective + noun + of + noun"},{"t":"mcq","sk":"W","q":"___ the report, the manager sent it to the whole team.","o":["Read","Having been read","Having read"],"a":2,"why":"The manager read the report first, so use the active Having read."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: Having analysed data from over 200 schools, ...","o":["the results showed a clear link between sleep and grades.","the researchers found a clear link between sleep and grades.","a clear link between sleep and grades was found."],"a":1,"why":"The people who analysed the data must be the subject: the researchers."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: Not only did the new law reduce air pollution, ...","o":["but also improving public health.","but also it improved public health.","but it also improved public health."],"a":2,"why":"The second part takes but + subject + also + verb."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: The Industrial Revolution, which began in Britain, ...","o":["and spread quickly to other parts of Europe.","spread quickly to other parts of Europe.","spreading quickly to other parts of Europe."],"a":1,"why":"The which clause is extra information. The main subject still needs a main verb: spread.","bn":"which অংশ বাদ দিলেও মূল verb থাকতে হবে।"},{"t":"tap","sk":"W","s":"Although the city is noisy, but I enjoy living there.","w":"but","o":["(remove)","so","and"],"a":0,"why":"Although already shows contrast, so remove but.","bn":"although থাকলে but লাগবে না।"},{"t":"tap","sk":"W","s":"Not only does cycling keep you fit, but also saves you money.","w":"also","o":["too","it also","also it"],"a":1,"why":"The second part needs a subject: but it also saves."},{"t":"tap","sk":"W","s":"The students, who they live on campus, pay lower rent.","w":"they","o":["them","(remove)","which"],"a":1,"why":"Who is already the subject of the clause, so they must go.","bn":"who নিজেই subject, they বাদ দিন।"},{"t":"tap","sk":"W","s":"Locating near the river, the hotel is popular with tourists.","w":"Locating","o":["Located","Locate","Having located"],"a":0,"why":"The hotel is located somewhere, so use the passive participle Located."},{"t":"tap","sk":"W","s":"It is the teachers which make a school successful.","w":"which","o":["whose","what","who"],"a":2,"why":"Teachers are people, so use who (or that) in this pattern."},{"t":"tap","sk":"W","s":"The town where I grew up it has changed a lot.","w":"it","o":["(remove)","this","which"],"a":0,"why":"The town is already the subject, so it repeats the subject.","bn":"subject দুবার লিখবেন না।"},{"t":"tap","sk":"W","s":"The rapid grow of cities has caused housing shortages.","w":"grow","o":["growing","grown","growth"],"a":2,"why":"After the rapid you need a noun: growth."},{"t":"gap","sk":"W","q":"The ___ (increase) use of private cars has made the air dirtier.","a":["increasing","increased"],"why":"An -ing or -ed adjective before the noun use makes a strong noun phrase."},{"t":"gap","sk":"W","q":"___ (have) lived abroad for two years, she speaks English fluently.","a":["having"],"why":"Having + past participle shows an action completed before the main clause.","bn":"আগে শেষ হওয়া কাজ বোঝাতে Having + V3।"},{"t":"gap","sk":"W","q":"Not only ___ the plan expensive, but it is also unpopular.","a":["is"],"why":"After a fronted not only, put the verb be before the subject."},{"t":"gap","sk":"W","q":"It was in 2015 ___ the government banned plastic bags.","a":["that"],"why":"The emphasis pattern is It was + focus + that."},{"t":"gap","sk":"W","q":"The library, ___ opened last year, stays open until midnight.","a":["which"],"why":"After a comma, use which for things in a non-defining clause."},{"t":"dict","sk":"L","s":"Having finished her degree, she decided to work abroad for a year.","why":"Listen for Having finished at the start."},{"t":"dict","sk":"L","s":"Not only is the metro faster, but it is also much cleaner.","why":"Notice is comes before the metro after Not only."},{"t":"dict","sk":"L","s":"The bridge, which was built in the last century, needs urgent repairs.","why":"Hear the extra information in the which clause."},{"t":"dict","sk":"L","s":"It was my older brother who encouraged me to learn English.","why":"Catch the It was ... who pattern."},{"t":"order","sk":"W","s":"The rapid growth of cities has increased air pollution.","why":"A noun phrase can be the subject of the sentence."},{"t":"order","sk":"S","s":"It was my teacher who inspired me to study.","why":"It was + person + who + verb."},{"t":"speak","sk":"S","q":"Describe a person who has influenced you. You should say who they are and how they influenced you.","need":"\\b(who|which|whose|having|although|it was|it is)\\b","hint":"Add a relative clause with who or which.","model":"My uncle, who works as an engineer, taught me to love maths. It was his advice that made me choose software engineering.","why":"Relative clauses and It was ... that add range."},{"t":"speak","sk":"S","q":"What are the advantages of living in a big city?","need":"\\bnot only\\b|\\b(although|while|whereas|which|having|if|when)\\b","hint":"Try Not only ... but also, or a which clause.","model":"Not only are there more jobs, but there are also better hospitals, which matters a lot as people get older.","why":"Inversion and relative clauses are band 7 structures."}]},{"id":"nounclause","title":"Noun clauses and cleft sentences","bn":"নাউন ক্লজ ও ক্লেফট বাক্য","why":"Frames like What I like most is ... help you start Speaking answers without going blank, and correct embedded questions improve your grammar score.","rules":[{"h":"What I like most is ...","en":"A what clause can be the subject of a sentence. It takes a singular verb and gives you time to think at the start of an answer.","bn":"What I like most is ... দিয়ে উত্তর শুরু করলে ভাবার সময় পাওয়া যায়। what clause subject হলে সাধারণত is বসে।","ex":["What I like most about my city is the food.","What worries me is the cost of living."]},{"h":"Embedded questions use statement order","en":"Inside a sentence, a question word is followed by subject + verb, with no do, does or did. Write I don't know where she lives, not where does she live.","bn":"বাক্যের ভেতরে প্রশ্ন থাকলে সাধারণ বাক্যের ক্রম হয়: subject তারপর verb। do, does, did বসে না।","ex":["I don't know where she lives.","Could you tell me what time the library opens?"]},{"h":"Whether or if for yes/no questions","en":"When the hidden question is a yes/no question, use whether or if. Whether sounds more formal and works well with or not.","bn":"হ্যাঁ/না প্রশ্ন বাক্যের ভেতরে আনতে whether বা if ব্যবহার করুন।","ex":["I'm not sure whether I'll have time.","She asked if the course was full."]},{"h":"The reason why ... is that ...","en":"After The reason why ... is, use that, not because. Because repeats the idea of reason.","bn":"The reason why ... is-এর পরে that বসে, because নয়। কারণ reason শব্দেই 'কারণ' বোঝানো হয়ে গেছে।","ex":["The reason why I chose this course is that it is practical.","The reason I moved was that rent was cheaper."]},{"h":"It is said that and The thing is","en":"It is said, believed or thought that ... reports general opinion in formal writing. The thing is ... is a natural way to explain a problem in Speaking.","bn":"It is said/believed that দিয়ে সাধারণ মতামত বলা যায়। কথায় সমস্যা বোঝাতে The thing is ... খুব স্বাভাবিক।","ex":["It is believed that the temple is over a thousand years old.","The thing is, I don't have much free time."]}],"traps":[{"wrong":"I don't know where does she live.","right":"I don't know where she lives.","why":"Embedded questions use statement order without does."},{"wrong":"The reason why I chose this course is because it is practical.","right":"The reason why I chose this course is that it is practical.","why":"After the reason is, use that, not because."},{"wrong":"Can you tell me what time does the bus leave?","right":"Can you tell me what time the bus leaves?","why":"No does inside an embedded question."},{"wrong":"It is say that the river was once very clean.","right":"It is said that the river was once very clean.","why":"It is said needs the past participle said."},{"wrong":"What he told me it was not true.","right":"What he told me was not true.","why":"The what clause is the subject; do not add it."}],"starters":["What I like most about ... is ...","The main reason why I ... is that ...","I'm not entirely sure whether ..., but ...","The thing is, ...","I've never really thought about why ..., but ...","It's often said that ..."],"q":[{"t":"mcq","sk":"S","q":"I don't know where ___.","o":["does she live","she lives","lives she"],"a":1,"why":"Inside a sentence, use statement order: where she lives.","bn":"বাক্যের ভেতরে প্রশ্নে subject আগে, verb পরে।"},{"t":"mcq","sk":"S","q":"___ I enjoy most about weekends is sleeping late.","o":["That","Which","What"],"a":2,"why":"What + clause can be the subject: What I enjoy most is ..."},{"t":"mcq","sk":"L","q":"Could you tell me what time ___?","o":["does the museum open","opens the museum","the museum opens"],"a":2,"why":"Polite questions with Could you tell me use statement order and no does."},{"t":"mcq","sk":"S","q":"The reason why I chose engineering is ___ I enjoy solving problems.","o":["because","that","why"],"a":1,"why":"Use that after The reason why ... is.","bn":"reason ... is-এর পরে that বসে।"},{"t":"mcq","sk":"S","q":"I'm not sure ___ I'll have time to travel this year.","o":["whether","that","what"],"a":0,"why":"This is a hidden yes/no question, so use whether (or if)."},{"t":"mcq","sk":"W","q":"It ___ that regular exercise reduces stress.","o":["thinks","is thought","thought"],"a":1,"why":"The passive reporting pattern is It is thought that ... An 'it' cannot think, so the active forms are wrong."},{"t":"mcq","sk":"S","q":"___ is, I've never been very good at cooking.","o":["What thing","The thing","That thing"],"a":1,"why":"The thing is ... is a fixed phrase to explain a problem."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: Scientists still do not fully understand why ...","o":["do some birds migrate at night.","some birds migrate at night.","migrate some birds at night."],"a":1,"why":"After why inside a sentence, use subject + verb: some birds migrate.","bn":"why-এর পরে subject তারপর verb।"},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: It is widely believed that ...","o":["the first cities appeared in Mesopotamia.","the first cities appearing in Mesopotamia.","the appearance of the first cities in Mesopotamia."],"a":0,"why":"That must be followed by a full clause with a main verb: appeared."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: What surprised the researchers most ...","o":["it was the speed of the change.","were the speed of the change.","was how quickly the ice melted."],"a":2,"why":"The what clause is the subject, so it takes was, and no extra it."},{"t":"tap","sk":"W","s":"I don't know where do they live now.","w":"do","o":["(remove)","did","does"],"a":0,"why":"Embedded questions do not use do: where they live.","bn":"ভেতরের প্রশ্নে do/does/did বাদ দিন।"},{"t":"tap","sk":"W","s":"The reason why I left my job was because the hours were too long.","w":"because","o":["since","that","why"],"a":1,"why":"After The reason why ... was, use that."},{"t":"tap","sk":"W","s":"What I need most are a quiet place to study.","w":"are","o":["be","were","is"],"a":2,"why":"A what clause subject with a singular noun takes is."},{"t":"tap","sk":"W","s":"I asked him that he could help me with the form.","w":"that","o":["whether","what","which"],"a":0,"why":"Asked introduces a yes/no question, so use whether or if.","bn":"হ্যাঁ/না প্রশ্নে whether বা if বসে।"},{"t":"tap","sk":"W","s":"It is believe that the bridge was built by the Romans.","w":"believe","o":["believing","believed","belief"],"a":1,"why":"The passive pattern needs the past participle: It is believed."},{"t":"tap","sk":"W","s":"What he said it was not true at all.","w":"it","o":["this","that","(remove)"],"a":2,"why":"What he said is already the subject, so remove it."},{"t":"tap","sk":"W","s":"Could you tell me how much do the tickets cost?","w":"do","o":["(remove)","does","did"],"a":0,"why":"Embedded questions keep statement order: how much the tickets cost."},{"t":"gap","sk":"W","q":"I have no idea where my keys ___ (be).","a":["are"],"why":"Statement order: where my keys are."},{"t":"gap","sk":"W","q":"___ I find hardest about English is the pronunciation.","a":["what"],"why":"What + clause as the subject of the sentence.","bn":"What I find hardest is ... দিয়ে শুরু করুন।"},{"t":"gap","sk":"W","q":"Do you know ___ the library is open on Fridays?","a":["whether","if"],"why":"This hides a yes/no question, so use whether or if."},{"t":"gap","sk":"W","q":"The reason I moved to Dhaka is ___ there are more jobs there.","a":["that"],"why":"After The reason ... is, use that."},{"t":"gap","sk":"W","q":"It is ___ (say) that the city was founded over a thousand years ago.","a":["said"],"why":"Passive reporting: It is said that ...","bn":"It is + V3 + that।"},{"t":"dict","sk":"L","s":"What I like most about my hometown is the friendly people.","why":"Listen for What I like most is."},{"t":"dict","sk":"L","s":"I am not sure whether the course will start next month.","why":"Catch whether after not sure."},{"t":"dict","sk":"L","s":"I would like to know where the nearest bus stop is.","why":"Notice the statement order at the end: the bus stop is."},{"t":"dict","sk":"L","s":"The reason why I chose this university is that it has a good library.","why":"Hear is that, not is because."},{"t":"order","sk":"S","s":"I don't know where the station is.","why":"Embedded question: where + subject + verb."},{"t":"order","sk":"W","s":"It is said that the bridge is unsafe.","why":"It is said that + full clause."},{"t":"speak","sk":"S","q":"What do you like most about your hometown?","need":"\\bwhat\\b.*\\b(is|was|are)\\b|\\bthe thing\\b|\\bthe reason\\b","hint":"Start with What I like most is ...","model":"What I like most is how friendly people are. The thing is, everyone knows each other there.","why":"A cleft opening gives you a fluent start."},{"t":"speak","sk":"S","q":"Why do some young people prefer to live alone?","need":"\\b(the reason|reason why|the thing is|what\\b.*\\bis|not sure (whether|if|why)|don'?t know (why|whether|if))\\b","hint":"Use The reason why ... is that ...","model":"The reason why many young people live alone is that they want more freedom. I'm not sure whether it's cheaper, though.","why":"Noun clauses help you explain reasons clearly."}]},{"id":"quant","title":"Quantifiers","bn":"পরিমাণবাচক শব্দ","why":"Task 1 reports are full of amounts and numbers, so errors with fewer, less, many and much cost marks in Writing and also in Speaking.","rules":[{"h":"Countable or uncountable","en":"Use many, few, fewer and a large number of with plural countable nouns. Use much, little, less and a large amount of with uncountable nouns. A lot of works with both.","bn":"গণনাযোগ্য noun-এর সাথে many, few, fewer, a large number of; অগণনীয় noun-এর সাথে much, little, less, a large amount of বসে।","ex":["A large number of tourists visited the beach.","A large amount of money was spent on roads."]},{"h":"Few and a few, little and a little","en":"A few and a little mean some, which is positive. Few and little mean not many or not much, which sounds negative.","bn":"a few/a little মানে কিছু আছে (ইতিবাচক)। few/little মানে প্রায় নেই (নেতিবাচক)।","ex":["I have a few close friends at university.","There is little green space in the city centre."]},{"h":"Fewer or less","en":"Fewer goes with plural nouns you can count, such as cars or people. Less goes with uncountable nouns, such as traffic or water.","bn":"গোনা যায় এমন জিনিসে fewer (fewer cars), আর গোনা যায় না এমন জিনিসে less (less traffic)।","ex":["Fewer people use landline phones today.","We use less paper than before."]},{"h":"Most, most of the, the majority of","en":"Most + noun talks about people or things in general. Most of the + noun talks about a specific group. The majority of + plural noun takes a plural verb.","bn":"সাধারণভাবে বললে most people; নির্দিষ্ট দল হলে most of the students। most of people ভুল।","ex":["Most people own a smartphone.","Most of the students in my class live nearby."]},{"h":"Each, every, both, either, neither","en":"Each and every take a singular noun and verb. Both takes a plural noun. Either and neither take a singular noun and mean one or none of two.","bn":"each/every-এর পরে একবচন noun ও verb বসে। both-এর পরে বহুবচন। either/neither দুটির মধ্যে একটি বা কোনোটিই না বোঝায়।","ex":["Every student has a laptop.","Neither option was cheap, so we stayed at home."]}],"traps":[{"wrong":"There are less cars on the roads at night.","right":"There are fewer cars on the roads at night.","why":"Cars are countable, so use fewer."},{"wrong":"Most of people use smartphones every day.","right":"Most people use smartphones every day.","why":"Most of needs the or my before the noun."},{"wrong":"Every students has a laptop.","right":"Every student has a laptop.","why":"Every is followed by a singular noun."},{"wrong":"A large amount of tourists visit Sylhet each year.","right":"A large number of tourists visit Sylhet each year.","why":"Tourists are countable, so use a large number of."},{"wrong":"We need more informations about the course.","right":"We need more information about the course.","why":"Information is uncountable and has no plural form."}],"starters":["Most people I know ...","Quite a few of my friends ...","There are far fewer ... than there used to be.","The majority of young people ...","Neither of my parents ...","I have very little time for ..."],"q":[{"t":"mcq","sk":"W","q":"There isn't ___ public transport in my village.","o":["many","much","few"],"a":1,"why":"Transport is uncountable, so use much in negatives.","bn":"অগণনীয় noun-এর সাথে much।"},{"t":"mcq","sk":"S","q":"I have ___ close friends, maybe three or four.","o":["a few","few","a little"],"a":0,"why":"A few means some, which fits three or four friends."},{"t":"mcq","sk":"W","q":"The chart shows that ___ people used public libraries in 2020 than in 2000.","o":["less","little","fewer"],"a":2,"why":"People is a plural countable noun, so use fewer.","bn":"গোনা যায় এমন noun হলে fewer।"},{"t":"mcq","sk":"W","q":"___ students in my class live in the university hall.","o":["Most of","Most of the","The most"],"a":1,"why":"A specific group needs Most of the + noun."},{"t":"mcq","sk":"L","q":"Each room in the hostel ___ its own bathroom.","o":["has","have","having"],"a":0,"why":"Each takes a singular verb: has."},{"t":"mcq","sk":"W","q":"A large ___ of money was spent on the new stadium.","o":["number","many","amount"],"a":2,"why":"Money is uncountable, so use a large amount of."},{"t":"mcq","sk":"W","q":"We looked at two hotels, but ___ hotel had free parking.","o":["either","neither","both"],"a":1,"why":"Neither means not one of the two and takes a singular noun.","bn":"দুটির কোনোটিই না হলে neither।"},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: Very little research ...","o":["have been done on this species.","has been done on this species.","were done on these species."],"a":1,"why":"Research is uncountable, so it takes a singular verb: has been done."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: Although the drug was tested on a large number of patients, ...","o":["few side effects were reported.","little side effects were reported.","a less side effects were reported."],"a":0,"why":"Side effects are countable. Few means not many, which fits the contrast with although."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: Compared with the previous decade, the 1990s saw ...","o":["less floods but more droughts.","little floods but much droughts.","fewer floods but more droughts."],"a":2,"why":"Floods are countable, so use fewer.","bn":"flood গোনা যায়, তাই fewer।"},{"t":"tap","sk":"W","s":"There are less students in the library during the holidays.","w":"less","o":["fewer","little","much"],"a":0,"why":"Students are countable, so use fewer."},{"t":"tap","sk":"W","s":"Most of people in my country eat rice every day.","w":"of","o":["(remove)","the","from"],"a":0,"why":"In general statements, use Most people with no of.","bn":"সাধারণভাবে বললে Most people, of ছাড়া।"},{"t":"tap","sk":"W","s":"Every students must bring a photo ID to the exam.","w":"students","o":["student's","student","studentes"],"a":1,"why":"Every is followed by a singular noun."},{"t":"tap","sk":"W","s":"The government spent a large number of money on new roads.","w":"number","o":["deal","many","amount"],"a":2,"why":"Money is uncountable, so use a large amount of."},{"t":"tap","sk":"W","s":"We don't have many time before the exam starts.","w":"many","o":["much","few","lot"],"a":0,"why":"Time is uncountable here, so use much.","bn":"time অগণনীয়, তাই much।"},{"t":"tap","sk":"W","s":"I need some advices about choosing a university abroad.","w":"advices","o":["advise","advice","advising"],"a":1,"why":"Advice is uncountable and has no plural form."},{"t":"tap","sk":"W","s":"Luckily, I had little money left, so I could buy a coffee.","w":"little","o":["few","a few","a little"],"a":2,"why":"A little means some, which fits the positive result.","bn":"ইতিবাচক অর্থে a little।"},{"t":"gap","sk":"W","q":"How ___ (much/many) hours do you study each day?","a":["many"],"why":"Hours are countable, so use many."},{"t":"gap","sk":"W","q":"There has been ___ (less/fewer) traffic since the new road opened.","a":["less"],"why":"Traffic is uncountable, so use less.","bn":"traffic গোনা যায় না, তাই less।"},{"t":"gap","sk":"W","q":"Only a ___ students failed the test, so the teacher was pleased.","a":["few"],"why":"A few + plural countable noun means a small number."},{"t":"gap","sk":"W","q":"___ of the two answers is correct; both are wrong.","a":["neither"],"why":"Neither means not one of the two."},{"t":"gap","sk":"W","q":"The ___ of people in the survey preferred online shopping.","a":["majority"],"why":"The majority of + plural noun means most of a group."},{"t":"dict","sk":"L","s":"Fewer people visited the museum this year than last year.","why":"Listen for fewer with the countable noun people."},{"t":"dict","sk":"L","s":"Most of the students in my class live in the hall.","why":"Notice most of the before a specific group."},{"t":"dict","sk":"L","s":"There is very little green space in the city centre.","why":"Hear little, not a little, which sounds negative."},{"t":"dict","sk":"L","s":"A large number of tourists visit the beach every winter.","why":"Catch a large number of with tourists."},{"t":"order","sk":"W","s":"The majority of workers prefer flexible hours.","why":"The majority of + plural noun + plural verb."},{"t":"order","sk":"S","s":"Most of my friends live near the campus.","why":"Most of + my + plural noun."},{"t":"speak","sk":"S","q":"Do you have many friends?","need":"\\b(a few|few|many|most|a lot of|lots of|quite a few|a couple of|several|plenty of|not many|hardly any|the majority)\\b","hint":"Use a quantifier like a few, quite a few or most.","model":"Not many, to be honest. I have a few close friends from school, and most of them live in Dhaka now.","why":"Accurate quantifiers make your answer precise."},{"t":"speak","sk":"S","q":"Do people read fewer books today than in the past?","need":"\\b(fewer|less|the majority of|a large number of|a lot of|most|few|little|much|many)\\b","hint":"Compare with fewer, less or the majority of.","model":"I think people read fewer printed books, but they read a lot of articles online. The majority of my friends read on their phones.","why":"Comparing amounts correctly shows grammatical range."}]},{"id":"parallel","title":"Parallel structure and lists","bn":"সমান্তরাল গঠন ও তালিকা","why":"Lists and comparisons appear in every Writing task and many Speaking answers, and mixed forms make sentences sound clumsy and lose grammar marks.","rules":[{"h":"Same form in a list","en":"Every item in a list should have the same grammatical form: all nouns, all -ing forms, or all to + verb.","bn":"তালিকার প্রতিটি অংশ একই রূপে লিখুন: সব noun, সব -ing, অথবা সব to + verb।","ex":["I enjoy reading, writing and speaking.","The scheme aims to cut costs, save time and improve quality."]},{"h":"Paired linkers need matching parts","en":"After both ... and, either ... or, neither ... nor and not only ... but also, use the same kind of word or phrase in each part.","bn":"both ... and, either ... or, neither ... nor-এর দুই পাশে একই ধরনের শব্দ বা phrase বসান।","ex":["The course is both useful and cheap.","You can either live in the hall or rent a flat."]},{"h":"Compare like with like","en":"Use prefer + -ing + to + -ing, and would rather + base verb + than + base verb. When comparing features, use that of or those of so you compare the same thing.","bn":"prefer cycling to driving এবং would rather walk than drive লিখুন। দুটি জিনিসের বৈশিষ্ট্য তুলনায় that of ব্যবহার করুন।","ex":["I prefer cycling to driving.","The population of Dhaka is larger than that of Khulna."]},{"h":"Lists with to","en":"In a to + verb list, either repeat to before every item or use it only before the first. Do not mix to with -ing.","bn":"to + verb তালিকায় হয় প্রতিটির আগে to দিন, নয়তো শুধু প্রথমটির আগে। to আর -ing মেশাবেন না।","ex":["People exercise to stay fit, to relax and to meet friends.","People exercise to stay fit, relax and meet friends."]},{"h":"Commas in lists","en":"Put commas between items and and or or before the last one. A comma before and is optional in British English, but be consistent.","bn":"তালিকার জিনিসগুলোর মাঝে comma দিন, শেষটির আগে and বা or দিন। and-এর আগে comma ঐচ্ছিক।","ex":["We need cleaner air, safer streets and better schools.","You can pay by cash, card or mobile banking."]}],"traps":[{"wrong":"I like reading, to swim and football.","right":"I like reading, swimming and playing football.","why":"Keep all list items in the same form."},{"wrong":"I prefer cycling than driving.","right":"I prefer cycling to driving.","why":"Prefer uses to, not than."},{"wrong":"The course is both useful and it is cheap.","right":"The course is both useful and cheap.","why":"Both ... and should join two matching adjectives."},{"wrong":"Students should read widely, practise often, and they should rest.","right":"Students should read widely, practise often and rest well.","why":"Keep each list item as a base verb."},{"wrong":"The rent in Dhaka is higher than Savar.","right":"The rent in Dhaka is higher than in Savar.","why":"Compare rent with rent, not rent with a town."}],"starters":["I'd much rather ... than ...","I prefer ... to ...","It's both ... and ...","In my free time I enjoy ..., ... and ...","Either ... or ... would be fine for me.","It helps you to ..., to ... and to ..."],"q":[{"t":"mcq","sk":"S","q":"In my free time I enjoy reading, cooking and ___.","o":["to play cricket","playing cricket","I play cricket"],"a":1,"why":"Reading and cooking are -ing forms, so the last item must be playing.","bn":"তালিকায় সব -ing রাখুন।"},{"t":"mcq","sk":"S","q":"I prefer walking ___ taking the bus.","o":["to","than","from"],"a":0,"why":"Prefer + -ing + to + -ing."},{"t":"mcq","sk":"W","q":"Public transport is cheap, reliable and ___.","o":["it is safe","safety","safe"],"a":2,"why":"Cheap and reliable are adjectives, so the last item should be the adjective safe."},{"t":"mcq","sk":"W","q":"The new policy aims to reduce traffic, cut pollution and ___ road safety.","o":["improving","improvement","improve"],"a":2,"why":"The list follows to: reduce, cut, improve, all base verbs.","bn":"to-এর পরের সব verb base form।"},{"t":"mcq","sk":"S","q":"I would rather stay at home ___ go to a crowded party.","o":["than","to","that"],"a":0,"why":"Would rather + base verb + than + base verb."},{"t":"mcq","sk":"W","q":"Students can either live in the hall ___ rent a flat nearby.","o":["nor","and","or"],"a":2,"why":"Either goes with or. Neither goes with nor."},{"t":"mcq","sk":"W","q":"The population of Dhaka is much larger than ___ of Chattogram.","o":["that","it","this"],"a":0,"why":"That of means the population of, so you compare population with population.","bn":"একই জিনিসের তুলনায় that of।"},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: The programme was designed both to improve literacy and ...","o":["increasing school attendance.","to increase school attendance.","school attendance increased."],"a":1,"why":"Both to improve ... and to increase: the two parts match."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: The new material is not only lighter than steel but also ...","o":["it resists heat better.","resisting heat better.","more resistant to heat."],"a":2,"why":"Lighter is an adjective, so the second part should be an adjective phrase too."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: Early settlers relied on the river for drinking water, transport and ...","o":["fishing.","to catch fish.","they caught fish."],"a":0,"why":"Water and transport are nouns, so the last item should be a noun: fishing.","bn":"for-এর পরের তালিকায় সব noun।"},{"t":"tap","sk":"W","s":"Reading, painting and swim are my favourite hobbies.","w":"swim","o":["swimming","to swim","swims"],"a":0,"why":"Reading and painting are -ing forms, so use swimming."},{"t":"tap","sk":"W","s":"I prefer cycling than driving in the city.","w":"than","o":["then","to","from"],"a":1,"why":"Prefer A to B, not than.","bn":"prefer-এর সাথে to বসে, than নয়।"},{"t":"tap","sk":"W","s":"The job was both well paid and interest for young people.","w":"interest","o":["interested","interests","interesting"],"a":2,"why":"Both ... and needs two adjectives: well paid and interesting."},{"t":"tap","sk":"W","s":"Neither the teachers or the students liked the new timetable.","w":"or","o":["and","nor","but"],"a":1,"why":"Neither goes with nor.","bn":"neither-এর সাথে nor।"},{"t":"tap","sk":"W","s":"The aim is to reduce costs, to save time and improving quality.","w":"improving","o":["to improve","improvement","improves"],"a":0,"why":"The list uses to + verb, so keep the same form: to improve."},{"t":"tap","sk":"W","s":"Living in the countryside is quieter than live in a city.","w":"live","o":["lived","to living","living"],"a":2,"why":"Compare -ing with -ing: Living ... than living."},{"t":"tap","sk":"W","s":"The laptop is not only light but also power for its size.","w":"power","o":["powerful","powerfully","powers"],"a":0,"why":"Light is an adjective, so the second part needs the adjective powerful.","bn":"দুই পাশে adjective রাখুন।"},{"t":"gap","sk":"W","q":"I enjoy hiking, swimming and ___ (cycle).","a":["cycling"],"why":"All items are -ing forms."},{"t":"gap","sk":"W","q":"I prefer tea ___ coffee.","a":["to","over"],"why":"Prefer A to B.","bn":"prefer A to B মনে রাখুন।"},{"t":"gap","sk":"W","q":"The city needs not only more buses ___ also safer cycle lanes.","a":["but"],"why":"Not only ... but also is a fixed pair."},{"t":"gap","sk":"W","q":"Students should learn to plan, to research and ___ (write) clearly. (two words)","a":["to write"],"why":"The list repeats to before each verb, so keep the pattern: to write."},{"t":"gap","sk":"W","q":"The weather in Sylhet is wetter than ___ in Rajshahi.","a":["that"],"why":"That means the weather, so you compare the same thing."},{"t":"dict","sk":"L","s":"I prefer studying in the morning to studying late at night.","why":"Listen for prefer ... to with two -ing forms."},{"t":"dict","sk":"L","s":"The new job was both challenging and very rewarding for me.","why":"Catch both ... and joining two adjectives."},{"t":"dict","sk":"L","s":"Students can either live in the hall or share a flat nearby.","why":"Hear either ... or with two base verbs."},{"t":"dict","sk":"L","s":"Regular exercise improves your sleep, your mood and your memory.","why": const PLAN = (() => { const p = [null]; GR && GR.forEach((u, i) => { p.push({ type:'learn', u:u.id, part:1 }); p.push({ type:'master', u:u.id, part:2 }); });
  p.push({ type:'mock', n:1 }, { type:'mock', n:2 }, { type:'mock', n:3 }, { type:'final' }); return p; })();
function unitStats(u){
  let ok = 0, tried = 0, spoke = 0; u.q.forEach((q, i) => { const r = S.g.q[gk(u, i)]; if (r){ tried++; if (r.ok){ ok++; if (q.t === 'speak') spoke++; } } });
  const pct = ok / u.q.length; const miss = u.q.filter((q, i) => S.g.miss[gk(u, i)]).length;

let ACTX = null;
function tone(seq){
  if (!S.g.sound) return;
  try { ACTX = ACTX || new (window.AudioContext || window.webkitAudioContext)(); let t = ACTX.currentTime;
    seq.forEach(([f, d, type]) => { const o = ACTX.createOscillator(), g = ACTX.createGain(); o.type = type || 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.18, t + .015); g.gain.exponentialRampToValueAtTime(.0001, t + d);
      o.connect(g); g.connect(ACTX.destination); o.start(t); o.stop(t + d + .02); t += d * .8; });
  } catch (e) {}
}
const sndOK = () => tone([[660, .12], [990, .18]]);
const sndNo = () => tone([[220, .22, 'triangle']]);
const sndWin = () => tone([[523, .14], [659, .14], [784, .14], [1047, .3]]);
function confetti(n = 90){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cols = ['#5B5BD6','#FF6A3D','#13B394','#F5B400','#D6457A','#1E88E5'];
  for (let i = 0; i < n; i++){ const c = document.createElement('i'); c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw'; c.style.background = cols[i % cols.length];
    c.style.animationDuration = 1.6 + Math.random() * 1.6 + 's'; c.style.animationDelay = Math.random() * .4 + 's';
    document.body.appendChild(c); setTimeout(() => c.remove(), 3800); }
}

  do { order = shuffle(order); tries++; } while (order.map(j => words[j]).join(' ') === q.s && tries < 10);
  const picked = [];
  $('#gbody').innerHTML = `<div class="label" style="text-align:center">Tap the words in the right order</div><div class="tray" id="tray"></div><div class="tokens" id="pool">${order.map(j => `<button class="tok" type="button" data-w="${j}">${esc(words[j])}</button>`).join('')}</div><div class="row" style="justify-content:center"><button class="btn" type="button" id="oClr">Clear</button><button class="btn primary" type="button" id="gChk" disabled>Check</button></div>`;
  let done = false;
  const draw = () => { $('#tray').innerHTML = picked.map((j, p) => `<button class="tok" type="button" data-p="${p}">${esc(words[j])}</button>`).join('');
    $$('#pool [data-w]').forEach(b => b.classList.toggle('used', picked.includes(+b.dataset.w))); $('#gChk').disabled = picked.length !== words.length;
    $$('#tray [data-p]').forEach(b => b.onclick = () => { if (done) return; picked.splice(+b.dataset.p, 1); draw(); }); };
  $$('#pool [data-w]').forEach(b => b.onclick = () => { if (done) return; const j = +b.dataset.w; if (!picked.includes(j)){ picked.push(j); draw(); if (picked.length === words.length) $('#gChk').focus(); } });
  $('#oClr').onclick = () => { if (done) return; picked.length = 0; draw(); };
  $('#gChk').onclick = () => { if (done) return; done = true; const s = picked.map(j => words[j]).join(' '); const ok = gnorm(s) === gnorm(q.s);
    $('#tray').classList.add(ok ? 'ok' : 'no'); $('#oClr').hidden = true; $('#gChk').hidden = true;
    gRecord(key, ok, s); gFeedback(ok, q, ok ? `<span>${speakBtn(q.s)} Listen and repeat it once.</span>` : `<span style="font-family:var(--f-head);font-size:19px">${esc(q.s)} ${speakBtn(q.s)}</span>`); bindSpeak(); };
  draw();
}
function qPredict(key, q){
  $('#gbody').innerHTML = `<div class="label" style="text-align:center">Before you listen: what kind of word fills the gap?</div><div class="qtext">${esc(q.q).replace(/_{3,}/g, '<span style="color:var(--violet)">______</span>')}</div><div class="opts">${q.o.map((o, j) => `<button class="opt" type="button" data-o="${j}"><b>${esc(o)}</b></button>`).join('')}</div>`;
  let done = false;
  $$('[data-o]').forEach(b => b.onclick = () => { if (done) return; done = true; const j = +b.dataset.o; const ok = j === q.a;
    b.classList.add(ok ? 'ok' : 'no'); $(`[data-o="${q.a}"]`).classList.add('ok'); gRecord(key, ok, q.o[j]);
    gFeedback(ok, q, `<span>Now listen: <button class="btn small" type="button" data-say="${esc(q.full)}">${ICON.speak} Play</button></span><span>The answer is <b style="font-family:var(--f-head);font-size:19px">${esc(q.ans)}</b></span>`); bindSpeak(); setTimeout(() => say(q.full), 500); });
}
function qSpeak(key, q){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  $('#gbody').innerHTML = `<div class="qtext">${esc(q.q)}</div><p class="hint" style="margin:0;text-align:center">Use: <b>${esc(q.hint)}</b></p>
    ${SR ? `<button class="mic" type="button" id="mic" aria-label="Start speaking">${ICON.mic}</button><p class="muted" style="text-align:center;margin:0;font-size:14px" id="micS">Tap the microphone and answer in one or two sentences.</p><div class="said" id="said" aria-live="polite"></div><div class="row" style="justify-content:center"><button class="btn small ghost" type="button" id="typeI">Mic not working? Type instead</button></div><textarea class="answer" id="said2" rows="3" style="font-size:18px" hidden></textarea>`
      : `<p class="muted" style="text-align:center;margin:0;font-size:14px">This browser cannot hear you, so say your answer out loud and then type it. Chrome or Edge can listen.</p><textarea class="answer" id="said2" rows="3" style="font-size:18px"></textarea>`}
    <div class="row" style="justify-content:center"><button class="btn primary" type="button" id="gChk">Check my answer</button><button class="btn ghost" type="button" id="mdl">Hear a model answer</button></div>`;
  let text = ''; let rec = null; let done = false;
  $('#mdl').onclick = () => { say(q.model); toast('Model: ' + q.model); };
  if (SR){
    $('#typeI').onclick = () => { $('#said2').hidden = false; $('#said2').focus(); $('#typeI').hidden = true; };
    $('#mic').onclick = () => {
      if (rec){ rec.stop(); return; }
      rec = new SR(); rec.lang = S.settings.accent === 'US' ? 'en-US' : 'en-GB'; rec.interimResults = true; rec.continuous = true; text = '';
      rec.onresult = e => { let t = ''; for (let k = 0; k < e.results.length; k++) t += e.results[k][0].transcript + ' '; text = t.trim(); $('#said').textContent = text; };
      rec.onerror = e => { $('#micS').textContent = e.error === 'not-allowed' ? 'Microphone blocked. Allow it in the address bar, then try again.' : 'I could not hear you. Tap the microphone and try again.'; };
      rec.onend = () => { rec = null; $('#mic').classList.remove('on'); if (text) $('#micS').textContent = 'Got it. Tap Check, or tap the microphone to try again.'; };
      rec.start(); $('#mic').classList.add('on'); $('#micS').textContent = 'Listening… tap again when you finish.';
    };
  }
  $('#gChk').onclick = () => { if (done) return; if (rec) rec.stop(); const said = (SR && text) ? text : $('#said2').value.trim();
    if (!said) return toast('Say or type your answer first.');
    done = true; let ok = false; try { ok = new RegExp(q.need, 'i').test(said); } catch (e) {}
    gRecord(key, ok, said);
    gFeedback(ok, q, `${ok ? '<span>You used the target grammar.</span>' : `<span>I could not find the structure (${esc(q.hint)}) in what you said. Try the model answer, then say your own version.</span>`}<span><b>Model:</b> ${esc(q.model)} ${speakBtn(q.model)}</span>`); bindSpeak(); };
}
function gResult(){
  G.active = false; const tot = G.keys.length, right = G.right, pct = right / tot;
  if (G.onDone) G.onDone(G.res);
  const stars = pct >= .9 ? 3 : pct >= .7 ? 2 : pct >= .4 ? 1 : 0;
  const wrong = G.res.filter(r => !r.ok);
  const msg = G.diag ? 'Your results are saved. Your plan starts today.' : pct === 1 ? 'Perfect score. Examiners love accuracy like this.' : pct >= .8 ? 'Strong work. A few more rounds and this lesson is yours.' : pct >= .5 ? 'Good progress. The mistakes below are your best teachers.' : 'This one is hard for everyone at first. Read the rules again, then try the mistakes.';
  main().innerHTML = `<div class="gq"><div class="card" style="text-align:center">
    <div class="label">${esc(G.title)}</div>${starsHTML(stars, 'result-stars')}
    <div style="font-family:var(--f-head);font-size:58px;font-weight:800;line-height:1">${right}<span class="muted" style="font-size:28px">/${tot}</span></div>
    <div class="row" style="justify-content:center"><span class="pill violet">+${right * 2} points</span>${G.best >= 3 ? `<span class="pill coral">${G.best} in a row</span>` : ''}</div>
    <p class="muted" style="margin:0">${msg}</p>
    ${wrong.length && !G.diag ? `<div style="text-align:left"><h3 style="font-size:18px;margin-bottom:8px">Saved to your mistakes</h3><div class="mistakes">${wrong.map(r => { const { u, q } = gq(r.k);
      const right = q.t === 'mcq' || q.t === 'predict' ? q.o[q.a] : q.t === 'tap' ? `${q.w} → ${q.o[q.a]}` : q.t === 'gap' ? q.a[0] : q.t === 'speak' ? q.hint : q.s;
      return `<div class="mk"><span><span class="pill" style="margin-bottom:4px">${esc(GSHORT[u.id])}</span><br><b>${esc(right)}</b></span><span>${r.given ? `You: <s>${esc(String(r.given).slice(0, 90))}</s>` : ''}</span></div>`; }).join('')}</div></div>` : ''}
    <div class="row" style="justify-content:center">${wrong.length && !G.diag ? '<button class="btn coral" type="button" id="gAgain">Try my mistakes again</button>' : ''}<button class="btn primary" type="button" id="gBack">Continue</button></div></div></div>`;
  if (pct >= .7 || G.diag){ sndWin(); confetti(); }
  if ($('#gAgain')) $('#gAgain').onclick = () => gStart({ keys: wrong.map(r => r.k), title: G.title.replace(/: mistakes$/, '') + ': mistakes', back: G.back });
  $('#gBack').onclick = () => { const b = G.back || '#grammar'; if (location.hash === b) route(); else location.hash = b; };
}

const ST = [{"id":"rhead","skill":"R","title":"Matching headings","bn":"হেডিং মেলানো (ম্যাচিং হেডিংস)","why":"Most students lose marks because they match a heading to one word or one detail instead of to the main idea of the whole paragraph. This course trains you to find the point of each paragraph, rule out tempting wrong headings and finish the set on time.","days":[{"n":1,"title":"How matching headings works","goal":"Today you will learn how the task is set out in the real test and what a heading is really asking you to find.","pages":[{"h":"What the task looks like","blocks":[{"t":"p","x":"In the Academic Reading test, a passage of five to eight paragraphs comes with a box of headings numbered i, ii, iii and so on. You choose the heading that fits each paragraph and write its number on the answer sheet. The list always has more headings than paragraphs, so two or three are never used, and each heading can be used only once."},{"t":"p","x":"Headings questions are normally the first task in their passage. Examiners put them there on purpose: they want you to understand the shape of the whole text before you hunt for details. If one paragraph has already been matched as an example, that heading is out of play."},{"t":"tip","x":"On the answer sheet, copy the Roman numeral exactly as it is printed. If the answer is vii, write vii, not 7 and not the heading itself."},{"t":"bn","x":"এই প্রশ্নে প্রতিটি প্যারাগ্রাফের জন্য একটা করে হেডিং বেছে নিতে হয়। হেডিং সবসময় প্যারাগ্রাফের চেয়ে বেশি থাকে, তাই কয়েকটা কোনো কাজেই লাগবে না। একটা হেডিং একবারের বেশি ব্যবহার করা যায় না।"}]},{"h":"A heading names the main idea","blocks":[{"t":"p","x":"A heading is a short summary of the **main idea** of the whole paragraph. It is not a fact taken from one sentence. Think of each paragraph as a tiny essay: it makes one point, then supports it with examples, names, dates and numbers."},{"t":"p","x":"The heading names the point. The supporting **details** are there to prove it, and they are where most wrong headings come from. If a heading only describes one example, one number or one person, it is probably describing a detail."},{"t":"example","q":"Paragraph: 'The old bridge had been closed twice in five years because of flooding. Shops on the far bank lost customers, and children had a two-hour walk to school. In 2019 the council finally agreed to build a new crossing.' Which heading fits? (i) The cost of a new bridge (ii) Problems that led to a decision (iii) A long walk to school","a":"ii","x":"Most of the paragraph lists problems: flooding, lost trade, the long walk. The last sentence gives the result, a decision. Heading iii matches only one example, and heading i talks about money, which the paragraph never mentions."},{"t":"bn","x":"হেডিং মানে পুরো প্যারাগ্রাফের মূল কথা, কোনো একটা লাইনের তথ্য না। উদাহরণ, সংখ্যা, নাম এগুলো হলো ডিটেইল, আর ভুল হেডিংগুলো সাধারণত এই ডিটেইল থেকেই বানানো হয়।"}]},{"h":"A first method you can trust","blocks":[{"t":"steps","x":["Read the list of headings once, quickly, and cross out the example heading if there is one.","Read the first one or two sentences of the paragraph, then the last sentence.","Say the main idea to yourself in five words or fewer, for example 'why the bridge was built'.","Look for the heading that matches your summary, not the one that shares a word with the paragraph.","If two headings are still possible, read the middle of the paragraph to decide between them.","If you are still unsure, write both numbers in pencil and move on."]},{"t":"tip","x":"Give yourself about one and a half minutes per paragraph on your first attempt. With practice, clear paragraphs will take less than a minute."},{"t":"trap","x":"Do not choose a heading the moment you see one of its words in the paragraph. Examiners copy words from the text into the wrong headings to catch exactly this habit."},{"t":"bn","x":"প্রথম আর শেষ লাইন পড়ে নিজের ভাষায় পাঁচ শব্দে মূল কথাটা বলো। তারপর সেই সারাংশের সাথে মিলিয়ে হেডিং খোঁজো, একই শব্দ আছে বলে কোনো হেডিং বেছে নিও না।"}]}],"drill":{"kind":"R","type":"heading","time":8,"title":"How honeybees find their way home","instr":"Reading Passage 1 has five paragraphs, A-E. Choose the correct heading for each paragraph from the list of headings below.","paras":[{"l":"A","x":"Honeybees can fly several kilometres from the hive in search of flowers and still return directly to it. For a long time, this ability puzzled naturalists, who assumed the insects simply followed familiar scents. Experiments in the twentieth century showed that the truth is far more complex. Bees combine several different sources of information, and they switch between them depending on the weather, the time of day and how well they know the area."},{"l":"B","x":"The most important of these sources is the sun. A foraging bee notes the angle between the sun and the direction of its flight, and it uses that angle to calculate the way back. Because the sun moves across the sky during the day, the bee must also correct for its movement. Researchers found that bees kept in a dark hive for several hours still adjusted their flight path accurately when released, which suggests they have an internal clock that tracks the sun's position."},{"l":"C","x":"On cloudy days the sun is hidden, yet bees continue to forage. They manage this because they can see polarised light, a pattern in the sky that is invisible to human eyes. Even a small patch of blue sky between clouds gives them enough of this pattern to work out where the sun must be. Only when the cloud cover is complete do bees begin to struggle, and on such days many of them stay inside the hive."},{"l":"D","x":"Close to the hive, bees rely less on the sky and more on landmarks. Young bees make short orientation flights in which they circle the entrance and study the surroundings, such as trees, walls and the edges of fields. In one study, scientists moved a hive a few metres overnight. Returning bees flew to the old position first and only found the hive after searching, showing how strongly they had learned the local scene."},{"l":"E","x":"Bees also share what they know. A forager that has found a rich source of food performs a 'waggle dance' on the honeycomb. The angle of the dance tells other bees the direction of the food in relation to the sun, and the length of the waggle indicates the distance. Recent work using small radar tags has confirmed that bees who watch the dance fly straight towards the area described, although they still search for the exact flowers once they arrive."}],"headings":["Passing on directions to other members of the colony","A long-held belief about smell","Finding a direction when the sky is covered","Why some bees never leave the hive","An ability that scientists struggled to explain","Memorising the area around the hive","Using the sun and an internal sense of time"],"qs":[{"p":"A","a":4,"ev":"For a long time, this ability puzzled naturalists, who assumed the insects simply followed familiar scents.","why":"The paragraph introduces a puzzle (how bees return home) and says the answer turned out to be complex. 'Puzzled naturalists' is paraphrased as 'scientists struggled to explain'. Heading 'A long-held belief about smell' is tempting because of 'scents', but the old belief about smell is only one clause, and the paragraph says it was wrong."},{"p":"B","a":6,"ev":"A foraging bee notes the angle between the sun and the direction of its flight, and it uses that angle to calculate the way back.","why":"Every sentence is about the sun: using its angle, correcting for its movement and the 'internal clock' found in the experiment. Heading 'Using the sun and an internal sense of time' covers both halves. No other heading mentions the sun or time."},{"p":"C","a":2,"ev":"On cloudy days the sun is hidden, yet bees continue to forage.","why":"The paragraph explains how bees navigate when clouds hide the sun, so 'when the sky is covered' fits. Heading 'Why some bees never leave the hive' is the trap: only the last sentence mentions bees staying inside, and only on fully cloudy days, not bees that 'never' leave."},{"p":"D","a":5,"ev":"Close to the hive, bees rely less on the sky and more on landmarks.","why":"The topic sentence says bees use landmarks near the hive. The orientation flights and the moved-hive experiment both show bees learning the local area, which is 'memorising the area around the hive'. The experiment is a detail that supports this point."},{"p":"E","a":0,"ev":"Bees also share what they know.","why":"The first sentence gives the main idea, and the rest describes how the waggle dance tells other bees the direction and distance. 'Share what they know' becomes 'passing on directions to other members of the colony'."}]}},{"n":2,"title":"Headings are paraphrases","goal":"Today you will learn to turn the specific content of a paragraph into the general words that headings use.","pages":[{"h":"Why the words never match","blocks":[{"t":"p","x":"A paragraph talks in specific terms: steam engines, coal, the year 1840. A heading talks in general terms: new technology, a source of energy, an early stage. This is why you will almost never find the exact words of the correct heading in the paragraph. The heading is a paraphrase of the whole paragraph, so it has to use wider, more general language."},{"t":"p","x":"Your job is to move up one level. When you read a list of examples, ask what they are examples of. When you read a list of events, ask what kind of change they describe. That general label is the language the heading will use."},{"t":"pairs","x":[["Trains, trams and buses all ran late that winter.","Disruption to public transport"],["Farmers sold the land, and the woods were cut down.","The loss of a habitat"],["The scheme was copied in Delhi, Lagos and Lima.","International interest in an idea"],["Nobody could agree whether the results were reliable.","A disputed finding"],["The device was first built in a garage in 1976.","Humble beginnings"]]},{"t":"bn","x":"প্যারাগ্রাফে থাকে নির্দিষ্ট জিনিস, যেমন ট্রেন, বাস, ১৮৪০ সাল। হেডিংয়ে থাকে সাধারণ শব্দ, যেমন 'পরিবহনের সমস্যা'। তাই নিজেকে প্রশ্ন করো, এই উদাহরণগুলো আসলে কী বোঝাচ্ছে?"}]},{"h":"Read the function word first","blocks":[{"t":"p","x":"Most headings are built around one key noun that tells you what the paragraph does: causes, effects, origins, problems, solutions, a comparison, criticism, a prediction. Underline that word in each heading before you read the passage. It is often more useful than the topic words, because several headings will share the same topic."},{"t":"p","x":"Paragraphs give their function away with signal words. 'Led to', 'as a result' and 'because of this' point to causes or effects. 'Originally' and 'in the early days' point to origins. 'One answer' and 'a way round this' point to a solution."},{"t":"pairs","x":[["This led to widespread protests.","Consequences of a decision"],["The custom dates back to the twelfth century.","The origins of a tradition"],["One way round this difficulty was to ...","An attempted solution"],["Unlike its rival, the new design ...","A comparison of two approaches"],["By 2050, experts expect ...","Future prospects"]]},{"t":"tip","x":"Make a quick note beside each heading: C for cause, E for effect, S for solution, H for history and so on. When a paragraph clearly describes a problem, you can ignore every heading not marked as a problem."},{"t":"bn","x":"প্রতিটা হেডিংয়ের মূল শব্দটা দাগ দাও, যেমন কারণ, ফলাফল, সমাধান, ইতিহাস। প্যারাগ্রাফের 'led to', 'originally', 'one answer' এই ধরনের শব্দ দেখে বোঝা যায় প্যারাগ্রাফটা কী কাজ করছে।"}]},{"h":"Where the topic sentence hides","blocks":[{"t":"p","x":"In most academic paragraphs the first sentence states the main idea. Sometimes, though, the first sentence only links back to the paragraph before ('This changed in the 1840s.'), and the real point comes in the second sentence. In other paragraphs the writer builds up evidence and gives the point at the end."},{"t":"steps","x":["Read the first sentence. If it only links to the previous paragraph, read the second as well.","Read the last sentence, which often sums up or gives a result.","Ask whether the middle simply supports those sentences. If it does, you have the main idea.","Put the idea into your own general words before you look at the list."]},{"t":"example","q":"Paragraph: 'This changed in the 1840s. Cheap printed newspapers began to reach small towns, and for the first time ordinary workers could follow national events. Within a generation, political debate was no longer limited to the wealthy.' Choose: (i) A change in the 1840s (ii) The spread of news widens public debate (iii) The price of newspapers","a":"ii","x":"The first sentence is only a link, so the real topic starts in sentence two: news reaching ordinary people. The last sentence gives the effect, wider political debate. Heading i repeats the date but says nothing about what changed, and iii picks out one word, 'cheap'."},{"t":"bn","x":"সব সময় প্রথম লাইনেই মূল কথা থাকে না। প্রথম লাইন যদি শুধু আগের প্যারাগ্রাফের সাথে সংযোগ দেয়, তাহলে দ্বিতীয় লাইন পড়ো। শেষ লাইনেও অনেক সময় সারাংশ বা ফলাফল থাকে।"}]}],"drill":{"kind":"R","type":"heading","time":10,"title":"Railways and the invention of standard time","instr":"Reading Passage 1 has six paragraphs, A-F. Choose the correct heading for each paragraph from the list of headings below.","paras":[{"l":"A","x":"Before the nineteenth century, every town in Britain kept its own time. Noon was the moment when the sun stood highest in the sky, and because the sun reaches that point earlier in the east than in the west, clocks in Bristol ran roughly ten minutes behind those in London. Nobody found this inconvenient. A journey between the two cities took a day or more by coach, and a difference of a few minutes made no practical difference to travellers."},{"l":"B","x":"The arrival of the railways changed this. Trains travelled so quickly that the gap between local times became noticeable, and timetables became confusing. A passenger leaving one town at a certain hour might arrive at another to find that the station clock showed an earlier time than the one at which the journey had started. More seriously, when trains on a single track were run according to different clocks, the risk of collisions increased."},{"l":"C","x":"Railway companies were the first to act. In 1840 the Great Western Railway decided that all its stations would follow London time, and other companies soon did the same. Within a decade most of the network ran on a single time, which became known as 'railway time'. The change was driven by business needs rather than by any government decision, and for many years the law continued to recognise only local time."},{"l":"D","x":"Not everyone welcomed the new arrangement. Some towns refused to give up their local time, and a few public clocks were fitted with two minute hands, one showing local time and one showing London time. Critics complained that the railway companies were imposing the habits of the capital on the rest of the country. Church leaders in particular objected, arguing that the sun, not a business, should decide when people prayed."},{"l":"E","x":"The practical problem of spreading the correct time across the country was solved by the electric telegraph. From the 1850s, signals sent from the Royal Observatory at Greenwich allowed clocks in distant cities to be checked and corrected automatically each day. For the first time, a clockmaker in Manchester could be certain that his clocks agreed with those in London to within a second."},{"l":"F","x":"Official recognition came only in 1880, when Parliament made Greenwich Mean Time the legal time throughout Great Britain. Four years later, an international conference in Washington chose Greenwich as the prime meridian, the starting point for the world's time zones. The system of zones that people now take for granted therefore grew, step by step, out of the needs of a single industry in one country."}],"headings":["Resistance to a change led by commerce","A government plan for national timetables","An arrangement that caused no difficulty at first","Private firms introduce a shared time","Clocks designed to show two times at once","How faster journeys exposed a problem","From a national rule to a global system","Sending accurate time over long distances"],"qs":[{"p":"A","a":2,"ev":"Nobody found this inconvenient.","why":"The paragraph describes local time and explains why it did not matter when travel was slow. 'Nobody found this inconvenient' is paraphrased as 'caused no difficulty', and 'at first' reflects 'before the nineteenth century'. The Bristol and London times are supporting detail."},{"p":"B","a":5,"ev":"Trains travelled so quickly that the gap between local times became noticeable, and timetables became confusing.","why":"Speed made the time gap visible and created confusion and danger. 'Trains travelled so quickly' becomes 'faster journeys', and the confusion and collision risk are the 'problem'. No other heading links speed to a difficulty."},{"p":"C","a":3,"ev":"The change was driven by business needs rather than by any government decision, and for many years the law continued to recognise only local time.","why":"Railway companies, which are private firms, adopted one time across their stations. Heading 'A government plan for national timetables' is the trap: the paragraph mentions government only to say it was not involved."},{"p":"D","a":0,"ev":"Not everyone welcomed the new arrangement.","why":"The topic sentence is about opposition, and the rest gives examples: towns refusing, critics, church leaders. The critics' complaint that 'the railway companies were imposing' London's habits links to 'led by commerce'. Heading 'Clocks designed to show two times at once' is tempting, but the two-handed clocks are one example of resistance, not the main idea."},{"p":"E","a":7,"ev":"The practical problem of spreading the correct time across the country was solved by the electric telegraph.","why":"The paragraph is about the telegraph sending time signals to distant cities. 'Spreading the correct time across the country' becomes 'sending accurate time over long distances'."},{"p":"F","a":6,"ev":"Four years later, an international conference in Washington chose Greenwich as the prime meridian, the starting point for the world's time zones.","why":"The paragraph moves from British law (1880) to an international decision (1884) and world time zones, which matches 'from a national rule to a global system'. Heading 'A government plan for national timetables' does not fit because this is a law about time, not a plan for timetables."}]}},{"n":3,"title":"Traps and tempting wrong headings","goal":"Today you will learn the three main ways examiners build wrong headings and a quick test to rule each one out.","pages":[{"h":"The repeated word trap","blocks":[{"t":"p","x":"Examiners know that nervous students scan for matching words. So they take a striking word from the paragraph, often a name, a number or an unusual noun, and put it into a wrong heading. The correct heading, meanwhile, is usually written in different words."},{"t":"p","x":"Treat a shared word as a warning, not as evidence. If a heading repeats a word from the paragraph, ask whether that word is the subject of the whole paragraph or just appears once. Very often it appears once."},{"t":"example","q":"Paragraph: 'Early cars were noisy, unreliable and expensive. Most people saw them as toys for the rich, and horses remained the normal way to travel in towns. A few engineers, however, kept improving the engine.' Choose: (i) The decline of the horse (ii) Doubts about a new invention (iii) Famous engineers","a":"ii","x":"The paragraph is about how people saw early cars: noisy, unreliable, toys for the rich. That is doubt about an invention. Heading i repeats 'horse', but the paragraph says horses remained normal, the opposite of decline. Heading iii picks up 'engineers' from one sentence."},{"t":"trap","x":"If you find a heading that repeats an unusual word from the paragraph, slow down. Check that the heading says what the paragraph says about that word, not just that the word is there."},{"t":"bn","x":"পরীক্ষক ইচ্ছা করে প্যারাগ্রাফের কোনো চোখে পড়ার মতো শব্দ ভুল হেডিংয়ে বসিয়ে দেয়। একই শব্দ দেখলে খুশি না হয়ে সাবধান হও, দেখো পুরো প্যারাগ্রাফ সেই বিষয়ে কিনা।"}]},{"h":"Detail headings and the cover test","blocks":[{"t":"p","x":"The second trap is a heading that is true but too narrow. It describes one example, one study or one sentence correctly, so it feels right. But a heading has to cover the whole paragraph, and a detail heading leaves most of the paragraph out."},{"t":"steps","x":["Take the heading you are considering and read the paragraph sentence by sentence.","For each sentence, ask: does this support the heading?","If most sentences support it, keep the heading.","If only one or two sentences support it, it is a detail heading. Cross it out for this paragraph."]},{"t":"tip","x":"Detail headings often contain specific words: a place, a group of people, a product. Correct headings tend to use broader words like 'factors', 'approach', 'impact' or 'response'."},{"t":"bn","x":"কোনো হেডিং সত্যি হতে পারে কিন্তু শুধু একটা লাইনের কথা বলে। পরীক্ষা করো: প্যারাগ্রাফের বেশিরভাগ লাইন কি এই হেডিংকে সমর্থন করে? না করলে সেটা ডিটেইল হেডিং, বাদ দাও।"}]},{"h":"Right topic, wrong angle","blocks":[{"t":"p","x":"The third trap is the hardest. The heading has the right topic but the wrong angle: it says 'reasons for' when the paragraph gives results, 'benefits' when it gives limits, or 'a solution' when the paragraph describes an attempt that failed. Every word in the heading must be true of the paragraph."},{"t":"p","x":"When two headings look close, find the one word that makes them different and check that word against the text. Common pairs are cause and effect, past and future, supporters and critics, and success and failure."},{"t":"pairs","x":[["Why the dam failed","The consequences of the dam's failure"],["Early supporters of the plan","Early critics of the plan"],["A solution that worked","A solution that was abandoned"],["The history of the method","The future of the method"]]},{"t":"trap","x":"Be careful with headings that fit the whole passage, such as the topic in the title. A heading that could fit every paragraph is too general for any one of them."},{"t":"bn","x":"কখনো হেডিংয়ের বিষয় ঠিক থাকে কিন্তু দৃষ্টিভঙ্গি ভুল, যেমন প্যারাগ্রাফে ফলাফল বলা আছে অথচ হেডিং বলছে কারণ। দুটো কাছাকাছি হেডিং থাকলে যে শব্দে পার্থক্য, সেটা প্যারাগ্রাফের সাথে মিলিয়ে দেখো।"}]}],"drill":{"kind":"R","type":"heading","time":11,"title":"Bringing back the coastal forests","instr":"Reading Passage 2 has six paragraphs, A-F. Choose the correct heading for each paragraph from the list of headings below.","paras":[{"l":"A","x":"Mangrove forests grow where rivers meet the sea, in water that is too salty for most trees. Their tangled roots trap sediment, shelter young fish and absorb much of the energy of storm waves before it reaches the land. For coastal villages, this makes the forests a kind of living sea wall. Yet over the last half century large areas have been cleared, mainly to make room for shrimp farms, rice fields and coastal housing."},{"l":"B","x":"In response, governments and charities in many countries began large replanting projects. The approach seemed simple: grow seedlings in nurseries, carry them to bare mudflats and plant them in neat rows. Millions of young trees were planted in this way, and the numbers were often reported with pride. However, when researchers returned to many of these sites a few years later, they found that most of the seedlings had died."},{"l":"C","x":"The main reason was location. Mudflats that have no mangroves are usually bare for a reason: they are flooded for too long each day, or the water is the wrong dep
