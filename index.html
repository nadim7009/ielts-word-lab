<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Daily IELTS vocabulary: reading words with Bangla meanings, high-frequency listening words, Part 4 topic lists, spelling, dictation and typing practice with progress tracking.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23B3245A'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='34' font-weight='700' fill='white' text-anchor='middle'%3EAa%3C/text%3E%3C/svg%3E">
<title>IELTS Word Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;700&family=Hind+Siliguri:wght@400;600&family=JetBrains+Mono:wght@400;600&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
<style>
/* Layout: bright study app. Floating left rail on desktop, scrolling tab strip on phones.
   Light theme only, by design: white cards on a cool, airy background, jade as the action colour, coral for streaks. */
:root{
  --bg:#F4F7FB; --bg2:#EAF5F2; --surface:#FFFFFF; --sunk:#F1F4F9; --line:#E2E7EF; --ink:#13203A; --muted:#5F6B82;
  --accent:#0B8F74; --accent-2:#13B394; --accent-ink:#FFFFFF; --accent-soft:#E3F5EF;
  --coral:#FF6A3D; --coral-soft:#FFEDE6; --gold:#C98407; --gold-soft:#FFF4DC; --violet:#5B5BD6; --violet-soft:#ECECFC;
  --good:#12855F; --good-soft:#E1F5EC; --bad:#D2422E; --bad-soft:#FDE8E4;
  --heat0:#E8ECF3; --heat1:#B8E6D8; --heat2:#4CC2A3; --heat3:#0B8F74;
  --shadow:0 1px 2px rgb(19 32 58 / .05), 0 8px 24px rgb(19 32 58 / .06);
  --f-head:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-ui:"Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --f-word:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-bn:"Hind Siliguri", "Nirmala UI", "Vrinda", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  --r:16px; color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg) radial-gradient(1200px 500px at 85% -10%, var(--bg2), transparent 70%) no-repeat;color:var(--ink);font:16px/1.6 var(--f-ui)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-head);font-weight:800;line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.015em}
.bn{font-family:var(--f-bn)}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}

.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;align-self:start;height:100vh;padding:22px 14px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-head);font-size:21px;font-weight:800;padding:0 10px 20px;letter-spacing:-.02em}
.brand .logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;display:grid;place-items:center;font-size:17px;box-shadow:var(--shadow)}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;color:var(--ink);text-decoration:none;font-weight:700;font-size:15px}
.nav a svg{width:19px;height:19px;flex:none;color:var(--muted)}
.nav a:hover{background:var(--surface)}
.nav a[aria-current="page"]{background:var(--surface);box-shadow:var(--shadow);color:var(--accent)}
.nav a[aria-current="page"] svg{color:var(--accent)}
.rail .spacer{flex:1}
.rail .mini{padding:12px;font-size:14px;color:var(--muted);background:var(--surface);border-radius:12px;box-shadow:var(--shadow)}
.rail .mini a{color:var(--accent);font-weight:700}
main{padding:30px 36px 90px;min-width:0;max-width:1140px}
@media (max-width:880px){
  .shell{grid-template-columns:1fr}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:auto;flex-direction:row;align-items:center;padding:8px 12px;overflow-x:auto;background:rgb(255 255 255 / .92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .brand{padding:0 10px 0 0;font-size:17px;white-space:nowrap}
  .brand .logo{width:30px;height:30px;font-size:14px}
  .nav{display:flex;gap:2px}
  .nav a{white-space:nowrap;padding:7px 10px;font-size:14px}
  .nav a svg{display:none}
  .rail .spacer,.rail .mini{display:none}
  main{padding:18px 16px 70px}
}

.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:22px}
.page-head h1{font-size:clamp(30px,4.2vw,44px)}
.page-head p{margin:6px 0 0;color:var(--muted);max-width:64ch}
.panel{background:var(--surface);border-radius:var(--r);padding:20px;min-width:0;box-shadow:var(--shadow)}
.panel h2{font-size:21px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media (max-width:900px){.grid3{grid-template-columns:1fr 1fr}}
@media (max-width:660px){.grid2,.grid3{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 16px;font-weight:700;font-size:15px;text-decoration:none;color:var(--ink);transition:transform .08s, box-shadow .15s}
.btn:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;color:var(--accent-ink)}
.btn.coral{background:var(--coral);border-color:var(--coral);color:#fff}
.btn.small{padding:6px 12px;font-size:14px;border-radius:10px}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:17px;height:17px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:14px;font-weight:700}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:700;background:var(--sunk);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.coral{background:var(--coral-soft);color:var(--coral)}
.pill.violet{background:var(--violet-soft);color:var(--violet)}
.speak{border:0;background:var(--sunk);color:var(--muted);padding:5px;border-radius:9px;display:inline-flex}
.speak:hover{color:#fff;background:var(--accent)}
.speak svg{width:18px;height:18px}
input[type=text],input[type=search],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 13px}
input[type=search]:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:80;background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-weight:700;max-width:calc(100% - 32px);box-shadow:var(--shadow)}

.hero{background:linear-gradient(135deg,#0B8F74 0%,#13B394 60%,#3CC7A9 100%);color:#fff;border-radius:22px;padding:24px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:24px;align-items:center;box-shadow:0 12px 30px rgb(11 143 116 / .25)}
.hero .label{color:rgb(255 255 255 / .8)}
.hero h1{font-size:clamp(28px,4vw,40px);color:#fff}
.hero p{margin:6px 0 0;color:rgb(255 255 255 / .88);max-width:52ch}
.ring{width:128px;height:128px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .center b{font-family:var(--f-head);font-size:34px;line-height:1}
.ring .center span{font-size:12px;opacity:.85}
.flame{background:rgb(255 255 255 / .16);border-radius:16px;padding:12px 16px;text-align:center;min-width:110px}
.flame b{display:block;font-family:var(--f-head);font-size:40px;line-height:1}
.flame span{font-size:13px}
@media (max-width:760px){.hero{grid-template-columns:auto minmax(0,1fr)}.hero .flame{grid-column:1 / -1}}
@media (max-width:480px){.hero{grid-template-columns:1fr}}
.mission{display:flex;flex-direction:column}
.task{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center}
.check.on{background:var(--good);border-color:var(--good);color:#fff}
.check svg{width:14px;height:14px}
.task b{display:block}
.task small{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:660px){.stats{grid-template-columns:1fr 1fr}}
.stat{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat::after{content:"";position:absolute;right:-18px;top:-18px;width:64px;height:64px;border-radius:50%;background:var(--tint,var(--accent-soft))}
.stat b{display:block;font-family:var(--f-head);font-size:32px;line-height:1.1;position:relative;z-index:1}
.stat span{font-size:13px;color:var(--muted);position:relative;z-index:1}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);grid-auto-columns:14px;justify-content:start;gap:4px;overflow-x:auto;padding-bottom:4px}
.heat i{width:14px;height:14px;border-radius:4px;background:var(--heat0);display:block}
.heat i[data-l="1"]{background:var(--heat1)}
.heat i[data-l="2"]{background:var(--heat2)}
.heat i[data-l="3"]{background:var(--heat3)}
.heat i.today{outline:2px solid var(--coral);outline-offset:1px}
.legend{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.today-words{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:8px}
.tw{border-radius:12px;padding:10px 12px;background:var(--sunk);display:flex;flex-direction:column}
.tw b{font-family:var(--f-word);font-size:18px;font-weight:600}
.tw span{font-family:var(--f-bn);color:var(--muted);font-size:14px}
.tw.done{background:var(--accent-soft)}
.tw.done b::after{content:" ✓";color:var(--accent)}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input[type=search]{flex:1;min-width:200px}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.word{background:var(--surface);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0;box-shadow:var(--shadow);border-top:4px solid var(--tint,var(--accent))}
.word-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.word h3{font-family:var(--f-word);font-size:25px;font-weight:600;letter-spacing:-.01em}
.pos{font-style:italic;color:var(--muted);font-size:14px}
.word .bnm{font-family:var(--f-bn);font-size:17px;font-weight:600;color:var(--accent)}
.word .def{margin:0}
.word .ex{margin:0;color:var(--muted);font-style:italic}
.word .syn{font-size:14px;background:var(--sunk);border-radius:10px;padding:6px 10px}
.word .syn b{color:var(--violet)}
.boxdots{display:inline-flex;gap:3px;margin-left:auto}
.boxdots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.boxdots i.on{background:var(--good)}
.star{border:0;background:transparent;color:#C3CAD6;padding:2px}
.star[aria-pressed="true"]{color:var(--gold)}
.star svg{width:19px;height:19px}
.compact{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.cw{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:12px;padding:9px 12px;min-width:0;box-shadow:var(--shadow)}
.cw b{font-family:var(--f-word);font-size:18px;font-weight:600}
.cw .bn{color:var(--muted);font-size:14.5px;margin-left:auto;text-align:right}
.groupcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.gc{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.gc h3{font-size:19px}
.gc.complete{box-shadow:inset 0 0 0 2px var(--good),var(--shadow);background:linear-gradient(180deg,var(--good-soft),var(--surface) 70%)}
.gc.complete .meter i{background:var(--good)}
.pill svg{width:12px;height:12px}
.trk{display:flex;flex-direction:column;gap:12px;margin-bottom:18px}
.trk .p-bar{flex:none}
.trk-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.trk-stats div{background:var(--sunk);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column}
.trk-stats b{font-family:var(--f-head);font-size:26px;line-height:1.1}
.trk-stats span{font-size:13px;color:var(--muted)}
.trk-stats .bad b{color:var(--bad)}
.trk-stats .good b{color:var(--good)}
.mgrp{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.mgrp h3{font-size:18px;display:flex;align-items:center;gap:8px}
.cw.st-done{box-shadow:inset 4px 0 0 var(--good),var(--shadow)}
.cw.st-miss{box-shadow:inset 4px 0 0 var(--bad),var(--shadow)}
.cw .stmark{display:inline-flex;width:20px;height:20px;border-radius:50%;align-items:center;justify-content:center;flex:none}
.cw .stmark svg{width:12px;height:12px}
.cw.st-done .stmark{background:var(--good);color:#fff}
.cw.st-miss .stmark{background:var(--bad);color:#fff;font-weight:800;font-size:12px}
.cw .wrote{width:100%;font-size:13px;color:var(--bad)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:0 0 10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
@media (max-width:520px){.trk-stats b{font-size:21px}}
.gc .meter{height:7px;background:var(--sunk);border-radius:4px;overflow:hidden}
.gc .meter i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.more{display:flex;justify-content:center;margin-top:18px}

.practice{max-width:740px;margin:0 auto}
.p-top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.p-bar{flex:1;height:10px;background:var(--surface);border-radius:5px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.p-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .25s}
.card{background:var(--surface);border-radius:22px;padding:32px;min-height:320px;display:flex;flex-direction:column;gap:14px;justify-content:center;box-shadow:var(--shadow)}
.card .big{font-family:var(--f-word);font-size:clamp(38px,7vw,60px);font-weight:600;letter-spacing:-.02em;line-height:1.05;text-align:center}
.card .bnbig{font-family:var(--f-bn);font-size:clamp(28px,6vw,40px);font-weight:600;text-align:center;line-height:1.3;color:var(--accent)}
.card .hint{text-align:center;color:var(--muted)}
.card .center{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.answer{width:100%;font-size:26px;text-align:center;padding:13px;border:2px solid var(--line);border-radius:14px;background:var(--sunk);font-family:var(--f-word)}
.answer:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 4px var(--accent-soft)}
.answer.ok{border-color:var(--good);background:var(--good-soft)}
.answer.no{border-color:var(--bad);background:var(--bad-soft)}
.diff{font-family:var(--f-mono);font-size:22px;text-align:center;letter-spacing:.04em}
.diff .ok{color:var(--good)}
.diff .x{color:var(--bad);text-decoration:underline;text-decoration-thickness:2px}
.diff .miss{color:var(--bad);background:var(--bad-soft);border-radius:3px}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:13px 16px;font-size:17px}
.opt:hover{border-color:var(--accent)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.flipback{border-top:1px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.result-hero{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.result-hero .score{font-family:var(--f-head);font-size:68px;font-weight:800;line-height:1}
.mistakes{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.mk{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;padding:10px 14px;border-radius:12px;background:var(--sunk)}
.mk s{color:var(--bad)}
.setup{display:flex;flex-direction:column;gap:14px}

.type-stage{background:var(--surface);border-radius:22px;padding:24px;box-shadow:var(--shadow)}
.stream{font-family:var(--f-mono);font-size:21px;line-height:1.9;min-height:130px;max-height:165px;overflow:hidden}
.stream span{padding:1px 3px;border-radius:5px}
.stream .cur{background:var(--accent-soft);color:var(--accent)}
.stream .done-ok{color:var(--good)}
.stream .done-no{color:var(--bad);text-decoration:line-through}
.typebox{width:100%;font-family:var(--f-mono);font-size:22px;padding:11px 15px;border:2px solid var(--line);border-radius:14px;background:var(--sunk);margin-top:14px}
.typebox:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.typebox.err{border-color:var(--bad)}
.type-meta{display:flex;gap:22px;flex-wrap:wrap;margin-top:12px}
.type-meta div b{display:block;font-family:var(--f-head);font-size:32px;line-height:1}
.type-meta div span{font-size:13px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:12px var(--f-mono)}
.bars .brow{display:grid;grid-template-columns:110px minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:14px;padding:4px 0}
.bars .bar{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.bars .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:5px}
table.weak{width:100%;border-collapse:collapse;font-size:15px}
table.weak td,table.weak th{padding:8px;border-bottom:1px solid var(--line);text-align:left}
table.weak th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.overlay{position:fixed;inset:0;z-index:60;background:rgb(19 32 58 / .45);display:flex;align-items:center;justify-content:center;padding:16px}
.dialog{background:var(--surface);border-radius:20px;padding:24px;max-width:520px;width:100%;max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-weight:700}

/* writing check */
.writer{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:960px){.writer{grid-template-columns:1fr}}
.editor{width:100%;min-height:320px;resize:vertical;font:17px/1.75 var(--f-ui);padding:16px;border-radius:16px}
.marked{font:17px/1.85 var(--f-ui);white-space:pre-wrap;word-wrap:break-word;padding:16px;background:var(--sunk);border-radius:16px;min-height:120px}
.marked mark{background:transparent;border-bottom:2.5px solid var(--bad);color:inherit;cursor:pointer;padding:0 1px}

.unit .num{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.unit h3{font-size:18px}

.unit.complete{background:linear-gradient(180deg,var(--good-soft),var(--surface) 75%)}
.stars{display:inline-flex;gap:2px;color:#E2E7EF}

.stars .on{color:#F5B400}
.stars.big svg{width:30px;height:30px}
.skills{display:flex;gap:4px}
.skills i{font-style:normal;font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;background:var(--sunk);color:var(--muted)}
.gbar{height:7px;background:var(--sunk);border-radius:4px;overflow:hidden}

.steps{display:flex;gap:6px;justify-content:center;margin-top:12px}

.starters{display:flex;flex-direction:column;gap:8px}
.starter{display:flex;gap:8px;align-items:center;background:var(--sunk);border-radius:12px;padding:9px 12px;font-family:var(--f-head);font-size:17px}
.drills{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.drill{border:0;border-radius:14px;padding:14px;text-align:left;background:var(--tint,var(--sunk));display:flex;flex-direction:column;gap:2px;font-weight:700}

.gq{max-width:760px;margin:0 auto}

.gq .opts{display:grid;gap:10px}
.combo{display:inline-flex;align-items:center;gap:4px;font-weight:800;color:var(--coral);font-family:var(--f-head);font-size:18px}

.tokens{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font-family:var(--f-head);font-size:20px}
.tok{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 10px}

.tok.miss{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}

.tok.used{visibility:hidden}
.tray{min-height:58px;border:2px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}

.fbk.no b.t{color:var(--bad)}

.wd{display:flex;flex-wrap:wrap;gap:4px 8px;justify-content:center;font-family:var(--f-head);font-size:19px}

.wd .ext{color:var(--muted);text-decoration:line-through}
.mic{width:86px;height:86px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--coral),#FF9A6B);color:#fff;display:grid;place-items:center;margin:0 auto;box-shadow:0 10px 24px rgb(255 106 61 / .35)}
.mic svg{width:36px;height:36px}

@keyframes pulse2{50%{box-shadow:0 0 0 14px var(--coral-soft)}}
.said{min-height:52px;background:var(--sunk);border-radius:12px;padding:10px 14px;font-family:var(--f-head);font-size:18px}

.result-stars .on:nth-child(2){animation-delay:.25s}
.result-stars .on:nth-child(3){animation-delay:.5s}
@keyframes pop{0%{transform:scale(0) rotate(-30deg)}70%{transform:scale(1.25)}}
.confetti{position:fixed;top:-12px;width:10px;height:14px;z-index:90;pointer-events:none;border-radius:2px;animation:fall linear forwards}

// prefer weak and unseen words, then the rest
function pickForDrill(keys, n){

  return [...shuffle(miss).slice(0, Math.ceil(n / 2)), ...shuffle(weak).slice(0, Math.ceil(n / 4)), ...shuffle(todo), ...shuffle(keys)].filter((k, i, a) => a.indexOf(k) === i).slice(0, n);
}

function setupTyping(src, secs){

      if (msg === 'Repeated word' && /^(had|that)$/i.test(m[1])) continue;
      out.push({ off, len, msg, sugs: sugs || [], type, src:'local' }); if (!re.global) break; } };
  ERRORS.forEach(([re, msg, sugs]) => add(re, msg, sugs, 'grammar'));
  INFORMAL.forEach(([re, msg, sugs]) => add(re, msg, sugs, 'style'));

  let pos = 0; text.split(/(?<=[.!?])\s+/).forEach(sen => { const i = text.indexOf(sen, pos); const n = wordsIn(sen).length; if (n > 38) out.push({ off:i, len:sen.length, msg:`Long sentence (${n} words). Consider splitting it.`, sugs:[], type:'style', src:'local' }); pos = i + sen.length; });

const GR = [{"id":"plural","title":"Singular and plural","bn":"একবচন ও বহুবচন","why":"A missing or extra -s makes a Listening or Reading answer wrong, and it lowers your accuracy score in Writing and Speaking.","rules":[{"h":"Some nouns are always uncountable","en":"Information, advice, equipment, research, furniture, luggage and evidence have no plural form and never take a or an. Use some, much, a lot of or a piece of with them.","bn":"information, advice, equipment এর মতো শব্দের শেষে কখনো -s বসে না, আগে a/an-ও বসে না। আলাদা করে গুনতে চাইলে a piece of ব্যবহার করুন।","ex":["The library gave us some useful information about the course.","She gave me two pieces of advice before the interview."]},{"h":"Numbers and quantity words need a plural noun","en":"After two, three, several, many, a few and both, a countable noun must end in -s. English always marks the plural, even when the number already shows it.","bn":"বাংলায় 'তিনটা বই' বললে বই শব্দ বদলায় না, কিন্তু ইংরেজিতে সংখ্যার পরে -s লাগবেই: three books।","ex":["The course lasts six weeks.","Several students asked for extra lessons."]},{"h":"One of the + plural noun","en":"After one of the, each of the and some of the, the noun is plural because you are choosing from a group. The verb after one of the ... stays singular.","bn":"one of the এর পরে বিশেষ্য বহুবচন হয়, কারণ একটা দলের ভেতর থেকে একটাকে বাছা হচ্ছে। কিন্তু ক্রিয়া একবচন থাকে।","ex":["Dhaka is one of the most crowded cities in the world.","One of the main problems is the lack of public transport."]},{"h":"Irregular plurals","en":"Some nouns change their form instead of adding -s: child and children, person and people, woman and women, criterion and criteria, phenomenon and phenomena, analysis and analyses. Never add another -s to these.","bn":"কিছু শব্দের বহুবচনে -s যোগ হয় না, শব্দটাই বদলে যায়, যেমন children, people, criteria। এদের শেষে আবার -s দেবেন না।","ex":["Many children walk to school in rural areas.","The judges used three criteria to choose the winner."]},{"h":"Listen for the quiet -s","en":"In Listening, the final -s is often soft, but it still counts. Look at the words around the gap before you listen, so you know whether to expect a plural.","bn":"Listening এ শব্দের শেষের -s আস্তে শোনা যায়, কিন্তু না লিখলে উত্তর ভুল। গ্যাপের আগের শব্দ দেখে আগেই আন্দাজ করুন একবচন না বহুবচন।","ex":["Please bring two passport photographs to the first meeting.","The tour includes visits to several local farms."]}],"traps":[{"wrong":"The teacher gave us many informations about the exam.","right":"The teacher gave us a lot of information about the exam.","why":"Information is uncountable, so no -s and no 'many'."},{"wrong":"He is one of the best player in the team.","right":"He is one of the best players in the team.","why":"After 'one of the', the noun must be plural."},{"wrong":"We need to buy some new furnitures for the office.","right":"We need to buy some new furniture for the office.","why":"Furniture is uncountable and never takes -s."},{"wrong":"Many peoples in Bangladesh use mobile banking.","right":"Many people in Bangladesh use mobile banking.","why":"People is already plural. 'Peoples' means different nations."},{"wrong":"The study lasted three year.","right":"The study lasted three years.","why":"Any number above one needs a plural noun."}],"starters":["One of the things I enjoy most is…","There are several reasons why…","The best advice I have ever received was…","A lot of people in my area…","The information I found online showed that…"],"q":[{"t":"mcq","sk":"W","q":"Could you give me some ___ about the visa process?","o":["an advice","advice","advices"],"a":1,"why":"Advice is uncountable. Say 'some advice' or 'a piece of advice', never 'advices'.","bn":"advice এর শেষে কখনো -s হয় না।"},{"t":"gap","sk":"W","q":"The museum is closed on public ___ (holiday).","a":["holidays"],"why":"We mean public holidays in general, so the noun is plural."},{"t":"tap","sk":"W","s":"The hotel has three swimming pool and a large gym.","w":"pool","o":["pooles","pools","pool's"],"a":1,"why":"After 'three', the noun needs a plural -s.","bn":"সংখ্যার পরে -s লাগবে।"},{"t":"dict","sk":"L","s":"The library has thousands of books and several quiet study rooms.","why":"Listen for the -s at the end of books and rooms."},{"t":"predict","sk":"L","q":"Each student must bring two ______ to the first class.","o":["plural noun","adjective","verb","singular noun"],"a":0,"ans":"notebooks","full":"On the first day, each student must bring two notebooks and a pen.","why":"'Two' before the gap tells you the answer is a plural noun ending in -s.","bn":"two দেখলেই বহুবচন আশা করুন।"},{"t":"mcq","sk":"W","q":"The airline allows each passenger to carry 20 kilograms of ___.","o":["luggages","luggage","a luggage","the luggages"],"a":1,"why":"Luggage is uncountable, so it has no -s and no 'a'."},{"t":"tap","sk":"W","s":"The researchers collected strong evidences from local hospitals.","w":"evidences","o":["evidance","evident","evidence"],"a":2,"why":"Evidence is uncountable, so it never takes -s."},{"t":"gap","sk":"W","q":"There ___ (be) a lot of new equipment in the science lab.","a":["is","was"],"why":"Equipment is uncountable, so it takes a singular verb: there is.","bn":"uncountable শব্দের সাথে is বসে।"},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: Many of the species that once lived in the region","o":["have disappeared because of farming.","has disappeared because of farming.","is disappearing because of farming."],"a":0,"why":"'Many of the species' is plural, so the verb is 'have'. Species looks the same in singular and plural."},{"t":"dict","sk":"L","s":"She gave me some useful advice about finding cheap accommodation in London.","why":"Advice and accommodation are uncountable, so you should not hear or write an -s."},{"t":"order","sk":"S","s":"My grandmother gave me some useful advice about money.","why":"Advice takes 'some', not 'a', and has no -s."},{"t":"tap","sk":"W","s":"Dhaka is one of the most polluted city in Asia.","w":"city","o":["city's","citys","cities"],"a":2,"why":"After 'one of the most', use a plural noun: cities.","bn":"one of the এর পরে বহুবচন।"},{"t":"predict","sk":"L","q":"Our advisers can give you a lot of ______ about part-time work.","o":["verb","adjective","singular noun","uncountable noun"],"a":3,"ans":"advice","full":"If you are looking for a job, our advisers can give you a lot of advice about part-time work.","why":"'A lot of' cannot go before a singular countable noun, so expect an uncountable word like advice."},{"t":"mcq","sk":"W","q":"The committee used several ___ to judge the projects.","o":["criterias","criterion","criteria"],"a":2,"why":"Criteria is already the plural of criterion. 'Criterias' does not exist.","bn":"criteria নিজেই বহুবচন।"},{"t":"gap","sk":"W","q":"Two of the ___ (child) in the class had already visited the museum.","a":["children"],"why":"Child has an irregular plural: children, with no -s."},{"t":"dict","sk":"L","s":"One of the biggest problems in modern cities is the lack of green spaces.","why":"Listen for the plural cities and spaces, and the singular verb is after 'one of'."},{"t":"tap","sk":"W","s":"Every student should get a feedback on their first essay.","w":"a","o":["(remove)","an","one"],"a":0,"why":"Feedback is uncountable, so it cannot take a or an.","bn":"feedback এর আগে a বসে না।"},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: The latest analyses of river water in Bangladesh","o":["shows a sharp rise in plastic waste.","has shown a sharp rise in plastic waste.","was showing a sharp rise in plastic waste.","show a sharp rise in plastic waste."],"a":3,"why":"'Analyses' is the plural of analysis, so the verb is 'show' with no -s."},{"t":"order","sk":"W","s":"The government has spent a lot of money on research.","why":"Research is uncountable, so it stays without -s."},{"t":"tap","sk":"W","s":"The lecturer described several natural phenomenon that scientists still cannot explain.","w":"phenomenon","o":["phenomena","phenomenas","phenomenons"],"a":0,"why":"After 'several' you need the plural, and the plural of phenomenon is phenomena."},{"t":"predict","sk":"L","q":"Participants will be divided into small ______","o":["singular noun","plural noun","uncountable noun","adjective"],"a":1,"ans":"groups","full":"On the first morning, participants will be divided into small groups of five.","why":"Many people are divided into more than one unit, so expect a plural noun."},{"t":"gap","sk":"W","q":"The flat comes with all the basic ___ (furniture), such as a bed and a desk.","a":["furniture"],"why":"Even with 'all the', furniture stays uncountable. Do not add -s.","bn":"furniture এর শেষে -s হয় না।"},{"t":"mcq","sk":"W","q":"Neither of the two ___ was suitable for the job.","o":["candidate","candidates","candidate's"],"a":1,"why":"'Neither of the' is followed by a plural noun, like 'one of the'."},{"t":"speak","sk":"S","q":"Do you prefer getting advice from friends or from family?","need":"\\badvice\\b","hint":"Use 'advice' with no -s, such as 'some advice'.","model":"I usually go to my older sister for advice because she has been through the same exams, and her advice is always practical.","why":"Advice is uncountable, so it never becomes 'advices'."},{"t":"tap","sk":"W","s":"Each of the participant was asked to keep a diary for two weeks.","w":"participant","o":["participated","participant's","participants"],"a":2,"why":"'Each of the' needs a plural noun after it, even though the verb is singular."},{"t":"dict","sk":"L","s":"The museum has a lot of equipment that visitors can try for themselves.","why":"Equipment has no -s, so do not add one when you write it."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: According to the report, a lack of reliable data on rural households","o":["make it difficult to plan new services.","making it difficult to plan new services.","makes it difficult to plan new services."],"a":2,"why":"The main subject is 'a lack', which is singular, so the verb is 'makes'."},{"t":"gap","sk":"W","q":"Local farmers have noticed changes in the behaviour of several bird ___ (species).","a":["species"],"why":"Species has the same form in singular and plural, so it does not change.","bn":"species এর বহুবচনও species।"},{"t":"tap","sk":"W","s":"Most of the damages caused by the flood happened near the river.","w":"damages","o":["damaged","damaging","damage"],"a":2,"why":"For harm to buildings or land, damage is uncountable. 'Damages' means money paid by a court."},{"t":"speak","sk":"S","q":"Describe one of the most useful things you have learnt at university.","need":"\\bone of (the|my)\\b","hint":"Use 'one of the' or 'one of my' with a plural noun.","model":"One of the most useful skills I have learnt is how to clean data in Python, because I use it in almost every project.","why":"After 'one of the', the noun is plural but the verb stays singular."}]},{"id":"articles","title":"Articles: a, an, the","bn":"আর্টিকেল: a, an, the","why":"Missing articles are one of the most common errors in Bangladeshi candidates' Writing and Speaking, and in Listening an 'a' or 'an' before a gap tells you the answer is singular.","rules":[{"h":"A singular countable noun cannot stand alone","en":"Put a, an, the, or a word like my or this before a singular countable noun. 'He is engineer' is wrong; 'He is an engineer' is right.","bn":"বাংলায় আর্টিকেল নেই, তাই আমরা প্রায়ই বাদ দিয়ে ফেলি। একবচন গণনাযোগ্য বিশেষ্যের আগে a/an/the অথবা my, this জাতীয় কিছু থাকতেই হবে।","ex":["She works as a nurse in a large hospital.","I bought a laptop last month."]},{"h":"A or an the first time, the after that","en":"Use a or an when you mention something for the first time. Use the when the listener already knows which one you mean, or when there is only one.","bn":"প্রথমবার কোনো কিছুর কথা বললে a/an, আর শ্রোতা যখন জানে কোনটার কথা বলছেন তখন the।","ex":["We stayed in a small hotel. The hotel was close to the beach.","The chart shows changes in rice production."]},{"h":"A or an depends on the sound","en":"Use an before a vowel sound and a before a consonant sound. So we say an hour and an honest man, but a university and a European country.","bn":"বানান নয়, উচ্চারণ দেখুন। hour শুরু হয় 'আ' ধ্বনিতে, তাই an hour; university শুরু হয় 'ইউ' ধ্বনিতে, তাই a university।","ex":["The exam lasts an hour.","He studies at a university in Sylhet."]},{"h":"The with superlatives and some names","en":"Use the before superlatives (the highest, the most popular) and before rivers, seas, oceans and country names that contain words like Kingdom, States or Republic. Most city and country names take no article.","bn":"superlative এর আগে the বসে। নদী, সাগর, মহাসাগর আর the UK, the USA এর আগেও the লাগে, কিন্তু Dhaka বা Bangladesh এর আগে না।","ex":["The Padma is one of the widest rivers in the country.","She moved to the UK to study medicine."]},{"h":"No article for things in general","en":"When you talk about something in general, use a plural or uncountable noun with no article: Technology changes quickly. Use the only when you mean a specific one.","bn":"সাধারণভাবে কোনো বিষয়ের কথা বললে the বসে না: Education is important। নির্দিষ্ট কিছু বোঝালে তখন the।","ex":["Technology has changed the way people work.","The technology used in this factory is very old."]}],"traps":[{"wrong":"My father is engineer.","right":"My father is an engineer.","why":"Jobs need a or an before them."},{"wrong":"Pollution is a big problem in the Dhaka.","right":"Pollution is a big problem in Dhaka.","why":"City names take no article."},{"wrong":"The education is important for every child.","right":"Education is important for every child.","why":"Education in general takes no article."},{"wrong":"It took me a hour to finish.","right":"It took me an hour to finish.","why":"The h is silent, so hour starts with a vowel sound."},{"wrong":"Bangladesh is one of most crowded countries.","right":"Bangladesh is one of the most crowded countries.","why":"Superlatives need 'the'."}],"starters":["When I was a child, I…","The best thing about my hometown is…","I'd like to work for an international company because…","In my opinion, technology has made life…","The most interesting place I have ever visited is…"],"q":[{"t":"mcq","sk":"W","q":"My uncle works as ___ engineer in Chattogram.","o":["(no article)","an","the","a"],"a":1,"why":"Jobs need a or an, and engineer starts with a vowel sound, so use 'an'.","bn":"পেশার আগে a/an লাগে।"},{"t":"gap","sk":"W","q":"It takes about ___ hour to get to the airport by bus.","a":["an"],"why":"The h in hour is silent, so it starts with a vowel sound."},{"t":"tap","sk":"W","s":"My sister wants to become doctor after she finishes school.","w":"doctor","o":["a doctor","the doctor","doctors"],"a":0,"why":"A job after 'become' needs a or an: become a doctor.","bn":"become এর পরে পেশার আগে a বসান।"},{"t":"dict","sk":"L","s":"We booked a room in a small hotel near the station.","why":"Listen for the small words a and the. They are quick and easy to miss."},{"t":"predict","sk":"L","q":"The tour ends with a visit to an old ______","o":["verb","plural noun","singular noun","adjective"],"a":2,"ans":"lighthouse","full":"At the end of the tour, we will visit an old lighthouse on the cliffs.","why":"'An old' before the gap means one thing, so expect a singular noun."},{"t":"mcq","sk":"W","q":"Task 1 opening: ___ line graph below shows the number of tourists in three cities.","o":["The","An","(no article)"],"a":0,"why":"We mean the graph in front of us, so use 'the'. 'An line' is wrong because line starts with a consonant sound."},{"t":"tap","sk":"W","s":"She is studying at an university in Rajshahi.","w":"an","o":["any","(remove)","a"],"a":2,"why":"University starts with a 'you' sound, which is a consonant sound, so use 'a'.","bn":"university এর আগে a বসে।"},{"t":"gap","sk":"W","q":"___ Jamuna is one of the main rivers in Bangladesh.","a":["the"],"why":"Names of rivers take 'the': the Jamuna, the Thames, the Nile."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: In many developing countries, access to clean water","o":["is still the serious problem for rural families.","is still a serious problem for rural families.","is still serious problem for rural families."],"a":1,"why":"'Problem' is singular and countable, and we are mentioning it for the first time, so use 'a'."},{"t":"dict","sk":"L","s":"The river that runs through the city is one of the longest in Europe.","why":"Listen for 'the' before river, city and longest. Superlatives always take 'the'."},{"t":"order","sk":"S","s":"She is the youngest person in her family.","why":"A superlative like youngest needs 'the' in front of it."},{"t":"tap","sk":"W","s":"Most people agree that the education should be free for all children.","w":"the","o":["(remove)","a","an"],"a":0,"why":"We mean education in general, so no article.","bn":"সাধারণ অর্থে education এর আগে the বসে না।"},{"t":"predict","sk":"L","q":"Remember to bring an ______ for the field trip.","o":["singular noun","plural noun","uncountable noun","verb"],"a":0,"ans":"umbrella","full":"It might rain, so remember to bring an umbrella for the field trip.","why":"'An' means one thing, and the word must start with a vowel sound, like umbrella."},{"t":"mcq","sk":"W","q":"___ unemployment rate in the region fell sharply after 2015.","o":["The","A","(no article)","An"],"a":0,"why":"We mean one specific rate, the rate in this region, so use 'the'."},{"t":"gap","sk":"W","q":"The Bay of Bengal is one of ___ most important fishing areas in Asia.","a":["the"],"why":"'One of the' plus a superlative: one of the most important."},{"t":"dict","sk":"L","s":"An hour of exercise a day is good for both the body and the mind.","why":"Hour takes 'an' because the h is silent. 'A day' here means each day."},{"t":"tap","sk":"W","s":"He was the most hardworking student in a class.","w":"a","o":["an","one","the"],"a":2,"why":"We know which class, his class, so it must be 'the'."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: The Amazon, which flows through several South American countries,","o":["is largest river in the world by volume.","is the largest river in the world by volume.","is a largest river in the world by volume."],"a":1,"why":"A superlative like largest always needs 'the', never 'a' or nothing."},{"t":"order","sk":"W","s":"Bangladesh has one of the highest population densities in the world.","why":"Country names like Bangladesh take no article, but 'the highest' and 'the world' do."},{"t":"tap","sk":"W","s":"Many students from Bangladesh go to university in United Kingdom.","w":"United","o":["the United","an United","a United"],"a":0,"why":"Country names with Kingdom, States or Republic take 'the'.","bn":"the UK, the USA, এগুলোর আগে the লাগে।"},{"t":"predict","sk":"L","q":"Tonight's talk is about the effects of ______ on teenagers.","o":["verb","singular noun","uncountable noun","adjective"],"a":2,"ans":"advertising","full":"Tonight's talk looks at the effects of advertising on teenagers.","why":"There is no article before the gap, so it cannot be a singular countable noun."},{"t":"gap","sk":"W","q":"He is ___ honest person, so people trust him.","a":["an"],"why":"The h in honest is silent, so it starts with a vowel sound and takes 'an'.","bn":"honest এর h উচ্চারিত হয় না।"},{"t":"mcq","sk":"W","q":"Generally speaking, ___ are more open to new technology than older people.","o":["young people","a young people","the young people"],"a":0,"why":"We mean young people in general, so no article. 'A' cannot go with a plural."},{"t":"speak","sk":"S","q":"Describe a place you visited that you would like to go back to.","need":"\\bthe\\s+(most|least|best|worst|\\w+est)\\b","hint":"Use 'the' with a superlative, like 'the most beautiful'.","model":"The most beautiful place I have visited is Sajek Valley, and it was the quietest trip I have ever had.","why":"Superlatives always need 'the'."},{"t":"tap","sk":"W","s":"This is the first time I have visited a Netherlands.","w":"a","o":["the","an","(remove)"],"a":0,"why":"Plural-looking country names take 'the': the Netherlands, the Philippines."},{"t":"dict","sk":"L","s":"Unemployment among young people has become a serious problem in many countries.","why":"No article before unemployment or young people, because they are general. 'A serious problem' is singular."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: Research suggests that a healthy diet in early childhood","o":["has the strong effect on later school results.","has a strong effect on later school results.","has strong effect on the later school results."],"a":1,"why":"'Effect' is a singular countable noun mentioned for the first time, so use 'a'."},{"t":"gap","sk":"W","q":"The new scheme aims to help ___ unemployed find work.","a":["the"],"why":"'The' plus an adjective means a whole group of people: the unemployed, the poor, the elderly.","bn":"the + adjective = একদল মানুষ।"},{"t":"tap","sk":"W","s":"Most of governments in the region have invested heavily in solar energy.","w":"of","o":["(remove)","for","in"],"a":0,"why":"Say 'most governments' for general meaning, or 'most of the governments'. 'Most of governments' is wrong."},{"t":"speak","sk":"S","q":"Do you think the internet has changed the way people study?","need":"\\bthe internet\\b","hint":"Say 'the internet'; general nouns like education need no article.","model":"Yes, the internet has made it much easier for students to find information, although it can also be a big distraction.","why":"We always say 'the internet', but 'students' and 'information' in general take no article."}]},{"id":"agreement","title":"Subject-verb agreement","bn":"কর্তা ও ক্রিয়ার মিল","why":"Agreement errors are easy for examiners to spot in Writing and Speaking, and in Reading the verb form often shows which sentence ending is grammatical.","rules":[{"h":"Find the real subject","en":"In a long subject, the verb agrees with the main noun, not with the noun just before the verb. In 'The quality of the roads is poor', the subject is quality.","bn":"লম্বা subject এ of এর পরের শব্দ দেখে ক্রিয়া ঠিক করবেন না। মূল বিশেষ্যটা খুঁজে বের করুন, ক্রিয়া তার সাথে মিলবে।","ex":["The level of pollution in many cities is dangerous.","The price of these phones has fallen."]},{"h":"A number of and the number of","en":"'A number of' means 'many', so it takes a plural verb. 'The number of' is one figure, so it takes a singular verb.","bn":"a number of মানে অনেকগুলো, তাই are/have; the number of মানে সংখ্যাটা, তাই is/has।","ex":["A number of students were absent today.","The number of students has increased."]},{"h":"Each, every, either and neither","en":"Each, every, everyone, either and neither take a singular verb, even when a plural noun comes after 'of'.","bn":"each, every, everyone এর পরে ক্রিয়া সবসময় একবচন, পরে plural শব্দ থাকলেও।","ex":["Every student has a library card.","Neither of the plans is cheap."]},{"h":"People and police are plural","en":"People and police always take a plural verb. Research, information and news are uncountable, so they take a singular verb.","bn":"people আর police সবসময় বহুবচন, তাই are। কিন্তু research, news, information একবচন, তাই is।","ex":["The police are investigating the accident.","The news is not good."]},{"h":"There is and there are","en":"After 'there', the verb agrees with the noun that comes next. Use there is with a singular or uncountable noun and there are with a plural noun.","bn":"there এর পরে ক্রিয়া পরের বিশেষ্যটার সাথে মেলে: there is a problem, there are two problems।","ex":["There is a lot of traffic in the morning.","There are two main reasons for this trend."]}],"traps":[{"wrong":"The number of students are increasing every year.","right":"The number of students is increasing every year.","why":"'The number' is one figure, so use a singular verb."},{"wrong":"Research show that sleep improves memory.","right":"Research shows that sleep improves memory.","why":"Research is uncountable, so the verb needs -s."},{"wrong":"Each of the students have a laptop.","right":"Each of the students has a laptop.","why":"Each means one at a time, so use a singular verb."},{"wrong":"The police has arrested two men.","right":"The police have arrested two men.","why":"Police is always plural."},{"wrong":"There is many reasons for this problem.","right":"There are many reasons for this problem.","why":"'Reasons' is plural, so use 'there are'."}],"starters":["There are a few reasons why I…","Most people in my country think…","Everyone in my family enjoys…","Research shows that…","One thing that really annoys me is…","A number of my friends have…"],"q":[{"t":"mcq","sk":"W","q":"My brother ___ in a bank in Motijheel.","o":["work","works","working"],"a":1,"why":"He, she, it or a single person takes -s in the present simple: works.","bn":"he/she এর পরে ক্রিয়ায় -s।"},{"t":"gap","sk":"W","q":"Most people in my city ___ (travel) to work by bus.","a":["travel","travelled"],"why":"People is plural, so the verb has no -s."},{"t":"tap","sk":"W","s":"There is three bedrooms in the flat, and each has its own bathroom.","w":"is","o":["are","was","be"],"a":0,"why":"'Bedrooms' is plural, so use 'there are'.","bn":"plural এর আগে there are।"},{"t":"dict","sk":"L","s":"Every student needs a library card to borrow books from the main building.","why":"Every takes a singular verb, so listen for the -s on needs."},{"t":"predict","sk":"L","q":"The main ______ is that the building is too old.","o":["singular noun","verb","plural noun","adjective"],"a":0,"ans":"problem","full":"The main problem, according to the council, is that the building is too old.","why":"'Is' after the gap tells you the noun is singular."},{"t":"mcq","sk":"W","q":"Everyone in my class ___ to pass the exam.","o":["are wanting","wants","want"],"a":1,"why":"Everyone is grammatically singular, so the verb takes -s.","bn":"everyone একবচন।"},{"t":"tap","sk":"W","s":"The police is looking for the driver who caused the accident.","w":"is","o":["has","are","was"],"a":1,"why":"Police is always plural, so use 'are'."},{"t":"gap","sk":"W","q":"There ___ (be) a lot of traffic in Dhaka during the rush hour.","a":["is","was"],"why":"Traffic is uncountable, so use 'there is'."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: The quality of the roads in many rural areas","o":["is much lower than in the cities.","have been much lower than the cities.","are much lower than in the cities."],"a":0,"why":"The real subject is 'quality', not 'roads' or 'areas', so the verb is singular."},{"t":"dict","sk":"L","s":"The number of students who live on campus has risen this year.","why":"'The number of' takes a singular verb, so listen for 'has', not 'have'."},{"t":"order","sk":"W","s":"A number of residents have complained about the noise.","why":"'A number of' means many, so the verb is plural: have."},{"t":"tap","sk":"W","s":"One of the main reasons for the traffic jams are poor planning.","w":"are","o":["is","were","be"],"a":0,"why":"The subject is 'one', so the verb is singular.","bn":"subject হলো one, তাই is।"},{"t":"predict","sk":"L","q":"Several ______ were damaged in the storm last week.","o":["uncountable noun","plural noun","singular noun","verb"],"a":1,"ans":"boats","full":"Several boats were damaged in the storm last week, so the ferry service is limited.","why":"'Several' before the gap and 'were' after it both point to a plural noun."},{"t":"mcq","sk":"W","q":"Neither of the two options ___ cheap enough for most families.","o":["are","is","being","be"],"a":1,"why":"In formal writing, 'neither of' takes a singular verb."},{"t":"gap","sk":"W","q":"Research ___ (suggest) that children learn languages more easily than adults.","a":["suggests","suggested","has suggested"],"why":"Research is uncountable and singular, so add -s.","bn":"research একবচন, তাই suggests।"},{"t":"dict","sk":"L","s":"There are several reasons why young people are moving to the capital.","why":"Listen for 'there are' before the plural reasons."},{"t":"tap","sk":"W","s":"Every one of these countries have its own national language.","w":"have","o":["has","having","are having"],"a":0,"why":"'Every one' is singular, and 'its' also shows that, so use 'has'."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: Neither the manager nor her assistants","o":["has been told about the new policy.","was told about the new policy.","were told about the new policy."],"a":2,"why":"With 'neither ... nor', the verb agrees with the nearer noun. 'Assistants' is plural, so 'were'."},{"t":"order","sk":"W","s":"There is not enough information about the new rules.","why":"Information is uncountable, so use 'there is'."},{"t":"tap","sk":"W","s":"The list of recommended books for the course are on the website.","w":"are","o":["is","be","were"],"a":0,"why":"The subject is 'the list', not 'books', so use 'is'.","bn":"মূল subject হলো list।"},{"t":"predict","sk":"L","q":"The ______ of visitors has doubled since the new bridge opened.","o":["verb","plural noun","singular noun","adjective"],"a":2,"ans":"number","full":"Since the new bridge opened, the number of visitors has doubled.","why":"'Has' agrees with a singular noun before 'of'."},{"t":"gap","sk":"W","q":"A number of local shops ___ (be) closed last year.","a":["were"],"why":"'A number of' means many, so use the plural past form: were."},{"t":"mcq","sk":"W","q":"Not only the students but also their teacher ___ unhappy with the new timetable.","o":["was","were","are being"],"a":0,"why":"With 'not only ... but also', the verb agrees with the nearer noun, teacher, which is singular."},{"t":"speak","sk":"S","q":"What do people in your country usually do at weekends?","need":"\\bpeople\\b(\\s+\\w+){0,4}?\\s+(go|spend|visit|like|prefer|stay|watch|meet|enjoy|tend|love|have|do|are)\\b","hint":"Start with 'Most people…' and use a verb with no -s.","model":"Most people in Bangladesh spend their weekends with family, and many go shopping or visit relatives.","why":"People is plural, so the verb has no -s."},{"t":"tap","sk":"W","s":"Mathematics are the subject that most students find difficult.","w":"are","o":["be","is","were"],"a":1,"why":"School subjects ending in -s, like mathematics and economics, are singular."},{"t":"dict","sk":"L","s":"Each of the participants was given a short questionnaire to complete at home.","why":"'Each of the' takes a singular verb, so listen for 'was'."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: The rise in house prices, together with low wages,","o":["make it hard for young people to buy a home.","making it hard for young people to buy a home.","makes it hard for young people to buy a home."],"a":2,"why":"'Together with' does not join two subjects. The subject is still 'the rise', so 'makes'."},{"t":"gap","sk":"W","q":"Neither the students nor the lecturer ___ (be) aware of the change to the timetable.","a":["was","is"],"why":"The verb agrees with the nearer noun, lecturer, which is singular.","bn":"কাছের noun এর সাথে ক্রিয়া মেলে।"},{"t":"tap","sk":"W","s":"The economic benefits of tourism to the local community is often exaggerated.","w":"is","o":["has","was","are"],"a":2,"why":"The real subject is 'benefits', which is plural, so use 'are'."},{"t":"speak","sk":"S","q":"Why do you think a number of young people choose to study abroad?","need":"\\b(a number of|many|most|lots of|a lot of)\\b.*\\b(are|have|want|choose|feel|think|believe|go|move|hope)\\b","hint":"Use 'a number of' or 'many' with a plural verb.","model":"A number of my friends have gone abroad because they believe a foreign degree will open more doors for them.","why":"'A number of' means many, so it takes a plural verb."}]},{"id":"tenses","title":"Tenses for data and change","bn":"তথ্য ও পরিবর্তন বোঝাতে কাল","why":"Every Task 1 chart has a time frame, so the wrong tense costs accuracy marks in Writing, and clear tense use in Speaking shows a wider range.","rules":[{"h":"Past simple for finished years","en":"If the chart shows years that are over, use the past simple: rose, fell, was, remained. Do not use has or have with a finished year.","bn":"চার্টে অতীতের বছর থাকলে past simple: rose, fell, remained। নির্দিষ্ট অতীত বছরের সাথে has/have বসে না।","ex":["Sales rose sharply in 2015.","The figure remained stable between 2000 and 2005."]},{"h":"Present perfect for since and so far","en":"Use has or have plus the past participle when a change started in the past and continues to now, often with since, so far or over the last ten years.","bn":"অতীতে শুরু হয়ে এখন পর্যন্ত চলা পরিবর্তনে has/have + V3, বিশেষ করে since বা so far থাকলে।","ex":["The number of internet users has doubled since 2010.","So far, the project has cost two million pounds."]},{"h":"Past perfect for by a past year","en":"Use had plus the past participle to show that something was complete before a point in the past: By 2010, the figure had risen to 40%.","bn":"অতীতের কোনো সময়ের আগেই কিছু ঘটে গেলে had + V3, যেমন By 2010 ... had risen।","ex":["By 1990, most villages had received electricity.","When the survey ended, prices had already fallen."]},{"h":"Future forms for forecasts","en":"For projections, use is expected to, is projected to or is predicted to plus the base verb. Use will have plus the past participle for something complete before a future date.","bn":"ভবিষ্যতের অনুমানে is expected to + মূল ক্রিয়া। ভবিষ্যতের কোনো সময়ের আগেই শেষ হবে বোঝাতে will have + V3।","ex":["The population is expected to reach 200 million by 2040.","By 2050, energy use will have doubled."]},{"h":"Present simple for processes and maps","en":"Process diagrams use the present simple, often in the passive. For maps, use the past simple for the old map and the present simple or present perfect for what is there now.","bn":"process diagram এ present simple (প্রায়ই passive)। ম্যাপে পুরনো অবস্থার জন্য past simple, এখনকার জন্য present।","ex":["First, the leaves are picked and dried.","A car park has replaced the old farm."]}],"traps":[{"wrong":"In 2010, the number of tourists has increased to 5 million.","right":"In 2010, the number of tourists increased to 5 million.","why":"A finished year needs the past simple."},{"wrong":"Since 2015, prices rose steadily.","right":"Since 2015, prices have risen steadily.","why":"Since plus a time up to now needs the present perfect."},{"wrong":"The population is expected to reached 10 million.","right":"The population is expected to reach 10 million.","why":"After 'to', use the base verb."},{"wrong":"By 2000, the figure has fallen to 20%.","right":"By 2000, the figure had fallen to 20%.","why":"By plus a past year needs the past perfect."},{"wrong":"The number of cars rised in 2018.","right":"The number of cars rose in 2018.","why":"Rise is irregular: rise, rose, risen."}],"starters":["When I was younger, I used to…","I have been learning English since…","By the time I finished school, I had…","In the next few years, I'm planning to…","Things have changed a lot since…","I think by 2035 people will have…"],"q":[{"t":"mcq","sk":"W","q":"In 2015, the number of visitors ___ to 2 million.","o":["has risen","rise","rose","risen"],"a":2,"why":"2015 is a finished year, so use the past simple. Rise is irregular: rose.","bn":"নির্দিষ্ট অতীত বছর = past simple।"},{"t":"gap","sk":"W","q":"Unemployment ___ (fall) slightly in 2019.","a":["fell"],"why":"Fall is irregular: fall, fell, fallen. A finished year needs the past simple."},{"t":"tap","sk":"W","s":"The price of rice rised sharply in 2008.","w":"rised","o":["raised","risen","rose"],"a":2,"why":"Rise is irregular, so the past simple is rose. 'Raised' needs an object.","bn":"rise এর past হলো rose।"},{"t":"dict","sk":"L","s":"Car sales increased steadily and then dropped in the final year.","why":"Listen for the -ed endings. In dropped it sounds like a soft t."},{"t":"predict","sk":"L","q":"Since the new manager arrived, sales have ______","o":["adjective","verb","number","singular noun"],"a":1,"ans":"doubled","full":"Since the new manager arrived, sales have doubled.","why":"'Have' before the gap needs a past participle verb, like doubled."},{"t":"mcq","sk":"W","q":"Since 2010, the number of online shoppers ___ dramatically.","o":["had increased","has increased","increases","increased"],"a":1,"why":"'Since 2010' connects the past to now, so use the present perfect."},{"t":"tap","sk":"W","s":"Since the factory closed, many families have leave the town.","w":"leave","o":["leaved","left","leaving"],"a":1,"why":"After 'have', use the past participle. Leave is irregular: left."},{"t":"gap","sk":"W","q":"The figure ___ (remain) stable between 2005 and 2010.","a":["remained"],"why":"Both years are finished, so use the past simple.","bn":"অতীতের সময়সীমা, তাই remained।"},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: By the end of the nineteenth century, the city's population","o":["will grow to over a million.","grows to over a million.","has grown to over a million.","had grown to over a million."],"a":3,"why":"'By' plus a past time needs the past perfect: had grown."},{"t":"dict","sk":"L","s":"The number of people working from home has risen since last year.","why":"Listen for 'has risen'. Since plus a past point needs the present perfect."},{"t":"order","sk":"W","s":"The population is expected to reach ten million.","why":"'Is expected to' is followed by the base verb: reach."},{"t":"tap","sk":"W","s":"In 2012, the government has introduced a new tax on sugary drinks.","w":"has","o":["have","(remove)","is"],"a":1,"why":"'In 2012' is a finished time, so use the past simple: introduced, without has.","bn":"অতীত বছরের সাথে has বসে না।"},{"t":"predict","sk":"L","q":"The new sports centre is expected to ______ next spring.","o":["verb","singular noun","number","adjective"],"a":0,"ans":"open","full":"The council says the new sports centre is expected to open next spring.","why":"'Expected to' is always followed by a base verb."},{"t":"mcq","sk":"W","q":"Experts predict that by 2040 the city ___ its target of zero waste.","o":["had reached","reached","will have reached","has reached"],"a":2,"why":"'By' plus a future year needs the future perfect: will have reached."},{"t":"gap","sk":"W","q":"By 2010, the figure had ___ (grow) to 40 percent.","a":["grown"],"why":"After 'had', use the past participle. Grow is irregular: grew, grown."},{"t":"dict","sk":"L","s":"By the end of the decade the number of students had nearly doubled.","why":"Listen for 'had' before doubled. It can be short and quiet.","bn":"had শব্দটা খুব দ্রুত বলা হয়।"},{"t":"tap","sk":"W","s":"The number of tourists is projected to reaching five million by 2030.","w":"reaching","o":["reach","reached","reaches"],"a":0,"why":"'Projected to' needs the base verb: reach."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: According to the latest forecast, the demand for electricity in South Asia","o":["has projected to rise by 30% over the next decade.","is projected to rise by 30% over the next decade.","projected rising by 30% over the next decade."],"a":1,"why":"Forecasts use 'is projected to' plus the base verb."},{"t":"order","sk":"W","s":"The number of cars had risen to three million.","why":"Had plus the past participle shows a change complete before a past point."},{"t":"tap","sk":"W","s":"In the next stage, the bottles was washed and then filled.","w":"was","o":["is","are","be"],"a":1,"why":"Processes use the present simple, and 'bottles' is plural, so 'are'."},{"t":"predict","sk":"L","q":"The bridge was ______ in 1887.","o":["plural noun","verb","adjective","number"],"a":1,"ans":"completed","full":"The bridge was completed in 1887, after nearly ten years of work.","why":"'Was' before the gap and a year after it point to a past participle, like completed."},{"t":"gap","sk":"W","q":"Over the past decade, the gap between rich and poor has ___ (widen) considerably.","a":["widened"],"why":"'Over the past decade' reaches up to now, so has plus past participle.","bn":"has এর পরে V3।"},{"t":"mcq","sk":"W","q":"Between 1990 and 2000, coal use ___, while gas use rose.","o":["falls","fell","has fallen","is falling"],"a":1,"why":"The period is finished, and 'rose' is past simple, so match it with 'fell'."},{"t":"speak","sk":"S","q":"How has your hometown changed in the last few years?","need":"\\b(has|have|hasn't|haven't|\\w+'ve|\\w+'s)\\s+(\\w+\\s+)?\\w+(ed|en|wn|t|un|one|ome)\\b","hint":"Use the present perfect, like 'has changed' or 'have built'.","model":"My hometown has changed a lot, because they have built a new bridge and several shopping malls have opened near the bus stand.","why":"Changes from the past up to now need the present perfect."},{"t":"tap","sk":"W","s":"By 2005, the number of mobile users has overtaken the number of landline users.","w":"has","o":["have","had","was"],"a":1,"why":"'By 2005' is a past point, so use the past perfect: had overtaken."},{"t":"dict","sk":"L","s":"Experts expect the price of solar panels to fall even further next year.","why":"Listen for 'to fall'. After 'expect ... to', the verb stays in its base form."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: Over the past twenty years, the amount of land used for farming","o":["had decreased by almost a third next year.","decreased by almost a third in 1990.","has decreased by almost a third."],"a":2,"why":"'Over the past twenty years' runs up to now, so the present perfect fits."},{"t":"gap","sk":"W","q":"By 2060, the average temperature in the region will have ___ (rise) by two degrees.","a":["risen"],"why":"'Will have' needs the past participle. Rise is irregular: risen.","bn":"will have + V3 (risen)।"},{"t":"tap","sk":"W","s":"When the government changed the law in 2015, smoking rates have already fallen by half.","w":"have","o":["had","has","were"],"a":0,"why":"The fall happened before 2015, a past point, so use the past perfect."},{"t":"speak","sk":"S","q":"What changes do you think will happen in education in the next twenty years?","need":"\\b(will|won't|is expected to|are expected to|is likely to|are likely to|is going to|are going to)\\b","hint":"Use future forms like 'will', 'is likely to' or 'will have'.","model":"I think most classes will have moved online by then, and teachers are likely to work more as guides than lecturers.","why":"Forecasts about the future use will, be likely to or will have."}]},{"id":"compare","title":"Comparing numbers","bn":"সংখ্যার তুলনা","why":"Task 1 is mostly about comparing figures, and in Listening and Reading words like fewer, less, twice and the highest decide whether your answer is right.","rules":[{"h":"Comparatives and superlatives","en":"Short adjectives add -er or -est (higher, the highest). Longer ones use more or most (more expensive, the most popular). Use 'than' after a comparative and 'the' before a superlative.","bn":"ছোট adjective এ -er/-est, বড়গুলোর আগে more/most। কখনো দুটো একসাথে নয়: more higher ভুল।","ex":["Rent is higher in Gulshan than in Mirpur.","Football is the most popular sport in the survey."]},{"h":"Show how big the difference is","en":"Put slightly, a little, considerably, significantly, much or far before a comparative: slightly higher, far more popular. Do not use 'very' with a comparative.","bn":"পার্থক্য কতটা তা বোঝাতে comparative এর আগে slightly, much, far বসান। very higher ভুল।","ex":["Women spent slightly more time online than men.","The new bridge is far wider than the old one."]},{"h":"Twice as ... as and three times","en":"Use twice as many, twice as much or three times as high as to show multiples. 'As ... as' shows equal amounts, and 'not as ... as' shows a smaller amount.","bn":"দ্বিগুণ বোঝাতে twice as ... as, তিনগুণ বোঝাতে three times as ... as। not as ... as মানে কম।","ex":["Germany produced twice as much electricity as Spain.","Bus fares are not as high as train fares."]},{"h":"Fewer with plurals, less with uncountables","en":"Use fewer with plural countable nouns (fewer cars) and less with uncountable nouns (less traffic). In the same way, use many with plurals and much with uncountables.","bn":"গোনা যায় এমন বহুবচনের সাথে fewer (fewer cars), আর গোনা যায় না এমন শব্দের সাথে less (less water)।","ex":["Fewer people smoke today than in 1990.","Families now use less water than before."]},{"h":"Linking two figures","en":"Use while, whereas or compared with to put two figures side by side. After 'compared with', use a noun phrase, not a full clause.","bn":"দুটো সংখ্যা পাশাপাশি রাখতে while, whereas, compared with ব্যবহার করুন।","ex":["Men spent three hours online a day, whereas women spent four.","Compared with 2010, unemployment was much lower in 2020."]}],"traps":[{"wrong":"The number of cars is more higher than before.","right":"The number of cars is much higher than before.","why":"Do not put more before an -er adjective."},{"wrong":"There were less students in 2020.","right":"There were fewer students in 2020.","why":"Students is a plural countable noun, so use fewer."},{"wrong":"Rice is the most cheapest food here.","right":"Rice is the cheapest food here.","why":"Use -est or most, never both."},{"wrong":"The price of oil was twice higher than in 2000.","right":"The price of oil was twice as high as in 2000.","why":"Say 'twice as high as'."},{"wrong":"Her salary is higher than her husband.","right":"Her salary is higher than her husband's.","why":"Compare salary with salary, not salary with a person."}],"starters":["Compared with my parents' generation, young people today…","The biggest difference between city life and village life is…","I find reading far more relaxing than…","It's not as easy as people think to…","Whereas my brother prefers…, I would rather…"],"q":[{"t":"mcq","sk":"W","q":"Dhaka is ___ than Sylhet.","o":["biggest","bigger","more big"],"a":1,"why":"Big is a short adjective, so add -er and double the g: bigger.","bn":"ছোট adjective এ -er।"},{"t":"gap","sk":"W","q":"Mount Everest is the ___ (high) mountain in the world.","a":["highest"],"why":"'The' and 'in the world' show a superlative: highest."},{"t":"tap","sk":"W","s":"This year the exam was more easier than last year.","w":"more","o":["most","(remove)","very"],"a":1,"why":"Easier already means 'more easy', so remove 'more'.","bn":"more আর -er একসাথে নয়।"},{"t":"dict","sk":"L","s":"Train tickets are much cheaper than flights, but the journey takes longer.","why":"Listen for the -er endings in cheaper and longer, and the word 'than'."},{"t":"predict","sk":"L","q":"The new bus service is ______ than the old one.","o":["singular noun","verb","adjective","number"],"a":2,"ans":"faster","full":"Passengers will notice that the new bus service is faster than the old one.","why":"'Than' after the gap tells you to expect a comparative adjective, like faster."},{"t":"mcq","sk":"W","q":"There is ___ traffic in the city centre on Fridays.","o":["lesser","fewer","less"],"a":2,"why":"Traffic is uncountable, so use less.","bn":"uncountable শব্দের সাথে less।"},{"t":"tap","sk":"W","s":"There were less accidents on the motorway after the speed limit was reduced.","w":"less","o":["little","lesser","fewer"],"a":2,"why":"Accidents can be counted, so use fewer."},{"t":"gap","sk":"W","q":"In 2020, there were ___ (few) visitors than in 2019 because of the pandemic.","a":["fewer"],"why":"Visitors is a plural countable noun, and 'than' needs a comparative: fewer."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: Compared with rural households, urban families","o":["spend almost twice as much on transport.","spends almost twice as much on transport.","spend almost twice more as on transport."],"a":0,"why":"Families is plural, so 'spend', and the correct pattern is 'twice as much'."},{"t":"dict","sk":"L","s":"Women spent slightly more time on housework than men in every country.","why":"Listen for 'slightly more ... than'. The -t in spent is short."},{"t":"order","sk":"S","s":"The museum was not as crowded as we expected.","why":"'Not as ... as' shows that something was less than expected."},{"t":"tap","sk":"W","s":"Rice is the most cheapest food in many Asian countries.","w":"most","o":["more","very","(remove)"],"a":2,"why":"Cheapest already means 'most cheap', so remove 'most'."},{"t":"predict","sk":"L","q":"The ______ part of the course is the final project.","o":["adjective","verb","plural noun","number"],"a":0,"ans":"hardest","full":"Most students say the hardest part of the course is the final project.","why":"'The' plus a gap plus a noun often means a superlative adjective, like hardest."},{"t":"mcq","sk":"W","q":"Spending on health was ___ that on education.","o":["three times as high as","three times high as","three times as higher than"],"a":0,"why":"The pattern is 'three times as + adjective + as'.","bn":"times as ... as কাঠামো।"},{"t":"gap","sk":"W","q":"In 2020, online sales were ___ as high as in 2015, which means they had doubled.","a":["twice"],"why":"Doubled means two times bigger, so 'twice as high as'."},{"t":"dict","sk":"L","s":"The cost of living in the capital is far higher than in smaller towns.","why":"Listen for 'far higher than'. Far makes the difference bigger."},{"t":"tap","sk":"W","s":"My salary is lower than my sister even though we do the same job.","w":"sister","o":["sisters'","sisters","sister's"],"a":2,"why":"Compare salary with salary: my sister's salary, shortened to my sister's."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: Although electric cars are more expensive to buy,","o":["they are far more cheaper to run than petrol cars.","they are far cheaper to run than petrol cars.","but they are far cheaper to run than petrol cars."],"a":1,"why":"Do not use 'but' after 'although', and never put more before an -er word.","bn":"although এর পরে but বসে না।"},{"t":"order","sk":"W","s":"Coal received the least government funding.","why":"'The least' is the opposite of 'the most' and also needs 'the'."},{"t":"tap","sk":"W","s":"The number of female students was as high than the number of male students.","w":"than","o":["that","then","as"],"a":2,"why":"The pattern is 'as high as', not 'as high than'."},{"t":"predict","sk":"L","q":"The library has fewer ______ on Sundays.","o":["plural noun","uncountable noun","singular noun","verb"],"a":0,"ans":"computers","full":"On Sundays the library has fewer computers, so please book one in advance.","why":"'Fewer' is only used with plural countable nouns."},{"t":"gap","sk":"W","q":"The ___ (low) rate of unemployment was recorded in Germany.","a":["lowest"],"why":"'The' plus a single top result needs the superlative: lowest."},{"t":"mcq","sk":"W","q":"Japan had the ___ proportion of elderly people of all the countries shown.","o":["highest","higher","most high","more higher"],"a":0,"why":"'Of all the countries' compares more than two, so use the superlative."},{"t":"speak","sk":"S","q":"Is life in a city better than life in the countryside?","need":"\\b(\\w+er|more\\s+\\w+|less\\s+\\w+|fewer\\s+\\w+)\\s+than\\b","hint":"Compare with '-er than' or 'more ... than'.","model":"I think city life is more convenient, but the countryside is far quieter than any city I know.","why":"Comparatives need 'than' after them."},{"t":"tap","sk":"W","s":"The new model is considerable faster than the previous one.","w":"considerable","o":["consider","considerably","considerate"],"a":1,"why":"Before a comparative, use the adverb: considerably faster.","bn":"adjective এর আগে adverb: considerably।"},{"t":"dict","sk":"L","s":"Fewer young people are buying newspapers than they did ten years ago.","why":"Listen for 'fewer', used with the plural people."},{"t":"mcq","sk":"R","q":"Choose the ending that completes the sentence grammatically: In 2020, the amount of plastic recycled in Germany","o":["was almost three times higher than in Spain.","were almost three times higher than in Spain.","was almost three times higher than Spain recycling."],"a":0,"why":"'The amount' is singular, so 'was', and 'than in Spain' compares place with place."},{"t":"gap","sk":"W","q":"The gap between the two countries was not as ___ (wide) as experts had predicted.","a":["wide"],"why":"'As ... as' takes the plain adjective, not the -er form.","bn":"as ... as এর মাঝে মূল adjective।"},{"t":"tap","sk":"W","s":"Sales of electric cars rose by far more as expected in 2023.","w":"as","o":["that","like","than"],"a":2,"why":"'More' is followed by 'than': far more than expected."},{"t":"speak","sk":"S","q":"How is the way young people communicate different from the way older people do?","need":"\\b(whereas|while|compared with|compared to|than|as \\w+ as)\\b","hint":"Use 'whereas', 'while' or 'compared with' to contrast.","model":"Young people mostly send short messages, whereas older people still prefer phone calls, which they find far more personal.","why":"Whereas and while put two groups side by side."}]},{"id":"passive","title":"Passive voice","bn":"কর্মবাচ্য (Passive voice)","why":"Task 1 process diagrams need the passive, Task 2 and Reading texts use it for a formal tone, and correct passives in Speaking show grammatical range.","rules":[{"h":"Form: be plus past participle","en":"Make the passive with a form of be plus the past participle: is made, was built, has been reduced, will be opened. The form of be shows the tense.","bn":"passive = be এর রূপ + V3: is made, was built, has been reduced। কাল বোঝা যায় be দেখে।","ex":["Tea is grown in Sylhet.","The bridge was opened in 2022."]},{"h":"Use it when the action matters more","en":"In processes and science writing we care about what happens, not who does it, so the passive sounds natural. Add 'by' plus the doer only when the doer is important.","bn":"কে করছে তার চেয়ে কী ঘটছে সেটা জরুরি হলে passive। কর্তা গুরুত্বপূর্ণ হলে তবেই by + কর্তা।","ex":["The bottles are collected and taken to a factory.","Gitanjali was written by Rabindranath Tagore."]},{"h":"Modal passives","en":"After can, should, must, will and might, use be plus the past participle: can be recycled, should be banned, must be signed.","bn":"can, should, must এর পরে be + V3: can be recycled। be বাদ দিলে বাক্য ভুল।","ex":["Glass can be recycled many times.","The form must be signed by a parent."]},{"h":"Some verbs are never passive","en":"Verbs with no object, such as happen, occur, arrive, die and consist of, cannot be passive. Say 'it happened', not 'it was happened', and 'it consists of', not 'it is consist of'.","bn":"happen, occur, arrive, consist of এর কোনো object নেই, তাই এদের passive হয় না। was happened বা is consist of ভুল।","ex":["The accident happened at night.","The course consists of four modules."]},{"h":"It is believed that","en":"Use it is believed that, it is said that or it is thought that to report a common opinion in formal writing when the source is not important.","bn":"সাধারণ মতামত জানাতে it is believed that, it is said that ব্যবহার করুন। এতে লেখা আনুষ্ঠানিক শোনায়।","ex":["It is believed that the temple was built in the twelfth century.","It is often said that travel broadens the mind."]}],"traps":[{"wrong":"The accident was happened late at night.","right":"The accident happened late at night.","why":"Happen has no object, so it cannot be passive."},{"wrong":"The process is consist of five stages.","right":"The process consists of five stages.","why":"Consist of is never passive."},{"wrong":"Plastic can recycled easily.","right":"Plastic can be recycled easily.","why":"After can, the passive needs 'be'."},{"wrong":"The new road was build in 2019.","right":"The new road was built in 2019.","why":"Use the past participle, not the base
