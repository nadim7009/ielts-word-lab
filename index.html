m nearby forests. Planting is then needed only where no natural source of seeds remains."},{"l":"F","x":"This method, sometimes called ecological mangrove restoration, has produced better results in Indonesia and Thailand, but it is less popular than planting. It requires surveys of land height and water flow before any work begins, and its early stages show little to photograph: the first months may consist of digging a channel through a pond wall. It also raises difficult questions about land. Abandoned ponds usually have owners, and returning them to forest means negotiating with families who may hope to use them again."},{"l":"G","x":"None of this means that planting should stop. In many areas, local people have been paid to collect seeds and care for young trees, and these jobs have value of their own. But the number of seedlings put into the ground, the figure that projects most often report, says almost nothing about whether a forest will result. A more honest measure would be the area of healthy mangrove still standing ten years later, and that figure is much harder to obtain."}],"qs":[{"q":"According to the writer, most of the mangrove loss between 1980 and 2000 was caused by","o":["the use of coastal land for food production and construction.","storm damage along tropical shorelines.","the release of carbon stored in coastal soils.","overfishing in mangrove nursery grounds."],"a":0,"ev":"Yet between 1980 and 2000 roughly a fifth of the world's mangroves were lost, mainly to shrimp ponds, rice fields and coastal building.","why":"Shrimp ponds and rice fields are food production, and coastal building is construction. B, C and D all take words from the first two sentences, which describe what mangroves do (protect from storms, store carbon, shelter fish), not why they were lost."},{"q":"The writer mentions planting ceremonies in paragraph B to suggest that","o":["local communities strongly supported the projects.","projects were judged by how they looked rather than by results.","most of the money was spent on publicity.","the Philippines planted more seedlings than Sri Lanka."],"a":1,"ev":"The money had been spent, the planting ceremonies photographed, and the coast was little changed.","why":"The sentence sets the photographed ceremonies against a coast that 'was little changed', so the visible event mattered more than the outcome. C goes too far: the text never says how the money was divided. D may be true from the figures, but it is not why ceremonies are mentioned."},{"q":"Why were open mudflats often chosen for planting?","o":["They lie within the band of the tide that mangroves need.","Seedlings grow faster there than in other places.","They seemed to be unused land that was easy to obtain.","Waves there are weaker than elsewhere on the coast."],"a":2,"ev":"Large areas of open mudflat below this band look empty and therefore available, and they are attractive to planners because nobody owns them.","why":"'Look empty and therefore available' and 'nobody owns them' match 'unused land that was easy to obtain'. A is the opposite: the mudflats are 'below this band'. D contradicts the next sentence, where seedlings are washed away by waves."},{"q":"What problem with planting only Rhizophora does the writer identify?","o":["Its seeds are difficult to collect and plant.","It cannot survive in most coastal positions.","It looks less green than mixed natural forest.","It provides a home for a narrower range of animals."],"a":3,"ev":"plantations of one species support fewer kinds of crab, snail and fish than mixed natural forest","why":"'Fewer kinds of crab, snail and fish' is paraphrased as 'a narrower range of animals'. A is the opposite: its seeds are 'easy to collect'. B is too extreme, because it 'does well in some positions'. C reverses 'may look green from a distance'."},{"q":"In Lewis's approach, planting is necessary only when","o":["no forest nearby can supply seeds to the site.","the tidal flow has been blocked by a road or wall.","an abandoned shrimp pond is found on the site.","surveys of land height have been completed."],"a":0,"ev":"Planting is then needed only where no natural source of seeds remains.","why":"'No natural source of seeds remains' matches A, and the earlier mention of seeds 'from nearby forests' tells you what a natural source is. B and C are reasons mangroves disappear; in Lewis's method the fix for them is to restore the water flow, not to plant. D comes from paragraph F and describes the method in general."},{"q":"Which of the following is the best title for the passage?","o":["How shrimp farming destroyed the world's mangroves","Why counting seedlings is not the same as restoring forests","Robin Lewis and the development of mangrove science","The value of local jobs in coastal conservation"],"a":1,"ev":"But the number of seedlings put into the ground, the figure that projects most often report, says almost nothing about whether a forest will result.","why":"The passage moves from failed planting to its causes, an alternative method and a final point that seedling numbers say little about real forests, so B covers the whole text. A is too narrow and only from paragraph A. C covers paragraph E only. D is a minor point in paragraph G."}]}}]},{"id":"lmcq","skill":"L","title":"Listening multiple choice","bn":"লিসেনিং বহুনির্বাচনী প্রশ্ন","why":"Students lose marks here because all three options are mentioned and speakers change their minds, so the first familiar word gets ticked. This course trains you to preview fast, follow each topic to its final decision and move on without panic.","days":[{"n":1,"title":"How multiple choice works","goal":"Today you will learn the format of Listening multiple choice and a simple routine for the preview time.","pages":[{"h":"What the question looks like","blocks":[{"t":"p","x":"Multiple choice appears most often in Parts 2 and 3, sometimes in Part 4 and only now and then in Part 1. The common version gives a question and three options, and the instruction says **Choose the correct letter, A, B or C**. Another version asks you to choose TWO letters from a list of five options."},{"t":"p","x":"The questions follow the order of the recording, and you hear it once. On paper you write only the letter. On the computer you click the option, so there is no spelling to worry about, which makes these marks easy to lose through listening errors rather than writing errors."},{"t":"tip","x":"In a choose TWO question, each correct letter is one mark and the order does not matter. Never leave the second letter empty, even if you have to guess it."},{"t":"bn","x":"লিসেনিং-এ মাল্টিপল চয়েস সাধারণত পার্ট ২ আর ৩-এ বেশি আসে। প্রশ্নগুলো রেকর্ডিং-এর সিরিয়াল মেনেই আসে, আর তুমি একবারই শুনবে। বেশিরভাগ সময় A, B, C থেকে একটা বাছতে হয়, কখনো পাঁচটা থেকে দুইটা।"}]},{"h":"Using the thirty second preview","blocks":[{"t":"p","x":"Before each section the recording gives you time to look at the questions, usually around thirty seconds. Many students read every option slowly from start to finish and run out of time. A better plan is to read the question stem properly and then cut each option down to two or three key words."},{"t":"steps","x":["Read the stem and underline what it asks: who, why, what problem, what decision.","Cut each option to two or three key words and underline them.","Notice how the options differ. If all three are about price, the difference is the detail you must hear.","Glance at the next question's stem so you know when this question is over.","Stop reading when the recording starts and keep your eyes on the question you are on."]},{"t":"example","q":"Why is the woman phoning? A to cancel a booking  B to change the date of a booking  C to ask about prices","a":"Preview notes: A cancel, B change date, C prices","x":"All three options are about one booking, so the key difference is the action. You do not need to read the full options again while listening. You only listen for cancel, change or price, and for the final decision."},{"t":"trap","x":"Rereading full options while the speaker talks. Your eyes slow your ears down. Work from your underlined key words only."}]},{"h":"Why you hear all three options","blocks":[{"t":"p","x":"This surprises a lot of students. In Cambridge style recordings the speakers usually mention all three options, or at least ideas linked to them. Two of them are rejected, ruled out or changed, and one is confirmed. So hearing a word from an option proves nothing."},{"t":"p","x":"Your job is to follow the conversation to the end of that topic and catch **the final decision**. Think of each option as a door: one door stays open, two get closed."},{"t":"example","q":"Which day will the man attend? A Monday  B Wednesday  C Thursday. Script: 'Monday's difficult, I play football then. Wednesday would be fine.' 'Sorry, Wednesday is full.' 'Then I'll go for Thursday.'","a":"C","x":"Monday is closed by football. Wednesday sounds like the answer for a moment, but the next line closes it. Thursday is the only door left open."},{"t":"bn","x":"রেকর্ডিং-এ সাধারণত তিনটা অপশনই শুনবে। তাই কোনো শব্দ শুনেই উত্তর দিয়ে দিও না। আলোচনা শেষে কোনটা টিকে থাকল, সেটাই উত্তর।"},{"t":"tip","x":"When you hear an option, put a small cross next to it if it is rejected and a tick if it is confirmed. Decide only when the next question's topic starts."}]}],"drill":{"kind":"L","type":"mcq","part":1,"context":"You will hear a man phoning a community centre to ask about a pottery course.","speakers":{"Emma":"f","Daniel":"m"},"script":[{"s":"Emma","x":"Good morning, Riverside Community Centre, Emma speaking. How can I help?"},{"s":"Daniel","x":"Oh, hi. I saw a poster about your pottery classes, and I wanted to find out a bit more before I sign up."},{"s":"Emma","x":"Of course. At the moment we run two courses, one for complete beginners and one for people with some experience. Which were you thinking of?"},{"s":"Daniel","x":"Well, I did a little at school, but that was years ago, so I suppose I'd better start with the beginners one."},{"s":"Emma","x":"That's probably wise. The beginners course runs on three evenings, Monday, Wednesday and Thursday, from seven until nine."},{"s":"Daniel","x":"Monday's difficult, because I play football then. Wednesday would be fine, I think."},{"s":"Emma","x":"Let me just check the list. Ah, I'm sorry, Wednesday is completely full. We had a lot of sign ups last week."},{"s":"Daniel","x":"Oh, that's a shame. Then I'll have to go for Thursday. That's fine, really."},{"s":"Emma","x":"Great, I'll put you down for Thursday."},{"s":"Daniel","x":"And what about the cost? The poster said ninety pounds, is that right?"},{"s":"Emma","x":"Yes, ninety pounds for eight weeks. That covers all the clay you use, and we lend you the tools, so you don't need to buy anything."},{"s":"Daniel","x":"What about an apron? Do you provide those as well?"},{"s":"Emma","x":"No, please bring your own, or just an old shirt. And the firing, that's when we bake your finished pieces in the kiln, is charged separately at the end. It's usually around five pounds."},{"s":"Daniel","x":"OK, that sounds reasonable. Is there anything I should know about the first evening?"},{"s":"Emma","x":"Yes, try to come about fifteen minutes early."},{"s":"Daniel","x":"Is that to fill in forms?"},{"s":"Emma","x":"No, we do all the paperwork online now. And the teacher, Mister Clarke, will be busy getting set up, so you won't really get a chance to chat with him before the class. It's really so you can pick a wheel. The ones near the window are popular because the light is much better there."},{"s":"Daniel","x":"Right, I'll make sure I'm early then. Can I pay by card when I arrive?"},{"s":"Emma","x":"We don't take cards at the desk, I'm afraid. You can pay cash at reception, or online through our website."},{"s":"Daniel","x":"I'd rather not carry that much cash around. I'll do it online tonight."},{"s":"Emma","x":"Perfect. Shall I email you a map as well? People sometimes find the centre a bit hard to find."},{"s":"Daniel","x":"No, thanks, I live just round the corner. But could you send me the class timetable? I'd like to check the dates, because I'm away for one week in March."},{"s":"Emma","x":"Sure. The timetable's on the website too, but I'll email it to you now. Can I take your email address?"},{"s":"Daniel","x":"Yes, it's Daniel dot Hart at mail dot com."},{"s":"Emma","x":"Lovely. You should have it in a few minutes. Is there anything else I can help with?"},{"s":"Daniel","x":"No, I think that's everything. Thanks very much for your help."},{"s":"Emma","x":"You're welcome. Enjoy the course, and see you on Thursday."}],"qs":[{"q":"Which evening will Daniel attend the course?","o":["Monday","Wednesday","Thursday"],"a":2,"keys":["evening","Monday","Wednesday","Thursday"],"ev":"Then I'll have to go for Thursday.","why":"All three days are mentioned. Monday is ruled out by football and Wednesday is full, so Daniel takes Thursday. Students who stop listening after 'Wednesday would be fine' choose B."},{"q":"What is included in the course fee?","o":["clay and tools","an apron","firing of finished pieces"],"a":0,"keys":["included","fee","clay","apron","firing"],"ev":"That covers all the clay you use, and we lend you the tools","why":"'Covers' is the paraphrase of 'included'. The apron and the firing are both mentioned, but he must bring an apron and firing is 'charged separately'."},{"q":"Why does Emma suggest arriving early on the first evening?","o":["to fill in a form","to choose a place to work","to meet the teacher"],"a":1,"keys":["arrive early","form","choose a place","teacher"],"ev":"It's really so you can pick a wheel.","why":"'Pick a wheel' means choosing where you will work. Daniel suggests forms, but Emma says paperwork is online, and she says there is no chance to chat with the teacher."},{"q":"How will Daniel pay?","o":["in cash at reception","online","by card at the desk"],"a":1,"keys":["pay","cash","online","card"],"ev":"I'll do it online tonight.","why":"Daniel first asks about a card, but the desk does not take cards. He then rejects cash and decides on online payment."},{"q":"What will Emma send Daniel?","o":["a map","the course timetable","a list of materials"],"a":1,"keys":["send","map","timetable","materials"],"ev":"The timetable's on the website too, but I'll email it to you now.","why":"Emma offers a map, but Daniel says no. He asks for the timetable and she agrees. No list of materials is offered because everything is provided."}]}},{"n":2,"title":"Paraphrase and keyword spotting","goal":"Today you will practise hearing the meaning of an option when the speaker uses completely different words.","pages":[{"h":"You rarely hear the words on the page","blocks":[{"t":"p","x":"In multiple choice the correct option is almost always a paraphrase. The speaker says 'it was too dear' and the option says 'it was expensive'. Meanwhile, the exact word from a wrong option is often said out loud, because that is how the test catches people who match sounds instead of meaning."},{"t":"pairs","x":[["we needed the marshes to clean the water","to improve water quality"],["some sections are quite muddy","parts of it are wet"],["the place to head for","where visitors should go"],["thousands of them arrive","large numbers of birds come"],["it's not worth the money","poor value"]]},{"t":"bn","x":"সঠিক উত্তর সাধারণত অন্য শব্দে বলা হয়, মানে প্যারাফ্রেজ। আর ভুল অপশনের হুবহু শব্দটা প্রায়ই রেকর্ডিং-এ শোনা যায়। তাই শব্দ না, অর্থ মিলাও।"},{"t":"trap","x":"Choosing an option because you heard its exact word. If a word from the option is spoken clearly and early, be suspicious and keep listening."}]},{"h":"The stem tells you when to listen","blocks":[{"t":"p","x":"The stem is your signpost. It tells you which part of the talk belongs to this question. The speaker will not repeat the stem word for word either, so prepare one or two other ways it could be said during the preview."},{"t":"pairs","x":[["the original reason was","why was it first set up"],["the real thing to watch out for","the main problem"],["what makes October special","what is special about this month"],["the thing that worried me most","what was she most concerned about"],["we've decided to go with","what do they choose"]]},{"t":"tip","x":"Underline the question word in the stem, such as why, problem, main or first. 'Why' questions often have the answer after 'because', 'so that' or 'the reason is'."}]},{"h":"From full options to key words","blocks":[{"t":"steps","x":["Cross out words that are the same in all three options.","Underline the word or two that make each option different.","Think of one quick synonym for each, for example cheap for low cost.","While listening, look only at your underlined words."]},{"t":"example","q":"What does the guide say about the trail today? A It is longer than usual.  B Parts of it are wet.  C It includes some steep sections.","a":"Key words: A longer, B wet, C steep","x":"Synonyms ready: longer or extended, wet or muddy, steep or climb. The speaker says 'mostly flat' (closes C), 'the work hasn't started' (closes A) and 'quite muddy' (opens B)."},{"t":"bn","x":"প্রিভিউ-এর সময় প্রতিটা অপশনকে দুই-তিনটা শব্দে ছোট করে ফেলো, আর প্রতিটার একটা সমার্থক শব্দ মাথায় রাখো। শোনার সময় পুরো অপশন আবার পড়তে যেও না।"}]},{"h":"Paraphrases that come up often","blocks":[{"t":"p","x":"Some meaning changes appear again and again in IELTS recordings. Learn them as pairs so your brain links them without effort."},{"t":"pairs","x":[["it isn't allowed any more","it is no longer permitted"],["I couldn't get hold of anyone","she was unable to contact staff"],["it's on its last legs","it is in poor condition"],["I didn't see that coming","it was unexpected"],["there's no point","it would not be useful"],["it's a bit of a trek","it is a long way"]]},{"t":"tip","x":"When you check your answers after the drill, write down every paraphrase that fooled you. Your own list is more useful than any book list."}]}],"drill":{"kind":"L","type":"mcq","part":2,"context":"You will hear a guide talking to visitors at the start of a walk around a nature reserve.","speakers":{"Guide":"f"},"script":[{"s":"Guide","x":"Good morning, everyone, and welcome to Hollow Marsh Nature Reserve. My name's Sarah and I'll be your guide this morning. Before we set off, I'd like to tell you a little about the reserve and explain how today will work."},{"s":"Guide","x":"The reserve was opened to the public about thirty years ago. A lot of people assume it was created to protect birds, and it's true that we have a huge number of them now. But the original reason was quite different. Part of the land had been used by farmers for grazing cattle, but that had stopped long before. The whole area was bought by the local water company, who needed the marshes to clean the water flowing into the river. The wildlife came later, almost by accident."},{"s":"Guide","x":"Now, about our walk. We'll be on the main trail for roughly two hours. Some of you may have read that the trail was being made longer this summer. That was the plan, but the work hasn't started yet, so it's the usual length. The paths are mostly flat, so there are no hard climbs. However, after last week's rain some sections are quite muddy, and that's the real thing to watch out for today. I hope you've all got sensible boots on."},{"s":"Guide","x":"If anyone gets separated from the group, please don't walk back to the car park. It's a long way from the trail and it's easy to take a wrong turn. You'll probably notice the big bird hide by the lake, and it's easy to spot, but it's often locked at lunchtime. So the place to head for is the visitor centre. It's signposted from every junction, and there's always a member of staff there."},{"s":"Guide","x":"A quick word about what you can and can't do. You're very welcome to take photos, flash and all. The birds really aren't bothered by it at this distance. Feeding the ducks used to be allowed, and you might still see an old sign or two encouraging it, but bread actually makes them ill, so we now ask you not to. As for the paths, you can step off into the grassy areas by the lake if you want a closer look. They're quite safe."},{"s":"Guide","x":"Finally, you've picked a good time to visit. Lots of people come here in the spring for the wildflowers, but I'm afraid they're finished now. And we do have deer, but you can see those all year round, if you're lucky, because they're very shy. What makes October special is the geese. Thousands of them arrive from the far north over just a few weeks, and the sound when they take off together is something you won't forget."},{"s":"Guide","x":"We'll stop for a short break about halfway round, at a wooden shelter with benches, so you can have a drink and a snack there. Please take all your rubbish home with you, as there are no bins on the trail."},{"s":"Guide","x":"Right, if there are no questions, let's get going. Please stay close to me for the first section, because the path is narrow."}],"qs":[{"q":"Why was the reserve first set up?","o":["to protect birds","to improve water quality","to provide land for farming"],"a":1,"keys":["first set up","birds","water quality","farming"],"ev":"who needed the marshes to clean the water flowing into the river","why":"'Clean the water' is the paraphrase of 'improve water quality'. Birds are what people assume, and farming had 'stopped long before'."},{"q":"What does the guide say about the trail today?","o":["It is longer than usual.","Parts of it are wet.","It includes some steep sections."],"a":1,"keys":["trail","longer","wet","steep"],"ev":"after last week's rain some sections are quite muddy","why":"'Muddy after rain' matches 'wet'. The longer trail was only a plan, and 'mostly flat' rules out steep sections."},{"q":"Where should visitors go if they get separated from the group?","o":["the car park","the bird hide","the visitor centre"],"a":2,"keys":["separated","car park","bird hide","visitor centre"],"ev":"So the place to head for is the visitor centre.","why":"'Head for' means go to. The car park is too far away and the bird hide is often locked, so both are rejected."},{"q":"What are visitors asked not to do?","o":["use a camera flash","feed the ducks","walk on the grass by the lake"],"a":1,"keys":["not","flash","feed ducks","grass"],"ev":"but bread actually makes them ill, so we now ask you not to","why":"Flash photos are allowed ('flash and all') and visitors can step onto the grass. Only feeding the ducks is now stopped. The word 'used to' is the clue that the old rule changed."},{"q":"What is special about the reserve in October?","o":["the wildflowers","the arrival of large numbers of birds","the chance to see young deer"],"a":1,"keys":["October","special","flowers","birds","deer"],"ev":"What makes October special is the geese.","why":"Geese are birds, and 'thousands of them arrive' matches 'large numbers'. The flowers are finished, and deer are seen all year round."}]}},{"n":3,"title":"Distractors and changes of mind","goal":"Today you will learn how the recording sets traps and how to follow a conversation to its real answer.","pages":[{"h":"Corrections and final decisions","blocks":[{"t":"p","x":"The most common trap is simple: a speaker says one thing and then changes it. In Part 1 it is often a correction of a fact. In Parts 2 and 3 it is usually a plan that changes or an idea that gets replaced. The first thing you hear is very often the wrong answer."},{"t":"pairs","x":[["no, sorry, it was Sunday","the first answer is cancelled"],["actually, I've changed my mind","the opinion is about to change"],["in the end we went for","this is the final choice"],["that was the plan, but","the plan did not happen"],["we used to, but now","the present answer comes next"],["on second thoughts","the speaker replaces the idea"]]},{"t":"bn","x":"প্রথমে যা শুনবে, সেটা প্রায়ই ভুল উত্তর। 'actually', 'no, sorry', 'in the end', 'but now' শুনলেই সতর্ক হয়ে যাও, কারণ এর পরেই আসল সিদ্ধান্ত আসে।"},{"t":"tip","x":"When you hear a correction word, look straight back at your options and move your tick. Do not trust your first mark until the topic is finished."}]},{"h":"Agreeing and disagreeing in Part 3","blocks":[{"t":"p","x":"Part 3 is a discussion, usually between students or a student and a tutor. One person suggests an idea and the other reacts. The answer is the idea that **both speakers accept**, so the reply matters more than the suggestion."},{"t":"pairs","x":[["Now that I like","agreement"],["Fair enough","accepting the other person's point"],["It would look nice, but","polite disagreement"],["I'm not against it in principle","partly agrees, a problem is coming"],["I suppose so","giving in, often after an objection"]]},{"t":"example","q":"What do they agree to include? A a video  B photographs  C a map. Script: 'I'd love to make a short video.' 'It would look nice, but the limit is ten minutes.' 'What about photos?' 'We can't, the rules don't allow it.' 'A map, then?' 'Now that I like.'","a":"C","x":"The video gets 'but', the photos get 'we can't', and the map gets 'Now that I like'. The suggestion alone is never enough. You need the second speaker's reaction."},{"t":"trap","x":"Polite English hides disagreement. 'That's an interesting idea' or 'It would look nice' often comes before a 'but'. Wait for the rest of the sentence."}]},{"h":"Mentioned but rejected","blocks":[{"t":"p","x":"Often an option is mentioned with a negative. 'I don't think people would lie' brings up honesty, but rules it out. Test writers love this because a student who catches only the noun ticks the wrong box."},{"t":"example","q":"What does Tom think about a questionnaire? A people would be dishonest  B too few would reply  C it would take too long to analyse. Script: 'People would answer honestly, I think, and we'd get enough replies. My worry is we'd spend weeks going through all the answers.'","a":"C","x":"A and B are both mentioned, but both are said not to be a problem. 'My worry is' signals Tom's real opinion, and 'going through all the answers' means analysing them."},{"t":"bn","x":"কোনো অপশন উল্লেখ হলেই সেটা উত্তর না। অনেক সময় 'না' বা 'সমস্যা নেই' বলে সেটা বাদ দেওয়া হয়। বাক্যের পুরোটা শোনো, শুধু নাউন ধরো না।"}]}],"drill":{"kind":"L","type":"mcq","part":3,"context":"You will hear two students, Maya and Tom, planning a presentation for their environmental studies course.","speakers":{"Maya":"f","Tom":"m"},"script":[{"s":"Maya","x":"So, Tom, we really need to fix the topic today. Professor Patel wants it by Friday."},{"s":"Tom","x":"I know. Did you have any more thoughts about urban gardens?"},{"s":"Maya","x":"I did. I was thinking rooftop gardens. There's loads written about them, so the research part would be easy."},{"s":"Tom","x":"That's true, but didn't half the class do rooftops last year? I'd rather pick something people haven't heard ten times already."},{"s":"Maya","x":"Fair enough. What about school gardens, then?"},{"s":"Tom","x":"I'd thought of that too. The trouble is getting information. I emailed three schools last month and none of them replied."},{"s":"Maya","x":"Hmm. OK, what about allotments? You know, the small plots the council rents out to people."},{"s":"Tom","x":"Actually, yes. My uncle has one, and he knows almost everyone on his site. We could talk to them directly."},{"s":"Maya","x":"Would he mind, though? I don't want him doing loads of work for us."},{"s":"Tom","x":"No, he'd love it. He's always telling me about his tomatoes, so he'll be glad someone's finally interested."},{"s":"Maya","x":"Great, allotments it is. Now, how do we collect information from the plot holders? I thought a questionnaire might work."},{"s":"Tom","x":"I'm not against it in principle. People would answer honestly, I think, and we'd probably get enough replies through my uncle. My worry is that we'd spend weeks going through all the answers. We've only got a month in total."},{"s":"Maya","x":"Good point. Let's just do a few interviews instead."},{"s":"Tom","x":"Agreed. And for the presentation itself, have you got any ideas?"},{"s":"Maya","x":"I'd love to make a short video, maybe two minutes, showing people working on their plots."},{"s":"Tom","x":"It would look nice, but the limit is ten minutes, and a video would eat up a big part of that."},{"s":"Maya","x":"Yes, I suppose so. What about photos instead?"},{"s":"Tom","x":"We can't, I'm afraid. My uncle said the site rules don't allow photos unless every plot holder agrees, and that's about sixty people."},{"s":"Maya","x":"Oh, OK. Well, a map, then? We could show where all the allotment sites in the city are."},{"s":"Tom","x":"Now that I like. It's simple and it makes the point straight away."},{"s":"Maya","x":"We could even colour the sites by how long the waiting list is. I read that some people wait five or six years for a plot."},{"s":"Tom","x":"Really? That's a good fact to open with."},{"s":"Maya","x":"Let's do that. When can we visit your uncle's site?"},{"s":"Tom","x":"He said Saturday morning. No, sorry, I'm getting mixed up. He's working on Saturday. It was Sunday morning, about ten."},{"s":"Maya","x":"Sunday's fine for me. Right, before we meet again, I'll start writing the introduction."},{"s":"Tom","x":"Ah, I've actually already started it. I did half a page last night."},{"s":"Maya","x":"Oh, great. Then I'll email Professor Patel to check whether the ten minutes includes questions. And do we need to book a room to practise?"},{"s":"Tom","x":"No, the library does that automatically for presentation groups."},{"s":"Maya","x":"Perfect. I'll send that email tonight, then."}],"qs":[{"q":"Which topic do the students finally choose?","o":["rooftop gardens","community allotments","school gardens"],"a":1,"keys":["topic","rooftop","allotments","school"],"ev":"Great, allotments it is.","why":"Rooftops are rejected because other students did them and school gardens because schools did not reply. Maya's 'allotments it is' is the final decision."},{"q":"What does Tom think about using a questionnaire?","o":["People would not answer honestly.","Too few people would reply.","It would take too long to analyse."],"a":2,"keys":["questionnaire","honestly","reply","analyse"],"ev":"My worry is that we'd spend weeks going through all the answers.","why":"Tom mentions honesty and replies, but only to say they are not a problem. 'Going through all the answers' is analysing, and 'my worry is' signals his real opinion."},{"q":"What do they agree to include in their presentation?","o":["a short video","photographs","a map"],"a":2,"keys":["include","video","photos","map"],"ev":"Now that I like. It's simple and it makes the point straight away.","why":"The video takes too much time and photos are not allowed by the site rules. Only the map gets agreement from both speakers."},{"q":"When will the students visit the allotment?","o":["Saturday morning","Sunday morning","Saturday afternoon"],"a":1,"keys":["visit","Saturday","Sunday","morning"],"ev":"It was Sunday morning, about ten.","why":"Tom says Saturday morning first and then corrects himself with 'No, sorry'. Saturday afternoon is never offered, but the word Saturday is there to tempt you."},{"q":"What will Maya do before their next meeting?","o":["write the introduction","book a practice room","contact their professor"],"a":2,"keys":["Maya","introduction","book room","professor"],"ev":"Then I'll email Professor Patel to check whether the ten minutes includes questions.","why":"Maya offers to write the introduction, but Tom has already started it. The library books rooms automatically. She will email the professor, which is 'contact'."}]}},{"n":4,"title":"Speed and time management","goal":"Today you will practise keeping up with the recording, letting go of hard questions and checking at the end.","pages":[{"h":"Find extra preview time","blocks":[{"t":"p","x":"Thirty seconds feels short, but there is more time than most students use. When a part ends there is often a pause to check your answers, and the next part also starts with time to read. If you are happy with the part you just finished, use the checking time to preview the next part instead."},{"t":"steps","x":["When the voice says 'You now have some time to look at questions', go straight to the stems.","Underline the stem keyword first, then the option key words.","If you finish early, read ahead to the next block of questions.","During the example or introduction, keep previewing. It rarely contains an answer.","Never spend preview time worrying about the last part."]},{"t":"bn","x":"প্রিভিউ টাইম শুধু ত্রিশ সেকেন্ড না। আগের পার্টের চেক করার সময়টা, আর রেকর্ডিং-এর শুরুর ভূমিকার সময়টাও পরের প্রশ্ন পড়তে কাজে লাগাও।"}]},{"h":"Do not freeze on one question","blocks":[{"t":"p","x":"The biggest time problem in multiple choice is thinking too long. You hear something confusing about question 13, you start comparing B and C in your head, and meanwhile question 14 and 15 go past. One lost mark becomes three. The fix is a rule: **when the next question starts, you move**."},{"t":"steps","x":["Mark your best guess with a light tick as soon as you hear something.","Change it only if you hear a correction or a 'but'.","When you hear the keyword of the next stem, stop thinking about the last question.","Put a small dot next to any answer you are unsure of, then forget it until checking time."]},{"t":"trap","x":"Leaving a question blank and hoping to remember it later. You will not. Choose a letter right away, even a guess, and mark it with a dot."}]},{"h":"How the next stem rescues you","blocks":[{"t":"p","x":"Because the questions are in order, the next stem tells you that the answer for the current one has passed. If you hear the words from question 15 and you have nothing for 14, choose your best guess for 14 and give your full attention to 15."},{"t":"example","q":"Q2: Where should volunteers collect their T-shirts? Q3: What does James say about lunch? You hear: '...collect them from the car park office instead. It opens at eight. Now, lunch.'","a":"Q2 is the car park office. The word 'lunch' tells you Q2 is closed.","x":"A strong student keeps one eye on the next stem's keyword. The moment 'lunch' is heard, the answer to Q2 is fixed and attention moves on. There is no going back during the recording."},{"t":"tip","x":"In Part 2 talks, speakers often use signal phrases like 'Next', 'Now', 'Last thing' or 'What about the weather?' to move to a new question. Treat them as a bell."},{"t":"bn","x":"পরের প্রশ্নের কীওয়ার্ড শুনলেই বুঝবে আগের প্রশ্নের উত্তর চলে গেছে। তখন একটা অনুমান করে লিখে দাও, আর পরের প্রশ্নে মন দাও।"}]},{"h":"Checking after the section","blocks":[{"t":"p","x":"On the paper test you get ten minutes at the end to transfer answers. On the computer test you get two minutes to check. Use this time on the questions you marked with a dot, not on the ones you were sure about."},{"t":"steps","x":["Make sure every question has a letter, and choose TWO questions have two letters.","Look at your dotted questions and recall what the speaker decided at the end.","Change an answer only if you clearly remember a correction you missed.","If you are still unsure, keep your first reasoned guess."]},{"t":"tip","x":"For choose TWO questions on paper, check the answer sheet layout. Each letter goes in its own box, in any order."}]}],"drill":{"kind":"L","type":"mcq","part":2,"context":"You will hear a manager giving information to new volunteers at a food festival.","speakers":{"James":"m"},"script":[{"s":"James","x":"Hello, everyone, and thanks for coming. I'm James, the volunteer manager for this year's Harbour Food Festival. I'll go through the important things quickly, because I know some of you have to get back to work."},{"s":"James","x":"First, what you'll be doing. Most of you signed up thinking you'd be helping stallholders unpack, and that will happen, but on Saturday. On Friday, the opening day, the gates are run by a security company, so they'll be checking tickets, not you. Your main job on Friday will be standing at the busy junctions and helping visitors find their way around. Shifts are four hours long, and you'll get a twenty minute break in the middle of each one."},{"s":"James","x":"Next, your festival T-shirts. We were going to hand them out in the main tent, but that's now being used for cooking demonstrations, so they've been moved to the information desk. No, sorry, I've just had a message. The desk isn't built yet, so please collect them from the car park office instead. It opens at eight. They come in small, medium and large, and if yours doesn't fit, you can swap it at the end of your first shift."},{"s":"James","x":"Now, lunch. Some stallholders will probably offer you free samples, and that's fine, please enjoy them, but don't count on them for a proper meal. There's no staff canteen this year, unfortunately, because of the cost. So please bring a packed lunch. We will give you vouchers for hot drinks. Water is free at all the stations marked with a blue flag, so please keep a bottle with you, especially if it's sunny."},{"s":"James","x":"I want to say something about last year, because we learned a lot. We actually had more than enough volunteers, which was lovely. And there were only a couple of lost children, both found within minutes. What really went wrong was the rubbish. The bins were full by midday and nobody was checking them. Several stallholders complained, and one or two told us they might not come back. So this year, every team will have one person in charge of bins for each shift."},{"s":"James","x":"What about the weather? If there's light rain, just carry on as normal. People still come out. If there's a real storm, with thunder or very strong wind, we won't send you home, because we'll need you once it clears. Go straight to the volunteer tent behind the main stage and wait there for instructions. Please don't shelter in the food tents, as stallholders need that space for their customers."},{"s":"James","x":"Last thing. If something goes wrong, someone's hurt or there's an argument at a stall, you'll see my number on the back of your badge. But please don't ring me first. I'm often in meetings. The person to call is your team leader. They know your area, and they'll contact me or the first aid team if they need to."},{"s":"James","x":"Right, that's everything. Team leaders will now give out your badges and shift times."}],"qs":[{"q":"What will volunteers mainly do on Friday?","o":["help stallholders unpack","give directions to visitors","check tickets at the gates"],"a":1,"keys":["Friday","unpack","directions","tickets"],"ev":"Your main job on Friday will be standing at the busy junctions and helping visitors find their way around.","why":"Unpacking happens on Saturday, and the security company checks tickets. 'Helping visitors find their way' is giving directions."},{"q":"Where should volunteers collect their T-shirts?","o":["the main tent","the information desk","the car park office"],"a":2,"keys":["T-shirts","main tent","information desk","car park"],"ev":"please collect them from the car park office instead","why":"This is a double change. The main tent is rejected, then the information desk is given and corrected with 'No, sorry'. The final place is the car park office."},{"q":"What does James say about lunch?","o":["Stallholders will provide free meals.","There is a staff canteen.","Volunteers should bring their own food."],"a":2,"keys":["lunch","stallholders","canteen","own food"],"ev":"So please bring a packed lunch.","why":"Free samples are mentioned, but 'don't count on them for a proper meal'. The canteen does not exist this year. A packed lunch is food you bring yourself."},{"q":"What was the main problem at last year's festival?","o":["There were not enough volunteers.","Rubbish was not dealt with.","Several children got lost."],"a":1,"keys":["last year","volunteers","rubbish","children"],"ev":"What really went wrong was the rubbish.","why":"James says there were more than enough volunteers and only two lost children, quickly found. 'What really went wrong' points to the rubbish."},{"q":"What should volunteers do if there is a storm?","o":["go home","go to a tent and wait","continue working as usual"],"a":1,"keys":["storm","go home","tent","continue"],"ev":"Go straight to the volunteer tent behind the main stage and wait there for instructions.","why":"Carrying on is for light rain only, and James says 'we won't send you home'. The volunteer tent is the answer."},{"q":"Who should volunteers phone first if there is a problem?","o":["James","the first aid team","their team leader"],"a":2,"keys":["phone","James","first aid","team leader"],"ev":"The person to call is your team leader.","why":"James's number is on the badge, but he says not to ring him first. The first aid team is contacted by the team leader, not by volunteers."}]}},{"n":5,"title":"The hardest questions","goal":"Today you will handle band 8 to 9 questions on opinions, long options and Part 4 lectures.","pages":[{"h":"Part 2 and Part 3 are different","blocks":[{"t":"p","x":"Part 2 is one speaker giving information, like a guide or a manager. The answers are usually facts, rules or plans, and the trap is a plan that changed or an option mentioned and dismissed. The speaker often uses signposts, so the questions are easier to follow."},{"t":"p","x":"Part 3 is a conversation, and the answers are mostly opinions and decisions. Two people build the answer together, so it can be spread across four or five turns. You must track who says what and whether **the other speaker agrees**. Questions that ask 'What does the tutor think' need the tutor's view, not the student's."},{"t":"pairs","x":[["Part 2: 'that was the plan, but'","a fact changed"],["Part 2: 'please don't ring me first'","an option ruled out by a rule"],["Part 3: 'I see what you mean, but'","the second speaker disagrees"],["Part 3: 'Yes, that's the one'","both speakers decide"]]},{"t":"bn","x":"পার্ট ২-এ একজন বক্তা তথ্য দেয়, তাই পরিবর্তিত প্ল্যান খেয়াল করো। পার্ট ৩-এ দুইজন আলোচনা করে, তাই দেখো কে কী বলছে আর অন্যজন রাজি হচ্ছে কিনা।"}]},{"h":"Opinion and attitude questions","blocks":[{"t":"p","x":"At band 8 and above the questions ask what someone thinks, not what happened. Options sound alike: 'it was exaggerated', 'it is well supported', 'it cannot be tested'. Speakers hedge and use contrast, so listen for where the sentence lands after 'but', 'although' or 'in fact'."},{"t":"example","q":"What is the lecturer's view of the claim? A It has been exaggerated.  B It is strongly supported.  C It is impossible to test. Script: 'People say this can't be tested. In fact, diaries give us a lot of evidence. Electric light did play a part, but I'd say its effect has been overstated.'","a":"A","x":"C is someone else's view, and 'In fact' rejects it. 'Did play a part' could pull you to B, but the sentence lands after 'but' on 'overstated', which means exaggerated."},{"t":"trap","x":"Confusing a view the speaker reports with the speaker's own view. Phrases like 'people often say' or 'it's often claimed' usually introduce an idea that will be challenged."}]},{"h":"Choose TWO from five","blocks":[{"t":"p","x":"In this version you will hear something about all five options. Three are rejected and two are confirmed, and they may come in any order. Some students hear one good answer and relax. Keep a tick and cross list for all five until the speakers move on."},{"t":"steps","x":["In the preview, cut all five options to one or two key words.","Listen for each one and put a tick or a cross beside it.","If you have three ticks, look again at the one you are least sure of.","If you have one tick, guess the second from the options you have not crossed."]},{"t":"tip","x":"The two correct answers in a choose TWO question are often close together in the recording, but not always. Keep your list open until the next question's stem is clearly heard."}]},{"h":"Multiple choice in Part 4","blocks":[{"t":"p","x":"Part 4 is a lecture with no break, so multiple choice here feels fast and academic. The options often paraphrase a whole idea, like 'challenge a common belief', rather than a single word. Listen for the lecturer's structure: 'It's often said', 'A recent study suggests otherwise', 'So what this shows is'."},{"t":"tip","x":"When a lecturer says 'You might expect' or 'You'd imagine', the expected idea is usually a distractor and the real answer comes in the next sentence."},{"t":"bn","x":"পার্ট ৪-এ লেকচারার প্রায়ই প্রথমে একটা প্রচলিত ধারণা বলে, তারপর সেটা ভুল প্রমাণ করে। 'You might expect' বা 'it's often said' শুনলে বুঝবে আসল উত্তর পরে আসছে।"}]}],"drill":{"kind":"L","type":"mcq","part":4,"context":"You will hear part of a history lecture about street lighting in European towns.","speakers":{"Lecturer":"f"},"script":[{"s":"Lecturer","x":"Good afternoon. Today we're looking at street lighting, and in particular at how and why European towns started lighting their streets, and what that tells us about urban life. It's a topic that tends to get ignored, partly because lighting seems so ordinary to us now. But for most of history, towns after dark were very different places."},{"s":"Lecturer","x":"It's often said that the first public lighting schemes were introduced to fight crime. And it's true that this was the argument used in many public notices at the time. But if you look at who actually paid for the lamps, it was mostly merchants' associations, and their records talk again and again about keeping shops open after dark. Civic pride did play a role later, with the grand gas lamps of the nineteenth century, but in the early period the driving force was really trade."},{"s":"Lecturer","x":"Let's think about what those early oil lamps were like. You might imagine they gave off very little light, and you'd be right. Visitors' letters often complain that you could barely see the person in front of you. What's less well known is how much labour they demanded. The wicks had to be trimmed every few hours, and the glass cleaned of soot every morning, so towns had to employ teams of lamplighters. And contrary to what you might expect, they were actually more expensive to run than the candle lanterns they replaced."},{"s":"Lecturer","x":"Moving on to gas. For a long time historians assumed that gas lighting spread fastest in the capital cities, simply because they had the most money. A recent study of the records of around forty towns suggests otherwise. It was medium sized industrial towns that adopted gas first, largely because they already had gasworks supplying their factories. The capitals, in many cases, came quite a bit later."},{"s":"Lecturer","x":"Now, a claim you'll come across in your reading is that electric light, almost on its own, changed the way people slept, pushing bedtimes much later. People sometimes say that this can't really be tested, because nobody recorded their sleep. In fact, diaries and household accounts give us quite a lot of evidence. And what that evidence shows is that bedtimes were already moving later with gas light, and with longer working hours in factories. So electric light did play a part, but I'd say its effect has been overstated."},{"s":"Lecturer","x":"Let me bring this up to the present with LED lighting. LEDs use a fraction of the energy of older lamps, so you'd expect the total energy that cities spend on lighting to have fallen sharply. In many places it hasn't. Because light has become so cheap, cities have simply installed more of it, lighting car parks, building fronts and parks that were once dark. There were also complaints from residents about the harsh, bluish colour of early LEDs, but the newer, warmer versions have largely dealt with that."},{"s":"Lecturer","x":"For next week, I'd planned to take you to the gas museum, but it's closed for repairs until the spring. So instead, we'll be working with copies of old street maps from the city archive and trying to work out where the lamps were placed and why. Please read chapter four before then, and bring a pencil and a ruler, because we'll be marking the maps by hand. Right, any questions before we finish?"}],"qs":[{"q":"According to the lecturer, early street lighting was introduced mainly to","o":["reduce crime.","help businesses trade at night.","show the wealth of the town."],"a":1,"keys":["mainly","crime","trade","wealth"],"ev":"in the early period the driving force was really trade","why":"Crime was the public argument, and pride came later with gas. 'The driving force was really trade' and 'keeping shops open after dark' match B."},{"q":"What does the lecturer say about early oil lamps?","o":["They were brighter than people believed.","They needed a lot of looking after.","They were cheaper than candles."],"a":1,"keys":["oil lamps","brighter","looking after","cheaper"],"ev":"What's less well known is how much labour they demanded.","why":"The lamps were dim, which rules out A, and they cost more than candle lanterns, which rules out C. Trimming wicks and cleaning glass every day is 'a lot of looking after'."},{"q":"What did the recent study of town records show?","o":["Capital cities used gas lighting first.","Industrial towns adopted gas lighting early.","Most towns rejected gas lighting."],"a":1,"keys":["study","capital","industrial towns","rejected"],"ev":"It was medium sized industrial towns that adopted gas first","why":"A is the old belief that the study challenged. No town is said to have rejected gas. Capitals came 'later', so they still adopted it."},{"q":"What is the lecturer's view of the claim that electric light changed sleep patterns?","o":["It has been exaggerated.","It is strongly supported by evidence.","It is impossible to test."],"a":0,"keys":["view","exaggerated","evidence","test"],"ev":"So electric light did play a part, but I'd say its effect has been overstated.","why":"'Overstated' means exaggerated. The lecturer rejects the idea that it cannot be tested, and the evidence shows bedtimes were changing before electricity, so it does not support the claim strongly."},{"q":"What point does the lecturer make about LED lighting?","o":["It has reduced the energy used for lighting.","Its low cost has led to more lighting overall.","Residents still dislike its colour."],"a":1,"keys":["LED","energy","low cost","colour"],"ev":"Because light has become so cheap, cities have simply installed more of it","why":"Energy use 'hasn't' fallen in many places, so A is the expected idea, not the fact. Colour complaints were about early LEDs and have 'largely' been dealt with."},{"q":"What will students do in the next session?","o":["visit a museum","study old maps","discuss a chapter of reading"],"a":1,"keys":["next session","museum","maps","chapter"],"ev":"So instead, we'll be working with copies of old street maps from the city archive","why":"The museum visit was the plan but it is closed. Chapter four is homework to read before the session, not the activity in it."}]}},{"n":6,"title":"Mock test and final checklist","goal":"Today you will do a full multiple choice section under exam conditions and fix your routine for test day.","pages":[{"h":"Your test day checklist","blocks":[{"t":"steps","x":["Preview: stem keyword first, then two or three key words per option.","Expect to hear all three options. A word you hear is not an answer yet.","Wait for the final decision after 'actually', 'no, sorry', 'in the end' or 'but now'.","In Part 3, check that the second speaker agrees before you tick.","When the next stem's keyword is heard, lock your best answer and move on.","At the end, check the dotted questions first and never leave a blank."]},{"t":"pairs","x":[["'You might expect' or 'it's often said'","a distractor is coming"],["'What bothers me is'","the speaker's real view"],["'Hang on, no, that's not right'","a correction"],["'Yes, that's the one'","a shared decision"]]},{"t":"tip","x":"Do the mock with the audio played once, no pausing and no script. Mark your answers, then read the script only after you finish."}]},{"h":"When you miss one","blocks":[{"t":"p","x":"Even band 9 listeners lose the thread for a moment. What separates them is what happens next. They guess, mark a dot and listen to the next question with full attention. A missed question costs one mark, but panic can cost four."},{"t":"trap","x":"Replaying the last few seconds in your head. The recording does not wait for you. Let it go and listen forward."},{"t":"bn","x":"একটা প্রশ্ন মিস হলে ঘাবড়ে যেও না। একটা অনুমান লিখে ডট দিয়ে রাখো, আর পরের প্রশ্নে পুরো মন দাও। একটা ভুলে এক নম্বর যায়, কিন্তু টেনশনে অনেকগুলো চলে যায়।"}]},{"h":"After the mock","blocks":[{"t":"p","x":"For every wrong answer, find the line in the script that gave the answer and the line that trapped you. Then name the trap: correction, mentioned but rejected, suggestion without agreement, or plan versus fact. After a few tests you will see that you fall for the same one or two traps again and again."},{"t":"tip","x":"If you scored five or six out of six, the method works for you. Keep doing one Part 2 and one Part 3 set from Cambridge books every few days so the routine stays automatic."}]}],"drill":{"kind":"L","type":"mcq","part":3,"context":"You will hear two students, Leila and Sam, discussing a research project on food waste in their university canteen.","speakers":{"Leila":"f","Sam":"m"},"script":[{"s":"Leila","x":"Hi, Sam. Sorry I'm a bit late, the bus was packed. Have you had a chance to look at the figures from the canteen?"},{"s":"Sam","x":"I have, yes. I went through them on Sunday. They're interesting, and not quite what I expected. What did you make of them?"},{"s":"Leila","x":"Well, I expected the total amount of waste to be huge, and it was more or less what the manager had predicted, so no surprise there. What I really didn't see coming was that the kitchen wasn't the problem at all. Nearly three quarters of the waste came back on students' plates."},{"s":"Sam","x":"Yes, that's what struck me too. And it was mostly rice. I'd assumed bread would be the worst, because you see half eaten sandwiches everywhere, but bread was quite a small share in the end."},{"s":"Leila","x":"So, looking back, do you think the weighing worked? I wasn't sure about those scales."},{"s":"Sam","x":"Oh, the scales were fine. We tested them every day, so I'm confident the numbers are solid. And the kitchen staff didn't mind at all, they were really helpful. It's just that it took us three hours every lunchtime. If I did it again, I'd find a quicker way."},{"s":"Leila","x":"Fair enough. Now, the recommendations. I still think the obvious one is self service, so students take only what they want."},{"s":"Sam","x":"I see what you mean, and it sounds sensible. But the manager told me they tried it a few years ago and the queues doubled. He won't go back to it."},{"s":"Leila","x":"OK. What about getting rid of free second helpings, then?"},{"s":"Sam","x":"Hardly anyone takes them, from what we saw. It wouldn't make much difference."},{"s":"Leila","x":"Then what about a smaller plate option, sold a bit more cheaply?"},{"s":"Sam","x":"Yes, that's the one. People pay less and leave less. And the manager actually liked that idea when I mentioned it."},{"s":"Leila","x":"Great, let's make that our main recommendation. Next, the survey. We said two hundred students, didn't we?"},{"s":"Sam","x":"We did, but Doctor Hughes said that was too many to analyse properly in the time we have, so we cut it to one hundred. Hang on, no, that's not right. It was one hundred and fifty. One hundred was the number for the pilot study."},{"s":"Leila","x":"Oh yes, I remember now. One hundred and fifty it is. And what about the report itself? I read through the draft last night."},{"s":"Sam","x":"Me too. I think the literature review is far too long. It's almost a third of the report."},{"s":"Leila","x":"I don't agree, actually. The marking guide gives it a lot of weight, so I'd leave it. And we've got plenty of charts, so that's fine. What bothers me is that the method is hidden away in the appendix. It really needs to be in the main text, because the examiners will want to see how we measured everything."},{"s":"Sam","x":"Hmm, you're right. I hadn't thought of it from the examiners' side. I'll move it this week, and I'll tidy up the references while I'm at it, because a few of them are in the wrong format."},{"s":"Leila","x":"Good. Doctor Hughes was quite strict about that last time, so it's worth doing."},{"s":"Leila","x":"Right. Last thing, the meeting with the canteen manager. Should we send him the full report beforehand?"},{"s":"Sam","x":"It's forty pages. He's a busy man, he won't read it. Let's send a one page summary of the results instead."},{"s":"Leila","x":"Good idea. He did say he'd like a list of our questions in advance, didn't he?"},{"s":"Sam","x":"He mentioned it at first, but then he said he'd rather just talk it through on the day. So the summary is enough."},{"s":"Leila","x":"Perfect. I'll write it tonight and send it to you to check. Can you look at it before Thursday?"},{"s":"Sam","x":"Sure. I've got a lab session on Wednesday morning, but I'll have time in the afternoon. And let's try to keep the summary short. If it's longer than a page, he probably won't read that either."},{"s":"Leila","x":"Ha, true. One page, I promise."}],"qs":[{"q":"What surprised the students about the food waste in the canteen?","o":["The total amount was much higher than predicted.","Most of it was food left on plates.","Bread made up the largest share."],"a":1,"keys":["surprised","total amount","plates","bread"],"ev":"Nearly three quarters of the waste came back on students' plates.","why":"The total was 'more or less what the manager had predicted', so A was no surprise. Bread was 'quite a small share'. 'Didn't see coming' signals the surprise: waste on plates."},{"q":"What does Sam think about the way they measured the waste?","o":["The equipment was not accurate.","It upset the kitchen staff.","It gave reliable results but took too long."],"a":2,"keys":["Sam","measured","accurate","staff","too long"],"ev":"It's just that it took us three hours every lunchtime.","why":"Leila doubts the scales, but Sam says they were fine and the numbers are solid. The staff 'didn't mind at all'. His only complaint is the time, which matches C."},{"q":"What do they decide to recommend?","o":["letting students serve themselves","ending free second helpings","offering a smaller, cheaper portion"],"a":2,"keys":["recommend","serve themselves","second helpings","smaller"],"ev":"Yes, that's the one. People pay less and leave less.","why":"Self service sounds sensible, but the queues doubled when it was tried. Second helpings would not make much difference. Both speakers accept the smaller plate idea."},{"q":"How many students will they survey in the main study?","o":["one hundred","one hundred and fifty","two hundred"],"a":1,"keys":["how many","survey","main study"],"ev":"One hundred and fifty it is.","why":"Two hundred was the first plan and was reduced. Sam then says one hundred and corrects himself, because one hundred was the pilot. Both speakers confirm one hundred and fifty."},{"q":"What change does Leila want to make to the report?","o":["shorten the literature review","move the method into the main text","add more charts"],"a":1,"keys":["Leila","change","literature review","method","charts"],"ev":"It really needs to be in the main text, because the examiners will want to see how we measured everything.","why":"Shortening the literature review is Sam's idea, and Leila disagrees. She says they have plenty of charts. 'What bothers me' introduces her real concern about the method."},{"q":"What will they send the canteen manager before the meeting?","o":["a summary of the results","the full report","a list of questions"],"a":0,"keys":["send","manager","summary","full report","questions"],"ev":"Let's send a one page summary of the results instead.","why":"The full report is too long, and the manager later said he would rather talk than get questions in advance. Both speakers agree on the summary."}]}}]},{"id":"lmatch","skill":"L","title":"Listening matching","bn":"লিসেনিং ম্যাচিং","why":"In matching tasks students lose marks when the options are long, because they try to read whole sentences while the speaker has already moved on. This course trains you to shrink every option to two or three key words before the audio starts, listen for paraphrases of those words, and wait for the speaker's final answer.","days":[{"n":1,"title":"How matching works","goal":"Today you will learn how IELTS listening matching tasks are built and set up a preview routine that still works when the options are long.","pages":[{"h":"What you see on the paper","blocks":[{"t":"p","x":"A listening matching task gives you two lists. On the left there is a numbered list of items, usually five, such as places, people or parts of a course. On the right there is a box of options with letters, usually seven or eight, and you write one letter next to each number. Because there are more options than items, two or three letters are never used."},{"t":"p","x":"Matching appears most often in Part 2 and Part 3. In Part 2 one speaker describes places, services or changes. In Part 3 two or three people give **opinions** about things like sources, methods or modules, and you match each one to a comment."},{"t":"tip","x":"Read the instruction line above the box with care. 'What does the speaker say about...' and 'What is the tutor's opinion of...' tell you whose voice decides the answer, which matters a lot when three people are talking."},{"t":"bn","x":"ম্যাচিং টাস্কে বাঁদিকে নম্বর দেওয়া আইটেম থাকে, ডানদিকে অক্ষর দেওয়া অপশনের বক্স। অপশন সবসময় আইটেমের চেয়ে বেশি, তাই দুই-তিনটা অক্ষর কোনো কাজেই লাগবে না। বক্সের উপরের লাইনটা মন দিয়ে পড়ো, কারণ ওটাই বলে দেয় কার মতামত শুনতে হবে।"}]},{"h":"The two lists move differently","blocks":[{"t":"p","x":"The numbered items come in the same order as the recording. If question 14 is the library and question 15 is the gym, you will hear about the library first. The options do not follow any order, so the answer to the first item could be G and the answer to the last could be A."},{"t":"p","x":"This gives you a simple map. The item names are your signposts: when you hear the speaker say 'the gym', you know question 14 is finished and question 15 has started. The option box is a menu you search each time."},{"t":"steps","x":["Put your pencil next to the current item number.","Listen for the item name, or a clear signal that the speaker has moved on to it.","While the speaker talks about that item, search your option notes for the meaning you hear.","When the next item name comes, move your pencil down, even if you have no answer yet."]},{"t":"trap","x":"Do not expect the options to come in letter order. Students who wait for A, then B, then C spend the first answer looking in the wrong part of the box."},{"t":"bn","x":"আইটেমগুলো রেকর্ডিং-এর ক্রমেই আসে, কিন্তু অপশনগুলো এলোমেলো। তাই আইটেমের নামগুলোকে সাইনবোর্ডের মতো ব্যবহার করো: পরের আইটেমের নাম শুনলেই আগেরটা শেষ ধরে নাও আর পেন্সিল নিচে নামাও।"}]},{"h":"Why long options cause trouble","blocks":[{"t":"p","x":"A box of eight options at twelve words each is almost one hundred words. Nobody can hold one hundred words in their head and follow a fast speaker at the same time. At band 7, students often reread the full options during the recording, and by the time they find the right line, the speaker is two sentences ahead."},{"t":"p","x":"The fix is to do the reading before the audio starts. In the preview you **shrink each option to two or three key words** and write them next to the letter. During the recording you look only at your short notes, never at the long sentences."},{"t":"example","q":"Option: 'It is more popular with visitors than the organisers expected.'","a":"popular > expected","x":"The topic is popularity and the twist is that it beat expectations. 'It', 'with visitors' and 'the organisers' are the same for every place in the list, so they do not separate this option from the others. Write 'popular > expected' next to the letter and stop."},{"t":"example","q":"Option: 'The equipment there needs to be replaced before the summer season.'","a":"replace equipment","x":"The action is replacing and the thing is equipment. 'Before the summer season' is a time detail, so leave it out unless another option also talks about equipment. Two words are enough to recognise this option when you hear 'the machines are worn out, we're getting new ones'."},{"t":"tip","x":"Keep the nouns and verbs that carry meaning, plus any small word that changes the sense, such as not, only, more, less or no longer. Drop it, there, the, is and anything that every option shares."},{"t":"bn","x":"লম্বা অপশন শোনার সময় পড়তে গেলে তুমি পিছিয়ে পড়বে। তাই প্রিভিউয়ের সময়েই প্রতিটা অপশনকে দুই-তিনটা মূল শব্দে ছোট করে পাশে লিখে ফেলো, যেমন 'replace equipment'। শোনার সময় শুধু এই ছোট নোটগুলোই দেখবে, পুরো বাক্য আর পড়বে না।"}]},{"h":"Timing in the real test","blocks":[{"t":"p","x":"Before each part you get about thirty seconds to look at the questions. If the part has another task before the matching, you may have only fifteen seconds for the box. That is about two seconds per option, which is enough for shrinking but not for reading every word."},{"t":"steps","x":["Read the instruction and underline whose opinion counts.","Read the item list quickly: these are your signposts.","Shrink each option to two or three key words and write them beside the letter.","If time is left, think of one synonym for the hardest key words."]},{"t":"trap","x":"Some students write their key words so small or messy that they cannot read them under pressure. Write in capitals, keep each note on one line, and use the space right next to the letter."},{"t":"tip","x":"At the end of the part, check that every letter you wrote exists in the box and that your B and D, and your E and F, look clearly different. In the computer test, look at the selected letter once more before moving on."},{"t":"bn","x":"আসল পরীক্ষায় প্রশ্ন দেখার জন্য প্রায় ত্রিশ সেকেন্ড পাও, কখনো তারও কম। প্রতিটা অপশনের জন্য দুই সেকেন্ডের মতো সময়, তাই শব্দে শব্দে না পড়ে শুধু মূল শব্দ বের করো। শেষে মিলিয়ে নাও তোমার লেখা অক্ষরগুলো পরিষ্কার আর বক্সে আছে কিনা।"}]}],"drill":{"kind":"L","type":"match","part":2,"context":"You will hear a ranger giving a group of visitors information about different areas of a nature reserve.","speakers":{"Ranger":"m"},"script":[{"s":"Ranger","x":"Good morning, everyone, and welcome to Hollin Wood Nature Reserve. I'm Dave, one of the rangers here, and before you head off I'll give you a quick guide to the different areas, because quite a few things have changed since last year. So even if you've been here before, it's worth listening for a minute or two."},{"s":"Ranger","x":"Let's start with the lake path, which goes all the way round the main lake. Now, regular visitors will remember that it used to get really muddy, especially in winter, and people were always coming back with wet feet. But we resurfaced the whole thing last spring, so it's now smooth and firm, and people in wheelchairs can get all the way round without any help. We're very pleased about that, as it was something visitors had been asking for for years."},{"s":"Ranger","x":"Next, the bird hide, which is on the north side of the lake. We did think about putting a new information board in there, with pictures of the ducks and geese you're likely to see, but, er, the money went on the path instead, so that's a job for next year. What I would say is, if you want to see the birds, you really need to get there just after sunrise. By about ten o'clock most of them have flown off to feed in the fields, and you'll be sitting there looking at an empty lake."},{"s":"Ranger","x":"Then there's the wildflower meadow. Some of you may have read in the local paper that it was going to be closed for replanting this year. Well, that didn't happen in the end. What we did instead was take over the field next to it, so the meadow is now about twice the size it was. It's at its best in June, but there's always something in flower, even this late in the season."},{"s":"Ranger","x":"After that, the old quarry. It's a fascinating place, with fossils in the rock, and it's open every day, from nine until dusk. But the edges are steep, and there's a twenty-metre drop in one corner, so I have to ask that anyone under sixteen stays with a parent or another adult the whole time they're in there. We've had a couple of near misses, and we'd rather not have any more."},{"s":"Ranger","x":"Finally, the picnic area, near the car park. There's a board there with a map of all the trails, though I'm afraid it's the old one and it's a bit faded, so pick up a paper map from the office if you can. The main thing to know is that the ground is quite low there, so after a heavy shower it turns into a bit of a swamp. If it's been raining, I'd take your sandwiches up to the benches by the meadow instead."},{"s":"Ranger","x":"Right, any questions before you set off? No? Then enjoy your walk, and please remember to take your litter home with you."}],"head":"What does the ranger say about each area of the reserve?","opts":[{"x":"is closed to visitors at the moment","keys":["closed","now"]},{"x":"is best visited early in the morning","keys":["early","morning"]},{"x":"is suitable for people who use wheelchairs","keys":["wheelchair","access"]},{"x":"has recently been made much bigger","keys":["bigger","recently"]},{"x":"children must stay with an adult there","keys":["children","adult"]},{"x":"has a new information board for visitors","keys":["new","info board"]},{"x":"can get very muddy after it rains","keys":["muddy","rain"]}],"qs":[{"q":"the lake path","a":2,"ev":"people in wheelchairs can get all the way round without any help","why":"The path is now smooth and firm, so wheelchair users can go round it. 'Muddy' is said here too, but only about the past ('it used to get really muddy'), so G is a trap for this item."},{"q":"the bird hide","a":1,"ev":"you really need to get there just after sunrise","why":"'Just after sunrise' is a paraphrase of 'early in the morning'. The new information board (F) was only an idea that was dropped because the money went on the path."},{"q":"the wildflower meadow","a":3,"ev":"the meadow is now about twice the size it was","why":"'Twice the size' means it has been made bigger. The closure (A) was reported in the paper, but the ranger says 'that didn't happen in the end'."},{"q":"the old quarry","a":4,"ev":"anyone under sixteen stays with a parent or another adult the whole time","why":"'Anyone under sixteen' is the paraphrase of 'children'. The ranger also says it is open every day, which rules out A."},{"q":"the picnic area","a":6,"ev":"after a heavy shower it turns into a bit of a swamp","why":"'Heavy shower' means rain and 'a bit of a swamp' means very muddy. The board at the picnic area is 'the old one', so F does not fit."}]}},{"n":2,"title":"Paraphrase and key words","goal":"Today you will practise turning each option into key words and predicting the different words the speakers will use for them.","pages":[{"h":"The speaker will not say your words","blocks":[{"t":"p","x":"In matching, the recording almost never repeats the wording of the correct option. If the option says 'is poor value for money', the speaker says 'it costs a fortune for what you get'. When you do hear the exact words of an option, be careful: that option is often the trap."},{"t":"pairs","x":[["it's always packed","is very popular"],["it costs a fortune for what you get","is poor value for money"],["they've cut the opening hours","is open for less time than before"],["you can't just turn up, you have to ring ahead","requires visitors to book in advance"],["it's a bit of a trek from the main building","is not conveniently located"],["I'd have been lost without it","was extremely helpful"]]},{"t":"tip","x":"Listen for meaning, not for sounds. A good test is to ask yourself, 'What did the speaker just say about this item, in two words?' and then look for those two words in your notes."},{"t":"bn","x":"রেকর্ডিং-এ সঠিক অপশনের শব্দগুলো প্রায় কখনোই হুবহু বলা হয় না, বলা হয় অন্যভাবে। বরং কোনো অপশনের শব্দ হুবহু শুনলে সাবধান হও, ওটা অনেক সময় ফাঁদ। শব্দ না খুঁজে অর্থ খোঁজো।"}]},{"h":"From long option to key words","blocks":[{"t":"steps","x":["Find the topic: what is the option about? Cost, location, staff, timing, difficulty, size.","Find the direction: good or bad, more or less, new or old, too much or not enough.","Keep any limiter that changes the meaning, such as only, not yet, no longer or some.","Write two or three words, using symbols like > or + if they are faster for you."]},{"t":"example","q":"Option: 'The sessions were more useful than the student had expected them to be.'","a":"useful > expected","x":"Topic: usefulness. Direction: better than expected. 'The sessions' and 'the student' appear in every option, so they add nothing. When the speaker says 'I thought it would be boring, but it was brilliant', your note 'useful > expected' jumps out."},{"t":"example","q":"Option: 'It should have been offered at an earlier stage of the course.'","a":"too late","x":"The topic is timing and the direction is negative: it came too late. Two words cover the whole idea. You can now expect speech like 'I wish we'd had it in first year' or 'by then it was a bit pointless'."},{"t":"example","q":"Option: 'The comments the tutor gave on written work were too general to help.'","a":"feedback vague","x":"'Comments on written work' is feedback, and 'too general to help' is vague. Using your own short words like these makes the speaker's paraphrase easier to spot, because you have already moved one step away from the printed wording."},{"t":"bn","x":"প্রতিটা অপশনে প্রথমে দেখো বিষয়টা কী (খরচ, সময়, জায়গা), তারপর দিকটা কী (ভালো না খারাপ, বেশি না কম)। 'only', 'no longer' এর মতো ছোট শব্দ থাকলে রেখে দাও। শেষে দুই-তিন শব্দে নিজের ভাষায় লিখে ফেলো।"}]},{"h":"Predict how they will say it","blocks":[{"t":"p","x":"Once your key words are written, use any seconds left to predict how a speaker might express the abstract ones. You do not need a synonym for 'wheelchair' or 'parking', but you do for ideas like value, timing, difficulty and usefulness. Think in **meaning families** rather than single words."},{"t":"pairs","x":[["the comments didn't tell me what to fix","feedback was too general"],["I wish we'd had it in first year","should have come earlier"],["it went over my head","was too difficult"],["it was the same old stuff from school","repeated what they already knew"],["we spent the whole time just sitting and listening","needed more practical activities"]]},{"t":"trap","x":"If you predict only one synonym, you may miss the paraphrase when it comes. For a difficulty option, have the whole family ready: hard, tough, struggled, couldn't follow, over my head."},{"t":"bn","x":"মূল শব্দ লেখার পর হাতে সময় থাকলে ভাবো স্পিকার এটা কীভাবে বলতে পারে। 'difficult' এর জন্য শুধু একটা প্রতিশব্দ না ভেবে পুরো পরিবার মাথায় রাখো: hard, tough, struggled, couldn't follow। এতে প্যারাফ্রেজ সহজে ধরা পড়বে।"}]},{"h":"Hearing when the item changes","blocks":[{"t":"p","x":"The item names can be paraphrased too. 'The time management workshop' may become 'the session on planning your week'. In Part 3, the speakers often move on with phrases like 'What about...', 'And the one on...', or 'Shall we look at...'. These phrases tell you to move your pencil down."},{"t":"example","q":"Items: '13 note-taking, 14 time management'. You hear: 'Right, so the next one was all about organising your week and not leaving things to the last minute.'","a":"Item 14 has started.","x":"The speaker never says 'time management', but 'organising your week' and 'not leaving things to the last minute' describe it. A strong student finishes 13 at this point, even with a gap, and starts listening for the answer to 14."},{"t":"tip","x":"In the preview, think of one other way to say each item name, especially the abstract ones. It costs two seconds and saves you from losing your place."},{"t":"bn","x":"আইটেমের নামও অনেক সময় অন্যভাবে বলা হয়। 'What about...' বা 'And the one on...' শুনলে বুঝবে নতুন আইটেম শুরু হলো, তাই পেন্সিল পরের নম্বরে নিয়ে যাও।"}]}],"drill":{"kind":"L","type":"match","part":3,"context":"You will hear two university students, Maya and Tom, discussing the study skills workshops they attended.","speakers":{"Maya":"f","Tom":"m"},"script":[{"s":"Maya","x":"So, Tom, we need to write up our feedback on the study skills workshops for Doctor Hughes by Friday. Shall we just go through them in the order we did them?"},{"s":"Tom","x":"Yeah, good idea. The first one was note-taking, wasn't it?"},{"s":"Maya","x":"Right. Honestly, I didn't get much out of that one. The room was packed, which was fine, there were enough chairs, but everything she told us, you know, using abbreviations, leaving space on the page, we'd done all of that at school."},{"s":"Tom","x":"Same for me. It was basically a repeat of what I'd learnt in college. I could have skipped it and not missed anything."},{"s":"Tom","x":"Then there was the one on planning your time. I thought that one was actually good."},{"s":"Maya","x":"Me too. The weekly planner they gave us is brilliant, I use it every day. My only complaint is when they ran it. We're in our second year now. If I'd had that in my first term, I wouldn't have missed so many deadlines."},{"s":"Tom","x":"Exactly. It would have made much more sense right at the start of the degree."},{"s":"Tom","x":"OK, academic writing next. We did loads of exercises in that one, rewriting paragraphs, fixing each other's introductions and so on, so nobody could say it wasn't hands-on."},{"s":"Maya","x":"No, the activities were fine. What annoyed me was what we got back on the essay we handed in at the end. It just said things like 'good structure' and 'check your referencing'. It didn't tell me what I'd actually done wrong."},{"s":"Tom","x":"Mine was the same. Comments that could have been written on anyone's work."},{"s":"Maya","x":"What about the one on searching the library databases?"},{"s":"Tom","x":"I almost didn't go to that, because I thought it was at the same time as our statistics lecture. Then I checked the timetable and it wasn't, luckily."},{"s":"Maya","x":"I'm glad you went. I thought it'd be really dull, just someone clicking through menus for an hour, but I found three articles for my dissertation while I was sitting there."},{"s":"Tom","x":"Yeah, I was surprised too. It turned out to be the most helpful of the lot."},{"s":"Maya","x":"And finally, presentation skills."},{"s":"Tom","x":"Well, I wanted more chances to actually practise, you know, standing up and speaking in front of people."},{"s":"Maya","x":"Hmm, we each gave a short talk, though, and we did those role plays at the start, so there was plenty of practice. The real problem was the numbers. There were about sixty of us in a room meant for twenty, and the tutor couldn't possibly give everyone proper attention."},{"s":"Tom","x":"That's true, actually, I'd forgotten the role plays. And half the people at the back couldn't even see the screen. OK, so shall I start typing this up and you can add anything I've forgotten?"},{"s":"Maya","x":"Sounds good. And let's suggest they split the presentation group into three smaller groups next year. I think Doctor Hughes will actually listen to that one, because she said the same thing in the lecture last week."}],"head":"What do the students say about each workshop?","opts":[{"x":"was more useful than they had expe
